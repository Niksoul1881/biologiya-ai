{{ $lines := split .Inner "\n" }}
<div style="display: inline-block; border: 3px solid #ef4444; border-radius: 12px; padding: 24px 32px; background: #ffffff; margin: 20px 10px; box-shadow: 0 4px 12px rgba(239,68,68,0.2);">
    <pre style="font-family: 'Courier New', monospace; font-size: 22px; line-height: 1.6; margin: 0; text-align: right; color: #1f2937; font-weight: 600;">{{ range $lines }}{{ if . }}{{ . | replaceRE `\^(\d+)` `<span style="color: #2563eb; font-size: 16px; vertical-align: super;">$1</span>` | safeHTML }}
{{ end }}{{ end }}</pre>
</div>
