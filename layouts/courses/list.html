{{ define "main" }}
<div class="program-wrapper" style="max-width:1100px;margin:0 auto;padding:64px 24px 100px">
    <div style="text-align:center;margin-bottom:40px">
        <span style="font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.08em">Курсы</span>
        <h1 style="font-family:Montserrat,sans-serif;font-size:2.6rem;font-weight:900;margin:12px 0">5 → 11 → <span style="color:#16A34A">Био-IT</span></h1>
        <p style="color:#666;font-size:1.1rem">{{ len site.Data.program.courses }} курсов — от школьной биологии до биоинформатики и ML. Всё бесплатно.</p>
    </div>
    <div class="bio-courses-grid">
        {{- range site.Data.program.courses }}
        <a class="bio-course-card" href="/{{ .id }}/" style="--c: {{ .color }}">
            <span class="bio-course-emoji">{{ .emoji }}</span>
            <span class="bio-course-count">{{ .count }} уроков</span>
            <h3>{{ .title }}</h3>
            <p>{{ .subtitle }}</p>
        </a>
        {{- end }}
    </div>
</div>
<style>
    .bio-courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .bio-course-card { position: relative; display: block; padding: 22px; border: 1px solid #E5E7EB; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .bio-course-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.06); border-color: var(--c); }
    .bio-course-emoji { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; font-size: 24px; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, white); }
    .bio-course-count { position: absolute; top: 22px; right: 22px; font-size: 12px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 10%, white); border-radius: 999px; padding: 3px 10px; }
    .bio-course-card h3 { margin: 14px 0 6px; font-size: 18px; }
    .bio-course-card p { margin: 0; font-size: 14px; color: #6B7280; line-height: 1.45; }
</style>
{{ end }}
