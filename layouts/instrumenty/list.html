{{ define "main" }}
<div class="tool-page" style="max-width:980px;margin:0 auto;padding:48px 20px 80px">
    <h1 style="font-family:Montserrat,sans-serif;font-weight:900;font-size:2.4rem">{{ .Title }}</h1>
    <p style="color:#6B7280;font-size:1.1rem">{{ .Description }}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:28px">
    {{ range .Pages }}
        <a href="{{ .RelPermalink }}" style="display:block;padding:22px;border:1px solid #E5E7EB;border-radius:16px;color:inherit;text-decoration:none">
            <div style="font-size:28px">{{ .Params.emoji }}</div>
            <h3 style="margin:10px 0 6px">{{ .Title }}</h3>
            <p style="margin:0;color:#6B7280;font-size:14px;line-height:1.45">{{ .Description }}</p>
        </a>
    {{ end }}
    </div>
</div>
{{ end }}
