<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="430" fill="#fff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Опыт Ниренберга и Маттеи (1961): первое слово кода</text>

  <!-- ингредиенты -->
  <g font-size="15" fill="#333">
    <rect x="30" y="70" width="250" height="56" rx="10" fill="#eef6fb" stroke="#6a8fa8"/>
    <text x="155" y="94" text-anchor="middle" font-weight="bold">Экстракт бактерий</text>
    <text x="155" y="114" text-anchor="middle">рибосомы, тРНК, ферменты</text>
    <rect x="30" y="140" width="250" height="56" rx="10" fill="#f3f9ec" stroke="#6a9a55"/>
    <text x="155" y="164" text-anchor="middle" font-weight="bold">20 аминокислот</text>
    <text x="155" y="184" text-anchor="middle">одна из них — с меткой ¹⁴C</text>
    <rect x="30" y="210" width="250" height="56" rx="10" fill="#f6effa" stroke="#7a3fa0"/>
    <text x="155" y="234" text-anchor="middle" font-weight="bold">Искусственная РНК</text>
    <text x="155" y="254" text-anchor="middle" fill="#7a3fa0" font-weight="bold">У У У У У У У У У …</text>
  </g>
  <path d="M 288 168 L 360 168" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- пробирка -->
  <g>
    <path d="M 390 70 L 390 260 Q 390 300 430 300 Q 470 300 470 260 L 470 70" fill="#fff" stroke="#6a8fa8" stroke-width="4"/>
    <path d="M 393 170 L 393 260 Q 393 297 430 297 Q 467 297 467 260 L 467 170 z" fill="#d9ecf7"/>
    <text x="430" y="330" font-size="15" text-anchor="middle" fill="#333">37 °C, пробирка</text>
    <text x="430" y="350" font-size="15" text-anchor="middle" fill="#333">без живых клеток</text>
  </g>
  <path d="M 485 168 L 555 168" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

  <!-- результат -->
  <g>
    <text x="720" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Синтезировался полипептид:</text>
    <g font-size="15" font-weight="bold" fill="#1b7a3a" text-anchor="middle">
      <circle cx="600" cy="130" r="26" fill="#e3f4e0" stroke="#1b7a3a" stroke-width="2"/><text x="600" y="135">Фен</text>
      <circle cx="660" cy="130" r="26" fill="#e3f4e0" stroke="#1b7a3a" stroke-width="2"/><text x="660" y="135">Фен</text>
      <circle cx="720" cy="130" r="26" fill="#e3f4e0" stroke="#1b7a3a" stroke-width="2"/><text x="720" y="135">Фен</text>
      <circle cx="780" cy="130" r="26" fill="#e3f4e0" stroke="#1b7a3a" stroke-width="2"/><text x="780" y="135">Фен</text>
      <text x="835" y="135" fill="#333">…</text>
    </g>
    <text x="720" y="195" font-size="15" text-anchor="middle" fill="#333">радиоактивная метка была только</text>
    <text x="720" y="215" font-size="15" text-anchor="middle" fill="#333">в опыте с меченым фенилаланином</text>
  </g>

  <!-- вывод -->
  <rect x="120" y="370" width="660" height="44" rx="10" fill="#fff8e1" stroke="#e0a800" stroke-width="2"/>
  <text x="450" y="399" font-size="19" text-anchor="middle" fill="#333">Вывод: кодон <tspan font-weight="bold" fill="#7a3fa0">УУУ</tspan> кодирует <tspan font-weight="bold" fill="#1b7a3a">фенилаланин</tspan></text>
</svg>
