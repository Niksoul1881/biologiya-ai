<text x="392.0" y="111" font-size="21" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#222">УУУ</text>
<text x="392.0" y="150" font-size="16" text-anchor="middle" fill="#1b7a3a" font-weight="bold">Фен</text>
