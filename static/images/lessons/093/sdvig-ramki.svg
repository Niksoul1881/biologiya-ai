<text x="392.0" y="291" font-size="21" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#222">УУГ</text>
<text x="392.0" y="330" font-size="16" text-anchor="middle" fill="#1b7a3a" font-weight="bold">Лей</text>
<rect x="448" y="264" width="92" height="38" rx="6" fill="#fdecea" stroke="#888"/>
<text x="494.0" y="291" font-size="21" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#222">ГЦУ</text>
<text x="494.0" y="330" font-size="16" text-anchor="middle" fill="#1b7a3a" font-weight="bold">Ала</text>
<rect x="550" y="264" width="68" height="38" rx="6" fill="#fdecea" stroke="#888"/>
<text x="584.0" y="291" font-size="21" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Courier New, monospace" fill="#222">АА</text>
<text x="584.0" y="330" font-size="16" text-anchor="middle" fill="#1b7a3a" font-weight="bold">…</text>
<text x="30" y="380" font-size="15" fill="#333">Все кодоны после мутации прочитаны «не так» — меняется вся дальнейшая последовательность аминокислот.</text>
