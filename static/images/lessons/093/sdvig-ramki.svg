<text x="596.0" y="150" font-size="16" text-anchor="middle" fill="#1b7a3a" font-weight="bold">стоп</text>
<text x="30" y="200" font-size="15" fill="#c0392b">Выпал один нуклеотид Г во втором кодоне (ГЦУ → ЦУ…) — рамка считывания сдвинулась:</text>
<text x="30" y="252" font-size="16" font-weight="bold" fill="#333">После выпадения: 5′-АУГЦУАААУУУГГЦУАА-3′</text>
