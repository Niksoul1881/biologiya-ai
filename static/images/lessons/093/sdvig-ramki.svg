<text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Код читается триплетами без запятых и перекрываний</text>
<text x="30" y="72" font-size="16" font-weight="bold" fill="#333">Исходная иРНК: 5′-АУГГЦУАААУУУГГЦУАА-3′</text>
