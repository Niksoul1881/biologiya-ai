<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="470" fill="#fff"/>
<text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Как прочитать ген: от ДНК к белку</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="30" y="85" font-size="14.5" fill="#333">Смысловая (кодирующая) цепь ДНК</text>
<rect x="330" y="61" width="440" height="36" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="2"/>
<text x="346" y="85" font-size="16" fill="#555" font-weight="bold">5′</text>
<text x="550" y="86" font-size="21" text-anchor="middle" fill="#555" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="bold">АТГ ГЦТ ААА ТТТ</text>
<text x="755" y="85" font-size="16" fill="#555" font-weight="bold" text-anchor="end">3′</text>
<path d="M 550 101 L 550 135" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="565" y="125" font-size="13" fill="#666">комплементарна смысловой</text>
<text x="30" y="167" font-size="14.5" fill="#333">Транскрибируемая (матричная) цепь ДНК</text>
<rect x="330" y="143" width="440" height="36" rx="8" fill="#f7f7f7" stroke="#1d4f86" stroke-width="2"/>
<text x="346" y="167" font-size="16" fill="#1d4f86" font-weight="bold">3′</text>
<text x="550" y="168" font-size="21" text-anchor="middle" fill="#1d4f86" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="bold">ТАЦ ЦГА ТТТ ААА</text>
<text x="755" y="167" font-size="16" fill="#1d4f86" font-weight="bold" text-anchor="end">5′</text>
<path d="M 550 183 L 550 217" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="565" y="207" font-size="13" fill="#666">транскрипция: комплементарна матричной,  Т → У</text>
<text x="30" y="249" font-size="14.5" fill="#333">иРНК</text>
<rect x="330" y="225" width="440" height="36" rx="8" fill="#f7f7f7" stroke="#7a3fa0" stroke-width="2"/>
<text x="346" y="249" font-size="16" fill="#7a3fa0" font-weight="bold">5′</text>
<text x="550" y="250" font-size="21" text-anchor="middle" fill="#7a3fa0" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="bold">АУГ ГЦУ ААА УУУ</text>
<text x="755" y="249" font-size="16" fill="#7a3fa0" font-weight="bold" text-anchor="end">3′</text>
<path d="M 550 265 L 550 299" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="565" y="289" font-size="13" fill="#666">трансляция: антикодон комплементарен кодону</text>
<text x="30" y="331" font-size="14.5" fill="#333">Антикодоны тРНК</text>
<rect x="330" y="307" width="440" height="36" rx="8" fill="#f7f7f7" stroke="#b85c00" stroke-width="2"/>
<text x="346" y="331" font-size="16" fill="#b85c00" font-weight="bold">3′</text>
<text x="550" y="332" font-size="21" text-anchor="middle" fill="#b85c00" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="bold">УАЦ ЦГА УУУ ААА</text>
<text x="755" y="331" font-size="16" fill="#b85c00" font-weight="bold" text-anchor="end">5′</text>
<path d="M 550 347 L 550 381" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="565" y="371" font-size="13" fill="#666">по таблице генетического кода (по кодонам иРНК)</text>
<text x="30" y="413" font-size="14.5" fill="#333">Белок</text>
<rect x="330" y="389" width="440" height="36" rx="8" fill="#f7f7f7" stroke="#1b7a3a" stroke-width="2"/>
<text x="346" y="413" font-size="16" fill="#1b7a3a" font-weight="bold">N-</text>
<text x="550" y="414" font-size="21" text-anchor="middle" fill="#1b7a3a" font-family="DejaVu Sans Mono, Courier New, monospace" font-weight="bold">Мет — Ала — Лиз — Фен</text>
<text x="755" y="413" font-size="16" fill="#1b7a3a" font-weight="bold" text-anchor="end">-C</text>
</svg>