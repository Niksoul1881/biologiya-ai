<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#1F2937"/></marker>
  </defs>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Рефлекторная дуга: отдёргивание руки от горячего</text>
  <!-- spinal cord cross-section -->
  <ellipse cx="690" cy="250" rx="140" ry="110" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="3"/>
  <path d="M690,165 C640,165 610,195 615,225 C620,245 650,245 655,255 C650,268 620,270 615,290 C612,315 645,335 690,335 C735,335 768,315 765,290 C760,270 730,268 725,255 C730,245 760,245 765,225 C770,195 740,165 690,165 z" fill="#D1D5DB" stroke="#6B7280" stroke-width="2"/>
  <circle cx="690" cy="252" r="5" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="690" y="385" text-anchor="middle" font-size="16" fill="#374151">спинной мозг (поперечный срез)</text>
  <text x="808" y="160" font-size="14" fill="#6B7280">белое</text><text x="808" y="176" font-size="14" fill="#6B7280">вещество</text>
  <text x="768" y="215" font-size="14" fill="#374151">серое</text>
  <!-- ganglion -->
  <ellipse cx="560" cy="165" rx="26" ry="18" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <text x="520" y="125" font-size="14" fill="#92400E">спинномозговой узел</text>
  <!-- sensory neuron (blue) -->
  <path d="M95,470 C150,420 260,260 420,190 C470,170 520,165 560,165" fill="none" stroke="#2563EB" stroke-width="5"/>
  <circle cx="560" cy="165" r="9" fill="#2563EB"/>
  <path d="M569,165 C600,165 625,190 650,215" fill="none" stroke="#2563EB" stroke-width="5"/>
  <!-- interneuron (purple) -->
  <circle cx="665" cy="228" r="8" fill="#7C3AED"/>
  <path d="M665,228 C670,250 668,275 660,295" fill="none" stroke="#7C3AED" stroke-width="5"/>
  <!-- motor neuron (red) -->
  <circle cx="655" cy="300" r="11" fill="#DC2626"/>
  <path d="M645,305 C560,330 430,330 330,360 C260,380 220,400 200,420" fill="none" stroke="#DC2626" stroke-width="5"/>
  <!-- arm & hand -->
  <path d="M60,520 C80,470 110,440 150,420 L250,365 C270,355 290,370 280,390 L190,450 C160,470 140,500 130,540 z" fill="#FCE7F3" stroke="#9D174D" stroke-width="2"/>
  <ellipse cx="225" cy="395" rx="55" ry="22" transform="rotate(-30 225 395)" fill="#FCA5A5" stroke="#B91C1C" stroke-width="2"/>
  <text x="235" y="345" font-size="15" fill="#B91C1C" transform="rotate(-30 235 345)">мышца-сгибатель</text>
  <!-- fire -->
  <path d="M55,585 C40,560 60,545 55,525 C75,540 70,555 80,560 C85,545 95,540 92,520 C115,545 110,570 100,585 z" fill="#F97316"/>
  <path d="M65,585 C60,570 70,562 70,550 C80,562 82,575 78,585 z" fill="#FDE047"/>
  <circle cx="95" cy="470" r="7" fill="#2563EB"/>
  <!-- arrows along path -->
  <g stroke="#1F2937" stroke-width="2.5" fill="none" marker-end="url(#b)">
    <path d="M300,250 L345,224"/>
    <path d="M410,345 L365,352"/>
  </g>
  <!-- labels -->
  <g font-size="16" fill="#1F2937">
    <circle cx="80" cy="420" r="14" fill="#1F2937"/><text x="80" y="426" text-anchor="middle" fill="#FFF" font-weight="bold">1</text>
    <circle cx="380" cy="160" r="14" fill="#1F2937"/><text x="380" y="166" text-anchor="middle" fill="#FFF" font-weight="bold">2</text>
    <circle cx="610" cy="250" r="14" fill="#1F2937"/><text x="610" y="256" text-anchor="middle" fill="#FFF" font-weight="bold">3</text>
    <circle cx="470" cy="300" r="14" fill="#1F2937"/><text x="470" y="306" text-anchor="middle" fill="#FFF" font-weight="bold">4</text>
    <circle cx="265" cy="440" r="14" fill="#1F2937"/><text x="265" y="446" text-anchor="middle" fill="#FFF" font-weight="bold">5</text>
  </g>
  <g font-size="16">
    <text x="420" y="452" fill="#1F2937" font-weight="bold">1 — рецептор (в коже пальца)</text>
    <text x="420" y="478" fill="#2563EB" font-weight="bold">2 — чувствительный нейрон</text>
    <text x="420" y="504" fill="#7C3AED" font-weight="bold">3 — вставочный нейрон (в спинном мозге)</text>
    <text x="420" y="530" fill="#DC2626" font-weight="bold">4 — двигательный нейрон</text>
    <text x="420" y="556" fill="#B91C1C" font-weight="bold">5 — рабочий орган (мышца)</text>
  </g>
</svg>
