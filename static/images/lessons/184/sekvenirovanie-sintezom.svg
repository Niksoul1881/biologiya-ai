<text x="480" y="270" font-size="14" text-anchor="middle" fill="#333">каждый фрагмент размножается на месте</text>
<text x="480" y="289" font-size="14" text-anchor="middle" fill="#333">(мостиковая амплификация) в кластер</text>
<text x="480" y="308" font-size="14" text-anchor="middle" fill="#333">из сотен одинаковых копий</text>
<rect x="650" y="80" width="290" height="250" rx="12" fill="#f8f9f9" stroke="#aab7b8"/>
<text x="795" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">3. Один цикл</text>
<text x="668" y="146" font-size="14" fill="#222">полимераза добавляет 1 нуклеотид</text>
<text x="668" y="178" font-size="14" fill="#222">с цветной меткой и «стоп-блоком»</text>
<text x="668" y="210" font-size="14" fill="#222">камера фотографирует цвет</text>
<text x="668" y="242" font-size="14" fill="#222">метку и блок снимают химически</text>
<text x="668" y="274" font-size="14" fill="#222">→ следующий цикл, следующая буква</text>
<circle cx="700" cy="312" r="9" fill="#27ae60"/>
<text x="714" y="317" font-size="15" font-weight="bold" fill="#222">A</text>
