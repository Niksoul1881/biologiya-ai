<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="365" fill="#ffffff"/>
<text x="500" y="32" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">От ДНК к белку: три шага и один словарь</text><text x="500" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">В клетке цепочку читает рибосома, в программе — словарь кодонов и цикл</text><rect x="30" y="82" width="250" height="160" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="48" y="108" font-size="19" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">ДНК</text><text x="48" y="126" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">хранение</text><rect x="375" y="82" width="250" height="160" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="393" y="108" font-size="19" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">иРНК</text><text x="393" y="126" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рабочая копия</text><rect x="720" y="82" width="250" height="160" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="738" y="108" font-size="19" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Белок</text><text x="738" y="126" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">результат</text><path d="M58 142 C 78 122, 98 162, 118 142" fill="none" stroke="#16A34A" stroke-width="3"/><path d="M58 178 C 78 158, 98 198, 118 178" fill="none" stroke="#111827" stroke-width="3"/><line x1="62" y1="151" x2="114" y2="151" stroke="#9ca3af" stroke-width="1.5"/><line x1="62" y1="160" x2="114" y2="160" stroke="#9ca3af" stroke-width="1.5"/><line x1="62" y1="169" x2="114" y2="169" stroke="#9ca3af" stroke-width="1.5"/><text x="132" y="152" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">ATG AAA ACC</text><text x="132" y="172" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">TAC TTT TGG</text><text x="393" y="152" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">AUG AAA ACC</text><text x="393" y="172" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">AUU AUU UAA</text><text x="393" y="202" font-size="13" fill="#16A34A" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">T → U</text><circle cx="750" cy="158" r="17" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="750" y="164" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">M</text><circle cx="788" cy="158" r="17" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="788" y="164" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">K</text><circle cx="826" cy="158" r="17" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="826" y="164" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">T</text><circle cx="864" cy="158" r="17" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="864" y="164" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">I</text><circle cx="902" cy="158" r="17" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="902" y="164" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">I</text><text x="750" y="202" font-size="14" fill="#16A34A" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">MKTII</text><line x1="286" y1="160" x2="366" y2="160" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrGreen)"/><text x="326" y="146" font-size="12" fill="#16A34A" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">транскрипция</text><text x="326" y="184" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">T → U</text><line x1="631" y1="160" x2="711" y2="160" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arrGreen)"/><text x="671" y="146" font-size="12" fill="#16A34A" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">трансляция</text><text x="671" y="184" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рибосома + тРНК</text><rect x="30" y="270" width="940" height="64" rx="12" fill="#111827" stroke="#111827" stroke-width="0"/><text x="48" y="298" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">dna = Seq("ATGAAAACCATTATT")</text><text x="48" y="320" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">belok = dna.translate()</text><text x="500" y="310" font-size="14" fill="#86efac" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1"># MKTII</text><text x="500" y="352" font-size="12" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">Один и тот же принцип: текст → тройки → аминокислоты</text></svg>
