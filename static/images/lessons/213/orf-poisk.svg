<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16A34A"/>
    </marker>
    <marker id="arrDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>
<text x="500" y="32" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Поиск ORF: шесть рамок, старт ATG, стоп-кодон</text><text x="500" y="57" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">Один и тот же алгоритм для прямой и обратной цепи</text><rect x="20" y="80" width="280" height="440" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="40" y="112" font-size="15" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Алгоритм</text><rect x="40" y="135" width="240" height="64" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="54" y="161" font-size="14" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">1. Шесть рамок</text><text x="54" y="182" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">3 прямые + 3 обратные</text><line x1="160" y1="199" x2="160" y2="221" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/><rect x="40" y="223" width="240" height="64" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="54" y="249" font-size="14" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">2. Ищи ATG</text><text x="54" y="270" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">старт-кодон</text><line x1="160" y1="287" x2="160" y2="309" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/><rect x="40" y="311" width="240" height="64" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="54" y="337" font-size="14" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">3. Читай до стопа</text><text x="54" y="358" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">TAA, TAG или TGA</text><line x1="160" y1="375" x2="160" y2="397" stroke="#16A34A" stroke-width="2" marker-end="url(#arrGreen)"/><rect x="40" y="399" width="240" height="64" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="54" y="425" font-size="14" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">4. Запиши ORF</text><text x="54" y="446" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">пептид и координаты</text><rect x="320" y="80" width="660" height="440" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="345" y="112" font-size="15" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Последовательность 42 нт</text><text x="345" y="136" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">ATGAAAACCATTATTTAACCCTTAAATGGTTTTAGCCATGGG</text><line x1="345" y1="205" x2="955" y2="205" stroke="#9ca3af" stroke-width="2"/><line x1="345.0" y1="200" x2="345.0" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="345.0" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">0</text><line x1="490.23809523809524" y1="200" x2="490.23809523809524" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="490.23809523809524" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">10</text><line x1="635.4761904761905" y1="200" x2="635.4761904761905" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="635.4761904761905" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">20</text><line x1="780.7142857142858" y1="200" x2="780.7142857142858" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="780.7142857142858" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">30</text><line x1="925.952380952381" y1="200" x2="925.952380952381" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="925.952380952381" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">40</text><line x1="955.0" y1="200" x2="955.0" y2="210" stroke="#9ca3af" stroke-width="1.5"/><text x="955.0" y="227" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">42</text><rect x="345" y="160" width="261.42857142857144" height="26" rx="6" fill="#dcfce7" stroke="#16A34A" stroke-width="2"/><text x="351" y="178" font-size="12" fill="#166534" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">MKTII*</text><text x="345" y="150" font-size="11" fill="#16A34A" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка +1</text><rect x="650.0" y="224" width="261.42857142857144" height="26" rx="6" fill="#e5e7eb" stroke="#111827" stroke-width="2"/><polygon points="650.0,237 663.0,229 663.0,245" fill="#111827"/><text x="670.0" y="242" font-size="12" fill="#111827" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">MAKTI*</text><text x="650.0" y="270" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка −1, обратная цепь</text><rect x="345" y="305" width="610" height="104" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><rect x="345" y="305" width="610" height="30" rx="8" fill="#111827" stroke="#111827" stroke-width="0"/><text x="360" y="325" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Цепь</text><text x="420" y="325" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Рамка</text><text x="490" y="325" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Координаты</text><text x="610" y="325" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Пептид</text><text x="360" y="359" font-size="13" fill="#111827" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">+</text><text x="420" y="359" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">1</text><text x="490" y="359" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">0–18</text><text x="610" y="359" font-size="13" fill="#166534" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">MKTII*</text><text x="360" y="395" font-size="13" fill="#111827" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">−</text><text x="420" y="395" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">1</text><text x="490" y="395" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">3–21</text><text x="610" y="395" font-size="13" fill="#111827" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">MAKTI*</text><text x="345" y="444" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">Для обратной цепи координаты даны в её системе; в исходной это 21–39.</text><text x="345" y="464" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">Порог min_aa отсекает короткие случайные ORF.</text></svg>
