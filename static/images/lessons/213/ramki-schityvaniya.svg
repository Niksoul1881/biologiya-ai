fffff" stroke="#d1d5db" stroke-width="2"/><text x="255" y="557" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAA</text><rect x="306" y="532" width="90" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="351" y="557" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TAA</text><rect x="402" y="532" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="447" y="557" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TGG</text><rect x="498" y="532" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="543" y="557" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TTT</text><rect x="594" y="532" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="639" y="557" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TCA</text><rect x="690" y="532" width="34" height="38" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/><text x="707.0" y="557" font-size="15" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">T</text><text x="800" y="557" font-size="15" fill="#374151" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">→ K*WFS</text><rect x="40" y="600" width="20" height="16" rx="4" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="68" y="613" font-size="12" fill="#111827" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">открытая рамка: старт ATG и стоп на своём месте</text><rect x="430" y="600" width="20" height="16" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="458" y="613" font-size="12" fill="#111827" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">стоп-кодон</text><rect x="580" y="600" width="20" height="16" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/><text x="608" y="613" font-size="12" fill="#111827" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">неполный кодон (1–2 нуклеотида)</text><text x="500" y="648" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">Неполный кодон не переводится: в нём меньше трёх букв. Поэтому длину проверяют до перевода.</text></svg>
