<text x="500" y="32" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Шесть рамок считывания одной последовательности</text><text x="500" y="57" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">18 нуклеотидов: три прямые рамки и три обратные. Сдвиг меняет все кодоны</text><rect x="20" y="78" width="960" height="240" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="38" y="104" font-size="14" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">Прямая цепь 5′→3′</text><text x="38" y="124" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рамки +1, +2, +3 — читаем слева направо</text><text x="38" y="144" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">ATGAAAACCATTATTTAA</text><text x="44" y="173" font-size="17" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">+1</text><text x="44" y="189" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка</text><rect x="150" y="156" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="195" y="181" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">ATG</text><rect x="246" y="156" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="291" y="181" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAA</text><rect x="342" y="156" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="387" y="181" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">ACC</text><rect x="438" y="156" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="483" y="181" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">ATT</text><rect x="534" y="156" width="90" height="38" rx="8" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/><text x="579" y="181" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">ATT</text><rect x="630" y="156" width="90" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="675" y="181" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TAA</text><text x="800" y="181" font-size="15" fill="#16A34A" text-anchor="start" font-weight="bold" font-family="Consolas, monospace" opacity="1">→ MKTII*</text><text x="44" y="235" font-size="17" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">+2</text><text x="44" y="251" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка</text><rect x="180" y="218" width="90" height="38" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="225" y="243" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TGA</text><rect x="276" y="218" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="321" y="243" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAA</text><rect x="372" y="218" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="417" y="243" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">CCA</text><rect x="468" y="218" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="513" y="243" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TTA</text><rect x="564" y="218" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="609" y="243" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TTT</text><rect x="660" y="218" width="60" height="38" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/><text x="690.0" y="243" font-size="15" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="Consolas, monospace" opacity="1">AA</text><text x="800" y="243" font-size="15" fill="#374151" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">→ *KPLF</text><text x="44" y="297" font-size="17" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">+3</text><text x="44" y="313" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка</text><rect x="210" y="280" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="255" y="305" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">GAA</text><rect x="306" y="280" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="351" y="305" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAC</text><rect x="402" y="280" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="447" y="305" font-size="17" fill="#111827" text-anchor="midd