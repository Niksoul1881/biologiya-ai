 width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="195" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TTA</text><rect x="246" y="408" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="291" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAT</text><rect x="342" y="408" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="387" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">AAT</text><rect x="438" y="408" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="483" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">GGT</text><rect x="534" y="408" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="579" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">TTT</text><rect x="630" y="408" width="90" height="38" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/><text x="675" y="433" font-size="17" fill="#111827" text-anchor="middle" font-weight="bold" font-family="Consolas, monospace" opacity="1">CAT</text><text x="800" y="433" font-size="15" fill="#374151" text-anchor="start" font-weight="normal" font-family="Consolas, monospace" opacity="1">→ LNNGFH</text><text x="44" y="487" font-size="17" fill="#111827" text-anchor="start" font-weight="bold" font-family="Arial, Helvetica, sans-serif" opacity="1">−2</text><text x="44" y="503" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="Arial, Helvetica, sans-serif" opacity="1">рамка</text><rect x="180" y="470" width="90" height="38" rx="8" fi