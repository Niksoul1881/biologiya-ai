<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="sans-serif">
<rect width="900" height="600" fill="#fff"/>
<text x="30" y="40" font-size="24" font-weight="bold" fill="#1f2937">Химические элементы в теле человека (% от массы)</text>
<rect x="30" y="56" width="18" height="18" fill="#0F766E"/><text x="56" y="71" font-size="16" fill="#374151">органогены (O, C, H, N) — около 96%</text>
<rect x="400" y="56" width="18" height="18" fill="#F59E0B"/><text x="426" y="71" font-size="16" fill="#374151">другие макроэлементы</text>
<text x="30" y="116" font-size="20" font-weight="bold" fill="#1f2937">O</text>
<text x="80" y="116" font-size="18" fill="#374151">кислород</text>
<rect x="230" y="98" width="560.0" height="24" rx="4" fill="#0F766E"/>
<text x="800.0" y="116" font-size="18" fill="#1f2937">65%</text>
<text x="30" y="156" font-size="20" font-weight="bold" fill="#1f2937">C</text>
<text x="80" y="156" font-size="18" fill="#374151">углерод</text>
<rect x="230" y="138" width="155.1" height="24" rx="4" fill="#0F766E"/>
<text x="395.1" y="156" font-size="18" fill="#1f2937">18%</text>
<text x="30" y="196" font-size="20" font-weight="bold" fill="#1f2937">H</text>
<text x="80" y="196" font-size="18" fill="#374151">водород</text>
<rect x="230" y="178" width="86.2" height="24" rx="4" fill="#0F766E"/>
<text x="326.2" y="196" font-size="18" fill="#1f2937">10%</text>
<text x="30" y="236" font-size="20" font-weight="bold" fill="#1f2937">N</text>
<text x="80" y="236" font-size="18" fill="#374151">азот</text>
<rect x="230" y="218" width="25.8" height="24" rx="4" fill="#0F766E"/>
<text x="265.8" y="236" font-size="18" fill="#1f2937">3%</text>
<text x="30" y="276" font-size="20" font-weight="bold" fill="#1f2937">Ca</text>
<text x="80" y="276" font-size="18" fill="#374151">кальций</text>
<rect x="230" y="258" width="12.9" height="24" rx="4" fill="#F59E0B"/>
<text x="252.9" y="276" font-size="18" fill="#1f2937">1,5%</text>
<text x="30" y="316" font-size="20" font-weight="bold" fill="#1f2937">P</text>
<text x="80" y="316" font-size="18" fill="#374151">фосфор</text>
<rect x="230" y="298" width="8.6" height="24" rx="4" fill="#F59E0B"/>
<text x="248.6" y="316" font-size="18" fill="#1f2937">1,0%</text>
<text x="30" y="356" font-size="20" font-weight="bold" fill="#1f2937">K</text>
<text x="80" y="356" font-size="18" fill="#374151">калий</text>
<rect x="230" y="338" width="3.4" height="24" rx="4" fill="#F59E0B"/>
<text x="243.4" y="356" font-size="18" fill="#1f2937">0,4%</text>
<text x="30" y="396" font-size="20" font-weight="bold" fill="#1f2937">S</text>
<text x="80" y="396" font-size="18" fill="#374151">сера</text>
<rect x="230" y="378" width="3.0" height="24" rx="4" fill="#F59E0B"/>
<text x="243.0" y="396" font-size="18" fill="#1f2937">0,3%</text>
<text x="30" y="436" font-size="20" font-weight="bold" fill="#1f2937">Na</text>
<text x="80" y="436" font-size="18" fill="#374151">натрий</text>
<rect x="230" y="418" width="3.0" height="24" rx="4" fill="#F59E0B"/>
<text x="243.0" y="436" font-size="18" fill="#1f2937">0,2%</text>
<text x="30" y="476" font-size="20" font-weight="bold" fill="#1f2937">Cl</text>
<text x="80" y="476" font-size="18" fill="#374151">хлор</text>
<rect x="230" y="458" width="3.0" height="24" rx="4" fill="#F59E0B"/>
<text x="243.0" y="476" font-size="18" fill="#1f2937">0,2%</text>
<text x="30" y="516" font-size="20" font-weight="bold" fill="#1f2937">Mg</text>
<text x="80" y="516" font-size="18" fill="#374151">магний</text>
<rect x="230" y="498" width="3.0" height="24" rx="4" fill="#F59E0B"/>
<text x="243.0" y="516" font-size="18" fill="#1f2937">0,1%</text>
<text x="30" y="560" font-size="16" fill="#4b5563">Микроэлементы (Fe, Zn, Cu, I, F, Mn, Co, Se и др.) — вместе меньше 0,1%, но без них клетка не работает.</text>
<text x="30" y="584" font-size="14" fill="#6b7280">Округлённые средние значения; у разных людей и в разных тканях доли различаются.</text>
</svg>