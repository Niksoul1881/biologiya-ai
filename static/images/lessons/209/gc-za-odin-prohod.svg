<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">GC-состав за один проход по строке</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#6b7280">dna = "ATGCGCGT": сначала считаем все буквы, потом складываем два числа из словаря</text>

  <!-- green markers -->
  <g fill="#16A34A">
    <circle cx="365" cy="74" r="4"/><circle cx="455" cy="74" r="4"/>
    <circle cx="545" cy="74" r="4"/><circle cx="635" cy="74" r="4"/>
    <circle cx="725" cy="74" r="4"/>
  </g>

  <g font-size="12" fill="#9ca3af" text-anchor="middle" font-family="Consolas, monospace">
    <text x="185" y="94">0</text><text x="275" y="94">1</text><text x="365" y="94">2</text><text x="455" y="94">3</text>
    <text x="545" y="94">4</text><text x="635" y="94">5</text><text x="725" y="94">6</text><text x="815" y="94">7</text>
  </g>

  <!-- boxes: A T G C G C G T -->
  <g stroke="#d1d5db" stroke-width="2">
    <rect x="147" y="102" width="76" height="52" rx="8" fill="#ffffff"/>
    <rect x="237" y="102" width="76" height="52" rx="8" fill="#ffffff"/>
    <rect x="327" y="102" width="76" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="417" y="102" width="76" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="507" y="102" width="76" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="597" y="102" width="76" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="687" y="102" width="76" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="777" y="102" width="76" height="52" rx="8" fill="#ffffff"/>
  </g>
  <g font-size="22" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="185" y="138" fill="#374151">A</text>
    <text x="275" y="138" fill="#374151">T</text>
    <text x="365" y="138" fill="#166534">G</text>
    <text x="455" y="138" fill="#166534">C</text>
    <text x="545" y="138" fill="#166534">G</text>
    <text x="635" y="138" fill="#166534">C</text>
    <text x="725" y="138" fill="#166534">G</text>
    <text x="815" y="138" fill="#374151">T</text>
  </g>
  <text x="920" y="122" font-size="12.5" fill="#16A34A">G и C —</text>
  <text x="920" y="140" font-size="12.5" fill="#16A34A">считаем</text>

  <!-- code panel -->
  <rect x="147" y="180" width="706" height="72" rx="10" fill="#111827"/>
  <text x="165" y="206" font-size="14" fill="#e5e7eb" font-family="Consolas, monospace">counts = Counter(dna)</text>
  <text x="165" y="236" font-size="14" fill="#86efac" font-family="Consolas, monospace">gc = (counts["G"] + counts["C"]) / sum(counts.values())</text>

  <!-- results -->
  <rect x="30" y="278" width="290" height="82" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="175" y="306" text-anchor="middle" font-size="13" fill="#6b7280">G + C из словаря</text>
  <text x="175" y="340" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827" font-family="Consolas, monospace">3 + 2 = 5</text>

  <rect x="355" y="278" width="290" height="82" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="500" y="306" text-anchor="middle" font-size="13" fill="#6b7280">всего оснований</text>
  <text x="500" y="340" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827" font-family="Consolas, monospace">sum = 8</text>

  <rect x="680" y="278" width="290" height="82" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="825" y="306" text-anchor="middle" font-size="13" fill="#166534">GC-состав</text>
  <text x="825" y="340" text-anchor="middle" font-size="19" font-weight="bold" fill="#16A34A" font-family="Consolas, monospace">5 / 8 = 62,5 %</text>

  <text x="500" y="394" text-anchor="middle" font-size="13" fill="#9ca3af">Один проход — вся статистика: и распределение букв, и доля GC. Второй раз строку читать не нужно.</text>
</svg>
