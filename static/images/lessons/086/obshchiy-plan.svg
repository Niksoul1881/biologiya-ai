<text x="130" y="330" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Бактерия</text>
<text x="130" y="355" font-size="14.5" fill="#374151" text-anchor="middle">без ядра; клеточная</text>
<text x="130" y="375" font-size="14.5" fill="#374151" text-anchor="middle">стенка из муреина</text>
<text x="375" y="330" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Растение</text>
<text x="375" y="355" font-size="14.5" fill="#374151" text-anchor="middle">ядро, хлоропласты, вакуоль,</text>
<text x="375" y="375" font-size="14.5" fill="#374151" text-anchor="middle">стенка из целлюлозы</text>
<text x="625" y="330" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Животное</text>
<text x="625" y="355" font-size="14.5" fill="#374151" text-anchor="middle">ядро, митохондрии,</text>
<text x="625" y="375" font-size="14.5" fill="#374151" text-anchor="middle">клеточной стенки нет</text>
<text x="870" y="330" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Гриб</text>
<text x="870" y="355" font-size="14.5" fill="#374151" text-anchor="middle">ядро, митохондрии,</text>
<text x="870" y="375" font-size="14.5" fill="#374151" text-anchor="middle">стенка из хитина</text>
<rect x="70" y="400" width="860" height="52" rx="10" fill="#f0fdfa" stroke="#0F766E"/>
<text x="500" y="422" font-size="16" font-weight="bold" fill="#0F766E" text-anchor="middle">Общее у всех: мембрана, цитоплазма, рибосомы (фиолетовые точки), ДНК, АТФ,</text>
<text x="500" y="443" font-size="16" font-weight="bold" fill="#0F766E" text-anchor="middle">единый генетический код. Синие круги — ядро (у бактерии ДНК лежит в цитоплазме)</text>
