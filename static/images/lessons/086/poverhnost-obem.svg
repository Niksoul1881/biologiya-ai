<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="sans-serif">
<rect width="980" height="470" fill="#fff"/>
<text x="490" y="36" font-size="25" font-weight="bold" fill="#1f2937" text-anchor="middle">Почему клетки маленькие: поверхность и объём</text>
<polygon points="110,240 130,240 130,260 110,260" fill="#99F6E4" stroke="#1f2937" stroke-width="2"/>
<polygon points="110,240 118.0,232.0 138.0,232.0 130,240" fill="#99F6E4" opacity="0.75" stroke="#1f2937" stroke-width="2"/>
<polygon points="130,240 138.0,232.0 138.0,252.0 130,260" fill="#99F6E4" opacity="0.55" stroke="#1f2937" stroke-width="2"/>
<text x="135.0" y="300" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">ребро 1</text>
<text x="135.0" y="328" font-size="17" fill="#374151" text-anchor="middle">площадь S = 6</text>
<text x="135.0" y="353" font-size="17" fill="#374151" text-anchor="middle">объём V = 1</text>
<text x="135.0" y="384" font-size="20" font-weight="bold" fill="#0F766E" text-anchor="middle">S : V = 6,0</text>
<polygon points="330,220 370,220 370,260 330,260" fill="#5EEAD4" stroke="#1f2937" stroke-width="2"/>
<polygon points="330,220 346.0,204.0 386.0,204.0 370,220" fill="#5EEAD4" opacity="0.75" stroke="#1f2937" stroke-width="2"/>
<polygon points="370,220 386.0,204.0 386.0,244.0 370,260" fill="#5EEAD4" opacity="0.55" stroke="#1f2937" stroke-width="2"/>
<text x="365.0" y="300" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">ребро 2</text>
<text x="365.0" y="328" font-size="17" fill="#374151" text-anchor="middle">площадь S = 24</text>
<text x="365.0" y="353" font-size="17" fill="#374151" text-anchor="middle">объём V = 8</text>
<text x="365.0" y="384" font-size="20" font-weight="bold" fill="#0F766E" text-anchor="middle">S : V = 3,0</text>
<polygon points="600,180 680,180 680,260 600,260" fill="#2DD4BF" stroke="#1f2937" stroke-width="2"/>
<polygon points="600,180 632.0,148.0 712.0,148.0 680,180" fill="#2DD4BF" opacity="0.75" stroke="#1f2937" stroke-width="2"/>
<polygon points="680,180 712.0,148.0 712.0,228.0 680,260" fill="#2DD4BF" opacity="0.55" stroke="#1f2937" stroke-width="2"/>
<text x="655.0" y="300" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">ребро 4</text>
<text x="655.0" y="328" font-size="17" fill="#374151" text-anchor="middle">площадь S = 96</text>
<text x="655.0" y="353" font-size="17" fill="#374151" text-anchor="middle">объём V = 64</text>
<text x="655.0" y="384" font-size="20" font-weight="bold" fill="#0F766E" text-anchor="middle">S : V = 1,5</text>
<rect x="760" y="120" width="205" height="190" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
<text x="774" y="148" font-size="15.5" fill="#1f2937">Ребро растёт в 2 раза —</text>
<text x="774" y="170" font-size="15.5" fill="#1f2937">площадь в 4 раза,</text>
<text x="774" y="192" font-size="15.5" fill="#1f2937">объём в 8 раз.</text>
<text x="774" y="236" font-size="15.5" fill="#1f2937">У крупной клетки на</text>
<text x="774" y="258" font-size="15.5" fill="#1f2937">каждую единицу объёма</text>
<text x="774" y="280" font-size="15.5" fill="#1f2937">меньше «дверей»</text>
<text x="774" y="302" font-size="15.5" fill="#1f2937">в мембране.</text>
<text x="490" y="455" font-size="15" fill="#6b7280" text-anchor="middle">Вещества входят и выходят через поверхность, а нужны всему объёму — поэтому выгодно быть маленькими</text>
</svg>