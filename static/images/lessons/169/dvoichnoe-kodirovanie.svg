<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Четыре буквы — два бита на нуклеотид</text>
  <!-- алфавит -->
  <g font-size="26" font-weight="bold" text-anchor="middle">
    <rect x="95" y="62" width="150" height="80" rx="12" fill="#e3f4e0" stroke="#1b7a3a" stroke-width="3"/>
    <text x="170" y="98" fill="#1b7a3a">A</text>
    <text x="170" y="128" font-size="22" fill="#333" font-family="Consolas, monospace">00</text>
    <rect x="285" y="62" width="150" height="80" rx="12" fill="#eef6fb" stroke="#1d4f86" stroke-width="3"/>
    <text x="360" y="98" fill="#1d4f86">C</text>
    <text x="360" y="128" font-size="22" fill="#333" font-family="Consolas, monospace">01</text>
    <rect x="475" y="62" width="150" height="80" rx="12" fill="#f3f3f3" stroke="#333" stroke-width="3"/>
    <text x="550" y="98" fill="#333">G</text>
    <text x="550" y="128" font-size="22" fill="#333" font-family="Consolas, monospace">10</text>
    <rect x="665" y="62" width="150" height="80" rx="12" fill="#fbeeee" stroke="#a02020" stroke-width="3"/>
    <text x="740" y="98" fill="#a02020">T</text>
    <text x="740" y="128" font-size="22" fill="#333" font-family="Consolas, monospace">11</text>
  </g>
  <text x="450" y="172" font-size="15" text-anchor="middle" fill="#555">4 символа = 2² → каждый нуклеотид несёт не больше log₂4 = 2 бит информации</text>
  <!-- пример -->
  <text x="60" y="222" font-size="17" font-weight="bold" fill="#333">Строка:</text>
  <g font-family="Consolas, monospace" font-size="30" font-weight="bold" text-anchor="middle">
    <text x="230" y="224" fill="#333">G</text>
    <text x="320" y="224" fill="#1b7a3a">A</text>
    <text x="410" y="224" fill="#a02020">T</text>
    <text x="500" y="224" fill="#a02020">T</text>
    <text x="590" y="224" fill="#1b7a3a">A</text>
    <text x="680" y="224" fill="#1d4f86">C</text>
    <text x="770" y="224" fill="#1b7a3a">A</text>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="230" y1="234" x2="230" y2="256"/><line x1="320" y1="234" x2="320" y2="256"/><line x1="410" y1="234" x2="410" y2="256"/><line x1="500" y1="234" x2="500" y2="256"/><line x1="590" y1="234" x2="590" y2="256"/><line x1="680" y1="234" x2="680" y2="256"/><line x1="770" y1="234" x2="770" y2="256"/>
  </g>
  <text x="60" y="284" font-size="17" font-weight="bold" fill="#333">Биты:</text>
  <g font-family="Consolas, monospace" font-size="24" text-anchor="middle" fill="#333">
    <text x="230" y="284">10</text><text x="320" y="284">00</text><text x="410" y="284">11</text><text x="500" y="284">11</text><text x="590" y="284">00</text><text x="680" y="284">01</text><text x="770" y="284">00</text>
  </g>
  <text x="450" y="322" font-size="16" text-anchor="middle" fill="#555">7 нуклеотидов → 14 бит. Обычный текст ASCII потратил бы 7 × 8 = 56 бит.</text>
  <!-- байт и геном -->
  <rect x="60" y="350" width="370" height="95" rx="12" fill="#fff8e6" stroke="#b07a00" stroke-width="2.5"/>
  <text x="245" y="384" font-size="18" font-weight="bold" text-anchor="middle" fill="#7a5400">1 байт = 4 нуклеотида</text>
  <text x="245" y="414" font-size="15" text-anchor="middle" fill="#333" font-family="Consolas, monospace">ACGT → 00 01 10 11</text>
  <text x="245" y="434" font-size="13" text-anchor="middle" fill="#555">на этой идее построен, например, формат .2bit</text>
  <rect x="470" y="350" width="370" height="95" rx="12" fill="#eef6fb" stroke="#1d4f86" stroke-width="2.5"/>
  <text x="655" y="384" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4f86">Геном человека</text>
  <text x="655" y="412" font-size="15" text-anchor="middle" fill="#333">≈ 3,1 млрд нуклеотидов × 2 бита</text>
  <text x="655" y="434" font-size="15" text-anchor="middle" fill="#333">≈ 775 МБ (одна копия, без сжатия)</text>
</svg>
