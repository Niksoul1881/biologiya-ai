<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Тургор и плазмолиз</text>
  <!-- 1 тургор -->
  <text x="150" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4ed8">В пресной воде</text>
  <rect x="50" y="90" width="200" height="200" rx="10" fill="#bbf7d0" stroke="#166534" stroke-width="8"/>
  <rect x="62" y="102" width="176" height="176" rx="6" fill="#dbeafe" stroke="#15803d" stroke-width="2"/>
  <circle cx="85" cy="125" r="14" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
  <g fill="#22c55e" stroke="#15803d"><ellipse cx="225" cy="120" rx="8" ry="5"/><ellipse cx="225" cy="260" rx="8" ry="5"/><ellipse cx="75" cy="260" rx="8" ry="5"/></g>
  <g stroke="#1d4ed8" stroke-width="2.5" fill="#1d4ed8">
    <line x1="150" y1="190" x2="150" y2="118"/><polygon points="150,110 145,121 155,121"/>
    <line x1="150" y1="190" x2="150" y2="262"/><polygon points="150,270 145,259 155,259"/>
    <line x1="150" y1="190" x2="222" y2="190"/><polygon points="230,190 219,185 219,195"/>
    <line x1="150" y1="190" x2="78" y2="190"/><polygon points="70,190 81,185 81,195"/>
  </g>
  <text x="150" y="320" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Тургор</text>
  <text x="150" y="340" font-size="14" text-anchor="middle" fill="#374151">вакуоль полная, давит</text>
  <text x="150" y="357" font-size="14" text-anchor="middle" fill="#374151">на стенку — клетка упругая</text>

  <!-- 2 вянет -->
  <text x="450" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#b45309">Мало воды</text>
  <path d="M350,95 C380,88 420,100 450,92 C480,86 520,100 550,95 L548,290 C520,296 480,284 450,292 C420,298 380,286 352,292 z" fill="#bbf7d0" stroke="#166534" stroke-width="8"/>
  <path d="M364,108 C400,102 430,114 450,106 C480,100 510,112 536,108 L534,278 C505,282 480,272 450,280 C420,286 390,276 366,280 z" fill="#e0e7ff" stroke="#15803d" stroke-width="2"/>
  <circle cx="390" cy="130" r="14" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
  <text x="450" y="320" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Увядание</text>
  <text x="450" y="340" font-size="14" text-anchor="middle" fill="#374151">давление слабое —</text>
  <text x="450" y="357" font-size="14" text-anchor="middle" fill="#374151">клетка «мягкая», лист никнет</text>

  <!-- 3 плазмолиз -->
  <text x="750" y="72" font-size="18" font-weight="bold" text-anchor="middle" fill="#b91c1c">В солёной воде</text>
  <rect x="650" y="90" width="200" height="200" rx="10" fill="#ffffff" stroke="#166534" stroke-width="8"/>
  <path d="M700,140 C720,120 780,125 795,145 C812,170 805,230 785,248 C760,265 715,258 700,238 C688,220 685,165 700,140 z" fill="#dbeafe" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="718" cy="160" r="12" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/>
  <g fill="#22c55e" stroke="#15803d"><ellipse cx="785" cy="160" rx="7" ry="4"/><ellipse cx="770" cy="242" rx="7" ry="4"/></g>
  <g stroke="#b91c1c" stroke-width="2.5" fill="#b91c1c">
    <line x1="805" y1="200" x2="835" y2="200"/><polygon points="843,200 832,195 832,205"/>
    <line x1="750" y1="135" x2="750" y2="105"/><polygon points="750,97 745,108 755,108"/>
    <line x1="695" y1="200" x2="665" y2="200"/><polygon points="657,200 668,195 668,205"/>
  </g>
  <text x="750" y="320" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Плазмолиз</text>
  <text x="750" y="340" font-size="14" text-anchor="middle" fill="#374151">вода уходит, содержимое</text>
  <text x="750" y="357" font-size="14" text-anchor="middle" fill="#374151">сжимается и отходит от стенки</text>

  <!-- легенда -->
  <rect x="215" y="375" width="18" height="12" fill="#bbf7d0" stroke="#166534" stroke-width="3"/><text x="240" y="386" font-size="13" fill="#374151">клеточная стенка</text>
  <rect x="370" y="375" width="18" height="12" fill="#dbeafe" stroke="#15803d"/><text x="395" y="386" font-size="13" fill="#374151">цитоплазма с вакуолью</text>
  <circle cx="570" cy="381" r="7" fill="#c4b5fd" stroke="#6d28d9"/><text x="582" y="386" font-size="13" fill="#374151">ядро</text>
  <line x1="630" y1="381" x2="655" y2="381" stroke="#1d4ed8" stroke-width="2.5"/><text x="662" y="386" font-size="13" fill="#374151">движение воды</text>
</svg>
