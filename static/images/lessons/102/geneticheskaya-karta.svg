<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="330" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="450.0" y="32" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Генетическая карта: расстояния складываются</text>
<line x1="100" y1="150" x2="800" y2="150" stroke="#666" stroke-width="12" stroke-linecap="round"/>
<line x1="150" y1="132" x2="150" y2="168" stroke="#c0392b" stroke-width="5"/>
<text x="150" y="122" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">A</text>
<text x="150" y="195" font-size="13" text-anchor="middle" fill="#555">0 сМ</text>
<line x1="450" y1="132" x2="450" y2="168" stroke="#c0392b" stroke-width="5"/>
<text x="450" y="122" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">B</text>
<text x="450" y="195" font-size="13" text-anchor="middle" fill="#555">12 сМ</text>
<line x1="600" y1="132" x2="600" y2="168" stroke="#c0392b" stroke-width="5"/>
<text x="600" y="122" font-size="20" text-anchor="middle" fill="#c0392b" font-weight="bold">C</text>
<text x="600" y="195" font-size="13" text-anchor="middle" fill="#555">18 сМ</text>
<path d="M 150 210 L 150 220 L 450 220 L 450 210" fill="none" stroke="#1d4f86" stroke-width="2"/>
<text x="300.0" y="238" font-size="14" text-anchor="middle" fill="#1d4f86" font-weight="bold">A — B: 12% рекомбинантов</text>
<path d="M 450 210 L 450 220 L 600 220 L 600 210" fill="none" stroke="#1d4f86" stroke-width="2"/>
<text x="525.0" y="238" font-size="14" text-anchor="middle" fill="#1d4f86" font-weight="bold">B — C: 6%</text>
<path d="M 150 85 L 150 75 L 600 75 L 600 85" fill="none" stroke="#a87020" stroke-width="2"/>
<text x="375" y="66" font-size="14" text-anchor="middle" fill="#a87020" font-weight="bold">A — C: 18% = 12 + 6 → ген B лежит между A и C</text>
<text x="450" y="295" font-size="13.5" text-anchor="middle" fill="#333">Зная частоты кроссинговера между тремя генами, можно определить их порядок в хромосоме.</text>
<text x="450" y="315" font-size="13.5" text-anchor="middle" fill="#333">Так в 1913 году Альфред Стёртевант построил первую генетическую карту X-хромосомы дрозофилы.</text>
</svg>