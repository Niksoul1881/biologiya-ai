<text x="520" y="168" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">v</text>
<path d="M 455 108 L 485 152 M 485 108 L 455 152" stroke="#333" stroke-width="2.5"/>
<text x="450" y="195" font-size="13" text-anchor="middle" fill="#555">хиазма: обмен между несестринскими хроматидами</text>
<text x="740" y="70" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">3. Гаметы</text>
<rect x="640" y="90" width="60" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>
<rect x="700" y="90" width="60" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>
<text x="670" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<text x="730" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">V</text>
<text x="770" y="103" font-size="12" text-anchor="start" fill="#555">родительская</text>
<rect x="640" y="118" width="60" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>
<rect x="700" y="118" width="60" height="16" fill="#4f9fd6" stroke="#444" stroke-width="1"/>
