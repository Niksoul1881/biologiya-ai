<text x="230" y="168" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">v</text>
<text x="160" y="195" font-size="13" text-anchor="middle" fill="#555">бивалент: 4 хроматиды</text>
<text x="450" y="70" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">2. Обмен участками (профаза I)</text>
