<text x="380" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<text x="520" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">V</text>
<rect x="330" y="112" width="130" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>

<rect x="470" y="112" width="100" height="16" fill="#4f9fd6" stroke="#444" stroke-width="1"/>
