<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="500" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="450.0" y="32" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Кроссинговер разрывает сцепление генов</text>
<text x="160" y="70" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">1. Конъюгация гомологов</text>
<rect x="40" y="90" width="240" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>
<text x="90" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<text x="230" y="102" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">V</text>
<rect x="40" y="112" width="240" height="16" fill="#d9534f" stroke="#444" stroke-width="1"/>
<text x="90" y="124" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<text x="230" y="124" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">V</text>
<rect x="40" y="134" width="240" height="16" fill="#4f9fd6" stroke="#444" stroke-width="1"/>
<text x="90" y="146" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">b</text>
<text x="230" y="146" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">v</text>
