<line x1="70" y1="0" x2="70" y2="560" stroke="#FCA5A5" stroke-width="1.5"/>
<text x="480" y="40" font-size="21" fill="#111827" font-weight="bold" text-anchor="middle">Как оформить решение: наследование гемофилии</text>
<text x="90" y="88" font-size="20" fill="#0F766E" font-weight="bold" text-anchor="start">Дано:</text>
<text x="180" y="88" font-size="18" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>— нормальная свёртываемость крови; X<tspan dy="-9" font-size="14">h</tspan><tspan dy="9"> </tspan>— гемофилия</text>
<text x="180" y="120" font-size="18" fill="#111827" text-anchor="start">мать — здоровая носительница, отец — здоров</text>
<text x="90" y="184" font-size="20" fill="#0F766E" font-weight="bold" text-anchor="start">P:</text>
<text x="180" y="184" font-size="20" fill="#111827" font-weight="bold" text-anchor="start">♀ X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>X<tspan dy="-9" font-size="14">h</tspan><tspan dy="9"> </tspan></text>
<text x="360" y="184" font-size="20" fill="#111827" font-weight="bold" text-anchor="start">×</text>
<text x="420" y="184" font-size="20" fill="#111827" font-weight="bold" text-anchor="start">♂ X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>Y</text>
<text x="180" y="214" font-size="15" fill="#6B7280" text-anchor="start">норма, носительница</text>
<text x="420" y="214" font-size="15" fill="#6B7280" text-anchor="start">норма</text>
<text x="90" y="280" font-size="20" fill="#0F766E" font-weight="bold" text-anchor="start">G:</text>
<text x="180" y="280" font-size="20" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>  ,  X<tspan dy="-9" font-size="14">h</tspan><tspan dy="9"> </tspan></text>
<text x="420" y="280" font-size="20" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>  ,  Y</text>
<text x="90" y="344" font-size="20" fill="#0F766E" font-weight="bold" text-anchor="start">F₁:</text>
<text x="180" y="344" font-size="20" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>— девочка, здорова</text>
<text x="180" y="376" font-size="20" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>X<tspan dy="-9" font-size="14">h</tspan><tspan dy="9"> </tspan>— девочка, здорова, носительница</text>
<text x="180" y="408" font-size="20" fill="#111827" text-anchor="start">X<tspan dy="-9" font-size="14">H</tspan><tspan dy="9"> </tspan>Y — мальчик, здоров</text>
<text x="180" y="440" font-size="20" fill="#DC2626" font-weight="bold" text-anchor="start">X<tspan dy="-9" font-size="14">h</tspan><tspan dy="9"> </tspan>Y — мальчик, болен гемофилией</text>
<text x="90" y="504" font-size="20" fill="#0F766E" font-weight="bold" text-anchor="start">Ответ:</text>
<text x="180" y="504" font-size="18" fill="#7C3AED" font-weight="bold" text-anchor="start">больной ребёнок — 1/4 (25%); среди сыновей — 1/2 (50%)</text>
</svg>