<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Обратный комплемент 10 млн оснований: замер времени</text>

  <!-- axis -->
  <line x1="250" y1="316" x2="890" y2="316" stroke="#d1d5db" stroke-width="2"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="250" y1="76" x2="250" y2="316"/>
    <line x1="410" y1="300" x2="410" y2="316"/>
    <line x1="570" y1="300" x2="570" y2="316"/>
    <line x1="730" y1="300" x2="730" y2="316"/>
    <line x1="890" y1="300" x2="890" y2="316"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#9ca3af" font-family="Consolas, monospace">
    <text x="250" y="334">0</text>
    <text x="410" y="334">400</text>
    <text x="570" y="334">800</text>
    <text x="730" y="334">1200</text>
    <text x="890" y="334">1600</text>
  </g>
  <text x="912" y="334" font-size="11.5" fill="#9ca3af">мс</text>

  <!-- row 1: translate -->
  <text x="40" y="101" font-size="14" font-weight="bold" fill="#111827">translate</text>
  <rect x="250" y="82" width="12" height="28" rx="4" fill="#16A34A"/>
  <text x="272" y="101" font-size="13.5" fill="#111827">28,4 мс</text>

  <!-- row 2: bytes -->
  <text x="40" y="161" font-size="14" font-weight="bold" fill="#111827">bytes.translate</text>
  <rect x="250" y="142" width="11" height="28" rx="4" fill="#0d9488"/>
  <text x="271" y="161" font-size="13.5" fill="#111827">27,3 мс</text>

  <!-- row 3: biopython -->
  <text x="40" y="221" font-size="14" font-weight="bold" fill="#111827">Biopython</text>
  <rect x="250" y="202" width="12" height="28" rx="4" fill="#1d4ed8"/>
  <text x="272" y="221" font-size="13.5" fill="#111827">28,5 мс</text>

  <!-- row 4: dict -->
  <text x="40" y="281" font-size="14" font-weight="bold" fill="#111827">словарь и цикл</text>
  <rect x="250" y="262" width="630" height="28" rx="4" fill="#b45309"/>
  <text x="640" y="281" font-size="13" fill="#ffffff">1575 мс — в 55 раз дольше</text>

  <!-- note -->
  <rect x="30" y="356" width="940" height="86" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="50" y="384" font-size="13" fill="#374151">Python 3.13.1, Biopython 1.88. Случайная последовательность из A, C, G, T, 3 повтора, лучшее время.</text>
  <text x="50" y="408" font-size="13" fill="#374151">Три способа упираются в скорость C-кода, четвёртый — в скорость цикла Python: отсюда и разрыв.</text>
  <text x="50" y="430" font-size="12.5" fill="#6b7280">Абсолютные числа зависят от машины; смысл имеет только соотношение.</text>
</svg>
