<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Как построить комплемент: четыре способа</text>

  <!-- card 1 -->
  <rect x="30" y="56" width="940" height="108" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="70" cy="92" r="15" fill="#16A34A"/>
  <text x="70" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <text x="98" y="88" font-size="15" font-weight="bold" fill="#111827">str.maketrans + translate</text>
  <text x="98" y="112" font-size="12.5" fill="#6b7280">замена за один проход,</text>
  <text x="98" y="130" font-size="12.5" fill="#6b7280">внутри работает код на C</text>
  <rect x="430" y="66" width="520" height="88" rx="8" fill="#111827"/>
  <text x="446" y="92" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">tab = str.maketrans("ACGT", "TGCA")</text>
  <text x="446" y="116" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">print("ATGCGCGT".translate(tab))</text>
  <text x="446" y="140" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># TACGCGCA</text>

  <!-- card 2 -->
  <rect x="30" y="178" width="940" height="108" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="70" cy="214" r="15" fill="#0f766e"/>
  <text x="70" y="219" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <text x="98" y="210" font-size="15" font-weight="bold" fill="#111827">словарь и цикл</text>
  <text x="98" y="234" font-size="12.5" fill="#6b7280">понятно новичку, но цикл</text>
  <text x="98" y="252" font-size="12.5" fill="#6b7280">идёт на уровне Python</text>
  <rect x="430" y="188" width="520" height="88" rx="8" fill="#111827"/>
  <text x="446" y="214" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">comp = {"A": "T", "T": "A", "G": "C", "C": "G"}</text>
  <text x="446" y="238" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">print("".join(comp[b] for b in "ATGCGCGT"))</text>
  <text x="446" y="262" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># TACGCGCA</text>

  <!-- card 3 -->
  <rect x="30" y="300" width="940" height="108" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="70" cy="336" r="15" fill="#1d4ed8"/>
  <text x="70" y="341" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>
  <text x="98" y="332" font-size="15" font-weight="bold" fill="#111827">bytes.translate</text>
  <text x="98" y="356" font-size="12.5" fill="#6b7280">быстрее всего на длинных</text>
  <text x="98" y="374" font-size="12.5" fill="#6b7280">строках, но только ASCII</text>
  <rect x="430" y="310" width="520" height="88" rx="8" fill="#111827"/>
  <text x="446" y="336" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">bt = bytes.maketrans(b"ACGT", b"TGCA")</text>
  <text x="446" y="360" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">print("ATGCGCGT".encode().translate(bt).decode())</text>
  <text x="446" y="384" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># TACGCGCA</text>

  <!-- card 4 -->
  <rect x="30" y="422" width="940" height="108" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="70" cy="458" r="15" fill="#6d28d9"/>
  <text x="70" y="463" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">4</text>
  <text x="98" y="454" font-size="15" font-weight="bold" fill="#111827">Biopython: сразу reverse_complement</text>
  <text x="98" y="478" font-size="12.5" fill="#6b7280">короче всего; понимает</text>
  <text x="98" y="496" font-size="12.5" fill="#6b7280">регистр и букву N</text>
  <rect x="430" y="432" width="520" height="88" rx="8" fill="#111827"/>
  <text x="446" y="458" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">from Bio.Seq import Seq</text>
  <text x="446" y="482" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">print(Seq("ATGCGCGT").reverse_complement())</text>
  <text x="446" y="506" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># ACGCGCAT</text>

  <!-- note -->
  <rect x="30" y="544" width="940" height="26" rx="8" fill="#f0fdf4"/>
  <text x="44" y="562" font-size="12.5" fill="#166534">Способы 1–3 строят комплемент; чтобы получить обратный комплемент, добавь [::-1]. Biopython умеет и то, и другое.</text>
</svg>
