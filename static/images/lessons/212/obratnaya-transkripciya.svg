<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Обратная транскрипция: из мРНК в кДНК</text>

  <!-- stage 1 -->
  <rect x="30" y="54" width="940" height="80" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="88" font-size="12.5" font-weight="bold" fill="#374151">мРНК</text>
  <text x="48" y="108" font-size="11.5" fill="#9ca3af">матрица, с которой читает фермент</text>
  <g font-size="19" font-weight="bold" font-family="Consolas, monospace">
    <text x="480" y="101" fill="#16A34A">5′-</text>
    <text x="520" y="101" fill="#7e22ce">AUGCGCGUUU</text>
    <text x="640" y="101" fill="#9ca3af">-3′</text>
  </g>

  <!-- arrow 1 -->
  <line x1="500" y1="140" x2="500" y2="172" stroke="#16A34A" stroke-width="2" marker-end="url(#arr6)"/>
  <text x="518" y="163" font-size="12" fill="#6b7280">обратная транскриптаза (RT)</text>

  <!-- stage 2 -->
  <rect x="30" y="180" width="940" height="80" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="214" font-size="12.5" font-weight="bold" fill="#374151">первая цепь кДНК</text>
  <text x="48" y="234" font-size="11.5" fill="#9ca3af">комплемент мРНК, синтез 5′ → 3′</text>
  <g font-size="19" font-weight="bold" font-family="Consolas, monospace">
    <text x="480" y="227" fill="#9ca3af">3′-</text>
    <text x="520" y="227" fill="#b45309">TACGCGCAAA</text>
    <text x="640" y="227" fill="#16A34A">-5′</text>
  </g>

  <!-- arrow 2 -->
  <line x1="500" y1="266" x2="500" y2="298" stroke="#16A34A" stroke-width="2" marker-end="url(#arr6)"/>
  <text x="518" y="289" font-size="12" fill="#6b7280">достраивается вторая цепь</text>

  <!-- stage 3 -->
  <rect x="30" y="306" width="940" height="86" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="48" y="340" font-size="12.5" font-weight="bold" fill="#374151">двуцепочечная кДНК</text>
  <text x="48" y="360" font-size="11.5" fill="#9ca3af">её и хранят в базах как «последовательность кДНК»</text>
  <g font-size="18" font-weight="bold" font-family="Consolas, monospace">
    <text x="480" y="338" fill="#16A34A">5′-</text>
    <text x="520" y="338" fill="#0f766e">ATGCGCGTTT</text>
    <text x="640" y="338" fill="#9ca3af">-3′</text>
    <text x="480" y="368" fill="#9ca3af">3′-</text>
    <text x="520" y="368" fill="#b45309">TACGCGCAAA</text>
    <text x="640" y="368" fill="#16A34A">-5′</text>
  </g>
  <text x="700" y="352" font-size="11.5" fill="#9ca3af">та же строка, что у мРНК, только с T</text>

  <!-- code -->
  <rect x="30" y="408" width="940" height="104" rx="12" fill="#111827"/>
  <text x="50" y="434" font-size="12.5" font-family="Consolas, monospace" fill="#9ca3af">mrna = "AUGCGCGUUU"</text>
  <text x="50" y="458" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">mrna.replace("U", "T")</text>
  <text x="330" y="458" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># ATGCGCGTTT — кодирующая цепь</text>
  <text x="50" y="482" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">str(Seq(mrna).reverse_complement())</text>
  <text x="330" y="482" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80"># AAACGCGCAT — первая цепь</text>

  <text x="50" y="531" font-size="12.5" fill="#6b7280">Обе строки — правильный ответ на разные вопросы. Поэтому уточняй, какая именно цепь нужна.</text>
</svg>
