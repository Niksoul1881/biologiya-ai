<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Транскрипция — не комплемент: три цепи и одна замена</text>

  <!-- strands panel -->
  <rect x="30" y="56" width="940" height="206" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>

  <text x="44" y="112" font-size="11.5" fill="#6b7280">кодирующая</text>
  <text x="152" y="112" font-size="15" font-weight="bold" fill="#16A34A">5′</text>
  <g font-size="21" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="180" y="112" fill="#0f766e">A</text><text x="220" y="112" fill="#b45309">T</text>
    <text x="260" y="112" fill="#6d28d9">G</text><text x="300" y="112" fill="#1d4ed8">C</text>
    <text x="340" y="112" fill="#6d28d9">G</text><text x="380" y="112" fill="#1d4ed8">C</text>
    <text x="420" y="112" fill="#6d28d9">G</text><text x="460" y="112" fill="#b45309">T</text>
    <text x="500" y="112" fill="#b45309">T</text><text x="540" y="112" fill="#b45309">T</text>
  </g>
  <text x="568" y="112" font-size="15" font-weight="bold" fill="#9ca3af">3′</text>

  <g stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="300" y1="122" x2="300" y2="150"/><line x1="340" y1="122" x2="340" y2="150"/>
    <line x1="380" y1="122" x2="380" y2="150"/><line x1="420" y1="122" x2="420" y2="150"/>
    <line x1="460" y1="122" x2="460" y2="150"/><line x1="500" y1="122" x2="500" y2="150"/>
    <line x1="540" y1="122" x2="540" y2="150"/><line x1="580" y1="122" x2="580" y2="150"/>
    <line x1="620" y1="122" x2="620" y2="150"/><line x1="660" y1="122" x2="660" y2="150"/>
  </g>

  <text x="44" y="172" font-size="11.5" fill="#6b7280">матричная</text>
  <text x="152" y="172" font-size="15" font-weight="bold" fill="#9ca3af">3′</text>
  <g font-size="21" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="180" y="172" fill="#b45309">T</text><text x="220" y="172" fill="#0f766e">A</text>
    <text x="260" y="172" fill="#1d4ed8">C</text><text x="300" y="172" fill="#6d28d9">G</text>
    <text x="340" y="172" fill="#1d4ed8">C</text><text x="380" y="172" fill="#6d28d9">G</text>
    <text x="420" y="172" fill="#1d4ed8">C</text><text x="460" y="172" fill="#0f766e">A</text>
    <text x="500" y="172" fill="#0f766e">A</text><text x="540" y="172" fill="#0f766e">A</text>
  </g>
  <text x="568" y="172" font-size="15" font-weight="bold" fill="#16A34A">5′</text>

  <g stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="300" y1="182" x2="300" y2="210"/><line x1="340" y1="182" x2="340" y2="210"/>
    <line x1="380" y1="182" x2="380" y2="210"/><line x1="420" y1="182" x2="420" y2="210"/>
    <line x1="460" y1="182" x2="460" y2="210"/><line x1="500" y1="182" x2="500" y2="210"/>
    <line x1="540" y1="182" x2="540" y2="210"/><line x1="580" y1="182" x2="580" y2="210"/>
    <line x1="620" y1="182" x2="620" y2="210"/><line x1="660" y1="182" x2="660" y2="210"/>
  </g>

  <text x="44" y="232" font-size="11.5" fill="#6b7280">мРНК</text>
  <text x="152" y="232" font-size="15" font-weight="bold" fill="#16A34A">5′</text>
  <g font-size="21" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace" fill="#7e22ce">
    <text x="180" y="232">A</text><text x="220" y="232">U</text><text x="260" y="232">G</text><text x="300" y="232">C</text>
    <text x="340" y="232">G</text><text x="380" y="232">C</text><text x="420" y="232">G</text><text x="460" y="232">U</text>
    <text x="500" y="232">U</text><text x="540" y="232">U</text>
  </g>
  <text x="568" y="232" font-size="15" font-weight="bold" fill="#9ca3af">3′</text>

  <text x="610" y="132" font-size="12" fill="#9ca3af">напротив A всегда T</text>
  <text x="610" y="192" font-size="12" fill="#9ca3af">напротив A всегда U</text>
  <text x="610" y="240" font-size="12" fill="#7e22ce">это и есть мРНК</text>

  <!-- wrong way -->
  <rect x="30" y="282" width="460" height="146" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="48" y="306" font-size="12.5" font-weight="bold" fill="#b91c1c">❌ просто заменить T на U</text>
  <text x="48" y="330" font-size="11.5" font-family="Consolas, monospace" fill="#7f1d1d">template = "AAACGCGCAT"</text>
  <text x="48" y="350" font-size="11.5" font-family="Consolas, monospace" fill="#7f1d1d">print(template.replace("T", "U"))</text>
  <text x="48" y="376" font-size="13" font-family="Consolas, monospace" fill="#b91c1c">AAACGCGCAU</text>
  <text x="48" y="400" font-size="11.5" fill="#7f1d1d">буквы заменены, а цепь осталась матричной:</text>
  <text x="48" y="416" font-size="11.5" fill="#7f1d1d">это не мРНК, а испорченная копия матрицы</text>

  <!-- right way -->
  <rect x="510" y="282" width="460" height="146" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="528" y="306" font-size="12.5" font-weight="bold" fill="#166534">✅ сначала обратный комплемент</text>
  <text x="528" y="330" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">coding = template.translate(tab)[::-1]</text>
  <text x="528" y="350" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">print(coding.replace("T", "U"))</text>
  <text x="528" y="376" font-size="13" font-family="Consolas, monospace" fill="#166534">AUGCGCGUUU</text>
  <text x="528" y="400" font-size="11.5" fill="#14532d">то же самое одной строкой:</text>
  <text x="528" y="416" font-size="11.5" font-family="Consolas, monospace" fill="#14532d">Seq(template).reverse_complement_rna()</text>

  <!-- rule -->
  <rect x="30" y="444" width="940" height="72" rx="12" fill="#111827"/>
  <text x="50" y="470" font-size="12.5" font-family="Consolas, monospace" fill="#e5e7eb">правило: мРНК = reverse complement(матричная цепь), потом замена T → U</text>
  <text x="50" y="494" font-size="12.5" font-family="Consolas, monospace" fill="#4ade80">если на руках кодирующая цепь — хватит replace("T", "U")</text>
</svg>
