<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">DataFrame и Series: вся таблица и один её столбец</text>

  <rect x="40" y="62" width="440" height="268" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="62" y="92" font-size="16" font-weight="bold" fill="#111827">DataFrame — вся таблица</text>
  <text x="62" y="114" font-size="13" fill="#6b7280">две оси: строки (index) и столбцы (columns)</text>

  <g font-size="13.5">
    <rect x="62" y="130" width="400" height="32" rx="5" fill="#111827"/>
    <text x="72" y="151" fill="#e5e7eb" font-weight="bold">gene</text>
    <text x="255" y="151" text-anchor="middle" fill="#e5e7eb" font-weight="bold">ctrl_1</text>
    <text x="360" y="151" text-anchor="middle" fill="#e5e7eb" font-weight="bold">treat_1</text>

    <rect x="62" y="162" width="400" height="32" fill="#f9fafb"/>
    <rect x="62" y="194" width="400" height="32" fill="#ffffff"/>
    <rect x="62" y="226" width="400" height="32" fill="#f9fafb"/>

    <text x="72" y="183" fill="#111827">TP53</text>
    <text x="72" y="215" fill="#111827">GAPDH</text>
    <text x="72" y="247" fill="#111827">MYC</text>
    <g fill="#111827" text-anchor="middle">
      <text x="255" y="183">120</text><text x="360" y="183">210</text>
      <text x="255" y="215">5200</text><text x="360" y="215">5400</text>
      <text x="255" y="247">300</text><text x="360" y="247">950</text>
    </g>
  </g>
  <g stroke="#e5e7eb" stroke-width="1.2">
    <line x1="62" y1="162" x2="462" y2="162"/><line x1="62" y1="194" x2="462" y2="194"/>
    <line x1="62" y1="226" x2="462" y2="226"/><line x1="62" y1="258" x2="462" y2="258"/>
    <line x1="200" y1="130" x2="200" y2="258"/><line x1="310" y1="130" x2="310" y2="258"/>
  </g>
  <text x="62" y="290" font-size="13" fill="#15803d" font-family="Consolas, monospace">df.shape → (6, 4)</text>
  <text x="215" y="290" font-size="13" fill="#6b7280">— осей две</text>
  <text x="62" y="314" font-size="13" fill="#6b7280">table[row, column] — две координаты</text>

  <rect x="520" y="62" width="440" height="268" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="542" y="92" font-size="16" font-weight="bold" fill="#111827">Series — один столбец</text>
  <text x="542" y="114" font-size="13" fill="#6b7280">одна ось: index, а имя — имя столбца</text>

  <g font-size="13.5">
    <rect x="542" y="130" width="396" height="32" rx="5" fill="#111827"/>
    <text x="552" y="151" fill="#e5e7eb" font-weight="bold">gene</text>
    <text x="760" y="151" text-anchor="middle" fill="#e5e7eb" font-weight="bold">treat_1</text>

    <rect x="542" y="162" width="396" height="32" fill="#f0fdf4"/>
    <rect x="542" y="194" width="396" height="32" fill="#ffffff"/>
    <rect x="542" y="226" width="396" height="32" fill="#f0fdf4"/>

    <text x="552" y="183" fill="#111827">TP53</text>
    <text x="552" y="215" fill="#111827">GAPDH</text>
    <text x="552" y="247" fill="#111827">MYC</text>
    <g fill="#111827" text-anchor="middle">
      <text x="760" y="183">210</text><text x="760" y="215">5400</text><text x="760" y="247">950</text>
    </g>
  </g>
  <g stroke="#e5e7eb" stroke-width="1.2">
    <line x1="542" y1="162" x2="938" y2="162"/><line x1="542" y1="194" x2="938" y2="194"/>
    <line x1="542" y1="226" x2="938" y2="226"/><line x1="542" y1="258" x2="938" y2="258"/>
    <line x1="680" y1="130" x2="680" y2="258"/>
  </g>
  <text x="542" y="290" font-size="13" fill="#15803d" font-family="Consolas, monospace">df["treat_1"].shape → (6,)</text>
  <text x="542" y="314" font-size="13" fill="#6b7280">индекс остался, столбец исчез — это вектор</text>

  <rect x="40" y="350" width="920" height="92" rx="12" fill="#111827"/>
  <text x="62" y="380" font-size="14" fill="#86efac" font-family="Consolas, monospace">type(df)</text>
  <text x="290" y="380" font-size="14" fill="#e5e7eb" font-family="Consolas, monospace">&lt;class 'pandas.DataFrame'&gt;</text>
  <text x="62" y="410" font-size="14" fill="#86efac" font-family="Consolas, monospace">type(df["treat_1"])</text>
  <text x="290" y="410" font-size="14" fill="#e5e7eb" font-family="Consolas, monospace">&lt;class 'pandas.Series'&gt;</text>
  <text x="290" y="432" font-size="11.5" fill="#9ca3af">Series знает только про одну ось — строки; второй координаты у неё нет</text>
</svg>
