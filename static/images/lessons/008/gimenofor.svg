<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Загляни под шляпку: трубчатый и пластинчатый</text>

  <!-- Трубчатый: вид снизу -->
  <text x="225" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#92400e">Трубчатый</text>
  <circle cx="225" cy="215" r="120" fill="#fde68a" stroke="#92400e" stroke-width="4"/>
  <g fill="#fef9c3" stroke="#a16207" stroke-width="1.5">
    <circle cx="145" cy="175" r="7"/><circle cx="163" cy="160" r="7"/><circle cx="183" cy="148" r="7"/><circle cx="205" cy="141" r="7"/><circle cx="228" cy="138" r="7"/><circle cx="251" cy="141" r="7"/><circle cx="272" cy="149" r="7"/><circle cx="290" cy="162" r="7"/><circle cx="305" cy="178" r="7"/>
    <circle cx="135" cy="200" r="7"/><circle cx="155" cy="187" r="7"/><circle cx="176" cy="174" r="7"/><circle cx="273" cy="174" r="7"/><circle cx="294" cy="188" r="7"/><circle cx="313" cy="203" r="7"/>
    <circle cx="133" cy="226" r="7"/><circle cx="153" cy="214" r="7"/><circle cx="297" cy="214" r="7"/><circle cx="317" cy="228" r="7"/>
    <circle cx="137" cy="252" r="7"/><circle cx="157" cy="241" r="7"/><circle cx="293" cy="241" r="7"/><circle cx="313" cy="254" r="7"/>
    <circle cx="148" cy="277" r="7"/><circle cx="168" cy="266" r="7"/><circle cx="188" cy="282" r="7"/><circle cx="210" cy="290" r="7"/><circle cx="234" cy="292" r="7"/><circle cx="257" cy="287" r="7"/><circle cx="279" cy="270" r="7"/><circle cx="300" cy="278" r="7"/>
    <circle cx="165" cy="300" r="7"/><circle cx="189" cy="310" r="7"/><circle cx="214" cy="316" r="7"/><circle cx="239" cy="316" r="7"/><circle cx="263" cy="310" r="7"/><circle cx="286" cy="299" r="7"/>
    <circle cx="200" cy="164" r="7"/><circle cx="250" cy="164" r="7"/><circle cx="178" cy="262" r="7"/><circle cx="272" cy="262" r="7"/>
  </g>
  <circle cx="225" cy="215" r="38" fill="#fefce8" stroke="#a16207" stroke-width="3"/>
  <text x="225" y="221" font-size="14" text-anchor="middle" fill="#713f12">ножка</text>
  <text x="225" y="365" font-size="16" text-anchor="middle" fill="#1f2937">низ шляпки — как губка</text>
  <text x="225" y="385" font-size="16" text-anchor="middle" fill="#1f2937">из множества трубочек</text>
  <text x="225" y="413" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">белый гриб, подберёзовик, маслёнок</text>

  <!-- Пластинчатый: вид снизу -->
  <text x="675" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Пластинчатый</text>
  <circle cx="675" cy="215" r="120" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="675" y1="177" x2="675" y2="95"/><line x1="675" y1="253" x2="675" y2="335"/><line x1="637" y1="215" x2="555" y2="215"/><line x1="713" y1="215" x2="795" y2="215"/>
    <line x1="702" y1="188" x2="760" y2="130"/><line x1="648" y1="242" x2="590" y2="300"/><line x1="648" y1="188" x2="590" y2="130"/><line x1="702" y1="242" x2="760" y2="300"/>
    <line x1="690" y1="180" x2="721" y2="104"/><line x1="660" y1="250" x2="629" y2="326"/><line x1="660" y1="180" x2="629" y2="104"/><line x1="690" y1="250" x2="721" y2="326"/>
    <line x1="710" y1="200" x2="786" y2="169"/><line x1="640" y1="230" x2="564" y2="261"/><line x1="640" y1="200" x2="564" y2="169"/><line x1="710" y1="230" x2="786" y2="261"/>
    <line x1="698" y1="105" x2="696" y2="135"/><line x1="742" y1="117" x2="732" y2="142"/><line x1="779" y1="146" x2="760" y2="160"/><line x1="793" y1="191" x2="770" y2="195"/>
    <line x1="793" y1="239" x2="770" y2="235"/><line x1="779" y1="284" x2="760" y2="270"/><line x1="742" y1="313" x2="732" y2="288"/><line x1="698" y1="325" x2="696" y2="295"/>
    <line x1="652" y1="325" x2="654" y2="295"/><line x1="608" y1="313" x2="618" y2="288"/><line x1="571" y1="284" x2="590" y2="270"/><line x1="557" y1="239" x2="580" y2="235"/>
    <line x1="557" y1="191" x2="580" y2="195"/><line x1="571" y1="146" x2="590" y2="160"/><line x1="608" y1="117" x2="618" y2="142"/><line x1="652" y1="105" x2="654" y2="135"/>
  </g>
  <circle cx="675" cy="215" r="38" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <text x="675" y="221" font-size="14" text-anchor="middle" fill="#334155">ножка</text>
  <text x="675" y="365" font-size="16" text-anchor="middle" fill="#1f2937">низ шляпки — тонкие пластинки</text>
  <text x="675" y="385" font-size="16" text-anchor="middle" fill="#1f2937">от ножки к краю, как спицы</text>
  <text x="675" y="413" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">сыроежка, шампиньон, мухомор</text>
</svg>
