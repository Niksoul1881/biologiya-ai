<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Плесневые грибы под микроскопом</text>

  <!-- МУКОР -->
  <text x="225" y="72" font-size="21" font-weight="bold" text-anchor="middle" fill="#374151">Мукор (белая плесень)</text>
  <rect x="20" y="370" width="410" height="30" fill="#fde68a"/>
  <text x="225" y="390" font-size="13" text-anchor="middle" fill="#92400e">хлеб</text>
  <!-- грибница без перегородок -->
  <path d="M40,368 C100,355 160,372 225,360 C290,350 350,370 410,360" fill="none" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>
  <g fill="#6b7280"><circle cx="80" cy="362" r="2.5"/><circle cx="130" cy="366" r="2.5"/><circle cx="180" cy="364" r="2.5"/><circle cx="260" cy="356" r="2.5"/><circle cx="320" cy="360" r="2.5"/><circle cx="380" cy="362" r="2.5"/></g>
  <!-- спорангиеносцы -->
  <g stroke="#9ca3af" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M120,365 C118,300 122,230 120,175"/><path d="M225,360 C228,290 222,200 225,140"/><path d="M330,360 C328,300 334,240 330,190"/>
  </g>
  <!-- спорангии -->
  <circle cx="120" cy="155" r="25" fill="#111827" stroke="#374151" stroke-width="2"/>
  <circle cx="225" cy="118" r="27" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <circle cx="330" cy="170" r="22" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <g fill="#9ca3af"><circle cx="322" cy="165" r="3"/><circle cx="335" cy="160" r="3"/><circle cx="340" cy="175" r="3"/><circle cx="326" cy="178" r="3"/></g>
  <g fill="#111827"><circle cx="262" cy="95" r="3"/><circle cx="270" cy="110" r="3"/><circle cx="258" cy="78" r="3"/><circle cx="160" cy="135" r="3"/></g>
  <g font-size="14" fill="#1f2937">
    <line x1="252" y1="118" x2="300" y2="112" stroke="#374151" stroke-width="1.5"/>
    <text x="305" y="105" font-weight="bold">спорангий —</text>
    <text x="305" y="122">шарик со спорами</text>
    <text x="305" y="139">(зрелый — чёрный)</text>
    <line x1="120" y1="260" x2="60" y2="250" stroke="#374151" stroke-width="1.5"/>
    <text x="25" y="230" font-weight="bold">гифа</text>
    <text x="25" y="246">без перегородок</text>
    <text x="25" y="300" font-size="13" fill="#4b5563">вся грибница —</text>
    <text x="25" y="316" font-size="13" fill="#4b5563">одна клетка</text>
    <text x="25" y="332" font-size="13" fill="#4b5563">с многими ядрами</text>
  </g>

  <line x1="450" y1="60" x2="450" y2="410" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ПЕНИЦИЛЛ -->
  <text x="675" y="72" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f766e">Пеницилл (сизо-зелёная)</text>
  <rect x="470" y="370" width="410" height="30" fill="#fed7aa"/>
  <text x="675" y="390" font-size="13" text-anchor="middle" fill="#9a3412">апельсин</text>
  <path d="M490,368 C550,355 610,372 675,360 C740,350 800,370 860,360" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#0f766e" stroke-width="2"><line x1="540" y1="355" x2="540" y2="371"/><line x1="610" y1="357" x2="610" y2="373"/><line x1="740" y1="350" x2="740" y2="366"/><line x1="810" y1="355" x2="810" y2="371"/></g>
  <!-- конидиеносец -->
  <path d="M675,360 L675,215" stroke="#5eead4" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#0f766e" stroke-width="2"><line x1="668" y1="300" x2="682" y2="300"/><line x1="668" y1="250" x2="682" y2="250"/></g>
  <!-- кисточка -->
  <g stroke="#5eead4" stroke-width="6" stroke-linecap="round">
    <line x1="675" y1="215" x2="645" y2="185"/><line x1="675" y1="215" x2="675" y2="180"/><line x1="675" y1="215" x2="705" y2="185"/>
    <line x1="645" y1="185" x2="630" y2="160"/><line x1="645" y1="185" x2="655" y2="158"/>
    <line x1="675" y1="180" x2="668" y2="153"/><line x1="675" y1="180" x2="684" y2="153"/>
    <line x1="705" y1="185" x2="697" y2="158"/><line x1="705" y1="185" x2="722" y2="160"/>
  </g>
  <!-- цепочки спор -->
  <g fill="#14b8a6" stroke="#0f766e" stroke-width="1.5">
    <circle cx="626" cy="150" r="5"/><circle cx="622" cy="139" r="5"/><circle cx="618" cy="128" r="5"/><circle cx="614" cy="117" r="5"/>
    <circle cx="657" cy="148" r="5"/><circle cx="659" cy="137" r="5"/><circle cx="661" cy="126" r="5"/><circle cx="663" cy="115" r="5"/>
    <circle cx="666" cy="143" r="5"/><circle cx="664" cy="132" r="5"/><circle cx="662" cy="121" r="5"/>
    <circle cx="686" cy="143" r="5"/><circle cx="688" cy="132" r="5"/><circle cx="690" cy="121" r="5"/><circle cx="692" cy="110" r="5"/>
    <circle cx="695" cy="148" r="5"/><circle cx="693" cy="137" r="5"/><circle cx="691" cy="126" r="5"/>
    <circle cx="726" cy="150" r="5"/><circle cx="730" cy="139" r="5"/><circle cx="734" cy="128" r="5"/><circle cx="738" cy="117" r="5"/>
  </g>
  <g font-size="14" fill="#1f2937">
    <line x1="738" y1="125" x2="770" y2="115" stroke="#374151" stroke-width="1.5"/>
    <text x="775" y="105" font-weight="bold">цепочки</text>
    <text x="775" y="122" font-weight="bold">спор</text>
    <line x1="710" y1="195" x2="770" y2="200" stroke="#374151" stroke-width="1.5"/>
    <text x="775" y="198" font-weight="bold">«кисточка»</text>
    <line x1="682" y1="275" x2="770" y2="275" stroke="#374151" stroke-width="1.5"/>
    <text x="775" y="270" font-weight="bold">гифа</text>
    <text x="775" y="286">с перегородками</text>
    <text x="490" y="300" font-size="13" fill="#4b5563">грибница</text>
    <text x="490" y="316" font-size="13" fill="#4b5563">многоклеточная</text>
  </g>
  <text x="450" y="440" font-size="15" text-anchor="middle" fill="#374151">Мукор: споры в шаровидных головках, гифы без перегородок.</text>
  <text x="450" y="463" font-size="15" text-anchor="middle" fill="#374151">Пеницилл: споры цепочками на «кисточках», гифы разделены перегородками.</text>
</svg>
