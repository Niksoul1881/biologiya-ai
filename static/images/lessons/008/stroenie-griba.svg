<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Строение шляпочного гриба</text>
  <!-- почва -->
  <rect x="0" y="390" width="900" height="170" fill="#e7d3b5"/>
  <line x1="0" y1="390" x2="900" y2="390" stroke="#92400e" stroke-width="3"/>
  <!-- грибница -->
  <g fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round">
    <path d="M300,395 C250,420 200,430 120,470 M300,395 C280,450 240,480 200,530 M300,395 C330,440 380,470 470,500 M300,395 C320,470 330,500 320,545"/>
    <path d="M200,450 C170,460 150,490 110,510 M380,470 C420,450 460,440 520,445 M240,480 C220,500 180,520 150,545 M470,500 C500,520 540,530 600,520"/>
    <path d="M120,470 C90,480 60,470 30,490 M520,445 C560,430 600,440 650,425 M600,520 C640,500 680,505 720,480"/>
  </g>
  <!-- ножка -->
  <path d="M282,395 C278,330 282,260 288,205 L314,205 C320,260 324,330 320,395 z" fill="#fefce8" stroke="#a16207" stroke-width="3"/>
  <!-- вольва -->
  <path d="M262,395 C262,360 275,345 285,342 L317,342 C327,345 340,360 340,395 z" fill="#f5f5f4" stroke="#78716c" stroke-width="3"/>
  <!-- кольцо -->
  <path d="M283,232 C270,245 268,258 276,262 C290,252 312,252 326,262 C334,258 332,245 319,232 z" fill="#f5f5f4" stroke="#78716c" stroke-width="2.5"/>
  <!-- шляпка -->
  <path d="M140,205 C150,110 240,75 301,75 C362,75 452,110 462,205 z" fill="#d6c97a" stroke="#854d0e" stroke-width="3"/>
  <!-- пластинки -->
  <path d="M140,205 L462,205 C440,222 380,226 301,226 C222,226 162,222 140,205 z" fill="#ffffff" stroke="#854d0e" stroke-width="2.5"/>
  <g stroke="#a8a29e" stroke-width="1.5">
    <line x1="170" y1="208" x2="290" y2="222"/><line x1="200" y1="208" x2="292" y2="222"/><line x1="230" y1="207" x2="294" y2="222"/><line x1="260" y1="207" x2="296" y2="222"/>
    <line x1="432" y1="208" x2="312" y2="222"/><line x1="402" y1="208" x2="310" y2="222"/><line x1="372" y1="207" x2="308" y2="222"/><line x1="342" y1="207" x2="306" y2="222"/>
  </g>
  <!-- подписи -->
  <g font-size="18" fill="#1f2937">
    <line x1="400" y1="120" x2="600" y2="95" stroke="#374151" stroke-width="2"/>
    <text x="608" y="100" font-weight="bold">Шляпка</text>
    <line x1="420" y1="215" x2="600" y2="175" stroke="#374151" stroke-width="2"/>
    <text x="608" y="170" font-weight="bold">Пластинки</text>
    <text x="608" y="190" font-size="15" fill="#4b5563">на них образуются споры</text>
    <text x="608" y="208" font-size="15" fill="#4b5563">(у трубчатых грибов — трубочки)</text>
    <line x1="330" y1="248" x2="600" y2="250" stroke="#374151" stroke-width="2"/>
    <text x="608" y="255" font-weight="bold">Кольцо</text>
    <text x="608" y="274" font-size="15" fill="#4b5563">есть не у всех грибов</text>
    <line x1="318" y1="300" x2="600" y2="315" stroke="#374151" stroke-width="2"/>
    <text x="608" y="320" font-weight="bold">Ножка</text>
    <line x1="338" y1="375" x2="600" y2="368" stroke="#374151" stroke-width="2"/>
    <text x="608" y="365" font-weight="bold">Вольва</text>
    <text x="608" y="384" font-size="15" fill="#4b5563">мешочек у основания ножки</text>
    <line x1="470" y1="500" x2="600" y2="470" stroke="#1f2937" stroke-width="2"/>
    <text x="608" y="465" font-weight="bold">Грибница (мицелий)</text>
    <text x="608" y="485" font-size="15" fill="#4b5563">сеть нитей-гиф в почве —</text>
    <text x="608" y="503" font-size="15" fill="#4b5563">главное тело гриба</text>
  </g>
  <!-- скобка плодового тела -->
  <path d="M110,75 L95,75 L95,395 L110,395" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <text x="80" y="235" font-size="17" font-weight="bold" fill="#b91c1c" text-anchor="middle" transform="rotate(-90 80 235)">Плодовое тело</text>
</svg>
