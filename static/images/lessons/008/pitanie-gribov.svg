<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Как питаются грибы</text>

  <!-- Панель 1: сапротрофы -->
  <rect x="15" y="55" width="300" height="400" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
  <text x="165" y="88" font-size="20" font-weight="bold" text-anchor="middle" fill="#854d0e">Сапротрофы</text>
  <rect x="15" y="250" width="300" height="80" fill="#e7d3b5"/>
  <!-- опавший лист -->
  <path d="M70,240 C110,200 180,205 230,240 C180,262 110,262 70,240 z" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <line x1="70" y1="240" x2="230" y2="240" stroke="#92400e" stroke-width="2"/>
  <!-- бревно -->
  <rect x="200" y="200" width="100" height="40" rx="18" fill="#a16207" stroke="#713f12" stroke-width="2"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.5">
    <path d="M90,250 C110,270 140,260 160,285 M150,250 C170,275 200,265 230,290 M220,240 C240,260 260,255 290,275"/>
  </g>
  <text x="165" y="130" font-size="15" text-anchor="middle" fill="#1f2937">питаются мёртвыми остатками:</text>
  <text x="165" y="150" font-size="15" text-anchor="middle" fill="#1f2937">листьями, древесиной, навозом,</text>
  <text x="165" y="170" font-size="15" text-anchor="middle" fill="#1f2937">продуктами</text>
  <text x="165" y="360" font-size="15" text-anchor="middle" fill="#1f2937">Разлагают органику</text>
  <text x="165" y="380" font-size="15" text-anchor="middle" fill="#1f2937">до минеральных веществ</text>
  <text x="165" y="420" font-size="15" font-weight="bold" text-anchor="middle" fill="#854d0e">шампиньон, опёнок,</text>
  <text x="165" y="440" font-size="15" font-weight="bold" text-anchor="middle" fill="#854d0e">мукор, пеницилл</text>

  <!-- Панель 2: паразиты -->
  <rect x="330" y="55" width="300" height="400" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="480" y="88" font-size="20" font-weight="bold" text-anchor="middle" fill="#991b1b">Паразиты</text>
  <rect x="450" y="120" width="60" height="210" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/>
  <g stroke="#1c1917" stroke-width="3"><line x1="458" y1="150" x2="475" y2="150"/><line x1="485" y1="190" x2="503" y2="190"/><line x1="460" y1="240" x2="478" y2="240"/><line x1="482" y1="290" x2="500" y2="290"/></g>
  <!-- трутовик -->
  <path d="M510,200 C560,195 585,215 580,232 C560,238 530,236 510,232 z" fill="#a16207" stroke="#713f12" stroke-width="2"/>
  <path d="M510,250 C550,247 570,262 566,275 C548,280 528,278 510,276 z" fill="#a16207" stroke="#713f12" stroke-width="2"/>
  <text x="480" y="360" font-size="15" text-anchor="middle" fill="#1f2937">живут на живом организме</text>
  <text x="480" y="380" font-size="15" text-anchor="middle" fill="#1f2937">и питаются за его счёт</text>
  <text x="480" y="420" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">трутовик на берёзе, головня,</text>
  <text x="480" y="440" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">ржавчина, спорынья</text>

  <!-- Панель 3: симбионты -->
  <rect x="645" y="55" width="300" height="400" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="795" y="88" font-size="20" font-weight="bold" text-anchor="middle" fill="#166534">Симбионты (микориза)</text>
  <rect x="645" y="200" width="300" height="130" fill="#e7d3b5"/>
  <!-- ствол и корни -->
  <rect x="780" y="105" width="30" height="95" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/>
  <g fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round">
    <path d="M795,200 C780,240 740,260 700,280 M795,200 C810,245 850,265 900,285 M795,200 C795,250 790,280 785,315"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <path d="M700,280 C690,295 670,300 660,320 M700,280 C715,300 740,305 750,320 M900,285 C915,300 930,305 940,320 M900,285 C880,300 870,312 860,325 M785,315 C770,322 760,328 745,328"/>
  </g>
  <!-- обмен стрелками -->
  <text x="795" y="350" font-size="14" text-anchor="middle" fill="#1f2937">дерево → грибу: сахара</text>
  <text x="795" y="370" font-size="14" text-anchor="middle" fill="#1f2937">гриб → дереву: вода и</text>
  <text x="795" y="388" font-size="14" text-anchor="middle" fill="#1f2937">минеральные вещества</text>
  <text x="795" y="420" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">подберёзовик, подосиновик,</text>
  <text x="795" y="440" font-size="15" font-weight="bold" text-anchor="middle" fill="#166534">маслёнок, белый гриб</text>
  <text x="795" y="130" font-size="13" text-anchor="middle" fill="#166534" transform="translate(-90,0)">берёза</text>
</svg>
