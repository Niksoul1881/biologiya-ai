<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#FFFFFF"/>
  <text x="450" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2937">Уровни организации организма человека</text>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#0F766E"/></marker>
  </defs>
  <!-- panels row 1 -->
  <g stroke="#E5E7EB" stroke-width="2" fill="#FAFAF8">
    <rect x="30" y="70" width="250" height="250" rx="16"/>
    <rect x="325" y="70" width="250" height="250" rx="16"/>
    <rect x="620" y="70" width="250" height="250" rx="16"/>
    <rect x="30" y="365" width="250" height="250" rx="16"/>
    <rect x="325" y="365" width="250" height="250" rx="16"/>
    <rect x="620" y="365" width="250" height="250" rx="16"/>
  </g>
  <!-- arrows -->
  <g stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#ar)">
    <line x1="283" y1="195" x2="318" y2="195"/>
    <line x1="578" y1="195" x2="613" y2="195"/>
    <path d="M745,322 C745,345 155,335 155,358"/>
    <line x1="283" y1="490" x2="318" y2="490"/>
    <line x1="578" y1="490" x2="613" y2="490"/>
  </g>
  <!-- 1 molecules -->
  <g>
    <g stroke="#6B7280" stroke-width="3">
      <line x1="110" y1="170" x2="150" y2="145"/><line x1="150" y1="145" x2="195" y2="170"/>
      <line x1="195" y1="170" x2="200" y2="215"/><line x1="110" y1="170" x2="105" y2="215"/>
      <line x1="105" y1="215" x2="150" y2="240"/><line x1="150" y1="240" x2="200" y2="215"/>
      <line x1="195" y1="170" x2="235" y2="150"/>
    </g>
    <circle cx="110" cy="170" r="14" fill="#16A34A"/><circle cx="150" cy="145" r="12" fill="#DC2626"/>
    <circle cx="195" cy="170" r="14" fill="#16A34A"/><circle cx="200" cy="215" r="12" fill="#2563EB"/>
    <circle cx="105" cy="215" r="14" fill="#16A34A"/><circle cx="150" cy="240" r="12" fill="#DC2626"/>
    <circle cx="235" cy="150" r="10" fill="#9CA3AF"/>
    <text x="155" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">1. Молекулярный</text>
    <text x="155" y="285" text-anchor="middle" font-size="16" fill="#374151">белки, ДНК, жиры, вода</text>
    <text x="155" y="306" text-anchor="middle" font-size="16" fill="#374151">(белки актин и миозин)</text>
  </g>
  <!-- 2 cell -->
  <g>
    <rect x="365" y="135" width="170" height="115" rx="50" fill="#FDE2E2" stroke="#B91C1C" stroke-width="3"/>
    <circle cx="450" cy="192" r="24" fill="#C4B5FD" stroke="#5B21B6" stroke-width="3"/>
    <circle cx="455" cy="188" r="7" fill="#5B21B6"/>
    <g stroke="#B91C1C" stroke-width="2" opacity="0.6"><line x1="385" y1="160" x2="420" y2="160"/><line x1="480" y1="225" x2="515" y2="225"/><line x1="385" y1="225" x2="415" y2="225"/><line x1="485" y1="160" x2="515" y2="160"/></g>
    <text x="450" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">2. Клеточный</text>
    <text x="450" y="285" text-anchor="middle" font-size="16" fill="#374151">клетка — единица жизни</text>
    <text x="450" y="306" text-anchor="middle" font-size="16" fill="#374151">(клетка сердечной мышцы)</text>
  </g>
  <!-- 3 tissue -->
  <g fill="#FDE2E2" stroke="#B91C1C" stroke-width="2">
    <rect x="655" y="130" width="85" height="38" rx="14"/><rect x="745" y="130" width="85" height="38" rx="14"/>
    <rect x="675" y="173" width="85" height="38" rx="14"/><rect x="765" y="173" width="65" height="38" rx="14"/><rect x="655" y="173" width="15" height="38" rx="6"/>
    <rect x="655" y="216" width="85" height="38" rx="14"/><rect x="745" y="216" width="85" height="38" rx="14"/>
  </g>
  <g fill="#7C3AED"><circle cx="697" cy="149" r="6"/><circle cx="787" cy="149" r="6"/><circle cx="717" cy="192" r="6"/><circle cx="797" cy="192" r="6"/><circle cx="697" cy="235" r="6"/><circle cx="787" cy="235" r="6"/></g>
  <text x="745" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">3. Тканевый</text>
  <text x="745" y="285" text-anchor="middle" font-size="16" fill="#374151">клетки + межклеточное</text>
  <text x="745" y="306" text-anchor="middle" font-size="16" fill="#374151">вещество (мышечная ткань)</text>
  <!-- 4 organ: heart -->
  <g>
    <path d="M155,560 C80,505 85,440 125,432 C145,428 155,445 155,455 C155,445 165,428 185,432 C225,440 230,505 155,560 z" fill="#EF4444" stroke="#991B1B" stroke-width="3"/>
    <path d="M140,436 L140,410 M170,436 L175,405" stroke="#991B1B" stroke-width="7" stroke-linecap="round"/>
    <text x="155" y="400" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">4. Органный</text>
    <text x="155" y="590" text-anchor="middle" font-size="16" fill="#374151">несколько тканей</text>
    <text x="155" y="608" text-anchor="middle" font-size="16" fill="#374151">(сердце)</text>
  </g>
  <!-- 5 system -->
  <g>
    <path d="M450,505 C415,480 418,452 437,448 C446,446 450,454 450,459 C450,454 455,446 464,448 C483,452 486,480 450,505 z" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M443,448 C440,420 400,425 395,450 L392,560" stroke="#DC2626"/>
      <path d="M458,448 C462,420 500,425 505,450 L508,560" stroke="#2563EB"/>
      <path d="M395,470 L370,520" stroke="#DC2626"/><path d="M505,470 L530,520" stroke="#2563EB"/>
      <path d="M392,560 L375,575" stroke="#DC2626"/><path d="M508,560 L525,575" stroke="#2563EB"/>
    </g>
    <text x="450" y="400" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">5. Системный</text>
    <text x="450" y="590" text-anchor="middle" font-size="16" fill="#374151">органы с общей работой</text>
    <text x="450" y="608" text-anchor="middle" font-size="16" fill="#374151">(кровеносная система)</text>
  </g>
  <!-- 6 organism -->
  <g fill="#0F766E">
    <circle cx="745" cy="432" r="18"/>
    <rect x="727" y="454" width="36" height="66" rx="12"/>
    <g stroke="#0F766E" stroke-width="12" stroke-linecap="round"><line x1="731" y1="465" x2="708" y2="515"/><line x1="759" y1="465" x2="782" y2="515"/><line x1="737" y1="515" x2="730" y2="565"/><line x1="753" y1="515" x2="760" y2="565"/></g>
    <circle cx="745" cy="478" r="7" fill="#EF4444"/>
  </g>
  <text x="745" y="400" text-anchor="middle" font-size="21" font-weight="bold" fill="#111111">6. Организменный</text>
  <text x="745" y="590" text-anchor="middle" font-size="16" fill="#374151">все системы вместе</text>
  <text x="745" y="608" text-anchor="middle" font-size="16" fill="#374151">(человек)</text>
</svg>
