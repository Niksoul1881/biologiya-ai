<path d="M383,535 L304,535" stroke="#44403C" stroke-width="3" fill="none" marker-end="url(#ad)"/>
<text x="343" y="585" font-size="12" fill="#44403C" text-anchor="middle">захоронение (миллионы лет)</text>
<path d="M300,470 C330,380 360,300 420,144" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="335" y="375" font-size="13" fill="#DC2626" text-anchor="start">сжигание</text>
<text x="335" y="391" font-size="13" fill="#DC2626" text-anchor="start">топлива</text>
<path d="M652,88 L726,88" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#ab)"/>
<path d="M728,116 L654,116" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#ab)"/>
<text x="690" y="58" font-size="11" fill="#0369A1" text-anchor="middle">растворение</text>
<text x="690" y="72" font-size="11" fill="#0369A1" text-anchor="middle">и выделение</text>
