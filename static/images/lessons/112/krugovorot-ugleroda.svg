<rect x="730" y="250" width="240" height="90" rx="14" fill="#7C3AED"/>
<text x="850.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Редуценты</text>
<text x="850.0" y="302" font-size="13" fill="#ffffff" text-anchor="middle">бактерии и грибы</text>
<rect x="40" y="460" width="260" height="100" rx="14" fill="#44403C"/>
