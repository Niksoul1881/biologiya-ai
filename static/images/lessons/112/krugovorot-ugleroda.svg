<rect x="40" y="250" width="230" height="90" rx="14" fill="#16A34A"/>
<text x="155.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Растения</text>
<text x="155.0" y="302" font-size="13" fill="#ffffff" text-anchor="middle">и водоросли:</text>
<text x="155.0" y="319" font-size="13" fill="#ffffff" text-anchor="middle">органика</text>
<rect x="385" y="250" width="230" height="90" rx="14" fill="#EA580C"/>
<text x="500.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Животные</text>
