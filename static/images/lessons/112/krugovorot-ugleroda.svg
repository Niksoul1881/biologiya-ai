<text x="170.0" y="529" font-size="13" fill="#ffffff" text-anchor="middle">остатки древних организмов</text>
<rect x="385" y="460" width="230" height="100" rx="14" fill="#92400E"/>
<text x="500.0" y="490" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Мёртвая органика</text>
