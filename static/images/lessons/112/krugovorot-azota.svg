<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
</defs>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Круговорот азота: всё держится на бактериях</text>
<rect x="350" y="55" width="300" height="75" rx="14" fill="#0EA5E9"/>
<text x="500.0" y="85" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">N₂ атмосферы</text>
<text x="500.0" y="106" font-size="13" fill="#ffffff" text-anchor="middle">≈ 78% воздуха, растениям недоступен</text>
<rect x="40" y="250" width="250" height="85" rx="14" fill="#16A34A"/>
<text x="165.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Растения</text>
<text x="165.0" y="301" font-size="13" fill="#ffffff" text-anchor="middle">белки, нуклеиновые</text>
<text x="165.0" y="318" font-size="13" fill="#ffffff" text-anchor="middle">кислоты</text>
<rect x="385" y="250" width="230" height="85" rx="14" fill="#EA580C"/>
<text x="500.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Животные</text>
<text x="500.0" y="301" font-size="13" fill="#ffffff" text-anchor="middle">белки тела</text>
<rect x="730" y="250" width="240" height="85" rx="14" fill="#92400E"/>
<text x="850.0" y="280" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Мёртвая органика</text>
<text x="850.0" y="301" font-size="13" fill="#ffffff" text-anchor="middle">белки трупов,</text>
<text x="850.0" y="318" font-size="13" fill="#ffffff" text-anchor="middle">мочевина, опад</text>
<rect x="730" y="460" width="240" height="85" rx="14" fill="#A16207"/>
<text x="850.0" y="490" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Аммоний NH₄⁺</text>
<text x="850.0" y="511" font-size="13" fill="#ffffff" text-anchor="middle">в почве</text>
<rect x="385" y="460" width="230" height="85" rx="14" fill="#0F766E"/>
<text x="500.0" y="490" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Нитраты NO₃⁻</text>
<text x="500.0" y="511" font-size="13" fill="#ffffff" text-anchor="middle">(через нитриты NO₂⁻)</text>
<path d="M350,100 C230,105 160,170 160,246" stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#ab)"/>
<text x="80" y="140" font-size="13" fill="#0369A1" text-anchor="start" font-weight="bold">азотфиксация:</text>
<text x="80" y="156" font-size="12" fill="#0369A1" text-anchor="start">клубеньковые бактерии,</text>
<text x="80" y="171" font-size="12" fill="#0369A1" text-anchor="start">цианобактерии, молнии</text>
<path d="M292,292 L381,292" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#ak)"/>
<text x="336" y="282" font-size="13" fill="#374151" text-anchor="middle">питание</text>
<path d="M617,292 L726,292" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#ak)"/>
<text x="672" y="282" font-size="12" fill="#374151" text-anchor="middle">отмирание</text>
<path d="M180,337 C220,400 660,380 728,320" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#ak)"/>
<text x="430" y="393" font-size="12" fill="#374151" text-anchor="middle">опад, отмершие растения</text>
<path d="M850,337 L850,456" stroke="#7C3AED" stroke-width="3" fill="none" marker-end="url(#av)"/>
<text x="860" y="395" font-size="13" fill="#7C3AED" text-anchor="start" font-weight="bold">аммонификация:</text>
<text x="860" y="411" font-size="12" fill="#7C3AED" text-anchor="start">гнилостные</text>
<text x="860" y="426" font-size="12" fill="#7C3AED" text-anchor="start">бактерии</text>
<path d="M728,502 L619,502" stroke="#D97706" stroke-width="3" fill="none" marker-end="url(#ao)"/>
<text x="672" y="492" font-size="12" fill="#D97706" text-anchor="middle" font-weight="bold">нитрификация</text>
<text x="672" y="520" font-size="11" fill="#D97706" text-anchor="middle">(хемосинтез)</text>
<path d="M383,502 C250,502 175,450 165,340" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#ag)"/>
<text x="250" y="470" font-size="13" fill="#16A34A" text-anchor="middle" font-weight="bold">поглощают корни</text>
<path d="M600,456 C680,400 690,200 640,134" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<text x="640" y="200" font-size="13" fill="#DC2626" text-anchor="start" font-weight="bold">денитрификация:</text>
<text x="640" y="216" font-size="12" fill="#DC2626" text-anchor="start">бактерии</text>
<text x="640" y="231" font-size="12" fill="#DC2626" text-anchor="start">возвращают N₂</text>
<text x="40" y="585" font-size="13" fill="#374151" text-anchor="start">Человек добавляет азот: заводские удобрения (синтез аммиака из N₂ воздуха) и сжигание топлива.</text>
</svg>