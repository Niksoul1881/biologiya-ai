<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" width="1000" height="615" font-family="DejaVu Sans, Arial, sans-serif">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#BAE6FD"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0C4A6E"/></linearGradient>
<linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A16207"/><stop offset="1" stop-color="#44403C"/></linearGradient></defs>
<rect width="1000" height="615" fill="#ffffff"/>
<text x="500" y="32" font-size="22" fill="#111827" text-anchor="middle" font-weight="bold">Границы биосферы (по В. И. Вернадскому)</text>
<rect x="40" y="50" width="640" height="250" fill="url(#sky)"/>
<rect x="40" y="70" width="640" height="26" fill="#A78BFA" opacity="0.75"/>
<text x="360" y="88" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">озоновый слой ≈ 20–25 км — верхняя граница жизни</text>
<path d="M40,300 L330,300 L360,305 L400,300 L400,300 Z" fill="#16A34A"/>
<rect x="40" y="300" width="330" height="12" fill="#16A34A"/>
<rect x="370" y="300" width="310" height="180" fill="url(#sea)"/>
<rect x="40" y="312" width="330" height="270" fill="url(#rock)"/>
<rect x="370" y="480" width="310" height="102" fill="#44403C"/>
<path d="M40,70 L680,70 M680,70 L680,488 M370,430 L40,430" stroke="#FACC15" stroke-width="3" stroke-dasharray="10,6" fill="none"/>
<path d="M370,430 L370,312" stroke="#FACC15" stroke-width="3" stroke-dasharray="10,6"/>
<path d="M370,488 L680,488" stroke="#FACC15" stroke-width="3" stroke-dasharray="10,6"/>
<text x="205" y="370" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">литосфера:</text>
<text x="205" y="390" font-size="14" fill="#ffffff" text-anchor="middle">жизнь до глубины</text>
<text x="205" y="408" font-size="14" fill="#ffffff" text-anchor="middle">≈ 3–5 км (бактерии)</text>
<text x="525" y="380" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">гидросфера:</text>
<text x="525" y="400" font-size="14" fill="#ffffff" text-anchor="middle">жизнь во всей толще,</text>
<text x="525" y="418" font-size="14" fill="#ffffff" text-anchor="middle">до дна океана ≈ 11 км</text>
<text x="360" y="200" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">атмосфера: споры, бактерии,</text>
<text x="360" y="220" font-size="14" fill="#ffffff" text-anchor="middle">пыльца, птицы, насекомые</text>
<text x="210" y="540" font-size="13" fill="#E7E5E4" text-anchor="middle">глубже — слишком горячо</text>
<rect x="710" y="60" width="270" height="420" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<text x="845" y="90" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">Что ограничивает жизнь</text>
<text x="728" y="125" font-size="14" fill="#7C3AED" text-anchor="start" font-weight="bold">сверху:</text>
<text x="728" y="145" font-size="13" fill="#374151" text-anchor="start">жёсткое ультрафиолетовое</text>
<text x="728" y="163" font-size="13" fill="#374151" text-anchor="start">излучение выше</text>
<text x="728" y="181" font-size="13" fill="#374151" text-anchor="start">озонового слоя</text>
<text x="728" y="213" font-size="14" fill="#A16207" text-anchor="start" font-weight="bold">снизу в литосфере:</text>
<text x="728" y="233" font-size="13" fill="#374151" text-anchor="start">высокая температура</text>
<text x="728" y="251" font-size="13" fill="#374151" text-anchor="start">(растёт с глубиной)</text>
<text x="728" y="283" font-size="14" fill="#0369A1" text-anchor="start" font-weight="bold">в океане:</text>
<text x="728" y="303" font-size="13" fill="#374151" text-anchor="start">жизнь есть даже</text>
<text x="728" y="321" font-size="13" fill="#374151" text-anchor="start">на дне глубоководных</text>
<text x="728" y="339" font-size="13" fill="#374151" text-anchor="start">впадин</text>
<text x="728" y="371" font-size="14" fill="#CA8A04" text-anchor="start" font-weight="bold">граница биосферы:</text>
<text x="728" y="391" font-size="13" fill="#374151" text-anchor="start">жёлтый пунктир</text>
<text x="500" y="605" font-size="12" fill="#6B7280" text-anchor="middle">Масштаб условный: толщина слоёв не соответствует реальным расстояниям</text>
</svg>