<line x1="742.5" y1="80" x2="742.5" y2="470" stroke="#f3f4f6" stroke-width="1.5"/><text x="742.5" y="490" text-anchor="middle" font-size="12" font-weight="normal" fill="#6b7280">4</text>
<line x1="673.75" y1="80" x2="673.75" y2="470" stroke="#f3f4f6" stroke-width="1.5"/><text x="673.75" y="490" text-anchor="middle" font-size="12" font-weight="normal" fill="#6b7280">6</text>
