<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="Arial, Helvetica, sans-serif">
<rect width="920" height="540" fill="#ffffff"/>
<text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Когда и от кого одомашнили животных</text>
<text x="460" y="54" text-anchor="middle" font-size="13" font-weight="normal" fill="#6b7280">примерное время, тысяч лет назад; данные археологии и генетики уточняются</text>
<line x1="880.0" y1="80" x2="880.0" y2="470" stroke="#f3f4f6" stroke-width="1.5"/><text x="880.0" y="490" text-anchor="middle" font-size="12" font-weight="normal" fill="#6b7280">0</text>
