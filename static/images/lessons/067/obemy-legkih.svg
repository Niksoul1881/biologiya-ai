<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2937">Объёмы лёгких взрослого человека (примерно)</text>
  <!-- шкала 0..6 л: y = 380 - 52*V -->
  <line x1="80" y1="380" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <g font-size="13" fill="#374151" text-anchor="end">
    <text x="72" y="384">0</text><text x="72" y="332">1</text><text x="72" y="280">2</text><text x="72" y="228">3</text><text x="72" y="176">4</text><text x="72" y="124">5</text><text x="72" y="72">6 л</text>
  </g>
  <!-- спирограмма: базовый уровень после спокойного выдоха = 2.5 л (y=250), спокойный вдох +0.5 (y=224) -->
  <path d="M90 250 Q100 224 110 224 Q120 224 130 250 Q140 224 150 224 Q160 224 170 250 Q180 224 190 224 Q200 224 210 250
           Q225 120 240 120 Q255 120 270 250 Q285 302 300 302 Q315 302 330 250
           Q345 224 355 224 Q365 224 375 250" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- полосы -->
  <rect x="430" y="302" width="60" height="78" fill="#e5e7eb" stroke="#6b7280"/>
  <rect x="430" y="250" width="60" height="52" fill="#fde68a" stroke="#b45309"/>
  <rect x="430" y="224" width="60" height="26" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="430" y="120" width="60" height="104" fill="#bfdbfe" stroke="#1d4ed8"/>
  <g font-size="14" fill="#111827">
    <text x="500" y="176" font-weight="bold" fill="#1d4ed8">Резервный объём вдоха ≈ 1,5–2 л</text>
    <text x="500" y="194" fill="#374151">можно вдохнуть сверх обычного</text>
    <text x="500" y="241" font-weight="bold" fill="#b91c1c">Дыхательный объём ≈ 0,5 л</text>
    <text x="500" y="280" font-weight="bold" fill="#b45309">Резервный объём выдоха ≈ 1–1,5 л</text>
    <text x="500" y="336" font-weight="bold" fill="#4b5563">Остаточный объём ≈ 1–1,5 л</text>
    <text x="500" y="354" fill="#374151">остаётся в лёгких всегда</text>
  </g>
  <path d="M422 120 L414 120 L414 302 L422 302" fill="none" stroke="#111827" stroke-width="2"/>
  <text x="404" y="200" font-size="14" font-weight="bold" text-anchor="end" fill="#111827">ЖЕЛ</text>
  <text x="404" y="218" font-size="12" text-anchor="end" fill="#374151">3,5–5 л</text>
  <text x="150" y="212" font-size="12" text-anchor="middle" fill="#374151">спокойное дыхание</text>
  <text x="240" y="110" font-size="12" text-anchor="middle" fill="#374151">глубокий вдох</text>
  <text x="300" y="322" font-size="12" text-anchor="middle" fill="#374151">глубокий выдох</text>
  <text x="380" y="410" font-size="13" text-anchor="middle" fill="#6b7280">ЖЕЛ = дыхательный объём + резервный объём вдоха + резервный объём выдоха</text>
</svg>
