<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerWidth="4" markerHeight="4" refX="3.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="#111827"/></marker></defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">Как мы дышим: вдох и выдох</text>
  <text x="190" y="66" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d4ed8">ВДОХ</text>
  <text x="570" y="66" font-size="20" font-weight="bold" text-anchor="middle" fill="#b45309">ВЫДОХ</text>
  <!-- вдох: грудная клетка шире, диафрагма плоская -->
  <path d="M190 85 L190 120" stroke="#9ca3af" stroke-width="14"/>
  <path d="M90 130 Q70 230 85 330 L295 330 Q310 230 290 130 Q190 100 90 130 Z" fill="#eff6ff" stroke="#374151" stroke-width="3"/>
  <path d="M110 150 Q100 230 112 312 L180 312 L180 150 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <path d="M270 150 Q280 230 268 312 L200 312 L200 150 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <path d="M85 330 Q190 318 295 330" fill="none" stroke="#b45309" stroke-width="7"/>
  <line x1="190" y1="360" x2="190" y2="395" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <line x1="60" y1="230" x2="30" y2="230" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <line x1="320" y1="230" x2="350" y2="230" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <line x1="215" y1="118" x2="215" y2="92" stroke="#111827" stroke-width="3" marker-start="url(#a)" opacity="0"/>
  <text x="225" y="104" font-size="13" fill="#374151">воздух входит</text>
  <text x="190" y="418" font-size="13" text-anchor="middle" fill="#374151">диафрагма сокращается и уплощается,</text>
  <text x="190" y="434" font-size="13" text-anchor="middle" fill="#374151">межрёберные мышцы поднимают рёбра</text>
  <!-- выдох: грудная клетка уже, диафрагма куполом -->
  <path d="M570 85 L570 130" stroke="#9ca3af" stroke-width="14"/>
  <path d="M485 140 Q470 220 480 300 Q570 230 660 300 Q670 220 655 140 Q570 112 485 140 Z" fill="#fff7ed" stroke="#374151" stroke-width="3"/>
  <path d="M500 158 Q492 220 498 286 Q530 262 560 250 L560 158 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <path d="M640 158 Q648 220 642 286 Q610 262 580 250 L580 158 Z" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <path d="M480 300 Q570 230 660 300" fill="none" stroke="#b45309" stroke-width="7"/>
  <line x1="570" y1="320" x2="570" y2="285" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <line x1="450" y1="220" x2="474" y2="220" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <line x1="690" y1="220" x2="666" y2="220" stroke="#111827" stroke-width="4" marker-end="url(#a)"/>
  <text x="605" y="104" font-size="13" fill="#374151">воздух выходит</text>
  <text x="570" y="418" font-size="13" text-anchor="middle" fill="#374151">диафрагма расслабляется и поднимается куполом,</text>
  <text x="570" y="434" font-size="13" text-anchor="middle" fill="#374151">рёбра опускаются — объём грудной клетки меньше</text>
  <text x="190" y="248" font-size="13" text-anchor="middle" fill="#9d174d">лёгкие</text>
  <text x="570" y="210" font-size="13" text-anchor="middle" fill="#9d174d">лёгкие</text>
  <text x="335" y="348" font-size="13" fill="#b45309">диафрагма</text>
</svg>
