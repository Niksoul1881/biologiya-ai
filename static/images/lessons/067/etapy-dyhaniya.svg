<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#374151"/></marker></defs>
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="390" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">Три этапа дыхания</text>
  <rect x="20" y="60" width="220" height="170" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="130" y="92" font-size="18" font-weight="bold" text-anchor="middle" fill="#9d174d">1. Внешнее дыхание</text>
  <text x="130" y="122" font-size="14" text-anchor="middle" fill="#374151">лёгкие: вдох и выдох,</text>
  <text x="130" y="142" font-size="14" text-anchor="middle" fill="#374151">газообмен между</text>
  <text x="130" y="162" font-size="14" text-anchor="middle" fill="#374151">воздухом альвеол</text>
  <text x="130" y="182" font-size="14" text-anchor="middle" fill="#374151">и кровью</text>
  <text x="130" y="212" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">O₂ → кровь, CO₂ → воздух</text>
  <line x1="244" y1="145" x2="276" y2="145" stroke="#374151" stroke-width="4" marker-end="url(#a)"/>
  <rect x="280" y="60" width="220" height="170" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="390" y="92" font-size="18" font-weight="bold" text-anchor="middle" fill="#991b1b">2. Транспорт газов</text>
  <text x="390" y="122" font-size="14" text-anchor="middle" fill="#374151">кровь: O₂ переносит</text>
  <text x="390" y="142" font-size="14" text-anchor="middle" fill="#374151">гемоглобин эритроцитов,</text>
  <text x="390" y="162" font-size="14" text-anchor="middle" fill="#374151">CO₂ — в основном плазма</text>
  <text x="390" y="182" font-size="14" text-anchor="middle" fill="#374151">(и частично гемоглобин)</text>
  <text x="390" y="212" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">сердце и сосуды</text>
  <line x1="504" y1="145" x2="536" y2="145" stroke="#374151" stroke-width="4" marker-end="url(#a)"/>
  <rect x="540" y="60" width="220" height="170" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="650" y="92" font-size="18" font-weight="bold" text-anchor="middle" fill="#78350f">3. Тканевое дыхание</text>
  <text x="650" y="122" font-size="14" text-anchor="middle" fill="#374151">клетки: O₂ из капилляров</text>
  <text x="650" y="142" font-size="14" text-anchor="middle" fill="#374151">идёт в митохондрии,</text>
  <text x="650" y="162" font-size="14" text-anchor="middle" fill="#374151">окисляет глюкозу и жиры,</text>
  <text x="650" y="182" font-size="14" text-anchor="middle" fill="#374151">энергия запасается в АТФ</text>
  <text x="650" y="212" font-size="14" font-weight="bold" text-anchor="middle" fill="#78350f">глюкоза + O₂ → CO₂ + H₂O</text>
  <text x="390" y="270" font-size="14" text-anchor="middle" fill="#6b7280">Углекислый газ идёт обратным путём: клетки → кровь → лёгкие → наружу</text>
</svg>
