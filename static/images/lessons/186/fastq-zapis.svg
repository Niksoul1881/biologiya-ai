<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#0e5a6b">Одна запись FASTQ: четыре строки на одно прочтение</text>
  <text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">Каждой букве последовательности соответствует один символ качества — строго по позиции</text>

  <!-- код записи -->
  <rect x="30" y="76" width="840" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#111">
    <text x="50" y="110"><tspan fill="#0e7490" font-weight="bold">@</tspan>read_1 1:N:0:ATCACG</text>
    <text x="50" y="146" letter-spacing="6">GATTACAGGCTA</text>
    <text x="50" y="182" fill="#0e7490" font-weight="bold">+</text>
    <text x="50" y="218" letter-spacing="6" fill="#b45309">IIIIIHHGF?5+</text>
  </g>
  <g font-size="14" fill="#333">
    <text x="470" y="108">① заголовок: «@» и имя прочтения</text>
    <text x="470" y="144">② последовательность (A, C, G, T, N)</text>
    <text x="470" y="180">③ разделитель «+» (имя можно не повторять)</text>
    <text x="470" y="216">④ качество: один символ ASCII на букву</text>
  </g>

  <!-- столбики качества -->
  <text x="450" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e5a6b">Расшифровка строки качества (Phred+33): Q = код символа − 33</text>
  <!-- ось: y = 470 - Q*4.5 ; Q40 -> 290 -->
  <g stroke="#e3e3e3">
    <line x1="120" y1="470" x2="840" y2="470"/>
    <line x1="120" y1="425" x2="840" y2="425"/>
    <line x1="120" y1="380" x2="840" y2="380"/>
    <line x1="120" y1="335" x2="840" y2="335"/>
    <line x1="120" y1="290" x2="840" y2="290"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="end">
    <text x="112" y="474">Q0</text><text x="10" y="276" font-weight="bold" text-anchor="start">качество · вероятность ошибки</text><text x="112" y="429">Q10 · 1/10</text><text x="112" y="384">Q20 · 1/100</text>
    <text x="112" y="339">Q30 · 1/1000</text><text x="112" y="294">Q40 · 1/10 000</text>
  </g>
  <!-- 12 столбиков, шаг 58, ширина 40, старт 135 -->
  <g>
    <rect x="135" y="290" width="40" height="180" fill="#0e7490"/>
    <rect x="193" y="290" width="40" height="180" fill="#0e7490"/>
    <rect x="251" y="290" width="40" height="180" fill="#0e7490"/>
    <rect x="309" y="290" width="40" height="180" fill="#0e7490"/>
    <rect x="367" y="290" width="40" height="180" fill="#0e7490"/>
    <rect x="425" y="294.5" width="40" height="175.5" fill="#0e7490"/>
    <rect x="483" y="294.5" width="40" height="175.5" fill="#0e7490"/>
    <rect x="541" y="299" width="40" height="171" fill="#0e7490"/>
    <rect x="599" y="303.5" width="40" height="166.5" fill="#0e7490"/>
    <rect x="657" y="335" width="40" height="135" fill="#0891b2"/>
    <rect x="715" y="380" width="40" height="90" fill="#f59e0b"/>
    <rect x="773" y="425" width="40" height="45" fill="#dc2626"/>
  </g>
  <g font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="155" y="310">40</text><text x="213" y="310">40</text><text x="271" y="310">40</text>
    <text x="329" y="310">40</text><text x="387" y="310">40</text><text x="445" y="314">39</text>
    <text x="503" y="314">39</text><text x="561" y="318">38</text><text x="619" y="322">37</text>
    <text x="677" y="354">30</text><text x="735" y="399">20</text><text x="793" y="444">10</text>
  </g>
  <g font-family="Consolas, monospace" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">
    <text x="155" y="496">G</text><text x="213" y="496">A</text><text x="271" y="496">T</text>
    <text x="329" y="496">T</text><text x="387" y="496">A</text><text x="445" y="496">C</text>
    <text x="503" y="496">A</text><text x="561" y="496">G</text><text x="619" y="496">G</text>
    <text x="677" y="496">C</text><text x="735" y="496">T</text><text x="793" y="496">A</text>
  </g>
  <g font-family="Consolas, monospace" font-size="16" text-anchor="middle" fill="#b45309">
    <text x="155" y="520">I</text><text x="213" y="520">I</text><text x="271" y="520">I</text>
    <text x="329" y="520">I</text><text x="387" y="520">I</text><text x="445" y="520">H</text>
    <text x="503" y="520">H</text><text x="561" y="520">G</text><text x="619" y="520">F</text>
    <text x="677" y="520">?</text><text x="735" y="520">5</text><text x="793" y="520">+</text>
  </g>
  <text x="450" y="548" font-size="13" text-anchor="middle" fill="#555">«I» = код 73 → Q40;  «?» = 63 → Q30;  «5» = 53 → Q20;  «+» = 43 → Q10. К концу прочтения качество обычно падает.</text>
</svg>
