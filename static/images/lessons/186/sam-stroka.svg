<rect x="100" y="273" width="14" height="14" rx="3" fill="#94a3b8"/><text x="122" y="284">S — soft clip: буквы есть в прочтении, но не выровнены (часто остаток адаптера)</text>
<rect x="100" y="295" width="14" height="14" rx="3" fill="#0e7490"/><text x="122" y="306">M — позиция выровнена: совпадение или замена (жёлтая G вместо A в позиции 115)</text>
<rect x="100" y="317" width="14" height="14" rx="3" fill="#16a34a"/><text x="122" y="328">I — вставка: буква есть в прочтении, но нет в эталоне</text>
<rect x="100" y="339" width="14" height="14" rx="3" fill="#dc2626"/><text x="122" y="350">D — делеция: позиции эталона, которых нет в прочтении</text>
