<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e5a6b"/></marker></defs>
<rect width="900" height="520" fill="#fff"/>
<text x="450" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#0e5a6b">Путь данных: от пробирки до списка вариантов</text>
<text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">Голубые карточки — файлы (форматы), белые — программы. Объёмы — для генома человека с покрытием 30×, по порядку величины</text>
<rect x="20" y="80" width="190" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="115.0" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">Образец</text>
<text x="115.0" y="130" font-size="12.5" text-anchor="middle" fill="#222">кровь или слюна:</text>
<text x="115.0" y="149" font-size="12.5" text-anchor="middle" fill="#222">выделяют ДНК</text>
<rect x="245" y="80" width="190" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="340.0" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">Секвенатор</text>
<text x="340.0" y="130" font-size="12.5" text-anchor="middle" fill="#222">Illumina, MGI —</text>
<text x="340.0" y="149" font-size="12.5" text-anchor="middle" fill="#222">короткие прочтения;</text>
<text x="340.0" y="168" font-size="12.5" text-anchor="middle" fill="#222">PacBio, Nanopore — длинные</text>
<rect x="470" y="80" width="190" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="565.0" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">FASTQ</text>
<text x="565.0" y="130" font-size="12.5" text-anchor="middle" fill="#222">прочтения + качество</text>
<text x="565.0" y="149" font-size="12.5" text-anchor="middle" fill="#222">≈ 200 ГБ без сжатия,</text>
<text x="565.0" y="168" font-size="12.5" text-anchor="middle" fill="#222">десятки ГБ в .fastq.gz</text>
<rect x="695" y="80" width="190" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="790.0" y="106" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">Выравнивание</text>
<text x="790.0" y="130" font-size="12.5" text-anchor="middle" fill="#222">BWA-MEM, Bowtie2,</text>
<text x="790.0" y="149" font-size="12.5" text-anchor="middle" fill="#222">minimap2: где в геноме</text>
<text x="790.0" y="168" font-size="12.5" text-anchor="middle" fill="#222">место каждого прочтения</text>
<rect x="695" y="236" width="190" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="790.0" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">SAM → BAM / CRAM</text>
<text x="790.0" y="286" font-size="12.5" text-anchor="middle" fill="#222">сортировка и сжатие</text>
<text x="790.0" y="305" font-size="12.5" text-anchor="middle" fill="#222">(samtools), индекс .bai;</text>
<text x="790.0" y="324" font-size="12.5" text-anchor="middle" fill="#222">десятки ГБ</text>
<rect x="470" y="236" width="190" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="565.0" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">Поиск вариантов</text>
<text x="565.0" y="286" font-size="12.5" text-anchor="middle" fill="#222">GATK, DeepVariant,</text>
<text x="565.0" y="305" font-size="12.5" text-anchor="middle" fill="#222">bcftools: где геном</text>
<text x="565.0" y="324" font-size="12.5" text-anchor="middle" fill="#222">отличается от эталона</text>
<rect x="245" y="236" width="190" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="340.0" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">VCF</text>
<text x="340.0" y="286" font-size="12.5" text-anchor="middle" fill="#222">≈ 4–5 млн вариантов,</text>
<text x="340.0" y="305" font-size="12.5" text-anchor="middle" fill="#222">сотни МБ в .vcf.gz</text>
<text x="340.0" y="324" font-size="12.5" text-anchor="middle" fill="#222">+ индекс .tbi</text>
<rect x="20" y="236" width="190" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="115.0" y="262" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">Аннотация</text>
<text x="115.0" y="286" font-size="12.5" text-anchor="middle" fill="#222">VEP, ANNOVAR, ClinVar:</text>
<text x="115.0" y="305" font-size="12.5" text-anchor="middle" fill="#222">что вариант делает</text>
<text x="115.0" y="324" font-size="12.5" text-anchor="middle" fill="#222">с геном → отчёт</text>
<rect x="470" y="400" width="190" height="96" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="565.0" y="426" font-size="16" font-weight="bold" text-anchor="middle" fill="#b45309">FASTA эталона</text>
<text x="565.0" y="450" font-size="12.5" text-anchor="middle" fill="#222">GRCh38 или T2T-CHM13,</text>
<text x="565.0" y="469" font-size="12.5" text-anchor="middle" fill="#222">≈ 3 ГБ + индексы</text>
<text x="565.0" y="488" font-size="12.5" text-anchor="middle" fill="#222">(.fai, индекс выравнивателя)</text>
<g stroke="#0e5a6b" stroke-width="2.5" fill="none" marker-end="url(#ar)">
<line x1="212" y1="128" x2="242" y2="128"/>
<line x1="437" y1="128" x2="467" y2="128"/>
<line x1="662" y1="128" x2="692" y2="128"/>
<line x1="790" y1="178" x2="790" y2="233"/>
<line x1="693" y1="284" x2="663" y2="284"/>
<line x1="468" y1="284" x2="438" y2="284"/>
<line x1="243" y1="284" x2="213" y2="284"/>
</g>
<g stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)">
<line x1="565" y1="398" x2="565" y2="335"/>
<path d="M662 448 L790 448 L790 335"/>
</g>
<text x="790" y="470" font-size="12" text-anchor="middle" fill="#b45309">эталон нужен выравнивателю</text><text x="790" y="486" font-size="12" text-anchor="middle" fill="#b45309">и для чтения CRAM</text>
<text x="115" y="440" font-size="13" text-anchor="middle" fill="#555">Каждый шаг сжимает данные:</text><text x="115" y="458" font-size="13" text-anchor="middle" fill="#555">сотни ГБ прочтений →</text><text x="115" y="476" font-size="13" text-anchor="middle" fill="#555">сотни МБ вариантов →</text><text x="115" y="494" font-size="13" text-anchor="middle" fill="#555">несколько строк в отчёте</text>
</svg>