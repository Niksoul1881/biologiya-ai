<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Зоны корня</text>
  <!-- корень: сверху вниз -->
  <!-- зона проведения -->
  <rect x="270" y="60" width="80" height="150" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <rect x="300" y="60" width="20" height="150" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M270,110 C240,105 215,95 195,80" fill="none" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
  <path d="M350,160 C380,155 405,145 425,130" fill="none" stroke="#b45309" stroke-width="10" stroke-linecap="round"/>
  <!-- зона всасывания с волосками -->
  <rect x="270" y="210" width="80" height="170" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <rect x="300" y="210" width="20" height="170" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <g stroke="#a16207" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M270,220 C250,216 235,222 220,214"/><path d="M270,235 C245,238 230,232 210,240"/><path d="M270,250 C248,248 232,256 214,252"/><path d="M270,265 C250,268 236,262 222,270"/><path d="M270,280 C245,280 232,286 210,284"/><path d="M270,295 C250,293 238,300 222,298"/><path d="M270,310 C246,312 232,306 214,314"/><path d="M270,325 C250,325 240,332 226,330"/><path d="M270,340 C252,342 242,338 232,344"/><path d="M270,355 C258,356 250,354 242,358"/>
    <path d="M350,222 C370,216 385,224 400,216"/><path d="M350,237 C375,240 390,232 410,240"/><path d="M350,252 C372,250 388,258 406,254"/><path d="M350,267 C370,270 384,264 398,272"/><path d="M350,282 C375,282 388,288 410,286"/><path d="M350,297 C370,295 382,302 398,300"/><path d="M350,312 C374,314 388,308 406,316"/><path d="M350,327 C370,327 380,334 394,332"/><path d="M350,342 C368,344 378,340 388,346"/><path d="M350,357 C362,358 370,356 378,360"/>
  </g>
  <!-- зона роста -->
  <rect x="272" y="380" width="76" height="90" fill="#fefce8" stroke="#b45309" stroke-width="3"/>
  <g stroke="#d6d3d1" stroke-width="1.5"><line x1="272" y1="410" x2="348" y2="410"/><line x1="272" y1="440" x2="348" y2="440"/><line x1="298" y1="380" x2="298" y2="470"/><line x1="322" y1="380" x2="322" y2="470"/></g>
  <!-- зона деления -->
  <path d="M274,470 L346,470 L344,520 C340,540 320,548 310,548 C300,548 280,540 276,520 z" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
  <g fill="#a78bfa"><circle cx="290" cy="482" r="4"/><circle cx="310" cy="482" r="4"/><circle cx="330" cy="482" r="4"/><circle cx="290" cy="500" r="4"/><circle cx="310" cy="500" r="4"/><circle cx="330" cy="500" r="4"/><circle cx="300" cy="518" r="4"/><circle cx="320" cy="518" r="4"/></g>
  <!-- чехлик -->
  <path d="M270,515 C272,550 290,575 310,580 C330,575 348,550 350,515 C345,545 330,560 310,562 C290,560 275,545 270,515 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2.5"/>
  <path d="M276,525 C285,565 335,565 344,525 L346,540 C340,575 280,575 274,540 z" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <g fill="#fecaca" stroke="#f87171"><circle cx="270" cy="575" r="4"/><circle cx="352" cy="572" r="4"/><circle cx="300" cy="595" r="3.5"/></g>

  <!-- скобки и подписи -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M440,62 L452,62 L452,208 L440,208"/><path d="M440,212 L452,212 L452,378 L440,378"/><path d="M440,382 L452,382 L452,468 L440,468"/><path d="M440,472 L452,472 L452,535 L440,535"/><path d="M440,540 L452,540 L452,590 L440,590"/>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="465" y="120" font-weight="bold">Зона проведения</text>
    <text x="465" y="142" font-size="15" fill="#4b5563">по сосудам вода идёт вверх,</text>
    <text x="465" y="161" font-size="15" fill="#4b5563">здесь растут боковые корни</text>
    <text x="465" y="285" font-weight="bold" fill="#a16207">Зона всасывания</text>
    <text x="465" y="307" font-size="15" fill="#4b5563">корневые волоски всасывают</text>
    <text x="465" y="326" font-size="15" fill="#4b5563">воду с минеральными веществами</text>
    <text x="465" y="420" font-weight="bold">Зона роста (растяжения)</text>
    <text x="465" y="442" font-size="15" fill="#4b5563">клетки вытягиваются в длину</text>
    <text x="465" y="500" font-weight="bold" fill="#6d28d9">Зона деления</text>
    <text x="465" y="521" font-size="15" fill="#4b5563">образовательная ткань, клетки делятся</text>
    <text x="465" y="568" font-weight="bold" fill="#b91c1c">Корневой чехлик</text>
    <text x="465" y="589" font-size="15" fill="#4b5563">защищает кончик, слизь облегчает рост в почве</text>
  </g>
  <text x="310" y="625" font-size="14" text-anchor="middle" fill="#6b7280">кончик корня (длина показана не в масштабе)</text>
  <text x="130" y="300" font-size="15" text-anchor="middle" fill="#a16207">корневые</text>
  <text x="130" y="318" font-size="15" text-anchor="middle" fill="#a16207">волоски</text>
  <line x1="165" y1="300" x2="212" y2="282" stroke="#374151" stroke-width="1.5"/>
  <text x="130" y="150" font-size="15" text-anchor="middle" fill="#1d4ed8">сосуды</text>
  <line x1="160" y1="155" x2="300" y2="180" stroke="#374151" stroke-width="1.5"/>
</svg>
