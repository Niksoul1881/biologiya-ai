<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Виды корней</text>
  <!-- почва -->
  <rect x="0" y="200" width="900" height="320" fill="#f3e8d6"/>
  <line x1="0" y1="200" x2="900" y2="200" stroke="#92400e" stroke-width="3"/>

  <!-- Растение 1: проросток фасоли — главный и боковые -->
  <text x="230" y="70" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Проросток фасоли</text>
  <path d="M230,200 L230,120" stroke="#65a30d" stroke-width="7"/>
  <path d="M230,125 C200,105 180,110 170,125 C190,135 215,132 230,125 z" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <path d="M230,125 C260,105 280,110 290,125 C270,135 245,132 230,125 z" fill="#86efac" stroke="#15803d" stroke-width="2"/>
  <path d="M230,200 C232,280 228,360 232,470" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
  <g fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round">
    <path d="M231,240 C200,250 180,265 160,290"/><path d="M231,250 C260,262 285,275 300,300"/>
    <path d="M230,300 C205,315 190,330 175,360"/><path d="M231,310 C255,325 275,345 285,370"/>
    <path d="M231,370 C215,385 205,400 198,420"/><path d="M232,380 C250,395 262,410 268,430"/>
  </g>
  <!-- подписи 1 -->
  <g font-size="16" fill="#1f2937">
    <line x1="236" y1="440" x2="330" y2="470" stroke="#374151" stroke-width="1.5"/>
    <text x="335" y="472" font-weight="bold" fill="#92400e">Главный корень</text>
    <text x="335" y="490" font-size="13" fill="#4b5563">из зародышевого корешка</text>
    <line x1="160" y1="290" x2="60" y2="320" stroke="#374151" stroke-width="1.5"/>
    <line x1="175" y1="360" x2="60" y2="335" stroke="#374151" stroke-width="1.5"/>
    <text x="15" y="345" font-weight="bold" fill="#d97706" transform="translate(0,10)">Боковые</text>
    <text x="15" y="373" font-size="13" fill="#4b5563">от главного корня</text>
  </g>

  <!-- Растение 2: черенок/стебель с придаточными корнями -->
  <text x="660" y="70" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Стебель кукурузы</text>
  <path d="M660,232 L660,95" stroke="#65a30d" stroke-width="16"/>
  <g stroke="#3f6212" stroke-width="3"><line x1="650" y1="160" x2="670" y2="160"/><line x1="650" y1="230" x2="670" y2="230"/><line x1="650" y1="190" x2="670" y2="190"/></g>
  <path d="M660,110 C700,90 740,100 770,130" fill="none" stroke="#4d7c0f" stroke-width="7" stroke-linecap="round"/>
  <path d="M660,140 C620,120 590,125 560,150" fill="none" stroke="#4d7c0f" stroke-width="7" stroke-linecap="round"/>
  <!-- опорные придаточные корни над землёй -->
  <g fill="none" stroke="#a16207" stroke-width="6" stroke-linecap="round">
    <path d="M654,165 C630,180 615,195 605,215"/><path d="M666,165 C690,180 705,195 715,215"/>
    <path d="M656,192 C640,205 632,215 628,225"/><path d="M664,192 C680,205 688,215 692,225"/>
  </g>
  <!-- подземные придаточные корни -->
  <g fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round">
    <path d="M655,230 C620,280 600,350 590,440"/><path d="M660,232 C650,300 645,380 640,470"/><path d="M665,232 C690,300 710,380 715,460"/>
    <path d="M657,231 C630,260 590,300 560,360"/><path d="M663,231 C700,260 740,300 765,350"/>
  </g>
  <g fill="none" stroke="#d97706" stroke-width="2.5"><path d="M600,380 L575,400 M645,400 L625,420 M705,390 L730,410 M585,330 L560,340 M740,320 L765,335"/></g>
  <g font-size="16" fill="#1f2937">
    <line x1="715" y1="215" x2="765" y2="245" stroke="#374151" stroke-width="1.5"/>
    <text x="770" y="255" font-weight="bold" fill="#a16207">Придаточные</text>
    <text x="770" y="273" font-size="13" fill="#4b5563">растут от стебля</text>
    <text x="770" y="290" font-size="13" fill="#4b5563">(над землёй —</text><text x="770" y="306" font-size="13" fill="#4b5563">опорные)</text>
  </g>
</svg>
