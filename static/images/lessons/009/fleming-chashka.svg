<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="mold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e"/><stop offset="70%" stop-color="#5eead4"/><stop offset="100%" stop-color="#f0fdfa"/>
    </radialGradient>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Что увидел Флеминг в 1928 году</text>
  <!-- чашка Петри -->
  <circle cx="300" cy="245" r="185" fill="#fef9c3" stroke="#9ca3af" stroke-width="8"/>
  <circle cx="300" cy="245" r="172" fill="#fefce8" stroke="#d1d5db" stroke-width="2"/>
  <!-- колонии бактерий -->
  <g fill="#fbbf24" stroke="#d97706" stroke-width="1.5">
    <circle cx="170" cy="160" r="9"/><circle cx="200" cy="130" r="8"/><circle cx="240" cy="110" r="9"/><circle cx="300" cy="100" r="8"/><circle cx="355" cy="108" r="9"/><circle cx="405" cy="130" r="8"/>
    <circle cx="150" cy="210" r="8"/><circle cx="440" cy="170" r="9"/><circle cx="455" cy="225" r="8"/><circle cx="140" cy="265" r="9"/><circle cx="450" cy="285" r="9"/>
    <circle cx="155" cy="320" r="8"/><circle cx="430" cy="335" r="8"/><circle cx="185" cy="365" r="9"/><circle cx="395" cy="375" r="9"/><circle cx="235" cy="390" r="8"/><circle cx="300" cy="395" r="9"/><circle cx="350" cy="392" r="8"/>
  </g>
  <!-- прозрачная зона -->
  <circle cx="300" cy="248" r="105" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- лизированные бледные колонии на границе -->
  <g fill="#fef3c7" stroke="#fcd34d" stroke-width="1"><circle cx="215" cy="180" r="7"/><circle cx="390" cy="200" r="7"/><circle cx="230" cy="330" r="7"/><circle cx="375" cy="315" r="6"/></g>
  <!-- колония пеницилла -->
  <circle cx="300" cy="248" r="48" fill="url(#mold)"/>
  <!-- подписи -->
  <g font-size="17" fill="#1f2937">
    <line x1="340" y1="230" x2="560" y2="140" stroke="#374151" stroke-width="2"/>
    <text x="570" y="130" font-weight="bold" fill="#0f766e">Колония плесени пеницилл</text>
    <text x="570" y="150" font-size="15" fill="#4b5563">случайно попала из воздуха</text>
    <line x1="398" y1="265" x2="560" y2="245" stroke="#374151" stroke-width="2"/>
    <text x="570" y="240" font-weight="bold" fill="#1d4ed8">Прозрачная зона</text>
    <text x="570" y="260" font-size="15" fill="#4b5563">вокруг плесени бактерии погибли —</text>
    <text x="570" y="278" font-size="15" fill="#4b5563">гриб выделяет пенициллин</text>
    <line x1="455" y1="285" x2="560" y2="340" stroke="#374151" stroke-width="2"/>
    <text x="570" y="345" font-weight="bold" fill="#b45309">Колонии бактерий</text>
    <text x="570" y="365" font-size="15" fill="#4b5563">стафилококки растут</text>
    <text x="570" y="383" font-size="15" fill="#4b5563">только вдали от плесени</text>
  </g>
</svg>
