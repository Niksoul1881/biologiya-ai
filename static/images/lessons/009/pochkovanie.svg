<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Почкование дрожжей</text>
  <!-- 1 -->
  <text x="110" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
  <ellipse cx="110" cy="180" rx="60" ry="75" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <circle cx="110" cy="185" r="20" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <ellipse cx="100" cy="140" rx="14" ry="10" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/>
  <text x="110" y="290" font-size="15" text-anchor="middle" fill="#1f2937">материнская</text>
  <text x="110" y="308" font-size="15" text-anchor="middle" fill="#1f2937">клетка</text>
  <line x1="180" y1="180" x2="215" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <!-- 2 -->
  <text x="300" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">2</text>
  <ellipse cx="290" cy="185" rx="60" ry="75" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <circle cx="325" cy="110" r="22" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <path d="M308,124 Q325,135 342,122" fill="#fef3c7" stroke="none"/>
  <circle cx="295" cy="190" r="20" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <text x="300" y="290" font-size="15" text-anchor="middle" fill="#1f2937">появляется</text>
  <text x="300" y="308" font-size="15" text-anchor="middle" fill="#1f2937">почка</text>
  <line x1="370" y1="180" x2="405" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <!-- 3 -->
  <text x="490" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">3</text>
  <ellipse cx="480" cy="195" rx="60" ry="72" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <ellipse cx="520" cy="105" rx="34" ry="38" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <rect x="495" y="128" width="36" height="20" fill="#fef3c7"/>
  <circle cx="483" cy="200" r="17" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <circle cx="518" cy="105" r="15" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <text x="490" y="290" font-size="15" text-anchor="middle" fill="#1f2937">ядро делится,</text>
  <text x="490" y="308" font-size="15" text-anchor="middle" fill="#1f2937">одно ядро — в почку,</text>
  <text x="490" y="326" font-size="15" text-anchor="middle" fill="#1f2937">почка растёт</text>
  <line x1="565" y1="180" x2="600" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ar)"/>
  <!-- 4 -->
  <text x="720" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">4</text>
  <ellipse cx="680" cy="200" rx="58" ry="70" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <circle cx="683" cy="205" r="17" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <path d="M700,136 q8,-6 16,0" fill="none" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="790" cy="130" rx="45" ry="52" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <circle cx="790" cy="132" r="16" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/>
  <text x="720" y="290" font-size="15" text-anchor="middle" fill="#1f2937">почка отделилась —</text>
  <text x="720" y="308" font-size="15" text-anchor="middle" fill="#1f2937">новая клетка; на материнской</text>
  <text x="720" y="326" font-size="15" text-anchor="middle" fill="#1f2937">остался шрам</text>
  <!-- легенда -->
  <circle cx="300" cy="360" r="9" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"/><text x="315" y="365" font-size="14" fill="#374151">ядро</text>
  <ellipse cx="400" cy="360" rx="11" ry="8" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/><text x="417" y="365" font-size="14" fill="#374151">вакуоль</text>
  <path d="M520,363 q8,-6 16,0" fill="none" stroke="#78350f" stroke-width="4"/><text x="545" y="365" font-size="14" fill="#374151">шрам от почки</text>
</svg>
