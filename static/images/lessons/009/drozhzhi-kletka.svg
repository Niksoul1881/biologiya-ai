<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Строение клетки дрожжей</text>
  <!-- клетка -->
  <ellipse cx="300" cy="250" rx="190" ry="160" fill="#fef3c7" stroke="#92400e" stroke-width="10"/>
  <ellipse cx="300" cy="250" rx="180" ry="150" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <!-- почка -->
  <ellipse cx="470" cy="120" rx="60" ry="52" fill="#fef3c7" stroke="#92400e" stroke-width="8"/>
  <ellipse cx="470" cy="120" rx="52" ry="44" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <rect x="425" y="140" width="40" height="34" fill="#fffbeb" transform="rotate(-38 445 157)"/>
  <!-- ядро -->
  <circle cx="300" cy="275" r="48" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
  <circle cx="312" cy="262" r="14" fill="#8b5cf6"/>
  <!-- вакуоль -->
  <ellipse cx="220" cy="190" rx="55" ry="40" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
  <!-- митохондрии -->
  <g fill="#fecaca" stroke="#b91c1c" stroke-width="2">
    <ellipse cx="380" cy="340" rx="24" ry="11" transform="rotate(-20 380 340)"/>
    <ellipse cx="190" cy="320" rx="24" ry="11" transform="rotate(25 190 320)"/>
    <ellipse cx="390" cy="210" rx="22" ry="10"/>
  </g>
  <!-- запасные вещества -->
  <g fill="#d6d3d1" stroke="#78716c"><circle cx="250" cy="355" r="7"/><circle cx="270" cy="365" r="5"/><circle cx="340" cy="185" r="6"/></g>
  <!-- подписи -->
  <g font-size="17" fill="#1f2937">
    <line x1="487" y1="250" x2="620" y2="250" stroke="#374151" stroke-width="2"/>
    <text x="628" y="246" font-weight="bold">Клеточная стенка</text>
    <text x="628" y="265" font-size="14" fill="#4b5563">прочная оболочка</text>
    <line x1="478" y1="290" x2="620" y2="300" stroke="#374151" stroke-width="2"/>
    <text x="628" y="304" font-weight="bold">Мембрана</text>
    <line x1="348" y1="280" x2="620" y2="345" stroke="#374151" stroke-width="2"/>
    <text x="628" y="350" font-weight="bold" fill="#6d28d9">Ядро</text>
    <text x="628" y="369" font-size="14" fill="#4b5563">дрожжи — эукариоты</text>
    <line x1="404" y1="340" x2="620" y2="405" stroke="#374151" stroke-width="2"/>
    <text x="628" y="410" font-weight="bold" fill="#b91c1c">Митохондрии</text>
    <text x="628" y="429" font-size="14" fill="#4b5563">дыхание при наличии кислорода</text>
    <line x1="170" y1="175" x2="70" y2="110" stroke="#374151" stroke-width="2"/>
    <text x="20" y="100" font-weight="bold" fill="#0369a1">Вакуоль</text>
    <line x1="246" y1="356" x2="70" y2="420" stroke="#374151" stroke-width="2"/>
    <text x="20" y="440" font-weight="bold">Запасные вещества</text>
    <line x1="530" y1="110" x2="620" y2="95" stroke="#374151" stroke-width="2"/>
    <text x="628" y="92" font-weight="bold" fill="#92400e">Почка</text>
    <text x="628" y="111" font-size="14" fill="#4b5563">будущая дочерняя клетка</text>
  </g>
  <text x="300" y="448" font-size="14" text-anchor="middle" fill="#6b7280" transform="translate(150,0)">Длина клетки — около 5–10 мкм</text>
</svg>
