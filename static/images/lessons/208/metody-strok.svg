<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Методы строки, которые нужны каждый день</text>

  <g font-size="14">
    <!-- header -->
    <rect x="20" y="48" width="960" height="34" rx="6" fill="#111827"/>
    <text x="34" y="70" fill="#e5e7eb" font-weight="bold">Запись</text>
    <text x="290" y="70" fill="#e5e7eb" font-weight="bold">Что делает</text>
    <text x="640" y="70" fill="#e5e7eb" font-weight="bold">Результат для "ATGCGCGT"</text>

    <g font-family="Consolas, monospace">
      <rect x="20" y="86" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="108" fill="#111827">len(dna)</text>
      <text x="290" y="108" fill="#6b7280" font-family="Arial, sans-serif">длина строки</text>
      <text x="640" y="108" fill="#16A34A">8</text>

      <rect x="20" y="124" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="146" fill="#111827">dna.count("G")</text>
      <text x="290" y="146" fill="#6b7280" font-family="Arial, sans-serif">сколько раз встречается</text>
      <text x="640" y="146" fill="#16A34A">3</text>

      <rect x="20" y="162" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="184" fill="#111827">dna.find("GC")</text>
      <text x="290" y="184" fill="#6b7280" font-family="Arial, sans-serif">позиция первого вхождения</text>
      <text x="640" y="184" fill="#16A34A">2</text>

      <rect x="20" y="200" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="222" fill="#111827">dna.find("TTT")</text>
      <text x="290" y="222" fill="#6b7280" font-family="Arial, sans-serif">не найдено → минус один</text>
      <text x="640" y="222" fill="#dc2626">-1</text>

      <rect x="20" y="238" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="260" fill="#111827">dna.replace("T","U")</text>
      <text x="290" y="260" fill="#6b7280" font-family="Arial, sans-serif">заменить все вхождения</text>
      <text x="640" y="260" fill="#16A34A">AUGCGCGU</text>

      <rect x="20" y="276" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="298" fill="#111827">dna.startswith("ATG")</text>
      <text x="290" y="298" fill="#6b7280" font-family="Arial, sans-serif">начинается ли с</text>
      <text x="640" y="298" fill="#16A34A">True</text>

      <rect x="20" y="314" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="336" fill="#111827">dna.upper()</text>
      <text x="290" y="336" fill="#6b7280" font-family="Arial, sans-serif">все буквы заглавными</text>
      <text x="640" y="336" fill="#16A34A">ATGCGCGT</text>
    </g>
  </g>

  <text x="500" y="380" text-anchor="middle" font-size="13" fill="#9ca3af">Все методы возвращают новое значение и не меняют исходную строку</text>
</svg>
