<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Комплементарная и обратная комплементарная цепь</text>

  <!-- original strand -->
  <text x="40" y="80" font-size="14" font-weight="bold" fill="#374151">Исходная цепь</text>
  <text x="40" y="118" font-size="13" fill="#9ca3af">5'</text>
  <g font-size="22" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">
    <text x="150" y="118" fill="#115e59">A</text><text x="220" y="118" fill="#111827">T</text>
    <text x="290" y="118" fill="#115e59">G</text><text x="360" y="118" fill="#b45309">C</text>
    <text x="430" y="118" fill="#115e59">G</text><text x="500" y="118" fill="#b45309">C</text>
    <text x="570" y="118" fill="#115e59">G</text><text x="640" y="118" fill="#111827">T</text>
  </g>
  <text x="690" y="118" font-size="13" fill="#9ca3af">3'</text>

  <!-- pairing lines -->
  <g stroke="#16A34A" stroke-width="2" stroke-dasharray="4 4">
    <line x1="150" y1="126" x2="150" y2="170"/><line x1="220" y1="126" x2="220" y2="170"/>
    <line x1="290" y1="126" x2="290" y2="170"/><line x1="360" y1="126" x2="360" y2="170"/>
    <line x1="430" y1="126" x2="430" y2="170"/><line x1="500" y1="126" x2="500" y2="170"/>
    <line x1="570" y1="126" x2="570" y2="170"/><line x1="640" y1="126" x2="640" y2="170"/>
  </g>

  <!-- complement strand -->
  <text x="770" y="118" font-size="13" fill="#9ca3af">5'</text>
  <text x="40" y="196" font-size="14" font-weight="bold" fill="#374151">Комплементарная</text>
  <text x="40" y="232" font-size="13" fill="#9ca3af">3'</text>
  <g font-size="22" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace" fill="#7e22ce">
    <text x="150" y="232">T</text><text x="220" y="232">A</text><text x="290" y="232">C</text><text x="360" y="232">G</text>
    <text x="430" y="232">C</text><text x="500" y="232">G</text><text x="570" y="232">C</text><text x="640" y="232">A</text>
  </g>
  <text x="690" y="232" font-size="13" fill="#9ca3af">5'</text>

  <!-- legend -->
  <g font-size="13" fill="#6b7280">
    <rect x="120" y="272" width="18" height="18" rx="4" fill="#115e59"/>
    <text x="146" y="286">A ↔ T</text>
    <rect x="230" y="272" width="18" height="18" rx="4" fill="#b45309"/>
    <text x="256" y="286">G ↔ C</text>
    <text x="370" y="286">пары всегда фиксированы: аденин только с тимином, гуанин только с цитозином</text>
  </g>

  <!-- result -->
  <rect x="30" y="300" width="940" height="30" rx="8" fill="#111827"/>
  <text x="46" y="320" font-size="14" font-family="Consolas, monospace" fill="#e5e7eb">обратная комплементарная = реверс комплемента: "ACGCGCAT"</text>
</svg>
