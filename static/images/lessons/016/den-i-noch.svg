<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="17">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <g id="plant">
      <path d="M0,0 L0,-190" stroke="#4f8a2b" stroke-width="7" fill="none"/>
      <path d="M0,-60 C-30,-90 -95,-90 -110,-70 C-80,-50 -35,-45 0,-60 Z" fill="#7cbf4f" stroke="#3b6b20" stroke-width="2"/>
      <path d="M0,-110 C30,-140 95,-140 110,-120 C80,-100 35,-95 0,-110 Z" fill="#7cbf4f" stroke="#3b6b20" stroke-width="2"/>
      <path d="M0,-160 C-25,-190 -80,-195 -95,-175 C-70,-155 -30,-148 0,-160 Z" fill="#7cbf4f" stroke="#3b6b20" stroke-width="2"/>
      <path d="M0,-188 C10,-215 40,-225 52,-215 C40,-195 20,-188 0,-188 Z" fill="#7cbf4f" stroke="#3b6b20" stroke-width="2"/>
      <path d="M-55,0 L55,0 L42,70 L-42,70 Z" fill="#b5651d" stroke="#7a3f10" stroke-width="2"/>
      <rect x="-60" y="-8" width="120" height="14" rx="3" fill="#c97a35" stroke="#7a3f10" stroke-width="2"/>
    </g>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- ДЕНЬ -->
  <rect x="10" y="10" width="430" height="500" rx="16" fill="#fff8dc" stroke="#e0c060" stroke-width="2"/>
  <text x="225" y="44" text-anchor="middle" font-size="23" font-weight="bold" fill="#8a6100">Днём (на свету)</text>
  <circle cx="390" cy="70" r="28" fill="#ffcc33" stroke="#e0a000" stroke-width="2"/>
  <g stroke="#e0a000" stroke-width="3">
    <line x1="390" y1="28" x2="390" y2="16"/><line x1="348" y1="70" x2="336" y2="70"/>
    <line x1="360" y1="40" x2="351" y2="31"/><line x1="360" y1="100" x2="351" y2="109"/>
  </g>
  <use href="#plant" x="225" y="360"/>
  <!-- фотосинтез: толстые стрелки -->
  <line x1="40" y1="140" x2="110" y2="195" stroke="#2a6fb0" stroke-width="7" marker-end="url(#a)"/>
  <text x="25" y="128" fill="#2a6fb0" font-weight="bold">CO₂ — много</text>
  <line x1="320" y1="200" x2="400" y2="150" stroke="#2e9b4f" stroke-width="7" marker-end="url(#a)"/>
  <text x="300" y="138" fill="#2e9b4f" font-weight="bold">O₂ — много</text>
  <!-- дыхание: тонкие стрелки -->
  <line x1="40" y1="290" x2="115" y2="280" stroke="#2e9b4f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="22" y="315" fill="#2e9b4f" font-size="15">O₂ — немного</text>
  <line x1="335" y1="280" x2="405" y2="300" stroke="#2a6fb0" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="320" y="328" fill="#2a6fb0" font-size="15">CO₂ — немного</text>
  <!-- испарение -->
  <path d="M250,160 q8,-15 0,-30 q-8,-15 0,-30" stroke="#5aa9d6" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="262" y="110" fill="#2b7cae" font-size="15">водяной пар</text>
  <text x="225" y="470" text-anchor="middle" font-size="15" fill="#444">фотосинтез сильнее дыхания →</text>
  <text x="225" y="494" text-anchor="middle" font-size="15" fill="#444">растение выделяет кислород</text>

  <!-- НОЧЬ -->
  <rect x="460" y="10" width="430" height="500" rx="16" fill="#e8ecf7" stroke="#8a97c2" stroke-width="2"/>
  <text x="675" y="44" text-anchor="middle" font-size="23" font-weight="bold" fill="#33407a">Ночью (в темноте)</text>
  <path d="M845,48 a28,28 0 1,0 18,50 a22,22 0 1,1 -18,-50 z" fill="#f2e6a0" stroke="#b9a640" stroke-width="2"/>
  <use href="#plant" x="675" y="360"/>
  <line x1="490" y1="335" x2="560" y2="305" stroke="#2e9b4f" stroke-width="4" marker-end="url(#a)"/>
  <text x="474" y="365" fill="#2e9b4f" font-weight="bold">O₂ поглощается</text>
  <line x1="785" y1="220" x2="860" y2="185" stroke="#2a6fb0" stroke-width="4" marker-end="url(#a)"/>
  <text x="730" y="172" fill="#2a6fb0" font-weight="bold">CO₂ выделяется</text>
  <text x="675" y="98" text-anchor="middle" font-size="15" fill="#444">фотосинтеза нет, устьица</text>
  <text x="675" y="118" text-anchor="middle" font-size="15" fill="#444">почти закрыты, испарение слабое</text>
  <text x="675" y="470" text-anchor="middle" font-size="15" fill="#444">идёт только дыхание —</text>
  <text x="675" y="494" text-anchor="middle" font-size="15" fill="#444">днём и ночью, без перерыва</text>
</svg>
