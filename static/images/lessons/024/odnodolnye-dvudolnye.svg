<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif">
  <title>Однодольные и двудольные: пять признаков</title>
  <rect width="1000" height="760" fill="#ffffff"/>
  <!-- шапка -->
  <rect x="200" y="15" width="390" height="55" rx="10" fill="#15803d"/>
  <rect x="605" y="15" width="385" height="55" rx="10" fill="#b45309"/>
  <text x="395" y="51" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Двудольные</text>
  <text x="797" y="51" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Однодольные</text>
  <!-- строки -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
    <rect x="10" y="80" width="980" height="130" rx="8"/>
    <rect x="10" y="215" width="980" height="130" rx="8"/>
    <rect x="10" y="350" width="980" height="130" rx="8"/>
    <rect x="10" y="485" width="980" height="130" rx="8"/>
    <rect x="10" y="620" width="980" height="130" rx="8"/>
  </g>
  <g font-size="19" font-weight="bold" fill="#111827">
    <text x="25" y="140">Семядоли</text><text x="25" y="165" font-size="15" font-weight="normal" fill="#4b5563">в зародыше</text>
    <text x="25" y="275">Корневая</text><text x="25" y="298">система</text>
    <text x="25" y="410">Жилкование</text><text x="25" y="433">листа</text>
    <text x="25" y="545">Цветок</text><text x="25" y="568" font-size="15" font-weight="normal" fill="#4b5563">число частей</text>
    <text x="25" y="680">Стебель</text><text x="25" y="703" font-size="15" font-weight="normal" fill="#4b5563">на срезе</text>
  </g>
  <line x1="597" y1="80" x2="597" y2="750" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1. семядоли -->
  <g transform="translate(290,145)">
    <line x1="0" y1="50" x2="0" y2="-5" stroke="#15803d" stroke-width="4"/>
    <ellipse cx="-24" cy="-18" rx="26" ry="12" transform="rotate(-25 -24 -18)" fill="#22c55e"/>
    <ellipse cx="24" cy="-18" rx="26" ry="12" transform="rotate(25 24 -18)" fill="#22c55e"/>
    <line x1="-40" y1="50" x2="40" y2="50" stroke="#92400e" stroke-width="3"/>
  </g>
  <g transform="translate(665,145)">
    <line x1="0" y1="50" x2="0" y2="20" stroke="#15803d" stroke-width="4"/>
    <path d="M0,22 Q6,-20 -4,-52" stroke="#22c55e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <line x1="-40" y1="50" x2="40" y2="50" stroke="#92400e" stroke-width="3"/>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="370" y="140" font-weight="bold">две семядоли</text>
    <text x="370" y="165">фасоль, горох, тыква</text>
    <text x="745" y="140" font-weight="bold">одна семядоля</text>
    <text x="745" y="165">пшеница, кукуруза, лук</text>
  </g>

  <!-- 2. корни -->
  <g transform="translate(290,230)" stroke="#92400e" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="100" stroke-width="7"/>
    <path d="M0,25 L-35,45 M0,25 L35,42 M0,50 L-30,72 M0,52 L32,70 M0,75 L-22,92 M0,78 L22,94" stroke-width="2.5"/>
  </g>
  <g transform="translate(665,230)" stroke="#92400e" fill="none" stroke-linecap="round" stroke-width="2.5">
    <path d="M0,0 Q-40,40 -45,100 M0,0 Q-22,45 -25,105 M0,0 Q-6,50 -6,108 M0,0 Q10,50 12,106 M0,0 Q28,45 30,102 M0,0 Q44,40 48,95"/>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="370" y="275" font-weight="bold">стержневая</text>
    <text x="370" y="300">хорошо заметен</text>
    <text x="370" y="322">главный корень</text>
    <text x="745" y="275" font-weight="bold">мочковатая</text>
    <text x="745" y="300">пучок одинаковых</text>
    <text x="745" y="322">придаточных корней</text>
  </g>

  <!-- 3. жилкование -->
  <g transform="translate(290,415)">
    <path d="M0,-55 Q42,-20 0,55 Q-42,-20 0,-55 z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <g stroke="#14532d" stroke-width="1.6" fill="none">
      <line x1="0" y1="-50" x2="0" y2="52"/>
      <path d="M0,-30 L-18,-38 M0,-30 L18,-38 M0,-10 L-25,-20 M0,-10 L25,-20 M0,10 L-24,0 M0,10 L24,0 M0,30 L-16,20 M0,30 L16,20"/>
      <path d="M-12,-34 L-14,-24 M12,-34 L14,-24 M-15,-15 L-17,-4 M15,-15 L17,-4 M-14,4 L-12,15 M14,4 L12,15"/>
    </g>
  </g>
  <g transform="translate(665,415)">
    <path d="M-12,58 Q-16,0 0,-58 Q16,0 12,58 z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <g stroke="#14532d" stroke-width="1.6" fill="none">
      <path d="M0,-54 L0,56 M-6,-30 Q-9,10 -7,56 M6,-30 Q9,10 7,56 M-10,0 L-10,56 M10,0 L10,56"/>
    </g>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="370" y="410" font-weight="bold">сетчатое</text>
    <text x="370" y="435">жилки ветвятся,</text>
    <text x="370" y="457">образуя сеточку</text>
    <text x="745" y="410" font-weight="bold">параллельное</text>
    <text x="745" y="435">или дуговое; лист часто</text>
    <text x="745" y="457">узкий, без черешка</text>
  </g>

  <!-- 4. цветок -->
  <g transform="translate(290,550)">
    <g fill="#f472b6" stroke="#be185d" stroke-width="1.5">
      <ellipse cx="0" cy="-30" rx="14" ry="24"/>
      <ellipse cx="0" cy="-30" rx="14" ry="24" transform="rotate(72)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="24" transform="rotate(144)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="24" transform="rotate(216)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="24" transform="rotate(288)"/>
    </g>
    <circle r="11" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
  </g>
  <g transform="translate(665,550)">
    <g fill="#fde68a" stroke="#b45309" stroke-width="1.5">
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(60)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(180)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(300)"/>
    </g>
    <g fill="#fb923c" stroke="#b45309" stroke-width="1.5">
      <ellipse cx="0" cy="-30" rx="13" ry="27"/>
      <ellipse cx="0" cy="-30" rx="13" ry="27" transform="rotate(120)"/>
      <ellipse cx="0" cy="-30" rx="13" ry="27" transform="rotate(240)"/>
    </g>
    <circle r="9" fill="#65a30d"/>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="370" y="545" font-weight="bold">по 4 или по 5</text>
    <text x="370" y="570">лепестков, чашелистиков,</text>
    <text x="370" y="592">часто тычинок</text>
    <text x="745" y="545" font-weight="bold">по 3 (или 3 + 3)</text>
    <text x="745" y="570">тюльпан: 6 листочков</text>
    <text x="745" y="592">околоцветника, 6 тычинок</text>
  </g>

  <!-- 5. стебель на срезе -->
  <g transform="translate(290,685)">
    <circle r="50" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
    <circle r="32" fill="none" stroke="#a16207" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g fill="#65a30d">
      <circle cx="0" cy="-32" r="7"/><circle cx="23" cy="-23" r="7"/><circle cx="32" cy="0" r="7"/><circle cx="23" cy="23" r="7"/>
      <circle cx="0" cy="32" r="7"/><circle cx="-23" cy="23" r="7"/><circle cx="-32" cy="0" r="7"/><circle cx="-23" cy="-23" r="7"/>
    </g>
  </g>
  <g transform="translate(665,685)">
    <circle r="50" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <g fill="#ca8a04">
      <circle cx="-8" cy="-34" r="5"/><circle cx="20" cy="-30" r="5"/><circle cx="-30" cy="-14" r="5"/><circle cx="2" cy="-12" r="5"/>
      <circle cx="30" cy="-6" r="5"/><circle cx="-16" cy="6" r="5"/><circle cx="16" cy="14" r="5"/><circle cx="-34" cy="18" r="5"/>
      <circle cx="-6" cy="30" r="5"/><circle cx="26" cy="32" r="5"/><circle cx="-24" cy="-32" r="4"/><circle cx="36" cy="16" r="4"/>
    </g>
  </g>
  <g font-size="18" fill="#1f2937">
    <text x="370" y="680" font-weight="bold">пучки по кругу</text>
    <text x="370" y="705">есть камбий — стебель</text>
    <text x="370" y="727">может утолщаться</text>
    <text x="745" y="680" font-weight="bold">пучки разбросаны</text>
    <text x="745" y="705">камбия нет — настоящей</text>
    <text x="745" y="727">древесины не образуется</text>
  </g>
</svg>
