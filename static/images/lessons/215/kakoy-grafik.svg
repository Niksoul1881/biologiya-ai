<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Какой график под какой вопрос</text>

  <!-- ============ CARD 1: histogram ============ -->
  <rect x="15" y="55" width="470" height="250" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="37" y="84" font-size="15" font-weight="bold" fill="#111827">Как распределены</text>
  <text x="37" y="104" font-size="15" font-weight="bold" fill="#111827">значения?</text>
  <line x1="55" y1="270" x2="230" y2="270" stroke="#111827" stroke-width="1.5"/>
  <line x1="55" y1="270" x2="55" y2="120" stroke="#111827" stroke-width="1.5"/>
  <g fill="#16A34A">
    <rect x="65" y="235" width="22" height="35" rx="2"/>
    <rect x="92" y="208" width="22" height="62" rx="2"/>
    <rect x="119" y="182" width="22" height="88" rx="2"/>
    <rect x="146" y="205" width="22" height="65" rx="2"/>
    <rect x="173" y="230" width="22" height="40" rx="2"/>
    <rect x="200" y="246" width="22" height="24" rx="2"/>
  </g>
  <text x="252" y="176" font-size="17" font-weight="bold" fill="#16A34A">Гистограмма</text>
  <text x="252" y="204" font-size="13" fill="#111827" font-family="Consolas, monospace">hist(), histplot()</text>
  <text x="252" y="228" font-size="12.5" fill="#6b7280">пики, хвосты, выбросы,</text>
  <text x="252" y="248" font-size="12.5" fill="#6b7280">одна группа или две</text>

  <!-- ============ CARD 2: boxplot ============ -->
  <rect x="515" y="55" width="470" height="250" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="537" y="84" font-size="15" font-weight="bold" fill="#111827">Чем группы</text>
  <text x="537" y="104" font-size="15" font-weight="bold" fill="#111827">отличаются?</text>
  <line x1="555" y1="270" x2="730" y2="270" stroke="#111827" stroke-width="1.5"/>
  <line x1="555" y1="270" x2="555" y2="120" stroke="#111827" stroke-width="1.5"/>
  <g stroke="#111827" stroke-width="1.5" fill="#dcfce7">
    <line x1="593" y1="160" x2="593" y2="245"/>
    <line x1="583" y1="160" x2="603" y2="160"/>
    <line x1="583" y1="245" x2="603" y2="245"/>
    <rect x="575" y="175" width="36" height="55"/>
    <line x1="575" y1="205" x2="611" y2="205" stroke="#16A34A" stroke-width="3"/>
    <line x1="643" y1="135" x2="643" y2="225"/>
    <line x1="633" y1="135" x2="653" y2="135"/>
    <line x1="633" y1="225" x2="653" y2="225"/>
    <rect x="625" y="150" width="36" height="50"/>
    <line x1="625" y1="180" x2="661" y2="180" stroke="#16A34A" stroke-width="3"/>
    <line x1="693" y1="185" x2="693" y2="262"/>
    <line x1="683" y1="185" x2="703" y2="185"/>
    <line x1="683" y1="262" x2="703" y2="262"/>
    <rect x="675" y="195" width="36" height="50"/>
    <line x1="675" y1="225" x2="711" y2="225" stroke="#16A34A" stroke-width="3"/>
  </g>
  <text x="752" y="176" font-size="17" font-weight="bold" fill="#16A34A">Боксплот</text>
  <text x="752" y="204" font-size="13" fill="#111827" font-family="Consolas, monospace">boxplot()</text>
  <text x="752" y="228" font-size="12.5" fill="#6b7280">медиана, квартили,</text>
  <text x="752" y="248" font-size="12.5" fill="#6b7280">выбросы; вайолина — форма</text>

  <!-- ============ CARD 3: scatter ============ -->
  <rect x="15" y="325" width="470" height="250" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="37" y="354" font-size="15" font-weight="bold" fill="#111827">Связаны ли</text>
  <text x="37" y="374" font-size="15" font-weight="bold" fill="#111827">две величины?</text>
  <line x1="55" y1="540" x2="230" y2="540" stroke="#111827" stroke-width="1.5"/>
  <line x1="55" y1="540" x2="55" y2="390" stroke="#111827" stroke-width="1.5"/>
  <g fill="#16A34A">
    <circle cx="70" cy="510" r="4"/>
    <circle cx="88" cy="500" r="4"/>
    <circle cx="104" cy="482" r="4"/>
    <circle cx="118" cy="492" r="4"/>
    <circle cx="134" cy="465" r="4"/>
    <circle cx="150" cy="458" r="4"/>
    <circle cx="165" cy="442" r="4"/>
    <circle cx="182" cy="430" r="4"/>
    <circle cx="198" cy="416" r="4"/>
    <circle cx="212" cy="422" r="4"/>
    <circle cx="160" cy="470" r="4"/>
    <circle cx="125" cy="440" r="4"/>
  </g>
  <text x="252" y="446" font-size="17" font-weight="bold" fill="#16A34A">Диаграмма</text>
  <text x="252" y="468" font-size="17" font-weight="bold" fill="#16A34A">рассеяния</text>
  <text x="252" y="494" font-size="13" fill="#111827" font-family="Consolas, monospace">scatter(), pairplot()</text>
  <text x="252" y="518" font-size="12.5" fill="#6b7280">направление и теснота</text>
  <text x="252" y="538" font-size="12.5" fill="#6b7280">связи, выбросы</text>

  <!-- ============ CARD 4: line ============ -->
  <rect x="515" y="325" width="470" height="250" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="537" y="354" font-size="15" font-weight="bold" fill="#111827">Что меняется</text>
  <text x="537" y="374" font-size="15" font-weight="bold" fill="#111827">во времени?</text>
  <line x1="555" y1="540" x2="730" y2="540" stroke="#111827" stroke-width="1.5"/>
  <line x1="555" y1="540" x2="555" y2="390" stroke="#111827" stroke-width="1.5"/>
  <polyline points="560,510 590,495 620,470 650,455 680,430 710,410" fill="none" stroke="#16A34A" stroke-width="3"/>
  <polyline points="560,522 590,516 620,500 650,492 680,486 710,462" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#16A34A">
    <circle cx="560" cy="510" r="3.5"/>
    <circle cx="620" cy="470" r="3.5"/>
    <circle cx="680" cy="430" r="3.5"/>
    <circle cx="710" cy="410" r="3.5"/>
  </g>
  <text x="752" y="446" font-size="17" font-weight="bold" fill="#16A34A">Линия</text>
  <text x="752" y="474" font-size="13" fill="#111827" font-family="Consolas, monospace">plot()</text>
  <text x="752" y="498" font-size="12.5" fill="#6b7280">тренд, сезонность,</text>
  <text x="752" y="518" font-size="12.5" fill="#6b7280">скачки, сравнение кривых</text>

  <text x="500" y="604" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#111827">Сначала вопрос — потом тип графика. Красота идёт последней.</text>
</svg>
