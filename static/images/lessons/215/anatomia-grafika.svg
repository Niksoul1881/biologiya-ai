<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Из чего состоит график matplotlib: figure и axes</text>

  <!-- figure -->
  <rect x="20" y="60" width="740" height="400" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="36" y="82" font-size="12" fill="#6b7280">Figure — весь холст</text>

  <!-- axes -->
  <rect x="120" y="130" width="560" height="270" fill="#ffffff" stroke="#111827" stroke-width="2"/>

  <!-- grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="120" y1="184" x2="680" y2="184"/>
    <line x1="120" y1="238" x2="680" y2="238"/>
    <line x1="120" y1="292" x2="680" y2="292"/>
    <line x1="120" y1="346" x2="680" y2="346"/>
    <line x1="260" y1="130" x2="260" y2="400"/>
    <line x1="360" y1="130" x2="360" y2="400"/>
    <line x1="460" y1="130" x2="460" y2="400"/>
    <line x1="560" y1="130" x2="560" y2="400"/>
  </g>

  <!-- data -->
  <polyline points="160,370 260,340 360,290 460,240 560,205 640,160" fill="none" stroke="#16A34A" stroke-width="3"/>
  <g fill="#16A34A">
    <circle cx="160" cy="370" r="5"/>
    <circle cx="260" cy="340" r="5"/>
    <circle cx="360" cy="290" r="5"/>
    <circle cx="460" cy="240" r="5"/>
    <circle cx="560" cy="205" r="5"/>
    <circle cx="640" cy="160" r="5"/>
  </g>

  <!-- title -->
  <text x="400" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Рост культуры</text>

  <!-- axis labels -->
  <text x="400" y="428" text-anchor="middle" font-size="12.5" fill="#374151">Время, ч</text>
  <text x="104" y="265" text-anchor="middle" font-size="12.5" fill="#374151" transform="rotate(-90 104 265)">Число клеток, тыс.</text>

  <!-- ticks -->
  <g font-size="10" fill="#6b7280">
    <text x="160" y="416" text-anchor="middle">0</text>
    <text x="260" y="416" text-anchor="middle">2</text>
    <text x="360" y="416" text-anchor="middle">4</text>
    <text x="460" y="416" text-anchor="middle">6</text>
    <text x="560" y="416" text-anchor="middle">8</text>
    <text x="640" y="416" text-anchor="middle">10</text>
  </g>
  <g stroke="#111827" stroke-width="1.5">
    <line x1="160" y1="400" x2="160" y2="406"/>
    <line x1="260" y1="400" x2="260" y2="406"/>
    <line x1="360" y1="400" x2="360" y2="406"/>
    <line x1="460" y1="400" x2="460" y2="406"/>
    <line x1="560" y1="400" x2="560" y2="406"/>
    <line x1="640" y1="400" x2="640" y2="406"/>
  </g>

  <!-- legend -->
  <rect x="150" y="142" width="150" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="162" y1="158" x2="186" y2="158" stroke="#16A34A" stroke-width="3"/>
  <circle cx="174" cy="158" r="4" fill="#16A34A"/>
  <text x="194" y="162" font-size="11" fill="#374151">культура</text>
  <text x="162" y="180" font-size="9" fill="#9ca3af">legend</text>

  <!-- numbers -->
  <g font-size="11" font-weight="bold" fill="#ffffff">
    <circle cx="734" cy="80" r="11" fill="#111827"/>
    <text x="734" y="84" text-anchor="middle">1</text>
    <circle cx="100" cy="148" r="11" fill="#111827"/>
    <text x="100" y="152" text-anchor="middle">2</text>
    <circle cx="676" cy="384" r="11" fill="#111827"/>
    <text x="676" y="388" text-anchor="middle">3</text>
    <circle cx="150" cy="414" r="11" fill="#111827"/>
    <text x="150" y="418" text-anchor="middle">4</text>
    <circle cx="312" cy="165" r="11" fill="#111827"/>
    <text x="312" y="169" text-anchor="middle">5</text>
    <circle cx="480" cy="116" r="11" fill="#111827"/>
    <text x="480" y="120" text-anchor="middle">6</text>
  </g>

  <!-- callouts -->
  <g font-size="12.5">
    <text x="790" y="86" font-weight="bold" fill="#111827">1. Figure — холст</text>
    <text x="790" y="104" fill="#6b7280">размер в дюймах (figsize)</text>
    <text x="790" y="121" fill="#6b7280">и качество (dpi)</text>

    <text x="790" y="156" font-weight="bold" fill="#111827">2. Axes — координаты</text>
    <text x="790" y="174" fill="#6b7280">на них рисуют: plot,</text>
    <text x="790" y="191" fill="#6b7280">scatter, hist, bar</text>

    <text x="790" y="226" font-weight="bold" fill="#111827">3. Spines — рамка</text>
    <text x="790" y="244" fill="#6b7280">линии по краям осей</text>

    <text x="790" y="278" font-weight="bold" fill="#111827">4. Ticks — деления</text>
    <text x="790" y="296" fill="#6b7280">числа на осях</text>

    <text x="790" y="330" font-weight="bold" fill="#111827">5. Legend — легенда</text>
    <text x="790" y="348" fill="#6b7280">кто есть кто на графике</text>

    <text x="790" y="382" font-weight="bold" fill="#111827">6. Подписи</text>
    <text x="790" y="400" fill="#6b7280">title, xlabel, ylabel</text>
    <text x="790" y="417" fill="#6b7280">с единицами измерения</text>
  </g>

  <!-- code -->
  <rect x="20" y="470" width="960" height="38" rx="8" fill="#111827"/>
  <text x="38" y="495" font-size="14" fill="#e5e7eb" font-family="Consolas, monospace">fig, ax = plt.subplots(figsize=(6, 4))</text>
  <text x="500" y="495" font-size="13" fill="#86efac" font-family="Consolas, monospace"># fig — холст, ax — оси</text>
</svg>
