<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Z-score: почему без него heatmap обманывает</text>

  <!-- left matrix -->
  <text x="40" y="72" font-size="13" font-weight="bold" fill="#111827">исходные уровни (log2)</text>
  <g font-size="11" fill="#6b7280">
    <text x="40" y="112">K1</text>
    <text x="92" y="112">K2</text>
    <text x="144" y="112">O1</text>
    <text x="196" y="112">O2</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="36" y="150">MKI67</text>
    <text x="36" y="192">TP53</text>
    <text x="28" y="234">ACTB</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <!-- MKI67 -->
    <rect x="90" y="120" width="48" height="38" fill="#fee2e2"/>
    <rect x="138" y="120" width="48" height="38" fill="#fecaca"/>
    <rect x="186" y="120" width="48" height="38" fill="#fca5a5"/>
    <rect x="234" y="120" width="48" height="38" fill="#f87171"/>
    <!-- TP53 -->
    <rect x="90" y="162" width="48" height="38" fill="#f87171"/>
    <rect x="138" y="162" width="48" height="38" fill="#fca5a5"/>
    <rect x="186" y="162" width="48" height="38" fill="#fecaca"/>
    <rect x="234" y="162" width="48" height="38" fill="#fee2e2"/>
    <!-- ACTB -->
    <rect x="90" y="204" width="48" height="38" fill="#991b1b"/>
    <rect x="138" y="204" width="48" height="38" fill="#b91c1c"/>
    <rect x="186" y="204" width="48" height="38" fill="#7f1d1d"/>
    <rect x="234" y="204" width="48" height="38" fill="#b91c1c"/>
  </g>
  <g font-size="11" fill="#111827">
    <text x="114" y="144" text-anchor="middle">5,1</text>
    <text x="162" y="144" text-anchor="middle">5,4</text>
    <text x="210" y="144" text-anchor="middle">8,2</text>
    <text x="258" y="144" text-anchor="middle">8,5</text>
    <text x="114" y="186" text-anchor="middle">8,4</text>
    <text x="162" y="186" text-anchor="middle">8,1</text>
    <text x="210" y="186" text-anchor="middle">5,0</text>
    <text x="258" y="186" text-anchor="middle">5,2</text>
  </g>
  <g font-size="11" fill="#ffffff">
    <text x="114" y="228" text-anchor="middle">120</text>
    <text x="162" y="228" text-anchor="middle">118</text>
    <text x="210" y="228" text-anchor="middle">121</text>
    <text x="258" y="228" text-anchor="middle">119</text>
  </g>
  <text x="40" y="278" font-size="12" fill="#dc2626">ACTB = 120 тянет всю шкалу на себя:</text>
  <text x="40" y="296" font-size="12" fill="#dc2626">остальные клетки почти белые</text>

  <!-- arrow -->
  <line x1="330" y1="180" x2="430" y2="180" stroke="#16A34A" stroke-width="3"/>
  <polygon points="430,180 416,173 416,187" fill="#16A34A"/>
  <text x="380" y="168" text-anchor="middle" font-size="12" fill="#16A34A" font-weight="bold">z-score</text>
  <text x="380" y="202" text-anchor="middle" font-size="11" fill="#16A34A">по каждому гену</text>

  <!-- right matrix -->
  <text x="480" y="72" font-size="13" font-weight="bold" fill="#111827">z-score по строке</text>
  <g font-size="11" fill="#6b7280">
    <text x="480" y="112">K1</text>
    <text x="532" y="112">K2</text>
    <text x="584" y="112">O1</text>
    <text x="636" y="112">O2</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="476" y="150">MKI67</text>
    <text x="476" y="192">TP53</text>
    <text x="468" y="234">ACTB</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <rect x="530" y="120" width="48" height="38" fill="#1d4ed8"/>
    <rect x="578" y="120" width="48" height="38" fill="#3b82f6"/>
    <rect x="626" y="120" width="48" height="38" fill="#f87171"/>
    <rect x="674" y="120" width="48" height="38" fill="#dc2626"/>
    <rect x="530" y="162" width="48" height="38" fill="#dc2626"/>
    <rect x="578" y="162" width="48" height="38" fill="#f87171"/>
    <rect x="626" y="162" width="48" height="38" fill="#3b82f6"/>
    <rect x="674" y="162" width="48" height="38" fill="#1d4ed8"/>
    <rect x="530" y="204" width="48" height="38" fill="#fca5a5"/>
    <rect x="578" y="204" width="48" height="38" fill="#1d4ed8"/>
    <rect x="626" y="204" width="48" height="38" fill="#dc2626"/>
    <rect x="674" y="204" width="48" height="38" fill="#93c5fd"/>
  </g>
  <g font-size="11" fill="#ffffff">
    <text x="554" y="144" text-anchor="middle">−1,1</text>
    <text x="602" y="144" text-anchor="middle">−0,9</text>
    <text x="650" y="144" text-anchor="middle">0,9</text>
    <text x="698" y="144" text-anchor="middle">1,1</text>
    <text x="554" y="186" text-anchor="middle">1,1</text>
    <text x="602" y="186" text-anchor="middle">0,9</text>
    <text x="650" y="186" text-anchor="middle">−1,1</text>
    <text x="698" y="186" text-anchor="middle">−0,9</text>
    <text x="602" y="228" text-anchor="middle">−1,3</text>
    <text x="650" y="228" text-anchor="middle">1,3</text>
  </g>
  <g font-size="11" fill="#111827">
    <text x="554" y="228" text-anchor="middle">0,4</text>
    <text x="698" y="228" text-anchor="middle">−0,4</text>
  </g>
  <text x="480" y="278" font-size="12" fill="#16A34A">Теперь цвет сравнивает гены между собой,</text>
  <text x="480" y="296" font-size="12" fill="#16A34A">а не абсолютные уровни</text>

  <!-- formula -->
  <rect x="20" y="330" width="960" height="62" rx="10" fill="#111827"/>
  <text x="500" y="358" text-anchor="middle" font-size="15" fill="#e5e7eb" font-family="Consolas, monospace">z = (x − среднее по гену) / стандартное отклонение по гену</text>
  <text x="500" y="380" text-anchor="middle" font-size="12" fill="#86efac">после z-score каждая строка имеет среднее 0 и разброс 1</text>

  <text x="500" y="428" text-anchor="middle" font-size="12.5" fill="#6b7280">Плоский ген (ACTB) после z-score превращается в шум — и это правильный сигнал: он не меняется между группами.</text>
</svg>
