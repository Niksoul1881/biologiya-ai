<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Таблица и график: одни и те же числа</text>

  <!-- left dark table -->
  <rect x="20" y="58" width="370" height="320" rx="12" fill="#111827"/>
  <text x="40" y="88" font-size="14" font-weight="bold" fill="#e5e7eb">24 значения экспрессии</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#9ca3af">
    <text x="40" y="126">1,2  3,4  2,1  5,6  2,3  1,8</text>
    <text x="40" y="158">1,5  2,9  2,2  5,9  2,0  1,7</text>
    <text x="40" y="190">9,1  8,4  2,4  5,2  2,1  1,9</text>
    <text x="40" y="222">8,8  9,3  2,2  5,0  2,2  1,6</text>
  </g>

  <line x1="40" y1="244" x2="370" y2="244" stroke="#374151" stroke-width="1"/>
  <text x="40" y="270" font-size="13" fill="#86efac">среднее = 3,8</text>
  <text x="40" y="292" font-size="13" fill="#86efac">медиана = 2,3</text>
  <text x="40" y="314" font-size="13" fill="#fca5a5">разброс: от 1,2 до 9,3</text>
  <text x="40" y="352" font-size="12.5" fill="#9ca3af">Три числа — и ни слова о форме.</text>

  <!-- arrow -->
  <line x1="400" y1="218" x2="448" y2="218" stroke="#16A34A" stroke-width="3"/>
  <polygon points="448,218 436,212 436,224" fill="#16A34A"/>
  <text x="424" y="204" text-anchor="middle" font-size="12" fill="#16A34A" font-weight="bold">plot</text>

  <!-- right chart -->
  <line x1="470" y1="110" x2="470" y2="370" stroke="#111827" stroke-width="2"/>
  <line x1="470" y1="370" x2="960" y2="370" stroke="#111827" stroke-width="2"/>
  <text x="455" y="240" text-anchor="middle" font-size="12" fill="#374151" transform="rotate(-90 455 240)">частота</text>
  <text x="715" y="394" text-anchor="middle" font-size="12" fill="#374151">значение</text>

  <!-- bars: two humps -->
  <g fill="#16A34A">
    <rect x="496" y="326" width="34" height="44" rx="2"/>
    <rect x="542" y="300" width="34" height="70" rx="2"/>
    <rect x="588" y="262" width="34" height="108" rx="2"/>
    <rect x="634" y="244" width="34" height="126" rx="2"/>
    <rect x="680" y="290" width="34" height="80" rx="2"/>
    <rect x="726" y="330" width="34" height="40" rx="2"/>
    <rect x="772" y="290" width="34" height="80" rx="2"/>
    <rect x="818" y="234" width="34" height="136" rx="2"/>
    <rect x="864" y="214" width="34" height="156" rx="2"/>
    <rect x="910" y="290" width="34" height="80" rx="2"/>
  </g>

  <!-- baseline axis -->
  <line x1="470" y1="370" x2="960" y2="370" stroke="#111827" stroke-width="2"/>

  <!-- valley marker -->
  <line x1="766" y1="250" x2="766" y2="370" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="766" y="238" text-anchor="middle" font-size="12" fill="#dc2626">провал</text>

  <!-- peaks markers -->
  <text x="651" y="234" text-anchor="middle" font-size="12" fill="#16A34A">пик 1</text>
  <text x="881" y="204" text-anchor="middle" font-size="12" fill="#16A34A">пик 2</text>

  <text x="716" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Два пика: выборка неоднородна — в ней две группы</text>
</svg>
