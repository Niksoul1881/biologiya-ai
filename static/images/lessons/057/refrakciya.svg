<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="700" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Как глаз фокусирует свет и как помогают очки</text>
  <line x1="450" y1="240" x2="450" y2="690" stroke="#E5E7EB" stroke-width="2"/>
  <text x="225" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#6B7280">без очков</text>
  <text x="675" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#6B7280">с очками</text>
<text x="450" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">Нормальное зрение: фокус точно на сетчатке</text><circle cx="525" cy="160" r="60" fill="#F0F9FF" stroke="#0F766E" stroke-width="3"/>
  <path d="M582,130 A60,60 0 0,1 582,190" fill="none" stroke="#DC2626" stroke-width="6"/>
  <ellipse cx="477" cy="160" rx="10" ry="27" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><polyline points="255,140 477,140 585,160" fill="none" stroke="#F59E0B" stroke-width="3"/><polyline points="255,180 477,180 585,160" fill="none" stroke="#F59E0B" stroke-width="3"/><circle cx="585" cy="160" r="5" fill="#B45309"/><text x="590" y="152" font-size="14" fill="#DC2626">сетчатка</text><text x="455" y="215" font-size="14" fill="#4338CA">хрусталик</text><text x="40" y="310" font-size="19" font-weight="bold" fill="#1F2937">Близорукость</text><text x="40" y="330" font-size="14" fill="#6B7280">фокус перед сетчаткой — вдаль видно размыто</text><circle cx="300" cy="400" r="60" fill="#F0F9FF" stroke="#0F766E" stroke-width="3"/>
  <path d="M357,370 A60,60 0 0,1 357,430" fill="none" stroke="#DC2626" stroke-width="6"/>
  <ellipse cx="252" cy="400" rx="10" ry="27" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><polyline points="30,380 252,380 325,400" fill="none" stroke="#F59E0B" stroke-width="3"/><line x1="325" y1="400" x2="360" y2="409.5890410958904" stroke="#F59E0B" stroke-width="3"/><polyline points="30,420 252,420 325,400" fill="none" stroke="#F59E0B" stroke-width="3"/><line x1="325" y1="400" x2="360" y2="390.4109589041096" stroke="#F59E0B" stroke-width="3"/><circle cx="325" cy="400" r="5" fill="#B45309"/><text x="490" y="310" font-size="19" font-weight="bold" fill="#1D4ED8">Очки «минус»</text><text x="490" y="330" font-size="14" fill="#6B7280">рассеивающая (вогнутая) линза</text><circle cx="750" cy="400" r="60" fill="#F0F9FF" stroke="#0F766E" stroke-width="3"/>
  <path d="M807,370 A60,60 0 0,1 807,430" fill="none" stroke="#DC2626" stroke-width="6"/>
  <ellipse cx="702" cy="400" rx="10" ry="27" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><polyline points="480,380 615,380 702,368.0 810,400" fill="none" stroke="#F59E0B" stroke-width="3"/><polyline points="480,420 615,420 702,432.0 810,400" fill="none" stroke="#F59E0B" stroke-width="3"/><circle cx="810" cy="400" r="5" fill="#B45309"/><path d="M607,362 Q617,400 607,438 L625,438 Q615,400 625,362 z" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2"/><text x="40" y="530" font-size="19" font-weight="bold" fill="#1F2937">Дальнозоркость</text><text x="40" y="550" font-size="14" fill="#6B7280">фокус за сетчаткой — вблизи видно размыто</text><circle cx="300" cy="620" r="60" fill="#F0F9FF" stroke="#0F766E" stroke-width="3"/>
  <path d="M357,590 A60,60 0 0,1 357,650" fill="none" stroke="#DC2626" stroke-width="6"/>
  <ellipse cx="252" cy="620" rx="10" ry="27" fill="#E0E7FF" stroke="#4338CA" stroke-width="2"/><polyline points="30,600 252,600 360,614.5945945945946" fill="none" stroke="#F59E0B" stroke-width="3"/><line x1="360" y1="614.5945945945946" x2="400" y2="620" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,4"/><polyline points="30,640 252,640 360,625.4054054054054" fill="none" stroke="#F59E0B" stroke-width="3"/><line x1="360" y1="625.4054054054054" x2="400" y2="620" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,4"/><circle cx="400" cy="620" r="5" fill="#B45309"/><text x="490" y="530" font-size="19" font-weight="bold" fill="#1D4ED8">Очки «плюс»</text><text x="490" y="550" font-size="14" fill="#6B7280">собирающая (выпуклая) линза</text><circle cx="750" cy="620" r="60" fill="#F0F9FF" stroke="#0F766E" stroke-width="3"/>
