<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
  </defs>
  <!-- корень -->
  <rect x="360" y="20" width="240" height="56" rx="12" fill="#111827"/>
  <text x="480" y="56" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Изменчивость</text>
  <!-- второй уровень -->
  <rect x="40" y="120" width="300" height="70" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="190" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#92400E">Ненаследственная</text>
  <text x="190" y="175" text-anchor="middle" font-size="16" fill="#92400E">(фенотипическая)</text>
  <rect x="440" y="120" width="480" height="70" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="680" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#14532D">Наследственная</text>
  <text x="680" y="175" text-anchor="middle" font-size="16" fill="#14532D">(генотипическая)</text>
  <path d="M440,76 L230,118" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M520,76 L660,118" stroke="#6B7280" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- третий уровень -->
  <rect x="40" y="240" width="300" height="56" rx="12" fill="#D97706"/>
  <text x="190" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Модификационная</text>
  <rect x="410" y="240" width="250" height="56" rx="12" fill="#16A34A"/>
  <text x="535" y="275" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">Комбинативная</text>
  <rect x="680" y="240" width="250" height="56" rx="12" fill="#0F766E"/>
  <text x="805" y="275" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">Мутационная</text>
  <path d="M190,190 L190,236" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M640,190 L560,236" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M720,190 L790,236" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- пояснения -->
  <g font-size="15" fill="#374151">
    <text x="50" y="330">• генотип не меняется</text>
    <text x="50" y="354">• в пределах нормы реакции</text>
    <text x="50" y="378">• групповая, обратимая</text>
    <text x="50" y="402">• потомкам не передаётся</text>
    <text x="50" y="436" fill="#92400E" font-style="italic">загар, стрелолист, гортензия</text>
    <text x="415" y="330">• новые сочетания</text>
    <text x="415" y="354" dx="14">уже имеющихся генов</text>
    <text x="415" y="378">• кроссинговер,</text>
    <text x="415" y="402" dx="14">расхождение хромосом,</text>
    <text x="415" y="426" dx="14">случайное оплодотворение</text>
    <text x="685" y="330">• меняется сам генотип</text>
    <text x="685" y="354">• внезапная,</text>
    <text x="685" y="378" dx="14">ненаправленная</text>
    <text x="685" y="402">• генные, хромосомные,</text>
    <text x="685" y="426" dx="14">геномные мутации</text>
  </g>
</svg>
