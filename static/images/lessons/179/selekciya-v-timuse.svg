<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="960" height="640" fill="#fff"/>
<text x="480.0" y="38" font-size="24" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Отбор T-лимфоцитов в тимусе</text>
<text x="480.0" y="64" font-size="15" text-anchor="middle" fill="#555">случайные рецепторы проходят два фильтра; выживает лишь малая часть клеток</text>
<rect x="270" y="85" width="420" height="70" rx="12" fill="#eaf2f8" stroke="#2e86c1" stroke-width="2"/>
<text x="480.0" y="115.3" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Тимоцит со случайным рецептором (TCR)</text>
<text x="480.0" y="135.3" font-size="16" text-anchor="middle" fill="#222">результат V(D)J-рекомбинации</text>
<line x1="480" y1="155" x2="480" y2="195" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="270" y="195" width="420" height="75" rx="12" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
<text x="480.0" y="227.8" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Фильтр 1: положительная селекция</text>
<text x="480.0" y="247.8" font-size="16" text-anchor="middle" fill="#222">узнаёт ли рецептор свои молекулы MHC?</text>
<line x1="270" y1="232" x2="135" y2="232" stroke="#a02020" stroke-width="2.5"/>
<rect x="20" y="290" width="230" height="80" rx="12" fill="#fdedec" stroke="#a02020" stroke-width="2"/>
<text x="135.0" y="316.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Нет: «смерть</text>
<text x="135.0" y="335.0" font-size="15" text-anchor="middle" fill="#222">от невнимания»</text>
<text x="135.0" y="354.0" font-size="15" text-anchor="middle" fill="#222">(рецептор бесполезен)</text>
<line x1="135" y1="232" x2="135" y2="288" stroke="#a02020" stroke-width="2.5" marker-end="url(#a)"/>
<text x="495" y="300" font-size="15" fill="#333">да, связывает слабо</text>
<line x1="480" y1="270" x2="480" y2="330" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="270" y="330" width="420" height="75" rx="12" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
<text x="480.0" y="362.8" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Фильтр 2: отрицательная селекция</text>
<text x="480.0" y="382.8" font-size="16" text-anchor="middle" fill="#222">сильно ли он узнаёт свои пептиды на MHC?</text>
<line x1="690" y1="367" x2="815" y2="367" stroke="#a02020" stroke-width="2.5"/>
<line x1="815" y1="367" x2="815" y2="425" stroke="#a02020" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="690" y="425" width="250" height="80" rx="12" fill="#fdedec" stroke="#a02020" stroke-width="2"/>
<text x="815.0" y="451.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Да, сильно: апоптоз</text>
<text x="815.0" y="470.0" font-size="15" text-anchor="middle" fill="#222">(опасен — нападал бы</text>
<text x="815.0" y="489.0" font-size="15" text-anchor="middle" fill="#222">на своё)</text>
<line x1="600" y1="405" x2="600" y2="535" stroke="#7d3c98" stroke-width="2.5" marker-end="url(#a)"/>
<text x="608" y="470" font-size="14" fill="#7d3c98">часть — в Treg</text>
<rect x="520" y="535" width="250" height="70" rx="12" fill="#f5eef8" stroke="#7d3c98" stroke-width="2"/>
<text x="645.0" y="565.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Регуляторные T-клетки</text>
<text x="645.0" y="584.5" font-size="15" text-anchor="middle" fill="#222">гасят атаки на своё</text>
<line x1="380" y1="405" x2="380" y2="535" stroke="#1e8449" stroke-width="2.5" marker-end="url(#a)"/>
<text x="390" y="470" font-size="15" fill="#1e8449">нет, слабо</text>
<rect x="200" y="535" width="290" height="70" rx="12" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
<text x="345.0" y="565.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">Зрелая наивная T-клетка</text>
<text x="345.0" y="584.5" font-size="15" text-anchor="middle" fill="#222">уходит патрулировать тело</text>
<text x="20" y="430" font-size="14" fill="#555">Клетки мозгового вещества тимуса</text>
<text x="20" y="450" font-size="14" fill="#555">с помощью белка AIRE показывают</text>
<text x="20" y="470" font-size="14" fill="#555">пептиды белков других органов:</text>
<text x="20" y="490" font-size="14" fill="#555">инсулина, белков щитовидной железы…</text>
<text x="940" y="630" font-size="11" text-anchor="end" fill="#999">«Биология AI»</text>
</svg>