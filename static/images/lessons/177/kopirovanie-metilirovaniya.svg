  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Как метилирование переживает деление клетки</text>

  <!-- Шаг 1: исходная ДНК -->
  <text x="150" y="72" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">1. Исходная ДНК</text>
  <text x="150" y="208" font-size="13" text-anchor="middle" fill="#555">CpG метилированы на обеих цепях</text>

  <!-- стрелка репликации -->
  <path d="M 270 135 L 340 135" stroke="#333" stroke-width="3.5" marker-end="url(#a)"/>
  <text x="305" y="120" font-size="13" text-anchor="middle" fill="#333">репликация</text>

  <!-- Шаг 2: две полуметилированные -->
  <text x="490" y="72" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">2. Две полуметилированные копии</text>
  <text x="490" y="296" font-size="13" text-anchor="middle" fill="#555">старая цепь — с метками (синяя),</text>
  <text x="490" y="313" font-size="13" text-anchor="middle" fill="#555">новая — пока без меток (серая)</text>

  <!-- стрелка DNMT1 -->
  <path d="M 615 165 L 685 165" stroke="#333" stroke-width="3.5" marker-end="url(#a)"/>
  <text x="650" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#a04000">DNMT1</text>

  <!-- Шаг 3 -->
  <text x="815" y="72" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">3. Узор восстановлен</text>
  <text x="815" y="296" font-size="13" text-anchor="middle" fill="#555">DNMT1 «видит» метку на старой</text>
  <text x="815" y="313" font-size="13" text-anchor="middle" fill="#555">цепи и ставит такую же напротив</text>

