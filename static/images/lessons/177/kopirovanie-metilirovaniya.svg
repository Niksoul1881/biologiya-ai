  <circle cx="60" cy="335" r="7" fill="#e67e22" stroke="#a04000" stroke-width="1.5"/>
  <text x="76" y="340" font-size="14" fill="#333">метильная группа на цитозине (5-метилцитозин)</text>
  <text x="470" y="340" font-size="14" fill="#333">CpG читается одинаково на обеих цепях: 5′-CG-3′ / 3′-GC-5′</text>

  <!-- аналогия -->
  <rect x="15" y="372" width="930" height="132" rx="14" fill="#fafafa" stroke="#ccc" stroke-width="2"/>
  <text x="35" y="398" font-size="15" font-weight="bold" fill="#333">Аналогия для программиста:</text>
  <g font-size="13.5" fill="#333">
    <text x="35" y="424">Метки — как метаданные файла (права доступа, флаги), а не его содержимое. При делении копируется и код, и «конфигурация».</text>
    <text x="35" y="446">Симметрия CpG работает как зеркальная копия: половина метки остаётся на старой цепи, по ней восстанавливают вторую.</text>
    <text x="35" y="470" fill="#a02020">Где ломается: копирование неточное — часть меток теряется при каждом делении, а «конфиг» пишут и стирают</text>
    <text x="35" y="490" fill="#a02020">ферменты, которые сами закодированы в том же геноме. Код и его настройки управляют друг другом.</text>
  </g>
