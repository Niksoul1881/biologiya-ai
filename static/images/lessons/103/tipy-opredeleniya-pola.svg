<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="420" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="450.0" y="32" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Типы хромосомного определения пола</text>
<text x="150" y="72" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">Тип</text>
<text x="300" y="72" font-size="20" text-anchor="middle" fill="#a0306a" font-weight="bold">♀</text>
<text x="400" y="72" font-size="20" text-anchor="middle" fill="#1d4f86" font-weight="bold">♂</text>
<text x="640" y="72" font-size="15" text-anchor="middle" fill="#333" font-weight="bold">У кого</text>
<rect x="30" y="95" width="840" height="64" rx="8" fill="#f7f7f7" stroke="#ddd"/>
<text x="150" y="133" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">XX / XY</text>
<rect x="262" y="109" width="76" height="36" rx="8" fill="#fbe1ec" stroke="#a0306a"/>
<text x="300" y="133" font-size="17" text-anchor="middle" fill="#a0306a" font-weight="bold">XX</text>
<rect x="362" y="109" width="76" height="36" rx="8" fill="#dbe9f6" stroke="#1d4f86"/>
<text x="400" y="133" font-size="17" text-anchor="middle" fill="#1d4f86" font-weight="bold">XY</text>
<text x="470" y="123" font-size="13" text-anchor="start" fill="#333">млекопитающие, дрозофила, многие растения (конопля)</text>
<text x="470" y="143" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">гетерогаметен самец</text>
<rect x="30" y="170" width="840" height="64" rx="8" fill="#fff" stroke="#ddd"/>
<text x="150" y="208" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">ZZ / ZW</text>
<rect x="262" y="184" width="76" height="36" rx="8" fill="#fbe1ec" stroke="#a0306a"/>
<text x="300" y="208" font-size="17" text-anchor="middle" fill="#a0306a" font-weight="bold">ZW</text>
<rect x="362" y="184" width="76" height="36" rx="8" fill="#dbe9f6" stroke="#1d4f86"/>
<text x="400" y="208" font-size="17" text-anchor="middle" fill="#1d4f86" font-weight="bold">ZZ</text>
<text x="470" y="198" font-size="13" text-anchor="start" fill="#333">птицы, бабочки, некоторые рыбы и рептилии</text>
<text x="470" y="218" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">гетерогаметна самка</text>
<rect x="30" y="245" width="840" height="64" rx="8" fill="#f7f7f7" stroke="#ddd"/>
<text x="150" y="283" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">XX / X0</text>
<rect x="262" y="259" width="76" height="36" rx="8" fill="#fbe1ec" stroke="#a0306a"/>
<text x="300" y="283" font-size="17" text-anchor="middle" fill="#a0306a" font-weight="bold">XX</text>
<rect x="362" y="259" width="76" height="36" rx="8" fill="#dbe9f6" stroke="#1d4f86"/>
<text x="400" y="283" font-size="17" text-anchor="middle" fill="#1d4f86" font-weight="bold">X0</text>
<text x="470" y="273" font-size="13" text-anchor="start" fill="#333">кузнечики, саранча, некоторые клопы</text>
<text x="470" y="293" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">у самца одна X, Y нет</text>
<rect x="30" y="320" width="840" height="64" rx="8" fill="#fff" stroke="#ddd"/>
<text x="150" y="358" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">2n / n</text>
<rect x="262" y="334" width="76" height="36" rx="8" fill="#fbe1ec" stroke="#a0306a"/>
<text x="300" y="358" font-size="17" text-anchor="middle" fill="#a0306a" font-weight="bold">2n</text>
<rect x="362" y="334" width="76" height="36" rx="8" fill="#dbe9f6" stroke="#1d4f86"/>
<text x="400" y="358" font-size="17" text-anchor="middle" fill="#1d4f86" font-weight="bold">n</text>
<text x="470" y="348" font-size="13" text-anchor="start" fill="#333">пчёлы, муравьи: самцы-трутни — из неоплодотворённых яиц</text>
<text x="470" y="368" font-size="13" text-anchor="start" fill="#c0392b" font-weight="bold">гаплодиплоидия</text>
<text x="450" y="405" font-size="13.5" text-anchor="middle" fill="#333">У многих рептилий (черепах, крокодилов) пол зависит от температуры, при которой развивается яйцо.</text>
</svg>