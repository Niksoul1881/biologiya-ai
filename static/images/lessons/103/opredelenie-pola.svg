<text x="450" y="418" font-size="13.5" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Пол ребёнка определяется в момент оплодотворения — тем, какую хромосому (X или Y) несёт сперматозоид.</text>
<text x="450" y="440" font-size="13" text-anchor="middle" fill="#333">Женский пол гомогаметный (одинаковые гаметы), мужской — гетерогаметный.</text>
<text x="450" y="457" font-size="13" text-anchor="middle" fill="#333">Ген SRY на Y-хромосоме запускает развитие зародыша по мужскому типу.</text>
