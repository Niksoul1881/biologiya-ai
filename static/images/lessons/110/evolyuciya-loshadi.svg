<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1000" height="590" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Филогенетический ряд лошади (упрощённо)</text>
<text x="130" y="80" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Эогиппус</text>
<text x="130" y="100" font-size="13" fill="#6B7280" text-anchor="middle">≈ 55 млн лет назад</text>
<rect x="60" y="285" width="18" height="45" rx="4" fill="#A16207"/>
<text x="69" y="277" font-size="12" fill="#A16207" text-anchor="middle">≈ 35 см</text>
<rect x="110" y="290" width="10" height="40" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="115.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<rect x="130" y="270" width="10" height="60" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="135.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<rect x="150" y="235" width="10" height="95" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="155.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<rect x="170" y="270" width="10" height="60" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="175.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<text x="150" y="356" font-size="13" fill="#111827" text-anchor="middle">4 пальца*</text>
<text x="150" y="374" font-size="12" fill="#6B7280" text-anchor="middle">на передних ногах</text>
<rect x="110" y="454" width="40" height="16" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="130" y="490" font-size="12" fill="#92400E" text-anchor="middle">низкий зуб</text>
<text x="130" y="525" font-size="13" fill="#0F766E" text-anchor="middle" font-weight="bold">лес, мягкие листья</text>
<path d="M225,230 L280,230" stroke="#9CA3AF" stroke-width="3" marker-end="url(#ar)"/>
<text x="375" y="80" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Мезогиппус</text>
<text x="375" y="100" font-size="13" fill="#6B7280" text-anchor="middle">≈ 35 млн лет назад</text>
<rect x="305" y="255" width="18" height="75" rx="4" fill="#B45309"/>
<text x="314" y="247" font-size="12" fill="#B45309" text-anchor="middle">≈ 60 см</text>
<rect x="375" y="270" width="10" height="60" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="380.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<rect x="395" y="235" width="16" height="95" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="403.0" cy="330" rx="10.0" ry="4" fill="#57534E"/>
<rect x="415" y="270" width="10" height="60" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="420.0" cy="330" rx="7.0" ry="4" fill="#57534E"/>
<text x="395" y="356" font-size="13" fill="#111827" text-anchor="middle">3 пальца</text>
<text x="395" y="374" font-size="12" fill="#6B7280" text-anchor="middle">опираются все</text>
<rect x="355" y="448" width="40" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="375" y="490" font-size="12" fill="#92400E" text-anchor="middle">низкий зуб</text>
<text x="375" y="525" font-size="13" fill="#0F766E" text-anchor="middle" font-weight="bold">лес и редколесье</text>
<path d="M470,230 L525,230" stroke="#9CA3AF" stroke-width="3" marker-end="url(#ar)"/>
<text x="620" y="80" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Мерикгиппус</text>
<text x="620" y="100" font-size="13" fill="#6B7280" text-anchor="middle">≈ 15 млн лет назад</text>
<rect x="550" y="210" width="18" height="120" rx="4" fill="#C2410C"/>
<text x="559" y="202" font-size="12" fill="#C2410C" text-anchor="middle">≈ 1 м</text>
<rect x="620" y="235" width="10" height="62" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="625.0" cy="297" rx="7.0" ry="4" fill="#57534E"/>
<rect x="640" y="210" width="20" height="120" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="650.0" cy="330" rx="12.0" ry="4" fill="#57534E"/>
<rect x="660" y="235" width="10" height="62" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="665.0" cy="297" rx="7.0" ry="4" fill="#57534E"/>
<text x="640" y="356" font-size="13" fill="#111827" text-anchor="middle">3 пальца,</text>
<text x="640" y="374" font-size="12" fill="#6B7280" text-anchor="middle">боковые не достают</text>
<text x="640" y="390" font-size="12" fill="#6B7280" text-anchor="middle">до земли</text>
<rect x="600" y="430" width="40" height="40" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="620" y="490" font-size="12" fill="#92400E" text-anchor="middle">высокий зуб</text>
<text x="620" y="525" font-size="13" fill="#0F766E" text-anchor="middle" font-weight="bold">степь, трава</text>
<path d="M715,230 L770,230" stroke="#9CA3AF" stroke-width="3" marker-end="url(#ar)"/>
<text x="865" y="80" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Лошадь (Equus)</text>
<text x="865" y="100" font-size="13" fill="#6B7280" text-anchor="middle">сегодня</text>
<rect x="795" y="140" width="18" height="190" rx="4" fill="#9A3412"/>
<text x="804" y="132" font-size="12" fill="#9A3412" text-anchor="middle">≈ 1,6 м</text>
<rect x="885" y="210" width="24" height="120" rx="4" fill="#E7E5E4" stroke="#57534E" stroke-width="1.5"/>
<ellipse cx="897.0" cy="330" rx="14.0" ry="4" fill="#57534E"/>
<text x="885" y="356" font-size="13" fill="#111827" text-anchor="middle">1 палец —</text>
<text x="885" y="374" font-size="12" fill="#6B7280" text-anchor="middle">копыто</text>
<rect x="845" y="418" width="40" height="52" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="865" y="490" font-size="12" fill="#92400E" text-anchor="middle">высокий зуб</text>
<text x="865" y="525" font-size="13" fill="#0F766E" text-anchor="middle" font-weight="bold">степь, жёсткая трава</text>
<text x="20" y="130" font-size="12" fill="#6B7280" text-anchor="start">рост в холке</text>
<text x="20" y="455" font-size="12" fill="#92400E" text-anchor="start">коренной</text>
<text x="20" y="470" font-size="12" fill="#92400E" text-anchor="start">зуб</text>
<text x="980" y="575" font-size="12" fill="#6B7280" text-anchor="end">* на задних ногах у эогиппуса — 3 пальца. Рост и возраст — приблизительные.</text>
</svg>