<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2937">Сколько энергии даёт 1 грамм вещества при окислении в организме</text>
  <!-- шкала 0..40 кДж -> 0..560 px; x0=170 -->
  <line x1="170" y1="60" x2="170" y2="300" stroke="#374151" stroke-width="2"/>
  <rect x="170" y="80" width="246" height="50" fill="#fbbf24"/>
  <rect x="170" y="155" width="246" height="50" fill="#f87171"/>
  <rect x="170" y="230" width="545" height="50" fill="#a3e635"/>
  <text x="160" y="111" font-size="17" font-weight="bold" text-anchor="end" fill="#111827">Углеводы</text>
  <text x="160" y="186" font-size="17" font-weight="bold" text-anchor="end" fill="#111827">Белки</text>
  <text x="160" y="261" font-size="17" font-weight="bold" text-anchor="end" fill="#111827">Жиры</text>
  <text x="426" y="111" font-size="16" fill="#111827">17,6 кДж (≈ 4,1 ккал)</text>
  <text x="426" y="186" font-size="16" fill="#111827">17,6 кДж (≈ 4,1 ккал)</text>
  <text x="560" y="261" font-size="16" font-weight="bold" fill="#111827" text-anchor="end">38,9 кДж (≈ 9,3 ккал)</text>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <line x1="170" y1="300" x2="730" y2="300" stroke="#374151" stroke-width="2"/>
    <text x="170" y="318">0</text><text x="310" y="318">10</text><text x="450" y="318">20</text><text x="590" y="318">30</text><text x="730" y="318">40 кДж</text>
  </g>
  <text x="380" y="350" font-size="14" text-anchor="middle" fill="#374151">Жиры дают энергии примерно в 2,2 раза больше, чем белки и углеводы.</text>
  <text x="380" y="370" font-size="13" text-anchor="middle" fill="#6b7280">Значения — из школьных учебников; 1 ккал = 4,19 кДж</text>
</svg>
