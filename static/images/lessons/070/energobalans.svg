<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2937">Энергетический баланс</text>
  <!-- весы -->
  <polygon points="380,300 350,340 410,340" fill="#6b7280"/>
  <line x1="380" y1="300" x2="380" y2="110" stroke="#6b7280" stroke-width="6"/>
  <line x1="80" y1="110" x2="680" y2="110" stroke="#374151" stroke-width="6"/>
  <line x1="200" y1="110" x2="200" y2="160" stroke="#374151" stroke-width="2"/><line x1="100" y1="110" x2="100" y2="160" stroke="#374151" stroke-width="2"/>
  <line x1="660" y1="110" x2="660" y2="160" stroke="#374151" stroke-width="2"/><line x1="560" y1="110" x2="560" y2="160" stroke="#374151" stroke-width="2"/>
  <path d="M60 160 L240 160 L220 190 L80 190 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <path d="M520 160 L700 160 L680 190 L540 190 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="216" font-size="18" font-weight="bold" text-anchor="middle" fill="#78350f">ПОСТУПЛЕНИЕ</text>
  <text x="150" y="238" font-size="14" text-anchor="middle" fill="#374151">энергия пищи</text>
  <text x="150" y="256" font-size="14" text-anchor="middle" fill="#374151">(белки, жиры, углеводы)</text>
  <text x="610" y="216" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e3a8a">РАСХОД</text>
  <text x="610" y="238" font-size="14" text-anchor="middle" fill="#374151">основной обмен (≈ 60–70%)</text>
  <text x="610" y="256" font-size="14" text-anchor="middle" fill="#374151">+ движение и работа</text>
  <text x="610" y="274" font-size="14" text-anchor="middle" fill="#374151">+ переваривание пищи (≈ 10%)</text>
  <g font-size="14" text-anchor="middle">
    <text x="380" y="62" font-weight="bold" fill="#15803d">поступление = расход → масса тела постоянна</text>
    <text x="380" y="82" fill="#b91c1c">поступление &gt; расход → запас жира;  поступление &lt; расход → похудение</text>
  </g>
</svg>
