<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Мышцы-антагонисты: сгибание и разгибание руки</text>
  <line x1="450" y1="60" x2="450" y2="500" stroke="#E5E7EB" stroke-width="2"/>
  <!-- LEFT: flexion -->
  <text x="225" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#B91C1C">Сгибание</text>
  <rect x="190" y="110" width="26" height="210" rx="12" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <circle cx="203" cy="325" r="16" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <rect x="190" y="312" width="26" height="125" rx="12" fill="#FDE68A" stroke="#B45309" stroke-width="2" transform="rotate(-120 203 325)"/>
  <!-- biceps contracted (thick) -->
  <path d="M222,130 C285,160 290,260 250,300" fill="#EF4444" stroke="#991B1B" stroke-width="2" opacity="0.9"/>
  <path d="M222,130 C300,170 300,270 250,300 C270,250 265,170 222,130 z" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
  <!-- triceps relaxed (thin) -->
  <path d="M186,130 C165,200 168,280 190,330" fill="none" stroke="#FCA5A5" stroke-width="10" stroke-linecap="round"/>
  <text x="300" y="200" font-size="16" font-weight="bold" fill="#991B1B">двуглавая</text>
  <text x="300" y="220" font-size="16" font-weight="bold" fill="#991B1B">(бицепс)</text>
  <text x="300" y="240" font-size="15" fill="#374151">сокращается</text>
  <text x="40" y="200" font-size="16" font-weight="bold" fill="#DC2626">трёхглавая</text>
  <text x="40" y="220" font-size="16" font-weight="bold" fill="#DC2626">(трицепс)</text>
  <text x="40" y="240" font-size="15" fill="#374151">расслаблена</text>
  <text x="225" y="470" text-anchor="middle" font-size="15" fill="#374151">предплечье поднимается к плечу</text>
  <!-- RIGHT: extension -->
  <text x="675" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#1D4ED8">Разгибание</text>
  <rect x="640" y="110" width="26" height="210" rx="12" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <circle cx="653" cy="325" r="16" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <rect x="640" y="325" width="26" height="150" rx="12" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <!-- biceps relaxed thin -->
  <path d="M670,130 C690,200 688,290 668,345" fill="none" stroke="#FCA5A5" stroke-width="10" stroke-linecap="round"/>
  <!-- triceps contracted thick -->
  <path d="M636,130 C585,170 585,270 640,330 C610,260 612,180 636,130 z" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
  <text x="710" y="200" font-size="16" font-weight="bold" fill="#DC2626">двуглавая</text>
  <text x="710" y="220" font-size="15" fill="#374151">расслаблена</text>
  <text x="480" y="200" font-size="16" font-weight="bold" fill="#991B1B">трёхглавая</text>
  <text x="480" y="220" font-size="15" fill="#374151">сокращается</text>
  <text x="675" y="500" text-anchor="middle" font-size="15" fill="#374151">рука выпрямляется в локте</text>
  <text x="225" y="500" text-anchor="middle" font-size="14" fill="#6B7280">мышца может только тянуть, но не толкать</text>
</svg>
