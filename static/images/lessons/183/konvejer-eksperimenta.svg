<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif">
<rect width="980" height="560" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="490.0" y="34" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Как эксперимент превращается в данные</text>
<text x="490.0" y="58" font-size="14" text-anchor="middle" fill="#555" font-weight="normal">Каждый шаг оставляет след в данных: ошибку на входе не исправит никакой анализ</text>
<rect x="20" y="80" width="940" height="170" rx="14" fill="#eef6ee" stroke="#9cc79c"/>
<text x="40" y="102" font-size="14" text-anchor="start" fill="#2e6b2e" font-weight="bold">«Мокрая» лаборатория — пробирки, клетки, приборы</text>
<rect x="20" y="300" width="940" height="170" rx="14" fill="#eef2fa" stroke="#9db1d9"/>
<text x="40" y="322" font-size="14" text-anchor="start" fill="#2c4f8f" font-weight="bold">«Сухая» лаборатория — файлы, код, статистика</text>
<rect x="40.5" y="125" width="200" height="100" rx="10" fill="#fff" stroke="#3d8b3d" stroke-width="2"/>
<text x="140.5" y="155" font-size="17" text-anchor="middle" fill="#1b4d1b" font-weight="bold">1. Вопрос</text>
<text x="140.5" y="180" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">и гипотеза</text>
<text x="140.5" y="200" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">«что изменится, если…»</text>
<line x1="243.5" y1="175" x2="270.5" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="273.5" y="125" width="200" height="100" rx="10" fill="#fff" stroke="#3d8b3d" stroke-width="2"/>
<text x="373.5" y="155" font-size="17" text-anchor="middle" fill="#1b4d1b" font-weight="bold">2. Дизайн</text>
<text x="373.5" y="180" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">контроли, повторы,</text>
<text x="373.5" y="200" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">рандомизация</text>
<line x1="476.5" y1="175" x2="503.5" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="506.5" y="125" width="200" height="100" rx="10" fill="#fff" stroke="#3d8b3d" stroke-width="2"/>
<text x="606.5" y="155" font-size="17" text-anchor="middle" fill="#1b4d1b" font-weight="bold">3. Протокол</text>
<text x="606.5" y="180" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">шаг за шагом,</text>
<text x="606.5" y="200" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">реактивы, партии</text>
<line x1="709.5" y1="175" x2="736.5" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="739.5" y="125" width="200" height="100" rx="10" fill="#fff" stroke="#3d8b3d" stroke-width="2"/>
<text x="839.5" y="155" font-size="17" text-anchor="middle" fill="#1b4d1b" font-weight="bold">4. Измерение</text>
<text x="839.5" y="180" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">прибор: ридер,</text>
<text x="839.5" y="200" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">секвенатор, микроскоп</text>
<rect x="40.5" y="345" width="200" height="100" rx="10" fill="#fff" stroke="#3b62b0" stroke-width="2"/>
<text x="140.5" y="375" font-size="17" text-anchor="middle" fill="#1f3f7a" font-weight="bold">8. Вывод</text>
<text x="140.5" y="400" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">и новая гипотеза</text>
<text x="140.5" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">или повтор опыта</text>
<line x1="270.5" y1="395" x2="243.5" y2="395" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="273.5" y="345" width="200" height="100" rx="10" fill="#fff" stroke="#3b62b0" stroke-width="2"/>
<text x="373.5" y="375" font-size="17" text-anchor="middle" fill="#1f3f7a" font-weight="bold">7. Статистика</text>
<text x="373.5" y="400" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">сравнение групп,</text>
<text x="373.5" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">размер эффекта</text>
<line x1="503.5" y1="395" x2="476.5" y2="395" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="506.5" y="345" width="200" height="100" rx="10" fill="#fff" stroke="#3b62b0" stroke-width="2"/>
<text x="606.5" y="375" font-size="17" text-anchor="middle" fill="#1f3f7a" font-weight="bold">6. Обработка</text>
<text x="606.5" y="400" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">нормировка,</text>
<text x="606.5" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">контроль качества</text>
<line x1="736.5" y1="395" x2="709.5" y2="395" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="739.5" y="345" width="200" height="100" rx="10" fill="#fff" stroke="#3b62b0" stroke-width="2"/>
<text x="839.5" y="375" font-size="17" text-anchor="middle" fill="#1f3f7a" font-weight="bold">5. Сырые данные</text>
<text x="839.5" y="400" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">файлы + метаданные</text>
<text x="839.5" y="420" font-size="14" text-anchor="middle" fill="#333" font-weight="normal">кто, когда, чем</text>
<line x1="839.5" y1="227" x2="839.5" y2="341" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="140.5" y1="343" x2="140.5" y2="229" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="150.5" y="290" font-size="13" text-anchor="start" fill="#c0392b" font-weight="normal">цикл повторяется</text>
<rect x="20" y="490" width="940" height="50" rx="10" fill="#fff8e6" stroke="#e0b44c"/>
<text x="490.0" y="512" font-size="14" text-anchor="middle" fill="#7a5800" font-weight="bold">Лабораторный журнал и метаданные сопровождают все восемь шагов:</text>
<text x="490.0" y="531" font-size="14" text-anchor="middle" fill="#7a5800" font-weight="normal">образец, дата, оператор, номер партии реактива, настройки прибора, версия кода</text>
</svg>