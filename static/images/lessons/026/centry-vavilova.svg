  <text x="500" y="612" font-size="14" fill="#64748b" text-anchor="middle">Карта схематичная: границы материков и центров показаны условно</text>
  <circle cx="36" cy="650" r="14" fill="#dc2626"/><text x="36" y="656" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="60" y="647" font-size="17" font-weight="bold" fill="#1f2937">Южноазиатский тропический</text>
  <text x="60" y="667" font-size="15" fill="#4b5563">рис, огурец, сахарный тростник</text>
  <circle cx="36" cy="702" r="14" fill="#ea580c"/><text x="36" y="708" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="60" y="699" font-size="17" font-weight="bold" fill="#1f2937">Восточноазиатский</text>
  <text x="60" y="719" font-size="15" fill="#4b5563">соя, просо, гречиха, чай</text>
  <circle cx="36" cy="754" r="14" fill="#ca8a04"/><text x="36" y="760" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="60" y="751" font-size="17" font-weight="bold" fill="#1f2937">Юго-Западноазиатский</text>
  <text x="60" y="771" font-size="15" fill="#4b5563">пшеница, рожь, горох, лён</text>
  <circle cx="36" cy="806" r="14" fill="#16a34a"/><text x="36" y="812" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="60" y="803" font-size="17" font-weight="bold" fill="#1f2937">Средиземноморский</text>
  <text x="60" y="823" font-size="15" fill="#4b5563">капуста, свёкла, маслина</text>
  <circle cx="536" cy="650" r="14" fill="#0891b2"/><text x="536" y="656" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="560" y="647" font-size="17" font-weight="bold" fill="#1f2937">Абиссинский</text>
  <text x="560" y="667" font-size="15" fill="#4b5563">кофе, твёрдая пшеница, сорго</text>
  <circle cx="536" cy="702" r="14" fill="#2563eb"/><text x="536" y="708" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <text x="560" y="699" font-size="17" font-weight="bold" fill="#1f2937">Центральноамериканский</text>
  <text x="560" y="719" font-size="15" fill="#4b5563">кукуруза, фасоль, тыква</text>
  <circle cx="536" cy="754" r="14" fill="#7c3aed"/><text x="536" y="760" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
  <text x="560" y="751" font-size="17" font-weight="bold" fill="#1f2937">Южноамериканский (Андийский)</text>
  <text x="560" y="771" font-size="15" fill="#4b5563">картофель, томат</text>
</svg>
