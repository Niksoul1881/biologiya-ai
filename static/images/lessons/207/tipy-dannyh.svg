<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Четыре типа данных, которых хватает почти всегда</text>

  <g fill="none" stroke="#d1d5db" stroke-width="2">
    <rect x="10" y="52" width="235" height="130" rx="12"/>
    <rect x="261" y="52" width="235" height="130" rx="12"/>
    <rect x="512" y="52" width="235" height="130" rx="12"/>
    <rect x="763" y="52" width="227" height="130" rx="12"/>
  </g>

  <!-- str -->
  <text x="26" y="78" font-size="16" font-weight="bold" fill="#0d9488">str — строка</text>
  <rect x="26" y="88" width="203" height="34" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="36" y="111" font-size="15" fill="#115e59" font-family="Consolas, monospace">"ATGC"</text>
  <text x="26" y="146" font-size="12.5" fill="#6b7280">текст в кавычках —</text>
  <text x="26" y="164" font-size="12.5" fill="#6b7280">последовательность ДНК</text>
  <text x="26" y="206" font-size="12" fill="#9ca3af">dna = "ATGC"</text>

  <!-- int -->
  <text x="277" y="78" font-size="16" font-weight="bold" fill="#1d4ed8">int — целое</text>
  <rect x="277" y="88" width="203" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="287" y="111" font-size="15" fill="#1e3a8a" font-family="Consolas, monospace">4</text>
  <text x="277" y="146" font-size="12.5" fill="#6b7280">целые числа —</text>
  <text x="277" y="164" font-size="12.5" fill="#6b7280">длина, число копий</text>
  <text x="277" y="206" font-size="12" fill="#9ca3af">dlina = 4</text>

  <!-- float -->
  <text x="528" y="78" font-size="16" font-weight="bold" fill="#b45309">float — дробное</text>
  <rect x="528" y="88" width="203" height="34" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="538" y="111" font-size="15" fill="#78350f" font-family="Consolas, monospace">0.5</text>
  <text x="528" y="146" font-size="12.5" fill="#6b7280">дроби —</text>
  <text x="528" y="164" font-size="12.5" fill="#6b7280">концентрация, доля GC</text>
  <text x="528" y="206" font-size="12" fill="#9ca3af">gc = 0.5</text>

  <!-- list -->
  <text x="779" y="78" font-size="16" font-weight="bold" fill="#7e22ce">list — список</text>
  <rect x="779" y="88" width="195" height="34" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="789" y="111" font-size="14" fill="#581c87" font-family="Consolas, monospace">["ATGC","GGCC"]</text>
  <text x="779" y="146" font-size="12.5" fill="#6b7280">много значений —</text>
  <text x="779" y="164" font-size="12.5" fill="#6b7280">список образцов</text>
  <text x="779" y="206" font-size="12" fill="#9ca3af">samples = ["ATGC"]</text>

  <line x1="10" y1="232" x2="990" y2="232" stroke="#e5e7eb" stroke-width="2"/>
  <text x="500" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Проверить тип можно в любой момент:</text>
  <rect x="330" y="276" width="340" height="44" rx="8" fill="#111827"/>
  <text x="346" y="304" font-size="15" fill="#e5e7eb" font-family="Consolas, monospace">&gt;&gt;&gt; type("ATGC")</text>
  <text x="560" y="304" font-size="15" fill="#86efac" font-family="Consolas, monospace">&lt;class 'str'&gt;</text>
</svg>
