<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Как выполняется программа на Python</text>

  <g fill="none" stroke="#d1d5db" stroke-width="2">
    <rect x="10" y="60" width="290" height="220" rx="14"/>
    <rect x="355" y="60" width="290" height="220" rx="14"/>
    <rect x="700" y="60" width="290" height="220" rx="14"/>
  </g>

  <text x="25" y="86" font-size="15" font-weight="bold" fill="#374151">1. Ты пишешь код</text>
  <rect x="25" y="98" width="260" height="150" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="38" y="126" font-size="15" fill="#6b7280" font-family="Consolas, monospace">dna = "ATGC"</text>
  <text x="38" y="152" font-size="15" fill="#6b7280" font-family="Consolas, monospace">print(dna)</text>
  <text x="38" y="178" font-size="15" fill="#6b7280" font-family="Consolas, monospace">print(len(dna))</text>
  <text x="25" y="272" font-size="13" fill="#6b7280">файл pervyy.py</text>

  <text x="370" y="86" font-size="15" font-weight="bold" fill="#374151">2. Python читает строку за строкой</text>
  <rect x="370" y="98" width="260" height="150" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="382" y="126" font-size="14" fill="#166534">1 → создана переменная dna</text>
  <text x="382" y="156" font-size="14" fill="#166534">2 → на экран выведено ATGC</text>
  <text x="382" y="186" font-size="14" fill="#166534">3 → посчитана длина: 4</text>
  <text x="370" y="272" font-size="13" fill="#6b7280">интерпретатор, а не компилятор</text>

  <text x="715" y="86" font-size="15" font-weight="bold" fill="#374151">3. Ты видишь результат</text>
  <rect x="715" y="98" width="260" height="150" rx="8" fill="#111827"/>
  <text x="728" y="128" font-size="15" fill="#e5e7eb" font-family="Consolas, monospace">ATGC</text>
  <text x="728" y="154" font-size="15" fill="#e5e7eb" font-family="Consolas, monospace">4</text>
  <text x="728" y="196" font-size="13" fill="#9ca3af">консоль / терминал</text>
  <text x="715" y="272" font-size="13" fill="#6b7280">то, что напечатал print()</text>

  <g stroke="#16A34A" stroke-width="4" marker-end="url(#ar)">
    <line x1="303" y1="170" x2="350" y2="170"/>
    <line x1="648" y1="170" x2="695" y2="170"/>
  </g>
</svg>
