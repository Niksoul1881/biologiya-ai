<circle cx="120" cy="195" r="2" fill="#7c3aed"/>
<line x1="120" y1="192" x2="100" y2="150" stroke="#7c3aed" stroke-width="1.5"/><text x="100" y="142" font-size="14" fill="#7c3aed" text-anchor="middle">вирус ≈ 0,1 мкм</text>
<line x1="60" y1="350" x2="200" y2="350" stroke="#1f2937" stroke-width="4"/><text x="130" y="375" font-size="15" fill="#1f2937" text-anchor="middle">10 мкм</text>
<text x="300" y="300" font-size="15" fill="#6b7280" text-anchor="middle">Объём типичной эукариотической клетки</text><text x="300" y="320" font-size="15" fill="#6b7280" text-anchor="middle">в сотни и тысячи раз больше, чем у бактерии</text>
