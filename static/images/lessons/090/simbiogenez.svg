<text x="660" y="305" font-size="15" fill="#374151" text-anchor="middle">предок с хлоропластами</text>
<text x="500" y="395" font-size="15" fill="#6b7280" text-anchor="middle">Пунктир — вторая (наружная) мембрана от пузырька, которым клетка поглотила бактерию.</text>
<text x="500" y="418" font-size="15" fill="#6b7280" text-anchor="middle">Доказательства: своя кольцевая ДНК, рибосомы 70S, две мембраны, деление надвое — как у бактерий.</text>
