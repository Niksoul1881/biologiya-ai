<text x="110" y="310" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Кокки</text>
<text x="110" y="334" font-size="15.5" fill="#374151" text-anchor="middle">шаровидные</text>
<text x="110" y="356" font-size="14" fill="#6b7280" text-anchor="middle">стафилококк, стрептококк</text>
