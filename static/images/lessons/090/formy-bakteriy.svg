<text x="760" y="356" font-size="14" fill="#6b7280" text-anchor="middle">бледная трепонема</text>
<text x="490" y="400" font-size="15" fill="#6b7280" text-anchor="middle">Кокки могут быть одиночными, парами (диплококки), цепочками (стрептококки) и гроздьями (стафилококки)</text>
