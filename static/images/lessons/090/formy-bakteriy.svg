<text x="540" y="310" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Вибрионы</text>
<text x="540" y="334" font-size="15.5" fill="#374151" text-anchor="middle">в форме запятой</text>
<text x="540" y="356" font-size="14" fill="#6b7280" text-anchor="middle">холерный вибрион</text>
<text x="760" y="310" font-size="20" font-weight="bold" fill="#1f2937" text-anchor="middle">Спириллы, спирохеты</text>
