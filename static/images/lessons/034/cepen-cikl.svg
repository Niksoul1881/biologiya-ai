<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect x="10" y="40" width="300" height="500" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<rect x="350" y="40" width="300" height="500" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
<rect x="690" y="40" width="300" height="500" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="160" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">ЧЕЛОВЕК — окончательный хозяин</text>
<text x="500" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#3f6212">ВНЕШНЯЯ СРЕДА</text>
<text x="840" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">КОРОВА — промежуточный хозяин</text>
<rect x="30" y="80" width="260" height="130" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="48" cy="100" r="13" fill="#16A34A"/>
<text x="48" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
<text x="68" y="107" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Кишечник</text>
<text x="44" y="132" font-size="15" text-anchor="start" fill="#374151">взрослый цепень 4–10 м</text>
<text x="44" y="152" font-size="15" text-anchor="start" fill="#374151">присасывается головкой,</text>
<text x="44" y="172" font-size="15" text-anchor="start" fill="#374151">всасывает пищу</text>
<text x="44" y="192" font-size="15" text-anchor="start" fill="#374151">всей поверхностью</text>
<rect x="30" y="360" width="260" height="130" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="48" cy="380" r="13" fill="#16A34A"/>
<text x="48" y="386" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
<text x="68" y="387" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Членики выходят</text>
<text x="44" y="412" font-size="15" text-anchor="start" fill="#374151">зрелые членики,</text>
<text x="44" y="432" font-size="15" text-anchor="start" fill="#374151">набитые яйцами,</text>
<text x="44" y="452" font-size="15" text-anchor="start" fill="#374151">отрываются и выходят</text>
<text x="44" y="472" font-size="15" text-anchor="start" fill="#374151">наружу</text>
<rect x="370" y="360" width="260" height="110" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="388" cy="380" r="13" fill="#16A34A"/>
<text x="388" y="386" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
<text x="408" y="387" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Яйца на траве</text>
<text x="384" y="412" font-size="15" text-anchor="start" fill="#374151">членики разрушаются,</text>
<text x="384" y="432" font-size="15" text-anchor="start" fill="#374151">яйца рассеиваются</text>
<text x="384" y="452" font-size="15" text-anchor="start" fill="#374151">по траве и почве</text>
<rect x="710" y="360" width="260" height="130" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="728" cy="380" r="13" fill="#16A34A"/>
<text x="728" y="386" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
<text x="748" y="387" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Корова ест траву</text>
<text x="724" y="412" font-size="15" text-anchor="start" fill="#374151">в кишечнике из яиц</text>
<text x="724" y="432" font-size="15" text-anchor="start" fill="#374151">выходят личинки,</text>
<text x="724" y="452" font-size="15" text-anchor="start" fill="#374151">с кровью они попадают</text>
<text x="724" y="472" font-size="15" text-anchor="start" fill="#374151">в мышцы</text>
<rect x="710" y="80" width="260" height="130" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="728" cy="100" r="13" fill="#16A34A"/>
<text x="728" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">5</text>
<text x="748" y="107" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Финны в мышцах</text>
<text x="724" y="132" font-size="15" text-anchor="start" fill="#374151">личинка превращается</text>
<text x="724" y="152" font-size="15" text-anchor="start" fill="#374151">в финну — пузырёк</text>
<text x="724" y="172" font-size="15" text-anchor="start" fill="#374151">с ввёрнутой головкой</text>
<text x="724" y="192" font-size="15" text-anchor="start" fill="#374151">размером с горошину</text>
<rect x="370" y="80" width="260" height="130" rx="12" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="388" cy="100" r="13" fill="#16A34A"/>
<text x="388" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">6</text>
<text x="408" y="107" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Человек ест мясо</text>
<text x="384" y="132" font-size="15" text-anchor="start" fill="#374151">сырое или плохо</text>
<text x="384" y="152" font-size="15" text-anchor="start" fill="#374151">прожаренное мясо</text>
<text x="384" y="172" font-size="15" text-anchor="start" fill="#374151">с живыми финнами</text>
<line x1="160" y1="210" x2="160" y2="357" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
<line x1="290" y1="425" x2="367" y2="415" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
<line x1="630" y1="415" x2="707" y2="425" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
<line x1="840" y1="360" x2="840" y2="213" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
<line x1="710" y1="145" x2="633" y2="145" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
<line x1="370" y1="145" x2="293" y2="145" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
</svg>
