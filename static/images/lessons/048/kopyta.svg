<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="600" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">Нога копытных ниже запястья (вид спереди, схема)</text>
  <text x="215" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">Непарнокопытные: лошадь</text>
  <text x="605" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">Парнокопытные: корова</text>
  <line x1="410" y1="55" x2="410" y2="560" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ЛОШАДЬ -->
  <g stroke="#8b7d5a" stroke-width="2" fill="#f5efe0">
    <path d="M186,100 L196,100 L194,250 L190,250 Z"/>
    <path d="M234,100 L244,100 L240,250 L236,250 Z"/>
    <rect x="200" y="92" width="30" height="250" rx="12"/>
    <rect x="199" y="348" width="32" height="62" rx="10"/>
    <rect x="200" y="416" width="30" height="34" rx="8"/>
  </g>
  <path d="M198,452 L232,452 L252,512 L178,512 Z" fill="#5b4636" stroke="#3b2f25" stroke-width="2"/>
  <g font-size="14" fill="#111827" text-anchor="end">
    <text x="170" y="170">пястная кость</text>
    <text x="170" y="188">(III палец)</text>
    <text x="170" y="222">грифельные кости —</text>
    <text x="170" y="240">остатки II и IV</text>
    <text x="170" y="258">пальцев</text>
    <text x="170" y="400">фаланги</text>
    <text x="170" y="418">III пальца</text>
    <text x="170" y="488">копыто</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.3">
    <line x1="174" y1="175" x2="203" y2="175"/>
    <line x1="174" y1="235" x2="190" y2="235"/>
    <line x1="174" y1="405" x2="199" y2="380"/>
    <line x1="174" y1="405" x2="200" y2="432"/>
    <line x1="174" y1="484" x2="196" y2="484"/>
  </g>
  <text x="215" y="545" text-anchor="middle" font-size="15" fill="#92400e">опора — на один (III) палец</text>

  <!-- КОРОВА -->
  <g stroke="#8b7d5a" stroke-width="2" fill="#f5efe0">
    <rect x="570" y="92" width="70" height="230" rx="16"/>
    <rect x="571" y="326" width="30" height="58" rx="10"/>
    <rect x="609" y="326" width="30" height="58" rx="10"/>
    <rect x="572" y="390" width="28" height="32" rx="8"/>
    <rect x="610" y="390" width="28" height="32" rx="8"/>
    <ellipse cx="556" cy="300" rx="8" ry="12"/>
    <ellipse cx="654" cy="300" rx="8" ry="12"/>
  </g>
  <line x1="605" y1="104" x2="605" y2="312" stroke="#8b7d5a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M570,424 L602,424 L604,488 L560,488 Z" fill="#5b4636" stroke="#3b2f25" stroke-width="2"/>
  <path d="M608,424 L640,424 L650,488 L606,488 Z" fill="#5b4636" stroke="#3b2f25" stroke-width="2"/>
  <path d="M548,306 L564,306 L562,322 L550,322 Z" fill="#5b4636"/>
  <path d="M646,306 L662,306 L660,322 L648,322 Z" fill="#5b4636"/>
  <g font-size="14" fill="#111827">
    <text x="668" y="150">«цевка» —</text>
    <text x="668" y="168">сросшиеся пястные</text>
    <text x="668" y="186">кости III и IV пальцев</text>
    <text x="680" y="292">побочные копытца —</text>
    <text x="680" y="310">остатки II и V</text>
    <text x="680" y="328">пальцев</text>
    <text x="668" y="384">фаланги III и IV</text>
    <text x="668" y="402">пальцев</text>
    <text x="668" y="468">два копытца</text>
    <text x="668" y="486">(«раздвоенное копыто»)</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.3">
    <line x1="664" y1="162" x2="641" y2="162"/>
    <line x1="676" y1="305" x2="663" y2="305"/>
    <line x1="664" y1="390" x2="639" y2="370"/>
    <line x1="664" y1="472" x2="646" y2="472"/>
  </g>
  <text x="605" y="545" text-anchor="middle" font-size="15" fill="#065f46">опора — на два (III и IV) пальца</text>
  <text x="410" y="584" text-anchor="middle" font-size="14" fill="#6b7280">Предки копытных были пятипалыми; лишние пальцы уменьшились при приспособлении к быстрому бегу.</text>
</svg>
