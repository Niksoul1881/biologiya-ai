<g font-size="14" fill="#111827" text-anchor="middle">
<text x="178" y="408">диастема — промежуток без зубов:</text><text x="178" y="426">клыков нет</text>
<text x="628" y="408">диастема — промежуток без зубов:</text><text x="628" y="426">клыков нет</text></g>
<g font-size="14" fill="#111827">
<text x="30" y="110">1 пара резцов сверху</text><text x="30" y="128">и 1 пара снизу</text>
<text x="480" y="110">2 пары резцов сверху:</text><text x="480" y="128">за большими — маленькие</text>
<text x="290" y="315">коренные зубы</text></g>
<g stroke="#6b7280" stroke-width="1.3"><line x1="80" y1="133" x2="72" y2="225"/><line x1="560" y1="133" x2="562" y2="245"/><line x1="335" y1="300" x2="300" y2="282"/></g>
<rect x="40" y="455" width="820" height="130" rx="14" fill="#fff7ed" stroke="#fdba74"/>
<text x="60" y="485" font-size="16" font-weight="bold" fill="#9a3412">Почему резцы сами затачиваются</text>
<path d="M120,570 L120,505 L150,495 L150,570 Z" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/>
<path d="M112,570 L112,503 L120,505 L120,570 Z" fill="#ea580c"/>
<path d="M112,503 L150,495 L150,520 Z" fill="#ffffff"/>
<g font-size="14" fill="#111827"><text x="175" y="515">• спереди резец покрыт твёрдой эмалью (оранжевый слой), сзади — мягкий дентин;</text>
<text x="175" y="538">• дентин стачивается быстрее, поэтому край резца срезается косо и остаётся острым, как стамеска;</text>
<text x="175" y="561">• резцы растут всю жизнь: сколько сточилось, столько и отросло.</text></g>
