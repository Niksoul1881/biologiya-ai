<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="540" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">Крыло летучей мыши — это видоизменённая рука</text>
  <!-- перепонка -->
  <path d="M520,300 L430,235 L280,180 L130,110 L110,270 L190,390 L300,410 L470,455 L525,410 Z" fill="#d6c3a5" fill-opacity="0.55" stroke="#a78b62" stroke-width="1.5"/>
  <path d="M525,410 L560,470 L600,410" fill="#d6c3a5" fill-opacity="0.55" stroke="#a78b62" stroke-width="1.5"/>
  <!-- тело и голова -->
  <ellipse cx="560" cy="340" rx="45" ry="85" fill="#7c5c3b"/>
  <ellipse cx="560" cy="238" rx="30" ry="26" fill="#7c5c3b"/>
  <path d="M540,220 L533,188 L552,214 Z M580,220 L587,188 L568,214 Z" fill="#7c5c3b"/>
  <!-- кости руки -->
  <g stroke="#1f2937" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="520" y1="300" x2="430" y2="235"/>
  </g>
  <g stroke="#1f2937" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="430" y1="235" x2="280" y2="180"/>
  </g>
  <g stroke="#374151" stroke-width="3" stroke-linecap="round" fill="none">
    <polyline points="280,180 205,145 130,110"/>
    <polyline points="280,180 190,200 110,270"/>
    <polyline points="280,180 230,270 190,390"/>
    <polyline points="280,180 290,300 300,410"/>
    <polyline points="280,180 262,150 252,132"/>
  </g>
  <path d="M252,132 q-12,-6 -8,-18" stroke="#111827" stroke-width="3" fill="none"/>
  <!-- задняя нога и хвост -->
  <g stroke="#374151" stroke-width="4" stroke-linecap="round" fill="none">
    <polyline points="540,400 515,430 470,455"/>
    <polyline points="560,420 560,470"/>
  </g>
  <!-- подписи -->
  <g font-size="15" fill="#111827">
    <text x="600" y="150">плечевая кость</text>
    <text x="600" y="110">кости предплечья</text>
    <text x="210" y="80">I палец (большой) —</text>
    <text x="210" y="98">свободный, с коготком</text>
    <text x="20" y="320">II–V пальцы —</text>
    <text x="20" y="338">очень длинные,</text>
    <text x="20" y="356">натягивают перепонку</text>
    <text x="330" y="500">летательная перепонка — тонкая кожа</text>
    <text x="640" y="470">задняя нога</text>
    <text x="640" y="510">хвост</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.3">
    <line x1="596" y1="146" x2="475" y2="265"/>
    <line x1="596" y1="106" x2="360" y2="210"/>
    <line x1="250" y1="102" x2="252" y2="128"/>
    <line x1="100" y1="305" x2="150" y2="235"/>
    <line x1="120" y1="305" x2="210" y2="330"/>
    <line x1="420" y1="485" x2="380" y2="420"/>
    <line x1="636" y1="466" x2="525" y2="440"/>
    <line x1="636" y1="506" x2="563" y2="470"/>
  </g>
</svg>
