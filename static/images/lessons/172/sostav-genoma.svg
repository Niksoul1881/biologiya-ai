<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#0e5a6b">Из чего состоит геном человека (доля от ~3,1 млрд пн)</text>
  <text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">Полоса — разброс опубликованных оценок, округлено. Категории пересекаются: многие повторы лежат внутри интронов.</text>
  <!-- сетка: x = 330 + p*5.2 (0..100%) -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="330" y1="80" x2="330" y2="395"/><line x1="434" y1="80" x2="434" y2="395"/>
    <line x1="538" y1="80" x2="538" y2="395"/><line x1="642" y1="80" x2="642" y2="395"/>
    <line x1="746" y1="80" x2="746" y2="395"/><line x1="850" y1="80" x2="850" y2="395"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="330" y="414">0%</text><text x="434" y="414">20%</text><text x="538" y="414">40%</text>
    <text x="642" y="414">60%</text><text x="746" y="414">80%</text><text x="850" y="414">100%</text>
  </g>
  <g font-size="14" fill="#222" text-anchor="end">
    <text x="318" y="110">Кодирует белки (CDS)</text>
    <text x="318" y="160">Интроны генов белков</text>
    <text x="318" y="210">Мобильные элементы</text>
    <text x="318" y="260">Сегментные дупликации</text>
    <text x="318" y="310">Сателлиты, простые повторы</text>
    <text x="318" y="360">Под отбором (функционально важно)</text>
  </g>
  <g fill="#0e7490">
    <rect x="335.2" y="96" width="2.6" height="20" rx="2"/>
    <rect x="460" y="146" width="78" height="20" rx="4"/>
    <rect x="564" y="196" width="26" height="20" rx="4"/>
    <rect x="356" y="246" width="10.4" height="20" rx="4"/>
    <rect x="345.6" y="296" width="15.6" height="20" rx="4"/>
    <rect x="356" y="346" width="52" height="20" rx="4"/>
  </g>
  <g font-size="13" fill="#222">
    <text x="346" y="111">≈ 1–1,5%</text>
    <text x="546" y="161">≈ 25–40%</text>
    <text x="598" y="211">≈ 45–50%</text>
    <text x="374" y="261">≈ 5–7%</text>
    <text x="369" y="311">≈ 3–6%</text>
    <text x="416" y="361">≈ 5–15% (чаще называют около 10%)</text>
  </g>
  <rect x="40" y="428" width="820" height="32" rx="6" fill="#eef7f9"/>
  <text x="56" y="449" font-size="13" fill="#333">Мобильные элементы: LINE ≈ 20%, SINE (в т. ч. Alu) ≈ 13%, LTR-ретротранспозоны ≈ 8%, ДНК-транспозоны ≈ 3%.</text>
</svg>
