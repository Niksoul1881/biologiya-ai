<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#fff"/>
  <text x="450" y="32" font-size="21" font-weight="bold" text-anchor="middle" fill="#0e5a6b">Размер генома и число генов: связи почти нет</text>
  <text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">Гаплоидный геном, млн пар нуклеотидов (логарифмическая шкала). Значения округлены.</text>
  <!-- x = 250 + 90*log10(Mb) ; 1 Mb -> 250, 1e6 Mb -> 790 -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="250" y1="75" x2="250" y2="455"/><line x1="340" y1="75" x2="340" y2="455"/>
    <line x1="430" y1="75" x2="430" y2="455"/><line x1="520" y1="75" x2="520" y2="455"/>
    <line x1="610" y1="75" x2="610" y2="455"/><line x1="700" y1="75" x2="700" y2="455"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="250" y="474">1</text><text x="340" y="474">10</text><text x="430" y="474">100</text>
    <text x="520" y="474">1 000</text><text x="610" y="474">10 000</text><text x="700" y="474">100 000</text>
  </g>
  <text x="845" y="76" font-size="12" fill="#666" text-anchor="middle">генов белков</text>
  <g font-size="14" fill="#222" text-anchor="end">
    <text x="238" y="102">Кишечная палочка</text>
    <text x="238" y="142">Пекарские дрожжи</text>
    <text x="238" y="182">Нематода C. elegans</text>
    <text x="238" y="222">Дрозофила</text>
    <text x="238" y="262">Мышь</text>
    <text x="238" y="302" font-weight="bold">Человек</text>
    <text x="238" y="342">Мягкая пшеница</text>
    <text x="238" y="382">Аксолотль</text>
    <text x="238" y="422">Вороний глаз японский</text>
  </g>
  <g fill="#7fb3c2">
    <rect x="250" y="88" width="59.6" height="20" rx="4"/>
    <rect x="250" y="128" width="97.1" height="20" rx="4"/>
    <rect x="250" y="168" width="180" height="20" rx="4"/>
    <rect x="250" y="208" width="193" height="20" rx="4"/>
    <rect x="250" y="248" width="308.8" height="20" rx="4"/>
    <rect x="250" y="328" width="378.4" height="20" rx="4"/>
    <rect x="250" y="368" width="405.5" height="20" rx="4"/>
    <rect x="250" y="408" width="465.5" height="20" rx="4"/>
  </g>
  <rect x="250" y="288" width="314.4" height="20" rx="4" fill="#0e5a6b"/>
  <g font-size="13" fill="#222">
    <text x="316" y="103">4,6</text>
    <text x="354" y="143">12</text>
    <text x="437" y="183">100</text>
    <text x="450" y="223">≈ 140</text>
    <text x="566" y="263">2 700</text>
    <text x="572" y="303" font-weight="bold">3 100</text>
    <text x="636" y="343">≈ 16 000</text>
    <text x="663" y="383">≈ 32 000</text>
    <text x="723" y="423">≈ 150 000</text>
  </g>
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="845" y="103">≈ 4 300</text>
    <text x="845" y="143">≈ 6 000</text>
    <text x="845" y="183">≈ 20 000</text>
    <text x="845" y="223">≈ 14 000</text>
    <text x="845" y="263">≈ 20 000</text>
    <text x="845" y="303" font-weight="bold">≈ 20 000</text>
    <text x="845" y="343">≈ 100 000</text>
    <text x="845" y="383">—</text>
    <text x="845" y="423">—</text>
  </g>
  <text x="40" y="505" font-size="13" fill="#333">Нематода из ~1000 клеток имеет примерно столько же генов, сколько человек; у пшеницы генов больше из-за полиплоидии.</text>
</svg>
