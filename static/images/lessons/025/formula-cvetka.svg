<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <title>Формула цветка: как её читать</title>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="40" font-size="26" font-weight="bold" fill="#14532d" text-anchor="middle">Формула цветка: как её читать</text>
  <!-- цветок сверху (шиповник) -->
  <g transform="translate(170,215)">
    <g fill="#86efac" stroke="#15803d" stroke-width="2">
      <path d="M0,-118 L16,-60 L-16,-60 z" transform="rotate(36)"/>
      <path d="M0,-118 L16,-60 L-16,-60 z" transform="rotate(108)"/>
      <path d="M0,-118 L16,-60 L-16,-60 z" transform="rotate(180)"/>
      <path d="M0,-118 L16,-60 L-16,-60 z" transform="rotate(252)"/>
      <path d="M0,-118 L16,-60 L-16,-60 z" transform="rotate(324)"/>
    </g>
    <g fill="#fbcfe8" stroke="#db2777" stroke-width="2">
      <ellipse cx="0" cy="-58" rx="40" ry="46"/>
      <ellipse cx="0" cy="-58" rx="40" ry="46" transform="rotate(72)"/>
      <ellipse cx="0" cy="-58" rx="40" ry="46" transform="rotate(144)"/>
      <ellipse cx="0" cy="-58" rx="40" ry="46" transform="rotate(216)"/>
      <ellipse cx="0" cy="-58" rx="40" ry="46" transform="rotate(288)"/>
    </g>
    <g fill="#facc15" stroke="#a16207" stroke-width="1">
      <circle cx="0" cy="-30" r="5"/><circle cx="18" cy="-24" r="5"/><circle cx="28" cy="-8" r="5"/><circle cx="28" cy="10" r="5"/>
      <circle cx="18" cy="25" r="5"/><circle cx="0" cy="31" r="5"/><circle cx="-18" cy="25" r="5"/><circle cx="-28" cy="10" r="5"/>
      <circle cx="-28" cy="-8" r="5"/><circle cx="-18" cy="-24" r="5"/>
    </g>
    <circle r="15" fill="#65a30d" stroke="#3f6212" stroke-width="2"/>
  </g>
  <text x="170" y="365" font-size="17" fill="#374151" text-anchor="middle">Цветок шиповника</text>
  <text x="170" y="387" font-size="17" fill="#374151" text-anchor="middle">(вид сверху)</text>

  <!-- формула -->
  <g font-size="54" font-weight="bold">
    <text x="360" y="130" fill="#15803d">Ч<tspan font-size="34" dy="12">5</tspan></text>
    <text x="490" y="130" fill="#db2777">Л<tspan font-size="34" dy="12">5</tspan></text>
    <text x="620" y="130" fill="#a16207">Т<tspan font-size="34" dy="12">∞</tspan></text>
    <text x="770" y="130" fill="#4d7c0f">П<tspan font-size="34" dy="12">1</tspan></text>
  </g>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="385" y1="150" x2="385" y2="180"/><line x1="515" y1="150" x2="515" y2="180"/>
    <line x1="650" y1="150" x2="650" y2="180"/><line x1="795" y1="150" x2="795" y2="180"/>
  </g>
  <g font-size="17" fill="#1f2937" text-anchor="middle">
    <text x="385" y="202" font-weight="bold" fill="#15803d">чашечка</text>
    <text x="385" y="224">5 чашелистиков</text>
    <text x="515" y="202" font-weight="bold" fill="#db2777">венчик</text>
    <text x="515" y="224">5 лепестков</text>
    <text x="650" y="202" font-weight="bold" fill="#a16207">тычинки</text>
    <text x="650" y="224">много</text>
    <text x="795" y="202" font-weight="bold" fill="#4d7c0f">пестик</text>
    <text x="795" y="224">один</text>
  </g>

  <!-- условные знаки -->
  <rect x="340" y="255" width="640" height="165" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="360" y="285" font-size="19" font-weight="bold" fill="#14532d">Условные знаки</text>
  <g font-size="17" fill="#1f2937">
    <text x="360" y="315"><tspan font-weight="bold">∞</tspan> — много (больше 12)</text>
    <text x="360" y="343"><tspan font-weight="bold">( )</tspan> — части срослись: Л(5) — лепестки срослись в трубку</text>
    <text x="360" y="371"><tspan font-weight="bold">+</tspan> — части в два круга: Т4+2 — 4 длинные и 2 короткие</text>
    <text x="360" y="399"><tspan font-weight="bold">О</tspan> — простой околоцветник: нет деления на чашечку и венчик</text>
  </g>

  <!-- примеры -->
  <text x="30" y="460" font-size="19" font-weight="bold" fill="#14532d">Примеры</text>
  <g font-size="17">
    <rect x="20" y="475" width="310" height="140" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="40" y="505" font-weight="bold" fill="#1f2937">Капустные (крестоцветные)</text>
    <text x="40" y="545" font-size="28" font-weight="bold" fill="#a16207">Ч4 Л4 Т4+2 П1</text>
    <text x="40" y="578" fill="#374151">лепестки крестом,</text>
    <text x="40" y="600" fill="#374151">тычинок 4 длинных и 2 коротких</text>

    <rect x="345" y="475" width="310" height="140" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="365" y="505" font-weight="bold" fill="#1f2937">Паслёновые</text>
    <text x="365" y="545" font-size="28" font-weight="bold" fill="#7e22ce">Ч(5) Л(5) Т5 П1</text>
    <text x="365" y="578" fill="#374151">чашелистики и лепестки</text>
    <text x="365" y="600" fill="#374151">срослись</text>

    <rect x="670" y="475" width="310" height="140" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
    <text x="690" y="505" font-weight="bold" fill="#1f2937">Лилейные (однодольные)</text>
    <text x="690" y="545" font-size="28" font-weight="bold" fill="#c2410c">О3+3 Т3+3 П1</text>
    <text x="690" y="578" fill="#374151">6 листочков околоцветника</text>
    <text x="690" y="600" fill="#374151">в два круга, 6 тычинок</text>
  </g>
</svg>
