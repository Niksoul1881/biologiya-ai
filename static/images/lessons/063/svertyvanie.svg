<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>
  <text x="360" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">Свёртывание крови: упрощённая схема</text>
  <!-- шаг 1 -->
  <rect x="40" y="60" width="640" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="360" y="84" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">1. Сосуд повреждён</text>
  <text x="360" y="106" font-size="15" text-anchor="middle" fill="#374151">тромбоциты прилипают к краям раны и склеиваются — «тромбоцитарная пробка»</text>
  <line x1="360" y1="118" x2="360" y2="146" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- шаг 2 -->
  <rect x="40" y="150" width="640" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="360" y="174" font-size="18" font-weight="bold" text-anchor="middle" fill="#78350f">2. Выделяются факторы свёртывания</text>
  <text x="360" y="196" font-size="15" text-anchor="middle" fill="#374151">из разрушенных тромбоцитов и тканей (тромбопластин); нужны ионы Ca²⁺</text>
  <line x1="360" y1="208" x2="360" y2="236" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- шаг 3 -->
  <rect x="40" y="240" width="300" height="70" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="190" y="268" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">протромбин</text>
  <text x="190" y="292" font-size="13" text-anchor="middle" fill="#374151">белок плазмы из печени (нужен витамин K)</text>
  <line x1="342" y1="275" x2="376" y2="275" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="380" y="240" width="300" height="70" rx="10" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
  <text x="530" y="268" font-size="18" font-weight="bold" text-anchor="middle" fill="#312e81">тромбин</text>
  <text x="530" y="292" font-size="14" text-anchor="middle" fill="#374151">активный фермент</text>
  <line x1="530" y1="312" x2="530" y2="346" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- шаг 4 -->
  <rect x="40" y="350" width="300" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="190" y="378" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">фибриноген</text>
  <text x="190" y="402" font-size="14" text-anchor="middle" fill="#374151">растворимый белок плазмы</text>
  <line x1="342" y1="385" x2="376" y2="385" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="380" y="350" width="300" height="70" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="530" y="378" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">фибрин</text>
  <text x="530" y="402" font-size="14" text-anchor="middle" fill="#374151">нерастворимые нити</text>
  <text x="518" y="338" font-size="14" text-anchor="end" fill="#4338ca">тромбин превращает</text>
  <line x1="530" y1="422" x2="530" y2="448" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- итог -->
  <rect x="40" y="452" width="640" height="56" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
  <text x="360" y="476" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">3. Тромб: сеть фибрина + застрявшие эритроциты</text>
  <text x="360" y="498" font-size="15" text-anchor="middle" fill="#374151">закрывает рану; у здорового человека — за несколько минут</text>
</svg>
