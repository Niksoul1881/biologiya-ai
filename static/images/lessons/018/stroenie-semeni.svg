<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <path id="bean" d="M70,0 C150,-8 190,45 180,110 C170,170 105,190 60,165 C38,152 45,122 22,110 C-12,92 -10,8 70,0 Z"/>
  </defs>
  <!-- Панель 1 -->
  <text x="140" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5d1e">Семя фасоли</text>
  <text x="140" y="56" text-anchor="middle" font-size="14" fill="#555">снаружи</text>
  <g transform="translate(50,140)">
    <use href="#bean" fill="#b03a48" stroke="#6d1f2a" stroke-width="3"/>
    <ellipse cx="34" cy="112" rx="9" ry="22" transform="rotate(25 34 112)" fill="#f4efe6" stroke="#6d1f2a" stroke-width="2"/>
    <circle cx="20" cy="140" r="3.5" fill="#3a1015"/>
  </g>
  <g fill="#222">
    <text x="40" y="380">рубчик</text>
    <text x="40" y="410">семявход</text>
    <text x="175" y="110">семенная кожура</text>
  </g>
  <g stroke="#444" stroke-width="1.3">
    <line x1="70" y1="366" x2="84" y2="268"/>
    <line x1="80" y1="396" x2="70" y2="284"/>
    <line x1="210" y1="116" x2="200" y2="160"/>
  </g>

  <line x1="300" y1="20" x2="300" y2="450" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Панель 2 -->
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5d1e">Семя фасоли без кожуры</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#555">одна семядоля отодвинута</text>
  <g transform="translate(355,130)">
    <!-- вторая семядоля (сзади) -->
    <use href="#bean" transform="translate(40,-20)" fill="#efe2b0" stroke="#a08c40" stroke-width="2.5"/>
    <!-- первая семядоля -->
    <use href="#bean" fill="#f7eec8" stroke="#a08c40" stroke-width="3"/>
    <!-- зародыш: корешок, стебелёк, почечка -->
    <path d="M30,92 C22,110 18,130 6,150 C24,140 36,124 42,104 Z" fill="#e6cf7a" stroke="#8a6a2a" stroke-width="2"/>
    <path d="M30,92 C40,80 52,72 66,66" stroke="#8a6a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M66,66 C76,48 96,44 106,52 C96,62 82,68 66,66 Z" fill="#c7d97a" stroke="#5a7a20" stroke-width="2"/>
    <path d="M66,66 C82,58 102,66 108,78 C94,82 78,78 66,66 Z" fill="#c7d97a" stroke="#5a7a20" stroke-width="2"/>
  </g>
  <g fill="#222">
    <text x="500" y="380">семядоли (2)</text>
    <text x="318" y="105">почечка</text>
    <text x="318" y="345">корешок</text>
    <text x="318" y="215">стебелёк</text>
  </g>
  <g stroke="#444" stroke-width="1.3">
    <line x1="560" y1="366" x2="520" y2="270"/>
    <line x1="590" y1="366" x2="575" y2="250"/>
    <line x1="350" y1="110" x2="440" y2="185"/>
    <line x1="350" y1="331" x2="370" y2="270"/>
    <line x1="360" y1="220" x2="400" y2="212"/>
  </g>
  <text x="460" y="425" text-anchor="middle" font-size="14" fill="#555">корешок + стебелёк + почечка + семядоли</text>
  <text x="460" y="444" text-anchor="middle" font-size="14" fill="#555">= зародыш</text>

  <line x1="620" y1="20" x2="620" y2="450" stroke="#ccc" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Панель 3 -->
  <text x="760" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5d1e">Зерновка пшеницы</text>
  <text x="760" y="56" text-anchor="middle" font-size="14" fill="#555">продольный разрез</text>
  <g transform="translate(805,235)">
    <ellipse cx="0" cy="0" rx="62" ry="150" fill="#d9a441" stroke="#8a5a10" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="54" ry="142" fill="#fbf6e6" stroke="#c9b48a" stroke-width="1.5"/>
    <!-- зародыш внизу сбоку -->
    <path d="M-54,95 C-40,80 -10,90 -8,120 C-10,135 -30,140 -40,128 C-48,118 -56,108 -54,95 Z" fill="#e6cf7a" stroke="#8a6a2a" stroke-width="2"/>
    <path d="M-8,120 C0,100 -12,82 -30,84" stroke="#8fae3a" stroke-width="5" fill="none"/>
    <path d="M-38,104 C-34,116 -36,126 -42,134" stroke="#8a6a2a" stroke-width="4" fill="none"/>
    <path d="M-10,72 C6,92 6,118 -6,136" stroke="#a6c24a" stroke-width="5" fill="none"/>
    <!-- волоски на верхушке -->
    <path d="M-10,-148 l-6,-14 M0,-150 l0,-15 M10,-148 l6,-14" stroke="#8a5a10" stroke-width="2"/>
  </g>
  <g fill="#222">
    <text x="805" y="200" text-anchor="middle" font-size="15">эндосперм</text>
    <text x="632" y="440">зародыш</text>
    <text x="632" y="300" font-size="15">щиток</text>
    <text x="632" y="318" font-size="15">(семядоля)</text>
    <text x="632" y="105" font-size="15">околоплодник,</text>
    <text x="632" y="123" font-size="15">сросшийся</text>
    <text x="632" y="141" font-size="15">с кожурой</text>
  </g>
  <g stroke="#444" stroke-width="1.3">
    <line x1="680" y1="426" x2="765" y2="360"/>
    <line x1="700" y1="312" x2="795" y2="335"/>
    <line x1="700" y1="130" x2="746" y2="160"/>
  </g>
</svg>
