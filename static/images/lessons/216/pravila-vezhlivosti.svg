<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Правила вежливости NCBI</text>
  <text x="500" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">Нарушишь — сначала предупреждение, потом блокировка IP</text>

  <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
    <rect x="20" y="90" width="300" height="160" rx="12"/>
    <rect x="340" y="90" width="300" height="160" rx="12"/>
    <rect x="660" y="90" width="320" height="160" rx="12"/>
  </g>

  <text x="42" y="170" font-size="62" font-weight="bold" fill="#16A34A">3</text>
  <text x="120" y="140" font-size="16" font-weight="bold" fill="#111827">запроса в секунду</text>
  <text x="120" y="164" font-size="13" fill="#6b7280">без API-ключа</text>
  <text x="42" y="206" font-size="12.5" fill="#374151">пауза не меньше 0,34 с</text>
  <text x="42" y="228" font-size="12.5" fill="#374151">между запросами</text>

  <text x="362" y="170" font-size="62" font-weight="bold" fill="#16A34A">10</text>
  <text x="452" y="140" font-size="16" font-weight="bold" fill="#111827">запросов в секунду</text>
  <text x="452" y="164" font-size="13" fill="#6b7280">с ключом</text>
  <text x="362" y="206" font-size="12.5" fill="#374151">ключ берут в настройках</text>
  <text x="362" y="228" font-size="12.5" fill="#374151">аккаунта NCBI</text>

  <text x="682" y="128" font-size="18" font-weight="bold" fill="#111827">email + tool</text>
  <text x="682" y="156" font-size="13" fill="#6b7280">в каждом запросе</text>
  <text x="682" y="190" font-size="12.5" fill="#374151">По ним NCBI напишет,</text>
  <text x="682" y="210" font-size="12.5" fill="#374151">если твои запросы</text>
  <text x="682" y="230" font-size="12.5" fill="#374151">мешают другим.</text>

  <g>
    <circle cx="34" cy="298" r="11" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/>
    <text x="34" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A">1</text>
    <text x="58" y="303" font-size="14" fill="#111827">Пауза между запросами: <tspan font-family="Consolas, monospace" fill="#16A34A">time.sleep(0.4)</tspan></text>

    <circle cx="34" cy="342" r="11" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/>
    <text x="34" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A">2</text>
    <text x="58" y="347" font-size="14" fill="#111827">Тысячи записей — порциями, а не одним запросом</text>

    <circle cx="34" cy="386" r="11" fill="#f0fdf4" stroke="#16A34A" stroke-width="2"/>
    <text x="34" y="391" text-anchor="middle" font-size="12" font-weight="bold" fill="#16A34A">3</text>
    <text x="58" y="391" font-size="14" fill="#111827">Проверяй <tspan font-family="Consolas, monospace" fill="#16A34A">status_code</tspan> и <tspan font-family="Consolas, monospace" fill="#16A34A">errorlist</tspan> — ответ мог быть пустым</text>

    <circle cx="34" cy="430" r="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="34" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">4</text>
    <text x="58" y="435" font-size="14" fill="#111827">За нарушения NCBI блокирует IP — и пишет на email из запроса</text>
  </g>

  <rect x="20" y="462" width="960" height="70" rx="12" fill="#111827"/>
  <text x="42" y="492" font-size="14" fill="#86efac" font-family="Consolas, monospace">time.sleep(0.4)   # 2,5 запроса в секунду — безопасно без ключа</text>
  <text x="42" y="516" font-size="12.5" fill="#9ca3af">Массовые запросы без ключа — плохая идея: тебя забанят, а не «просто притормозят»</text>
</svg>
