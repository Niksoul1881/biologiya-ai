<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Созревание иРНК у эукариот (процессинг)</text>
  <text x="40" y="82" font-size="16" font-weight="bold" fill="#333">Пре-иРНК (первичный транскрипт)</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="60" y="125" fill="#555">5′</text>
    <rect x="80" y="105" width="140" height="34" rx="5" fill="#7fbf6a"/><text x="150" y="128" fill="#fff">экзон 1</text>
    <rect x="220" y="110" width="130" height="24" fill="#ccc"/><text x="285" y="127" fill="#555">интрон</text>
    <rect x="350" y="105" width="140" height="34" rx="5" fill="#4f9fd6"/><text x="420" y="128" fill="#fff">экзон 2</text>
    <rect x="490" y="110" width="150" height="24" fill="#ccc"/><text x="565" y="127" fill="#555">интрон</text>
    <rect x="640" y="105" width="140" height="34" rx="5" fill="#e3964a"/><text x="710" y="128" fill="#fff">экзон 3</text>
    <text x="800" y="125" fill="#555">3′</text>
  </g>
  <path d="M 450 155 L 450 205" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <text x="470" y="172" font-size="15" fill="#333">кэпирование 5′-конца, полиаденилирование</text><text x="470" y="192" font-size="15" fill="#333">3′-конца и сплайсинг</text>
  <!-- вырезанные интроны -->
  <g>
    <path d="M 120 250 q 30 -40 60 0 q -30 25 -60 0" fill="none" stroke="#aaa" stroke-width="5"/>
    <path d="M 200 250 q 30 -40 60 0 q -30 25 -60 0" fill="none" stroke="#aaa" stroke-width="5"/>
    <text x="190" y="290" font-size="14" text-anchor="middle" fill="#777">интроны вырезаются</text>
    <text x="190" y="308" font-size="14" text-anchor="middle" fill="#777">и разрушаются</text>
  </g>
  <text x="330" y="258" font-size="16" font-weight="bold" fill="#333">Зрелая иРНК</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="345" cy="300" r="16" fill="#7a3fa0"/><text x="345" y="305" fill="#fff" font-size="11">кэп</text>
    <rect x="365" y="283" width="140" height="34" rx="5" fill="#7fbf6a"/><text x="435" y="306" fill="#fff">экзон 1</text>
    <rect x="505" y="283" width="140" height="34" rx="5" fill="#4f9fd6"/><text x="575" y="306" fill="#fff">экзон 2</text>
    <rect x="645" y="283" width="140" height="34" rx="5" fill="#e3964a"/><text x="715" y="306" fill="#fff">экзон 3</text>
    <text x="830" y="306" fill="#7a3fa0" font-size="14">ААААА…</text>
  </g>
  <text x="330" y="345" font-size="14" fill="#7a3fa0">5′-кэп</text>
  <text x="790" y="345" font-size="14" fill="#7a3fa0">поли(А)-хвост</text>
  <text x="40" y="390" font-size="14" fill="#333">Кэп и поли(А)-хвост защищают иРНК от разрушения и помогают рибосоме её узнать. Экзоны сшиваются,</text>
  <text x="40" y="410" font-size="14" fill="#333">интроны удаляются. Только зрелая иРНК выходит через ядерные поры в цитоплазму.</text>
</svg>
