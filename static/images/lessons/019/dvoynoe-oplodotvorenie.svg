<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="270" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5d1e">Двойное оплодотворение</text>
  <!-- пестик -->
  <path d="M230,70 Q270,55 310,70 L290,95 L282,270 Q360,300 360,390 Q360,480 270,485 Q180,480 180,390 Q180,300 258,270 L250,95 Z" fill="#cfe8b5" stroke="#3b6b20" stroke-width="3"/>
  <!-- семязачаток -->
  <ellipse cx="270" cy="400" rx="62" ry="70" fill="#f6efc8" stroke="#a08c40" stroke-width="3"/>
  <ellipse cx="270" cy="395" rx="40" ry="50" fill="#fffbe9" stroke="#c9b060" stroke-width="2"/>
  <!-- яйцеклетка у семявхода (вверху) -->
  <circle cx="270" cy="358" r="11" fill="#f08cae" stroke="#a3245f" stroke-width="2"/>
  <!-- центральная клетка -->
  <ellipse cx="270" cy="405" rx="16" ry="12" fill="#ffd27a" stroke="#b37a00" stroke-width="2"/>
  <!-- пыльцевое зерно на рыльце -->
  <circle cx="262" cy="64" r="12" fill="#f2c94c" stroke="#b38b00" stroke-width="2"/>
  <!-- пыльцевая трубка -->
  <path d="M262,74 C268,140 262,200 270,260 C276,300 268,330 270,346" stroke="#d48a00" stroke-width="5" fill="none"/>
  <!-- спермии -->
  <circle cx="266" cy="300" r="5" fill="#2a6fb0"/><circle cx="274" cy="314" r="5" fill="#2a6fb0"/>
  <g fill="#222">
    <text x="320" y="62">пыльцевое зерно на рыльце</text>
    <text x="320" y="170">пыльцевая трубка</text>
    <text x="320" y="190" font-size="14" fill="#555">растёт через столбик</text>
    <text x="38" y="305">2 спермия</text>
    <text x="380" y="330">яйцеклетка</text>
    <text x="380" y="420">центральная клетка</text>
    <text x="40" y="440">семязачаток</text>
    <text x="40" y="500">завязь</text>
  </g>
  <g stroke="#444" stroke-width="1.3" fill="none">
    <line x1="318" y1="58" x2="275" y2="62"/>
    <line x1="318" y1="166" x2="268" y2="170"/>
    <line x1="115" y1="300" x2="260" y2="304"/>
    <line x1="378" y1="326" x2="282" y2="356"/>
    <line x1="378" y1="415" x2="287" y2="406"/>
    <line x1="132" y1="436" x2="210" y2="420"/>
    <line x1="92" y1="495" x2="195" y2="455"/>
  </g>

  <!-- итоговые уравнения -->
  <rect x="560" y="90" width="320" height="150" rx="14" fill="#fdeef3" stroke="#a3245f" stroke-width="2"/>
  <text x="720" y="122" text-anchor="middle" font-weight="bold" fill="#a3245f">Первый спермий</text>
  <text x="720" y="150" text-anchor="middle">+ яйцеклетка</text>
  <line x1="720" y1="160" x2="720" y2="185" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="720" y="208" text-anchor="middle" font-weight="bold">зигота → зародыш</text>
  <text x="720" y="229" text-anchor="middle" font-size="14" fill="#555">будущее растение</text>

  <rect x="560" y="270" width="320" height="150" rx="14" fill="#fff6e0" stroke="#b37a00" stroke-width="2"/>
  <text x="720" y="302" text-anchor="middle" font-weight="bold" fill="#8a5a00">Второй спермий</text>
  <text x="720" y="330" text-anchor="middle">+ центральная клетка</text>
  <line x1="720" y1="340" x2="720" y2="365" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="720" y="388" text-anchor="middle" font-weight="bold">эндосперм</text>
  <text x="720" y="409" text-anchor="middle" font-size="14" fill="#555">запас питания для зародыша</text>

  <text x="720" y="460" text-anchor="middle" font-size="15" fill="#333">Семязачаток → семя,</text>
  <text x="720" y="482" text-anchor="middle" font-size="15" fill="#333">завязь → плод</text>
  <text x="720" y="504" text-anchor="middle" font-size="13" fill="#666">Открыто С. Г. Навашиным в 1898 году</text>
</svg>
