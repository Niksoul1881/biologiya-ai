<circle cx="106" cy="471" r="8" fill="#e0f7fa" stroke="#555" stroke-width="1.2"/><circle cx="106" cy="471" r="3" fill="#333"/>
<text x="110" y="508" font-size="13" text-anchor="middle" fill="#333">икра</text>
<path d="M 135 460 L 195 460" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<ellipse cx="255" cy="460" rx="16" ry="12" fill="#5d4037"/><path d="M 241 460 Q 215 446 199 464 Q 215 468 241 464" fill="#8d6e63"/>
<text x="240" y="508" font-size="13" text-anchor="middle" fill="#333">головастик (жабры, хвост)</text>
<path d="M 320 460 L 410 460" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<ellipse cx="470" cy="460" rx="30" ry="20" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/><circle cx="458" cy="442" r="7" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/><circle cx="482" cy="442" r="7" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/><circle cx="458" cy="442" r="2.5" fill="#222"/><circle cx="482" cy="442" r="2.5" fill="#222"/><path d="M 442 470 L 426 480 M 498 470 L 514 480" stroke="#2e7d32" stroke-width="3"/>
<text x="470" y="508" font-size="13" text-anchor="middle" fill="#333">лягушка (лёгкие, конечности)</text>
<text x="760" y="445" font-size="12" text-anchor="middle" fill="#555">у личинки — жабры</text>
<text x="760" y="461" font-size="12" text-anchor="middle" fill="#555">и двухкамерное сердце,</text>
<text x="760" y="477" font-size="12" text-anchor="middle" fill="#555">как у рыб</text>
<text x="450" y="548" font-size="13" text-anchor="middle" fill="#333">При прямом развитии (пресмыкающиеся, птицы, млекопитающие) рождается организм, похожий на взрослого.</text>
