<text x="490" y="348" font-size="13" text-anchor="middle" fill="#333">взрослое насекомое</text>
<text x="760" y="285" font-size="12" text-anchor="middle" fill="#555">стадии куколки нет;</text>
<text x="760" y="301" font-size="12" text-anchor="middle" fill="#555">личинка похожа</text>
<text x="760" y="317" font-size="12" text-anchor="middle" fill="#555">на взрослое, растёт</text>
<text x="760" y="333" font-size="12" text-anchor="middle" fill="#555">и линяет</text>
<rect x="20" y="372" width="860" height="150" rx="0" fill="#eef6fb" stroke="none"/>
<text x="30" y="396" font-size="15" text-anchor="start" fill="#1d4f86" font-weight="bold">Земноводные: личинка-головастик → метаморфоз</text>
<circle cx="100" cy="455" r="8" fill="#e0f7fa" stroke="#555" stroke-width="1.2"/><circle cx="100" cy="455" r="3" fill="#333"/>
<circle cx="116" cy="461" r="8" fill="#e0f7fa" stroke="#555" stroke-width="1.2"/><circle cx="116" cy="461" r="3" fill="#333"/>
