<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="470" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Как виляющий танец пчелы указывает путь к цветам</text>
<rect x="12" y="50" width="460" height="400" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/><text x="242" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">На лугу (вид сверху)</text>
<rect x="125" y="340" width="50" height="40" rx="6" fill="#fde68a" stroke="#a16207" stroke-width="2"/><text x="150" y="400" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">улей</text>
<circle cx="150" cy="120" r="24" fill="#fbbf24"/><line x1="180.0" y1="120.0" x2="190.0" y2="120.0" stroke="#f59e0b" stroke-width="3"/><line x1="171.21320343559643" y1="141.21320343559643" x2="178.2842712474619" y2="148.2842712474619" stroke="#f59e0b" stroke-width="3"/><line x1="150.0" y1="150.0" x2="150.0" y2="160.0" stroke="#f59e0b" stroke-width="3"/><line x1="128.78679656440357" y1="141.21320343559643" x2="121.7157287525381" y2="148.2842712474619" stroke="#f59e0b" stroke-width="3"/><line x1="120.0" y1="120.0" x2="110.0" y2="120.0" stroke="#f59e0b" stroke-width="3"/><line x1="128.78679656440357" y1="98.78679656440357" x2="121.7157287525381" y2="91.7157287525381" stroke="#f59e0b" stroke-width="3"/><line x1="150.0" y1="90.0" x2="150.0" y2="80.0" stroke="#f59e0b" stroke-width="3"/><line x1="171.21320343559643" y1="98.78679656440357" x2="178.2842712474619" y2="91.7157287525381" stroke="#f59e0b" stroke-width="3"/>
<text x="210" y="125" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">солнце</text>
<line x1="150" y1="340" x2="150" y2="148" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="150" y1="340" x2="326.19022191736497" y2="212.15884977209595" stroke="#16a34a" stroke-width="3"/>
<circle cx="326.19022191736497" cy="212.15884977209595" r="9" fill="#ec4899"/><circle cx="340.19022191736497" cy="212.15884977209595" r="7" fill="#f9a8d4"/><circle cx="333.19022191736497" cy="224.28320542507808" r="7" fill="#f9a8d4"/><circle cx="319.19022191736497" cy="224.28320542507808" r="7" fill="#f9a8d4"/><circle cx="312.19022191736497" cy="212.15884977209595" r="7" fill="#f9a8d4"/><circle cx="319.19022191736497" cy="200.03449411911382" r="7" fill="#f9a8d4"/><circle cx="333.19022191736497" cy="200.03449411911382" r="7" fill="#f9a8d4"/>
<text x="351.19022191736497" y="217.15884977209595" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">цветы</text>
<path d="M150.0,270.0 A70,70 0 0 1 203.62311101832847,295.00486732194224" stroke="#dc2626" stroke-width="2.5" fill="none"/>
<text x="180" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">угол α</text>
<rect x="488" y="50" width="460" height="400" rx="14" fill="#fffbeb" stroke="#fde68a"/><text x="718" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">На вертикальных сотах в улье</text>
<line x1="640" y1="380" x2="640" y2="150" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M634,160 L640,145 L646,160" fill="#f59e0b"/><text x="640" y="138" text-anchor="middle" font-size="14" font-weight="normal" fill="#b45309">вверх</text>
<path d="M708.9,222.1 Q726.0,351.4 601.7,312.1" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M708.9,222.1 Q584.6,182.9 601.7,312.1" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5 4"/><polyline points="601.7,312.1 603.9,301.2 619.6,306.3 617.3,289.9 633.0,295.0 630.7,278.7 646.4,283.8 644.1,267.4 659.8,272.5 657.5,256.2 673.2,261.3 670.9,244.9 686.6,250.0 684.3,233.7 700.0,238.8 697.7,222.4 708.9,222.1" stroke="#16a34a" stroke-width="3" fill="none"/>
<path d="M640.0,220.0 A60,60 0 0 1 685.9626665871386,241.43274341880766" stroke="#dc2626" stroke-width="2.5" fill="none"/>
<text x="668" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">угол α</text>




<text x="772" y="130" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">«вверх» на сотах =</text>
<text x="772" y="152" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">направление на солнце</text>
<text x="772" y="196" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">угол виляющего пробега</text>
<text x="772" y="218" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">к вертикали = угол</text>
<text x="772" y="240" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">между солнцем и цветами</text>
<text x="772" y="284" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">чем дольше виляние —</text>
<text x="772" y="306" text-anchor="start" font-size="14" font-weight="normal" fill="#111827">тем дальше корм</text>
<text x="718" y="440" text-anchor="middle" font-size="13" font-weight="normal" fill="#15803d">зелёная зигзагообразная линия — «виляющий пробег»</text>
</svg>