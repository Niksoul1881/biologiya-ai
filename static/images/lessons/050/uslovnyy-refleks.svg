<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="400" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Как вырабатывается условный рефлекс (опыт И. П. Павлова)</text>
<rect x="12" y="50" width="306" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="165" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">1. До опыта</text>
<ellipse cx="155" cy="190" rx="34" ry="28" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><ellipse cx="185" cy="198" rx="20" ry="13" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><circle cx="201" cy="194" r="4" fill="#1f2937"/><circle cx="167" cy="182" r="4" fill="#1f2937"/><path d="M130,170 q-15,25 2,38" fill="#a07850" stroke="#7c5c3b" stroke-width="2"/>
<path d="M55,158 Q55,122 75,120 Q95,122 95,158 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/><circle cx="75" cy="162" r="5" fill="#a16207"/><path d="M103,130 q8,8 0,16 M111,124 q12,14 0,28" stroke="#a16207" stroke-width="2" fill="none"/>

<text x="165" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">звонок → слюны нет</text>
<text x="165" y="337" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">(звук для собаки ничего не значит)</text>
<rect x="327" y="50" width="306" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="480" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">2. Сочетание</text>
<ellipse cx="470" cy="190" rx="34" ry="28" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><ellipse cx="500" cy="198" rx="20" ry="13" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><circle cx="516" cy="194" r="4" fill="#1f2937"/><circle cx="482" cy="182" r="4" fill="#1f2937"/><path d="M445,170 q-15,25 2,38" fill="#a07850" stroke="#7c5c3b" stroke-width="2"/>
<path d="M370,158 Q370,122 390,120 Q410,122 410,158 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/><circle cx="390" cy="162" r="5" fill="#a16207"/><path d="M418,130 q8,8 0,16 M426,124 q12,14 0,28" stroke="#a16207" stroke-width="2" fill="none"/>
<path d="M542,240 h56 q-6,22 -28,22 q-22,0 -28,-22 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><circle cx="562" cy="236" r="6" fill="#92400e"/><circle cx="578" cy="235" r="7" fill="#92400e"/>
<path d="M510,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/><path d="M524,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/><path d="M538,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/>
<text x="480" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">звонок + еда, много раз подряд</text>
<text x="480" y="337" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">еда вызывает слюну (безусловный рефлекс)</text>
<rect x="642" y="50" width="306" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="795" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">3. Рефлекс готов</text>
<ellipse cx="785" cy="190" rx="34" ry="28" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><ellipse cx="815" cy="198" rx="20" ry="13" fill="#d6b48a" stroke="#7c5c3b" stroke-width="2"/><circle cx="831" cy="194" r="4" fill="#1f2937"/><circle cx="797" cy="182" r="4" fill="#1f2937"/><path d="M760,170 q-15,25 2,38" fill="#a07850" stroke="#7c5c3b" stroke-width="2"/>
<path d="M685,158 Q685,122 705,120 Q725,122 725,158 Z" fill="#facc15" stroke="#a16207" stroke-width="2"/><circle cx="705" cy="162" r="5" fill="#a16207"/><path d="M733,130 q8,8 0,16 M741,124 q12,14 0,28" stroke="#a16207" stroke-width="2" fill="none"/>
<path d="M825,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/><path d="M839,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/><path d="M853,222 q-5,10 0,14 q5,-4 0,-14 Z" fill="#38bdf8" stroke="#0369a1"/>
<text x="795" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">звонок → слюна, хотя еды нет</text>
<text x="795" y="337" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">это условный рефлекс</text>
</svg>