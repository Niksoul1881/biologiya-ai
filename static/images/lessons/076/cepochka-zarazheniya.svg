<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f766e">Три звена эпидемического процесса</text>
  <defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="14" refY="10" orient="auto"><path d="M0 0 L20 10 L0 20 z" fill="#374151"/></marker></defs>
  <!-- Звенья -->
  <rect x="30" y="70" width="260" height="180" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="160" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#b91c1c">1. Источник</text>
  <g font-size="16" fill="#1f2937">
    <text x="50" y="142">• больной человек</text>
    <text x="50" y="168">• носитель (без симптомов)</text>
    <text x="50" y="194">• больное животное</text>
    <text x="50" y="220" fill="#6b7280">где микроб размножается</text>
  </g>
  <rect x="350" y="70" width="260" height="180" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="480" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#c2410c">2. Путь передачи</text>
  <g font-size="16" fill="#1f2937">
    <text x="370" y="142">• воздушно-капельный</text>
    <text x="370" y="168">• пищевой и водный</text>
    <text x="370" y="194">• контактный</text>
    <text x="370" y="220">• через кровь, переносчиков</text>
  </g>
  <rect x="670" y="70" width="260" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="800" y="108" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">3. Восприимчивый</text>
  <text x="800" y="134" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">организм</text>
  <g font-size="16" fill="#1f2937">
    <text x="690" y="168">• нет иммунитета</text>
    <text x="690" y="194">• не привит</text>
    <text x="690" y="220">• ослаблен</text>
  </g>
  <line x1="292" y1="160" x2="346" y2="160" stroke="#374151" stroke-width="4" marker-end="url(#m)"/>
  <line x1="612" y1="160" x2="666" y2="160" stroke="#374151" stroke-width="4" marker-end="url(#m)"/>
  <!-- Меры -->
  <text x="480" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#374151">Как разорвать цепочку</text>
  <rect x="30" y="320" width="260" height="160" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="16" fill="#1f2937">
    <text x="50" y="352">• выявить и лечить</text>
    <text x="50" y="378">• изолировать больного</text>
    <text x="50" y="404">• карантин</text>
    <text x="50" y="430">• ветеринарный контроль</text>
  </g>
  <rect x="350" y="320" width="260" height="160" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="16" fill="#1f2937">
    <text x="370" y="352">• мыть руки, проветривать</text>
    <text x="370" y="378">• кипятить воду, мыть еду</text>
    <text x="370" y="404">• дезинфекция, маски</text>
    <text x="370" y="430">• защита от комаров, клещей</text>
  </g>
  <rect x="670" y="320" width="260" height="160" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <g font-size="16" fill="#1f2937">
    <text x="690" y="352">• вакцинация</text>
    <text x="690" y="378">• сон, питание, спорт</text>
    <text x="690" y="404">• закаливание</text>
    <text x="690" y="430">• лечебные сыворотки</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5">
    <line x1="160" y1="252" x2="160" y2="318"/><line x1="480" y1="252" x2="480" y2="318"/><line x1="800" y1="252" x2="800" y2="318"/>
  </g>
</svg>
