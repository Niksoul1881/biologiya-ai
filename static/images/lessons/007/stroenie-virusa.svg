      <line x1="67" y1="67" x2="84" y2="84"/><line x1="-67" y1="-67" x2="-84" y2="-84"/><line x1="67" y1="-67" x2="84" y2="-84"/><line x1="-67" y1="67" x2="-84" y2="84"/>
      <line x1="36" y1="-88" x2="45" y2="-109"/><line x1="-36" y1="88" x2="-45" y2="109"/><line x1="88" y1="36" x2="109" y2="45"/><line x1="-88" y1="-36" x2="-109" y2="-45"/>
      <line x1="-36" y1="-88" x2="-45" y2="-109"/><line x1="36" y1="88" x2="45" y2="109"/><line x1="88" y1="-36" x2="109" y2="-45"/><line x1="-88" y1="36" x2="-109" y2="45"/>
    </g>
    <circle r="95" fill="#fce7f3" stroke="#f59e0b" stroke-width="8"/>
    <circle r="62" fill="#fdf2f8" stroke="#be185d" stroke-width="4" stroke-dasharray="10 4"/>
    <path d="M-40,-20 C-25,-40 -10,0 5,-20 M-30,15 C-15,-5 0,35 15,15 M10,-35 C25,-55 40,-15 45,-30 M15,30 C25,15 40,45 45,25" fill="none" stroke="#7c3aed" stroke-width="4"/>
  </g>
  <g font-size="16" fill="#1f2937">
    <line x1="715" y1="150" x2="755" y2="120" stroke="#374151" stroke-width="1.5"/>
    <text x="760" y="117" font-weight="bold" fill="#9d174d">«Шипы»</text>
    <text x="760" y="135" font-size="13" fill="#4b5563">белки для</text>
    <text x="760" y="151" font-size="13" fill="#4b5563">прикрепления</text>
    <line x1="698" y1="275" x2="755" y2="300" stroke="#374151" stroke-width="1.5"/>
    <text x="760" y="298" font-weight="bold" fill="#b45309">Липидная</text>
    <text x="760" y="316" font-weight="bold" fill="#b45309">оболочка</text>
    <text x="760" y="333" font-size="13" fill="#4b5563">кусочек мембраны</text>
    <text x="760" y="349" font-size="13" fill="#4b5563">клетки-хозяина</text>
