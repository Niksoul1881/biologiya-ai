  <text x="220" y="94" font-size="15" text-anchor="middle" fill="#4b5563">простой вирус-палочка</text>
  <g transform="translate(60,130)">
    <!-- капсомеры: ряды -->
    <g fill="#bbf7d0" stroke="#15803d" stroke-width="1.5">
      <rect x="0" y="0" width="26" height="22" rx="5"/><rect x="26" y="0" width="26" height="22" rx="5"/><rect x="52" y="0" width="26" height="22" rx="5"/><rect x="78" y="0" width="26" height="22" rx="5"/><rect x="104" y="0" width="26" height="22" rx="5"/><rect x="130" y="0" width="26" height="22" rx="5"/><rect x="156" y="0" width="26" height="22" rx="5"/><rect x="182" y="0" width="26" height="22" rx="5"/><rect x="208" y="0" width="26" height="22" rx="5"/><rect x="234" y="0" width="26" height="22" rx="5"/><rect x="260" y="0" width="26" height="22" rx="5"/><rect x="286" y="0" width="26" height="22" rx="5"/>
      <rect x="0" y="78" width="26" height="22" rx="5"/><rect x="26" y="78" width="26" height="22" rx="5"/><rect x="52" y="78" width="26" height="22" rx="5"/><rect x="78" y="78" width="26" height="22" rx="5"/><rect x="104" y="78" width="26" height="22" rx="5"/><rect x="130" y="78" width="26" height="22" rx="5"/><rect x="156" y="78" width="26" height="22" rx="5"/><rect x="182" y="78" width="26" height="22" rx="5"/><rect x="208" y="78" width="26" height="22" rx="5"/><rect x="234" y="78" width="26" height="22" rx="5"/><rect x="260" y="78" width="26" height="22" rx="5"/><rect x="286" y="78" width="26" height="22" rx="5"/>
    </g>
    <rect x="0" y="22" width="312" height="56" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <path d="M0,50 C13,25 26,75 39,50 C52,25 65,75 78,50 C91,25 104,75 117,50 C130,25 143,75 156,50 C169,25 182,75 195,50 C208,25 221,75 234,50 C247,25 260,75 273,50 C286,25 299,75 312,50" fill="none" stroke="#7c3aed" stroke-width="4"/>
  </g>
  <g font-size="16" fill="#1f2937">
    <line x1="140" y1="141" x2="120" y2="280" stroke="#374151" stroke-width="1.5"/>
    <line x1="150" y1="180" x2="230" y2="280" stroke="#374151" stroke-width="1.5"/>
    <text x="60" y="300" font-weight="bold">Капсид</text>
    <text x="60" y="320" font-size="14" fill="#4b5563">одинаковые белки,</text>
    <text x="60" y="338" font-size="14" fill="#4b5563">уложенные по спирали</text>
    <text x="230" y="300" font-weight="bold" fill="#6d28d9">РНК</text>
    <text x="230" y="320" font-size="14" fill="#4b5563">«инструкция» вируса</text>
