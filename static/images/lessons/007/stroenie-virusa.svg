    <line x1="630" y1="255" x2="600" y2="410" stroke="#374151" stroke-width="1.5"/>
    <text x="560" y="428" font-weight="bold" fill="#6d28d9">РНК</text>
  </g>
  <text x="650" y="455" font-size="14" text-anchor="middle" fill="#4b5563">диаметр около 100 нм</text>
