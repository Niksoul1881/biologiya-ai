<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Строение бактериофага</text>
  <!-- головка: шестиугольник -->
  <polygon points="300,70 370,110 370,190 300,230 230,190 230,110" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/>
  <path d="M255,130 C275,110 295,150 315,125 C335,100 345,150 330,170 C315,190 285,160 270,185 C260,200 250,170 255,150 C262,140 280,145 290,160" fill="none" stroke="#dc2626" stroke-width="4"/>
  <!-- воротничок -->
  <rect x="280" y="230" width="40" height="14" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
  <!-- хвост: чехол и трубка -->
  <rect x="284" y="244" width="32" height="150" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/>
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="284" y1="264" x2="316" y2="264"/><line x1="284" y1="284" x2="316" y2="284"/><line x1="284" y1="304" x2="316" y2="304"/>
    <line x1="284" y1="324" x2="316" y2="324"/><line x1="284" y1="344" x2="316" y2="344"/><line x1="284" y1="364" x2="316" y2="364"/>
  </g>
  <rect x="296" y="244" width="8" height="150" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- базальная пластинка -->
  <polygon points="262,394 338,394 326,414 274,414" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
  <!-- хвостовые нити -->
  <g fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round">
    <path d="M272,412 L215,450 L245,520"/><path d="M285,414 L255,465 L280,525"/>
    <path d="M328,412 L385,450 L355,520"/><path d="M315,414 L345,465 L320,525"/>
  </g>
  <!-- стенка бактерии -->
  <rect x="120" y="525" width="360" height="40" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="300" y="551" font-size="16" text-anchor="middle" fill="#92400e">клеточная стенка бактерии</text>

  <!-- подписи -->
  <g font-size="18" fill="#1f2937">
    <line x1="370" y1="115" x2="520" y2="90" stroke="#374151" stroke-width="2"/>
    <text x="528" y="95" font-weight="bold">Головка</text>
    <text x="528" y="115" font-size="15" fill="#4b5563">белковый капсид в форме многогранника</text>
    <line x1="330" y1="160" x2="520" y2="160" stroke="#374151" stroke-width="2"/>
    <text x="528" y="165" font-weight="bold">ДНК вируса</text>
    <text x="528" y="185" font-size="15" fill="#4b5563">плотно уложена внутри головки</text>
    <line x1="320" y1="237" x2="520" y2="235" stroke="#374151" stroke-width="2"/>
    <text x="528" y="240" font-weight="bold">Воротничок</text>
    <line x1="316" y1="310" x2="520" y2="300" stroke="#374151" stroke-width="2"/>
    <text x="528" y="305" font-weight="bold">Хвостовой отросток</text>
    <text x="528" y="325" font-size="15" fill="#4b5563">полая трубка в сократимом чехле —</text>
    <text x="528" y="343" font-size="15" fill="#4b5563">по ней ДНК уходит в бактерию</text>
    <line x1="338" y1="403" x2="520" y2="395" stroke="#374151" stroke-width="2"/>
    <text x="528" y="400" font-weight="bold">Базальная пластинка</text>
    <line x1="372" y1="460" x2="520" y2="460" stroke="#374151" stroke-width="2"/>
    <text x="528" y="465" font-weight="bold">Хвостовые нити</text>
    <text x="528" y="485" font-size="15" fill="#4b5563">узнают бактерию и цепляются к ней</text>
  </g>
  <text x="700" y="575" font-size="14" text-anchor="middle" fill="#6b7280">Длина такого фага — около 0,2 мкм</text>
</svg>
