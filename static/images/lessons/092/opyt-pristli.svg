<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="450" y="32" font-size="23" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Опыт Джозефа Пристли (1771)</text>

  <!-- Колпак 1 -->
  <g>
    <path d="M 90 360 L 90 150 Q 90 80 190 80 Q 290 80 290 150 L 290 360" fill="#eef6fb" stroke="#6a8fa8" stroke-width="4"/>
    <rect x="60" y="360" width="260" height="14" rx="4" fill="#9a7b56"/>
    <!-- мышь -->
    <ellipse cx="160" cy="342" rx="34" ry="17" fill="#9c9c9c"/>
    <circle cx="128" cy="332" r="9" fill="#9c9c9c"/>
    <circle cx="124" cy="324" r="5" fill="#c9a0a0"/>
    <circle cx="122" cy="333" r="2" fill="#222"/>
    <path d="M 194 345 Q 220 352 230 340" stroke="#9c9c9c" stroke-width="3" fill="none"/>
    <!-- свеча погасла -->
    <rect x="240" y="300" width="18" height="58" fill="#f3e2b3" stroke="#b49a5a" stroke-width="2"/>
    <line x1="249" y1="300" x2="249" y2="290" stroke="#333" stroke-width="2"/>
    <path d="M 249 286 q -8 -12 0 -22 q 8 -10 0 -22" stroke="#999" stroke-width="2" fill="none"/>
    <text x="190" y="408" font-size="17" font-weight="bold" text-anchor="middle" fill="#c0392b">Без растения</text>
    <text x="190" y="430" font-size="15" text-anchor="middle" fill="#333">свеча гаснет, мышь задыхается</text>
  </g>

  <!-- Колпак 2 -->
  <g>
    <path d="M 560 360 L 560 150 Q 560 80 660 80 Q 760 80 760 150 L 760 360" fill="#eef6fb" stroke="#6a8fa8" stroke-width="4"/>
    <rect x="530" y="360" width="260" height="14" rx="4" fill="#9a7b56"/>
    <!-- мята -->
    <rect x="590" y="330" width="44" height="30" fill="#b5651d"/>
    <line x1="612" y1="330" x2="612" y2="200" stroke="#2e7d32" stroke-width="4"/>
    <ellipse cx="594" cy="300" rx="20" ry="9" fill="#43a047" transform="rotate(-25 594 300)"/>
    <ellipse cx="630" cy="300" rx="20" ry="9" fill="#43a047" transform="rotate(25 630 300)"/>
    <ellipse cx="594" cy="262" rx="18" ry="8" fill="#43a047" transform="rotate(-25 594 262)"/>
    <ellipse cx="630" cy="262" rx="18" ry="8" fill="#43a047" transform="rotate(25 630 262)"/>
    <ellipse cx="596" cy="226" rx="15" ry="7" fill="#43a047" transform="rotate(-25 596 226)"/>
    <ellipse cx="628" cy="226" rx="15" ry="7" fill="#43a047" transform="rotate(25 628 226)"/>
    <!-- свеча горит -->
    <rect x="700" y="300" width="18" height="58" fill="#f3e2b3" stroke="#b49a5a" stroke-width="2"/>
    <line x1="709" y1="300" x2="709" y2="290" stroke="#333" stroke-width="2"/>
    <path d="M 709 262 Q 698 280 709 292 Q 720 280 709 262 z" fill="#ffb300" stroke="#e65100" stroke-width="1.5"/>
    <!-- O2 -->
    <text x="660" y="160" font-size="18" font-weight="bold" fill="#c0392b">O₂</text>
    <path d="M 640 175 L 690 255" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="660" y="408" font-size="17" font-weight="bold" text-anchor="middle" fill="#1b7a3a">С растением на свету</text>
    <text x="660" y="430" font-size="15" text-anchor="middle" fill="#333">через несколько дней свеча снова горит</text>
  </g>

  <!-- солнце -->
  <circle cx="440" cy="120" r="30" fill="#ffd21f" stroke="#e0a800" stroke-width="2"/>
  <g stroke="#e0a800" stroke-width="3">
    <line x1="440" y1="75" x2="440" y2="62"/><line x1="440" y1="165" x2="440" y2="178"/>
    <line x1="395" y1="120" x2="382" y2="120"/><line x1="485" y1="120" x2="498" y2="120"/>
    <line x1="408" y1="88" x2="399" y2="79"/><line x1="472" y1="152" x2="481" y2="161"/>
    <line x1="472" y1="88" x2="481" y2="79"/><line x1="408" y1="152" x2="399" y2="161"/>
  </g>
  <path d="M 490 170 L 548 210" stroke="#e0a800" stroke-width="3"/>
  <path d="M 548 210 l -14 -2 l 7 -10 z" fill="#e0a800"/>
  <text x="440" y="235" font-size="15" text-anchor="middle" fill="#555">свет</text>
  <text x="440" y="300" font-size="15" text-anchor="middle" fill="#555">растение «исправляет»</text>
  <text x="440" y="320" font-size="15" text-anchor="middle" fill="#555">испорченный воздух</text>
</svg>
