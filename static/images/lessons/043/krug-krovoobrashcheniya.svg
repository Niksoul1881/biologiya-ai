<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
</defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="38" font-size="26" font-weight="bold" fill="#1f2937" text-anchor="middle">Кровообращение рыбы: один круг</text>
<!-- жабры -->
<rect x="150" y="80" width="240" height="90" rx="18" fill="url(#g)" stroke="#475569" stroke-width="3"/>
<text x="270" y="118" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Жабры</text>
<text x="270" y="146" font-size="17" fill="#1f2937" text-anchor="middle">кровь получает O₂</text>
<!-- органы -->
<rect x="640" y="230" width="270" height="110" rx="18" fill="url(#g)" stroke="#475569" stroke-width="3" transform="rotate(180 775 285)"/>
<text x="775" y="275" font-size="22" font-weight="bold" fill="#1f2937" text-anchor="middle">Органы тела</text>
<text x="775" y="303" font-size="17" fill="#1f2937" text-anchor="middle">кровь отдаёт O₂</text>
<!-- сердце -->
<rect x="130" y="380" width="140" height="90" rx="20" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="3"/>
<text x="200" y="420" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Предсердие</text>
<rect x="280" y="380" width="140" height="90" rx="20" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
<text x="350" y="420" font-size="19" font-weight="bold" fill="#0b1f4d" text-anchor="middle">Желудочек</text>
<text x="275" y="368" font-size="19" fill="#1e3a8a" text-anchor="middle" font-weight="bold">Сердце — 2 камеры</text>
<path d="M262 425 L284 425" stroke="#1e3a8a" stroke-width="4" marker-end="url(#ab)"/>
<!-- пути -->
<path d="M420 410 C 520 400, 470 200, 360 172" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#ab)"/>
<text x="490" y="330" font-size="17" fill="#2563eb">венозная кровь</text>
<text x="490" y="352" font-size="17" fill="#2563eb">к жабрам</text>
<path d="M390 115 C 600 90, 760 130, 775 222" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#ar)"/>
<text x="560" y="88" font-size="17" fill="#dc2626">артериальная кровь — к органам (спинная аорта)</text>
<path d="M775 342 C 770 500, 300 510, 205 476" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#ab)"/>
<text x="500" y="404" font-size="17" fill="#2563eb">венозная кровь</text><text x="500" y="426" font-size="17" fill="#2563eb">возвращается в сердце</text>
<!-- легенда -->
<rect x="40" y="520" width="18" height="18" fill="#dc2626"/><text x="64" y="535" font-size="16" fill="#1f2937">артериальная (много O₂)</text>
<rect x="290" y="520" width="18" height="18" fill="#2563eb"/><text x="314" y="535" font-size="16" fill="#1f2937">венозная (мало O₂)</text>
<text x="960" y="535" font-size="16" fill="#1f2937" text-anchor="end">Через сердце рыбы идёт только венозная кровь</text>
</svg>
