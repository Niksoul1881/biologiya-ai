<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs>
<text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Генная инженерия: как бактерия начинает делать инсулин</text>
<rect x="20" y="60" width="300" height="230" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<circle cx="45" cy="88" r="15" fill="#0F766E"/>
<text x="45" y="94" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="185" y="94" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Вырезают нужный ген</text>
<line x1="40" y1="150" x2="300" y2="150" stroke="#9CA3AF" stroke-width="6"/>
<line x1="130" y1="150" x2="210" y2="150" stroke="#DC2626" stroke-width="6"/>
<line x1="40" y1="164" x2="300" y2="164" stroke="#9CA3AF" stroke-width="6"/>
<line x1="130" y1="164" x2="210" y2="164" stroke="#DC2626" stroke-width="6"/>
<line x1="130" y1="132" x2="130" y2="182" stroke="#111827" stroke-width="2" stroke-dasharray="4,3"/>
<line x1="210" y1="132" x2="210" y2="182" stroke="#111827" stroke-width="2" stroke-dasharray="4,3"/>
<text x="170" y="135" font-size="14" fill="#DC2626" text-anchor="middle">ген инсулина</text>
<text x="170" y="210" font-size="14" fill="#374151" text-anchor="middle">ДНК клетки человека</text>
<text x="170" y="240" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">✂ фермент рестриктаза</text>
<text x="170" y="262" font-size="13" fill="#6B7280" text-anchor="middle">режет ДНК в определённых местах</text>
<rect x="350" y="60" width="300" height="230" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<circle cx="375" cy="88" r="15" fill="#0F766E"/>
<text x="375" y="94" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="515" y="94" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Разрезают плазмиду</text>
<path d="M517.8,121.1 A52,52 0 1 1 482.2,121.1" fill="none" stroke="#2563EB" stroke-width="9" stroke-linecap="butt"/>
<text x="500" y="175" font-size="14" fill="#2563EB" text-anchor="middle">плазмида</text>
<text x="500" y="250" font-size="13" fill="#6B7280" text-anchor="middle">кольцевая ДНК бактерии,</text>
<text x="500" y="268" font-size="13" fill="#6B7280" text-anchor="middle">та же рестриктаза</text>
<rect x="680" y="60" width="300" height="230" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<circle cx="705" cy="88" r="15" fill="#0F766E"/>
<text x="705" y="94" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="845" y="94" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Сшивают</text>
<circle cx="830" cy="170" r="52" fill="none" stroke="#2563EB" stroke-width="9"/>
<path d="M812.2,121.1 A52,52 0 0 1 847.8,121.1" fill="none" stroke="#DC2626" stroke-width="11"/>
<text x="830" y="168" font-size="13" fill="#111827" text-anchor="middle">рекомбинантная</text>
<text x="830" y="184" font-size="13" fill="#111827" text-anchor="middle">плазмида</text>
<text x="830" y="250" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">фермент ДНК-лигаза</text>
<text x="830" y="268" font-size="13" fill="#6B7280" text-anchor="middle">вшивает ген в плазмиду</text>
<path d="M322,175 L346,175" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>
<path d="M652,175 L676,175" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>
<path d="M830,292 C830,322 640,318 600,338" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<rect x="350" y="340" width="300" height="230" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<circle cx="375" cy="368" r="15" fill="#0F766E"/>
<text x="375" y="374" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="515" y="374" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Вводят в бактерию</text>
<rect x="410" y="400" width="180" height="90" rx="45" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
<path d="M440,450 q20,-25 40,0 t40,0 t40,0" fill="none" stroke="#9CA3AF" stroke-width="4"/>
<circle cx="545" cy="430" r="14" fill="none" stroke="#2563EB" stroke-width="9"/>
<path d="M540.2,416.8 A14,14 0 0 1 549.8,416.8" fill="none" stroke="#DC2626" stroke-width="11"/>
<text x="500" y="525" font-size="13" fill="#6B7280" text-anchor="middle">трансформация: бактерия</text>
<text x="500" y="543" font-size="13" fill="#6B7280" text-anchor="middle">поглощает плазмиду</text>
<path d="M652,455 L676,455" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/>
<rect x="680" y="340" width="300" height="230" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
<circle cx="705" cy="368" r="15" fill="#0F766E"/>
<text x="705" y="374" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="850" y="374" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">Бактерии делают инсулин</text>
<rect x="730" y="410" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="770" cy="424" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<rect x="800" y="420" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="840" cy="434" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<rect x="870" y="405" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="910" cy="419" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<rect x="745" y="470" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="785" cy="484" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<rect x="820" y="480" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="860" cy="494" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<rect x="895" y="465" width="56" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<circle cx="935" cy="479" r="5" fill="none" stroke="#DC2626" stroke-width="3"/>
<circle cx="777" cy="460" r="3.5" fill="#16A34A"/>
<circle cx="809" cy="466" r="3.5" fill="#16A34A"/>
<circle cx="870" cy="407" r="3.5" fill="#16A34A"/>
<circle cx="723" cy="492" r="3.5" fill="#16A34A"/>
<circle cx="782" cy="426" r="3.5" fill="#16A34A"/>
<circle cx="959" cy="452" r="3.5" fill="#16A34A"/>
<circle cx="921" cy="452" r="3.5" fill="#16A34A"/>
<circle cx="873" cy="417" r="3.5" fill="#16A34A"/>
<circle cx="872" cy="495" r="3.5" fill="#16A34A"/>
<circle cx="846" cy="482" r="3.5" fill="#16A34A"/>
<circle cx="881" cy="407" r="3.5" fill="#16A34A"/>
<circle cx="902" cy="465" r="3.5" fill="#16A34A"/>
<circle cx="792" cy="403" r="3.5" fill="#16A34A"/>
<circle cx="928" cy="452" r="3.5" fill="#16A34A"/>
<text x="830" y="535" font-size="13" fill="#6B7280" text-anchor="middle">бактерии делятся, ген копируется,</text>
<text x="830" y="553" font-size="13" fill="#16A34A" text-anchor="middle">● — молекулы инсулина</text>
<rect x="20" y="340" width="300" height="230" rx="14" fill="#ffffff" stroke="#E5E7EB"/>
<text x="40" y="372" font-size="15" fill="#111827" text-anchor="start" font-weight="bold">Обозначения</text>
<line x1="40" y1="400" x2="90" y2="400" stroke="#DC2626" stroke-width="8"/>
<text x="100" y="405" font-size="14" fill="#374151" text-anchor="start">ген человека</text>
<line x1="40" y1="430" x2="90" y2="430" stroke="#2563EB" stroke-width="8"/>
<text x="100" y="435" font-size="14" fill="#374151" text-anchor="start">ДНК плазмиды</text>
<line x1="40" y1="460" x2="90" y2="460" stroke="#9CA3AF" stroke-width="8"/>
<text x="100" y="465" font-size="14" fill="#374151" text-anchor="start">ДНК клетки</text>
<rect x="40" y="480" width="50" height="26" rx="13" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="100" y="498" font-size="14" fill="#374151" text-anchor="start">бактерия</text>
<text x="40" y="540" font-size="13" fill="#6B7280" text-anchor="start">Так с 1982 года получают</text>
<text x="40" y="558" font-size="13" fill="#6B7280" text-anchor="start">человеческий инсулин</text>
</svg>