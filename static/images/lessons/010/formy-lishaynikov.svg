<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Три формы лишайников</text>
  <!-- накипной -->
  <text x="150" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#92400e">Накипной</text>
  <path d="M30,300 C40,250 80,230 150,228 C220,230 260,250 270,300 z" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
  <path d="M70,262 C90,248 120,244 150,246 C190,248 215,256 230,268 C200,262 180,272 150,268 C120,264 100,272 70,262 z" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/>
  <g fill="#1f2937"><circle cx="110" cy="257" r="3"/><circle cx="170" cy="258" r="3"/><circle cx="205" cy="262" r="3"/></g>
  <text x="150" y="330" font-size="15" text-anchor="middle" fill="#1f2937">корочка на камне или коре,</text>
  <text x="150" y="350" font-size="15" text-anchor="middle" fill="#1f2937">отделить нельзя</text>
  <text x="150" y="385" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">леканора, графис, ризокарпон</text>
  <!-- листоватый -->
  <text x="450" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#c2410c">Листоватый</text>
  <rect x="330" y="260" width="240" height="40" fill="#92400e"/>
  <path d="M360,262 C350,240 370,225 390,232 C395,210 425,205 440,222 C455,205 485,208 490,228 C510,222 535,235 530,255 C545,262 540,270 530,262 L360,262 z" fill="#fb923c" stroke="#c2410c" stroke-width="3"/>
  <g fill="#ea580c" stroke="#9a3412" stroke-width="1.5"><circle cx="420" cy="240" r="7"/><circle cx="460" cy="236" r="6"/><circle cx="495" cy="248" r="6"/></g>
  <g stroke="#44403c" stroke-width="2"><line x1="390" y1="262" x2="390" y2="272"/><line x1="440" y1="262" x2="440" y2="272"/><line x1="490" y1="262" x2="490" y2="272"/></g>
  <text x="450" y="330" font-size="15" text-anchor="middle" fill="#1f2937">пластинка, прикреплена</text>
  <text x="450" y="350" font-size="15" text-anchor="middle" fill="#1f2937">ризинами, можно отделить</text>
  <text x="450" y="385" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">ксантория, пармелия</text>
  <!-- кустистый -->
  <text x="750" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="#3f6212">Кустистый</text>
  <rect x="630" y="285" width="240" height="18" fill="#a16207"/>
  <g stroke="#a3a3a3" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M720,285 L715,230 L695,190 M715,230 L735,195 M695,190 L680,160 M695,190 L705,155 M735,195 L728,160 M735,195 L752,165"/>
    <path d="M770,285 L775,225 L760,185 M775,225 L795,190 M760,185 L748,150 M760,185 L770,152 M795,190 L790,155 M795,190 L812,160"/>
    <path d="M745,285 L745,245 L735,215 M745,245 L755,215"/>
  </g>
  <g stroke="#e5e5e5" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M720,285 L715,230 L695,190 M715,230 L735,195 M770,285 L775,225 L760,185 M775,225 L795,190"/>
  </g>
  <text x="750" y="330" font-size="15" text-anchor="middle" fill="#1f2937">кустик или «борода»,</text>
  <text x="750" y="350" font-size="15" text-anchor="middle" fill="#1f2937">прикреплён у основания</text>
  <text x="750" y="385" font-size="15" font-weight="bold" text-anchor="middle" fill="#3f6212">ягель, уснея, цетрария</text>
  <!-- шкала чувствительности -->
  <text x="450" y="412" font-size="14" text-anchor="middle" fill="#6b7280">← выносливее к загрязнению воздуха · · · чувствительнее →</text>
</svg>
