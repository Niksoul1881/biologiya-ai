<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Разрез листоватого лишайника</text>
  <!-- верхний коровой слой -->
  <rect x="40" y="70" width="520" height="55" fill="#a8a29e"/>
  <g stroke="#57534e" stroke-width="3" fill="none">
    <path d="M40,80 C90,70 140,90 190,80 C240,70 290,90 340,80 C390,70 440,90 490,80 C520,74 540,82 560,80"/>
    <path d="M40,97 C90,87 140,107 190,97 C240,87 290,107 340,97 C390,87 440,107 490,97 C520,91 540,99 560,97"/>
    <path d="M40,114 C90,104 140,124 190,114 C240,104 290,124 340,114 C390,104 440,124 490,114 C520,108 540,116 560,114"/>
  </g>
  <!-- слой водорослей -->
  <rect x="40" y="125" width="520" height="65" fill="#f5f5f4"/>
  <g stroke="#78716c" stroke-width="2" fill="none">
    <path d="M60,125 C70,150 50,170 70,190 M130,125 C140,150 120,170 140,190 M200,125 C210,150 190,170 210,190 M270,125 C280,150 260,170 280,190 M340,125 C350,150 330,170 350,190 M410,125 C420,150 400,170 420,190 M480,125 C490,150 470,170 490,190 M545,125 C555,150 535,170 555,190"/>
  </g>
  <g fill="#4ade80" stroke="#15803d" stroke-width="2">
    <circle cx="85" cy="145" r="10"/><circle cx="105" cy="170" r="10"/><circle cx="160" cy="150" r="10"/><circle cx="178" cy="175" r="9"/><circle cx="230" cy="143" r="10"/><circle cx="245" cy="170" r="10"/>
    <circle cx="300" cy="150" r="10"/><circle cx="318" cy="174" r="9"/><circle cx="372" cy="145" r="10"/><circle cx="388" cy="170" r="10"/><circle cx="445" cy="150" r="10"/><circle cx="458" cy="176" r="9"/><circle cx="515" cy="146" r="10"/><circle cx="525" cy="172" r="9"/>
  </g>
  <!-- сердцевина -->
  <rect x="40" y="190" width="520" height="130" fill="#fafaf9"/>
  <g stroke="#a8a29e" stroke-width="2" fill="none">
    <path d="M40,210 C100,250 150,200 220,240 C280,275 330,215 400,250 C460,280 500,225 560,250"/>
    <path d="M40,280 C110,240 170,300 240,265 C300,235 360,300 430,270 C480,250 520,300 560,290"/>
    <path d="M90,190 C110,240 70,280 100,320 M190,190 C170,250 230,280 200,320 M300,190 C330,240 280,270 310,320 M410,190 C380,240 440,280 420,320 M510,190 C540,250 490,280 520,320"/>
  </g>
  <!-- нижний коровой слой -->
  <rect x="40" y="320" width="520" height="35" fill="#a8a29e"/>
  <g stroke="#57534e" stroke-width="3" fill="none">
    <path d="M40,330 C90,320 140,340 190,330 C240,320 290,340 340,330 C390,320 440,340 490,330 C520,324 540,332 560,330"/>
    <path d="M40,345 C90,335 140,355 190,345 C240,335 290,355 340,345 C390,335 440,355 490,345 C520,339 540,347 560,345"/>
  </g>
  <!-- ризины -->
  <g stroke="#44403c" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M110,355 L105,395 M105,385 L95,400 M105,385 L118,400"/>
    <path d="M290,355 L295,395 M295,385 L283,400 M295,385 L307,400"/>
    <path d="M470,355 L465,395 M465,385 L453,400 M465,385 L477,400"/>
  </g>
  <!-- кора дерева -->
  <rect x="20" y="398" width="560" height="40" fill="#92400e"/>
  <text x="300" y="424" font-size="15" text-anchor="middle" fill="#fef3c7">кора дерева (опора)</text>
  <!-- подписи -->
  <g font-size="17" fill="#1f2937">
    <line x1="560" y1="97" x2="600" y2="97" stroke="#374151" stroke-width="2"/>
    <text x="608" y="93" font-weight="bold">Верхний коровой слой</text>
    <text x="608" y="112" font-size="14" fill="#4b5563">плотные гифы гриба — «крыша»</text>
    <line x1="560" y1="160" x2="600" y2="160" stroke="#374151" stroke-width="2"/>
    <text x="608" y="156" font-weight="bold" fill="#15803d">Слой водорослей</text>
    <text x="608" y="175" font-size="14" fill="#4b5563">клетки водоросли, оплетённые гифами</text>
    <line x1="560" y1="255" x2="600" y2="255" stroke="#374151" stroke-width="2"/>
    <text x="608" y="251" font-weight="bold">Сердцевина</text>
    <text x="608" y="270" font-size="14" fill="#4b5563">рыхлые гифы, воздух и запас воды</text>
    <line x1="560" y1="338" x2="600" y2="338" stroke="#374151" stroke-width="2"/>
    <text x="608" y="334" font-weight="bold">Нижний коровой слой</text>
    <line x1="480" y1="390" x2="600" y2="385" stroke="#374151" stroke-width="2"/>
    <text x="608" y="385" font-weight="bold">Ризины</text>
    <text x="608" y="404" font-size="14" fill="#4b5563">пучки гиф — прикрепляют,</text>
    <text x="608" y="421" font-size="14" fill="#4b5563">но не всасывают воду (не корни!)</text>
  </g>
</svg>
