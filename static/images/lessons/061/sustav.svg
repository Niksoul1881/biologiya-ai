<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Строение сустава</text>
  <!-- upper bone with head -->
  <path d="M390,60 L510,60 L510,180 C560,195 580,240 560,270 C540,298 360,298 340,270 C320,240 340,195 390,180 z" fill="#FDE68A" stroke="#B45309" stroke-width="3"/>
  <!-- lower bone with socket -->
  <path d="M330,330 C360,300 540,300 570,330 L570,345 C540,330 360,330 330,345 z" fill="#FDE68A" stroke="#B45309" stroke-width="0"/>
  <path d="M320,520 L320,320 C350,300 400,312 450,312 C500,312 550,300 580,320 L580,520 z" fill="#FDE68A" stroke="#B45309" stroke-width="3"/>
  <!-- cartilage -->
  <path d="M345,268 C370,296 530,296 555,268 C552,280 540,290 525,294 C480,305 420,305 375,294 C360,290 348,280 345,268 z" fill="#93C5FD" stroke="#1D4ED8" stroke-width="2"/>
  <path d="M322,322 C350,304 400,316 450,316 C500,316 550,304 578,322 L578,334 C550,318 500,330 450,330 C400,330 350,318 322,334 z" fill="#93C5FD" stroke="#1D4ED8" stroke-width="2"/>
  <!-- cavity with fluid -->
  <path d="M375,296 C420,307 480,307 525,296 C545,300 560,308 575,320 C550,304 500,316 450,316 C400,316 350,304 325,320 C340,308 355,300 375,296 z" fill="#BAE6FD"/>
  <!-- capsule -->
  <path d="M300,200 C270,260 270,330 300,400" fill="none" stroke="#7C3AED" stroke-width="7"/>
  <path d="M600,200 C630,260 630,330 600,400" fill="none" stroke="#7C3AED" stroke-width="7"/>
  <!-- ligament -->
  <rect x="595" y="230" width="22" height="150" rx="8" fill="#F9A8D4" stroke="#9D174D" stroke-width="2"/>
  <!-- spongy texture -->
  <g fill="#D97706" opacity="0.35"><circle cx="420" cy="230" r="6"/><circle cx="470" cy="245" r="5"/><circle cx="440" cy="260" r="4"/><circle cx="500" cy="225" r="5"/><circle cx="400" cy="360" r="6"/><circle cx="460" cy="380" r="5"/><circle cx="520" cy="355" r="5"/></g>
  <g font-size="17" fill="#1F2937">
    <line x1="450" y1="120" x2="680" y2="90" stroke="#374151" stroke-width="1.5"/><text x="685" y="95" font-weight="bold">суставная головка</text>
    <line x1="520" y1="345" x2="680" y2="480" stroke="#374151" stroke-width="1.5"/><text x="685" y="485" font-weight="bold">суставная впадина</text>
    <line x1="520" y1="285" x2="680" y2="180" stroke="#1D4ED8" stroke-width="1.5"/><text x="685" y="175" font-weight="bold" fill="#1D4ED8">суставной хрящ</text><text x="685" y="195" font-size="14" fill="#374151">гладкий, уменьшает трение</text>
    <line x1="560" y1="314" x2="680" y2="300" stroke="#0369A1" stroke-width="1.5"/><text x="685" y="295" font-weight="bold" fill="#0369A1">суставная полость</text><text x="685" y="315" font-size="14" fill="#374151">с синовиальной жидкостью — «смазкой»</text>
    <line x1="606" y1="360" x2="680" y2="400" stroke="#9D174D" stroke-width="1.5"/><text x="685" y="400" font-weight="bold" fill="#9D174D">связка</text><text x="685" y="420" font-size="14" fill="#374151">укрепляет сустав</text>
    <line x1="285" y1="300" x2="200" y2="300" stroke="#7C3AED" stroke-width="1.5"/><text x="30" y="290" font-weight="bold" fill="#7C3AED">суставная сумка</text><text x="30" y="310" font-size="14" fill="#374151">(капсула) — замыкает</text><text x="30" y="328" font-size="14" fill="#374151">полость сустава</text>
  </g>
</svg>
