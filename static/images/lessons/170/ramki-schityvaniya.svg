<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">Три рамки считывания одной мРНК</text>
  <!-- последовательность: 18 нуклеотидов, шаг 40 px, начало x=110 -->
  <text x="40" y="92" font-size="15" font-weight="bold" fill="#333">мРНК</text>
  <g font-family="Consolas, monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="130" y="94">A</text><text x="170" y="94">U</text><text x="210" y="94">G</text><text x="250" y="94">G</text><text x="290" y="94">C</text><text x="330" y="94">C</text><text x="370" y="94">A</text><text x="410" y="94">U</text><text x="450" y="94">U</text><text x="490" y="94">G</text><text x="530" y="94">U</text><text x="570" y="94">A</text><text x="610" y="94">A</text><text x="650" y="94">U</text><text x="690" y="94">G</text><text x="730" y="94">G</text><text x="770" y="94">G</text><text x="810" y="94">C</text>
  </g>
  <!-- рамка 1 -->
  <text x="40" y="150" font-size="15" font-weight="bold" fill="#1d4f86">рамка 1</text>
  <g fill="#eef6fb" stroke="#1d4f86" stroke-width="2">
    <rect x="112" y="118" width="116" height="30" rx="6"/><rect x="232" y="118" width="116" height="30" rx="6"/><rect x="352" y="118" width="116" height="30" rx="6"/><rect x="472" y="118" width="116" height="30" rx="6"/><rect x="592" y="118" width="116" height="30" rx="6"/><rect x="712" y="118" width="116" height="30" rx="6"/>
  </g>
  <g font-family="Consolas, monospace" font-size="17" text-anchor="middle" fill="#1d4f86">
    <text x="170" y="139">AUG</text><text x="290" y="139">GCC</text><text x="410" y="139">AUU</text><text x="530" y="139">GUA</text><text x="650" y="139">AUG</text><text x="770" y="139">GGC</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4f86">
    <text x="170" y="170">Met</text><text x="290" y="170">Ala</text><text x="410" y="170">Ile</text><text x="530" y="170">Val</text><text x="650" y="170">Met</text><text x="770" y="170">Gly</text>
  </g>
  <!-- рамка 2 -->
  <text x="40" y="226" font-size="15" font-weight="bold" fill="#7a3fa0">рамка 2</text>
  <g fill="#f6effa" stroke="#7a3fa0" stroke-width="2">
    <rect x="152" y="194" width="116" height="30" rx="6"/><rect x="272" y="194" width="116" height="30" rx="6"/><rect x="392" y="194" width="116" height="30" rx="6"/><rect x="512" y="194" width="116" height="30" rx="6"/><rect x="632" y="194" width="116" height="30" rx="6"/>
  </g>
  <g font-family="Consolas, monospace" font-size="17" text-anchor="middle" fill="#7a3fa0">
    <text x="210" y="215">UGG</text><text x="330" y="215">CCA</text><text x="450" y="215">UUG</text><text x="570" y="215">UAA</text><text x="690" y="215">UGG</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#7a3fa0">
    <text x="210" y="246">Trp</text><text x="330" y="246">Pro</text><text x="450" y="246">Leu</text><text x="570" y="246" fill="#a02020">СТОП</text><text x="690" y="246">Trp</text>
  </g>
  <!-- рамка 3 -->
  <text x="40" y="302" font-size="15" font-weight="bold" fill="#1b7a3a">рамка 3</text>
  <g fill="#e3f4e0" stroke="#1b7a3a" stroke-width="2">
    <rect x="192" y="270" width="116" height="30" rx="6"/><rect x="312" y="270" width="116" height="30" rx="6"/><rect x="432" y="270" width="116" height="30" rx="6"/><rect x="552" y="270" width="116" height="30" rx="6"/><rect x="672" y="270" width="116" height="30" rx="6"/>
  </g>
  <g font-family="Consolas, monospace" font-size="17" text-anchor="middle" fill="#1b7a3a">
    <text x="250" y="291">GGC</text><text x="370" y="291">CAU</text><text x="490" y="291">UGU</text><text x="610" y="291">AAU</text><text x="730" y="291">GGG</text>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#1b7a3a">
    <text x="250" y="322">Gly</text><text x="370" y="322">His</text><text x="490" y="322">Cys</text><text x="610" y="322">Asn</text><text x="730" y="322">Gly</text>
  </g>
  <!-- вывод -->
  <rect x="40" y="350" width="820" height="100" rx="12" fill="#fafafa" stroke="#ccc" stroke-width="2"/>
  <text x="60" y="380" font-size="15" fill="#333">Одна и та же строка — три совершенно разных «текста». Рибосома выбирает рамку по стартовому кодону AUG.</text>
  <text x="60" y="406" font-size="15" fill="#333">Если удалить один нуклеотид (C в позиции 5), рамка 1 сдвинется:</text>
  <text x="60" y="432" font-size="16" font-family="Consolas, monospace" fill="#a02020">AUG GCA UUG UAA … → Met Ala Leu СТОП — белок обрывается</text>
</svg>
