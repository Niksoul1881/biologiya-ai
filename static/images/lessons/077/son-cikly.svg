<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f766e">Как устроена ночь: циклы сна</text>
  <!-- Оси -->
  <g font-size="15" fill="#374151" text-anchor="end">
    <text x="150" y="88">Бодрствование</text>
    <text x="150" y="138" fill="#7c3aed" font-weight="bold">Быстрый сон</text>
    <text x="150" y="188">Дремота</text>
    <text x="150" y="238">Неглубокий сон</text>
    <text x="150" y="288">Глубокий сон</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="160" y1="83" x2="870" y2="83"/><line x1="160" y1="133" x2="870" y2="133"/>
    <line x1="160" y1="183" x2="870" y2="183"/><line x1="160" y1="233" x2="870" y2="233"/>
    <line x1="160" y1="283" x2="870" y2="283"/>
  </g>
  <line x1="160" y1="310" x2="870" y2="310" stroke="#374151" stroke-width="2"/>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <text x="160" y="332">0 ч</text><text x="249" y="332">1</text><text x="338" y="332">2</text><text x="426" y="332">3</text>
    <text x="515" y="332">4</text><text x="604" y="332">5</text><text x="693" y="332">6</text><text x="781" y="332">7</text><text x="870" y="332">8 ч</text>
  </g>
  <!-- Гипнограмма: 5 циклов -->
  <polyline fill="none" stroke="#0f766e" stroke-width="4" stroke-linejoin="round" points="
    160,83 175,83 180,183 200,233 220,283 255,283 270,233 280,183 290,133 300,133
    310,183 325,233 345,283 370,283 385,233 400,183 420,133 440,133
    455,183 470,233 490,233 505,283 520,283 535,233 555,183 575,133 600,133
    615,183 630,233 670,233 690,183 715,133 745,133
    755,183 770,233 800,233 815,183 835,133 860,133 865,83 870,83"/>
  <g fill="#7c3aed" opacity="0.18">
    <rect x="290" y="120" width="10" height="26"/><rect x="420" y="120" width="20" height="26"/>
    <rect x="575" y="120" width="25" height="26"/><rect x="715" y="120" width="30" height="26"/><rect x="835" y="120" width="25" height="26"/>
  </g>
  <g font-size="15" fill="#1f2937">
    <text x="160" y="368">• Один цикл ≈ 90 минут, за ночь 4–6 циклов.</text>
    <text x="160" y="392">• Глубокого сна больше в начале ночи, быстрого (сны, работа с памятью) — под утро.</text>
  </g>
</svg>
