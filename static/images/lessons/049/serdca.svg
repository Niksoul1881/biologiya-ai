<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">Как усложнялось сердце позвоночных</text>
<rect x="10" y="50" width="190" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="105" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Рыбы</text>
<rect x="60" y="95" width="90" height="55" rx="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<text x="105" y="128" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">предсердие</text>
<rect x="55" y="156" width="100" height="90" rx="26" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<text x="105" y="206" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">желудочек</text>
<text x="105" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">2 камеры</text>
<text x="105" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">1 круг кровообращ.</text>
<text x="105" y="326" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">в сердце — только</text>
<text x="105" y="348" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">венозная кровь</text>
<rect x="208" y="50" width="190" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="303" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Земноводные</text>
<rect x="228" y="95" width="72" height="55" rx="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="306" y="95" width="72" height="55" rx="18" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="264" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правое</text>
<text x="264" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<text x="342" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левое</text>
<text x="342" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<rect x="233" y="156" width="140" height="90" rx="28" fill="#c084fc" stroke="#581c87" stroke-width="2"/>
<text x="303" y="198" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">один желудочек:</text>
<text x="303" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">смешанная кровь</text>
<text x="303" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">3 камеры</text>
<text x="303" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">2 круга</text>
<text x="303" y="326" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">кровь смешивается</text>
<text x="303" y="348" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">в желудочке</text>
<rect x="406" y="50" width="190" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="501" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Пресмыкающиеся</text>
<rect x="426" y="95" width="72" height="55" rx="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="504" y="95" width="72" height="55" rx="18" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="462" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правое</text>
<text x="462" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<text x="540" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левое</text>
<text x="540" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<defs><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#c084fc"/><stop offset="1" stop-color="#f87171"/></linearGradient></defs>
<rect x="431" y="156" width="140" height="90" rx="28" fill="url(#g2)" stroke="#581c87" stroke-width="2"/>
<line x1="501" y1="246" x2="501" y2="196" stroke="#374151" stroke-width="4"/>
<text x="501" y="178" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">неполная</text>
<text x="501" y="192" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">перегородка</text>
<text x="501" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">3 камеры, в желудочке</text>
<text x="501" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">неполная перегородка</text>
<text x="501" y="326" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">смешивание меньше</text>
<text x="501" y="348" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">(у крокодилов — 4)</text>
<rect x="604" y="50" width="190" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="699" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Птицы</text>
<rect x="624" y="95" width="72" height="55" rx="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="702" y="95" width="72" height="55" rx="18" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="660" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правое</text>
<text x="660" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<text x="738" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левое</text>
<text x="738" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<rect x="627" y="156" width="70" height="90" rx="24" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="701" y="156" width="70" height="90" rx="24" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="662" y="198" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правый</text>
<text x="662" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">жел.</text>
<text x="736" y="198" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левый</text>
<text x="736" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">жел.</text>
<text x="699" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">4 камеры</text>
<text x="699" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">2 круга, кровь</text>
<text x="699" y="326" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">не смешивается</text>
<text x="699" y="348" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">правая дуга аорты</text>
<rect x="802" y="50" width="190" height="330" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="897" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Млекопитающие</text>
<rect x="822" y="95" width="72" height="55" rx="18" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="900" y="95" width="72" height="55" rx="18" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="858" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правое</text>
<text x="858" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<text x="936" y="120" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левое</text>
<text x="936" y="136" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">предс.</text>
<rect x="825" y="156" width="70" height="90" rx="24" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
<rect x="899" y="156" width="70" height="90" rx="24" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/>
<text x="860" y="198" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">правый</text>
<text x="860" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">жел.</text>
<text x="934" y="198" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">левый</text>
<text x="934" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">жел.</text>
<text x="897" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">4 камеры</text>
<text x="897" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">2 круга, кровь</text>
<text x="897" y="326" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">не смешивается</text>
<text x="897" y="348" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">левая дуга аорты</text>
<rect x="200" y="405" width="22" height="22" rx="4" fill="#60a5fa"/><text x="230" y="422" text-anchor="start" font-size="15" font-weight="normal" fill="#111827">венозная кровь</text>
<rect x="420" y="405" width="22" height="22" rx="4" fill="#f87171"/><text x="450" y="422" text-anchor="start" font-size="15" font-weight="normal" fill="#111827">артериальная кровь</text>
<rect x="660" y="405" width="22" height="22" rx="4" fill="#c084fc"/><text x="690" y="422" text-anchor="start" font-size="15" font-weight="normal" fill="#111827">смешанная кровь</text>
<text x="500" y="455" text-anchor="middle" font-size="13" font-weight="normal" fill="#6b7280">Схемы условные: правая половина животного нарисована слева, как на анатомических рисунках.</text>
</svg>