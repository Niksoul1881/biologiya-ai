<line x1="537" y1="130" x2="504" y2="128" stroke="#6b7280"/>
<text x="540" y="260" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">брюшная</text><text x="540" y="276" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">нервная</text><text x="540" y="292" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">цепочка</text>
<line x1="537" y1="270" x2="490" y2="278" stroke="#6b7280"/>
<text x="480" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">кольчатые черви, членистоногие</text>
<text x="480" y="460" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">нервные клетки собраны в узлы —</text>
<text x="480" y="480" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">ганглии; головной узел управляет</text>
<text x="480" y="500" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">остальными; цепочка лежит</text>
<text x="480" y="520" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">на брюшной стороне</text>
