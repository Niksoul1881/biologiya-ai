<text x="165" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">гидра, медузы</text>
<text x="165" y="460" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">нервные клетки рассеяны по телу</text>
<text x="165" y="480" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">и связаны в сеть; центра нет —</text>
<text x="165" y="500" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">раздражение расходится во все</text>
<text x="165" y="520" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">стороны, реакция всем телом</text>
<text x="480" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Узловая (ганглиозная)</text>
