<line x1="852" y1="124" x2="820" y2="135" stroke="#6b7280"/>
<text x="855" y="280" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">спинной</text><text x="855" y="296" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">мозг</text>
<line x1="852" y1="286" x2="803" y2="290" stroke="#6b7280"/>
<text x="795" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">хордовые (позвоночные)</text>
<text x="795" y="460" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">нервная трубка на спинной</text>
<text x="795" y="480" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">стороне: головной и спинной мозг,</text>
<text x="795" y="500" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">от них отходят нервы;</text>
<text x="795" y="520" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">мозг сложнее всего у зверей</text>
