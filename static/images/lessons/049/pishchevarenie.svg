<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif">
<rect width="960" height="470" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">Как усложнялась пищеварительная система</text>
<rect x="12" y="48" width="306" height="405" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="327" y="48" width="306" height="405" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="642" y="48" width="306" height="405" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="165" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">1. Внутри клетки</text>
<path d="M85,200 Q75,120 155,115 Q235,100 250,170 Q265,250 185,270 Q95,285 85,200 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<circle cx="205" cy="235" r="20" fill="#bae6fd" stroke="#0369a1"/>
<circle cx="135" cy="160" r="20" fill="#fde68a" stroke="#a16207"/><circle cx="135" cy="160" r="7" fill="#a16207"/>
<text x="205" y="240" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">ядро</text><text x="135" y="200" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">пищеварительная</text><text x="135" y="214" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">вакуоль</text>
<text x="165" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">амёба, инфузория</text>
<text x="165" y="352" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">пища переваривается</text>
<text x="165" y="374" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">в пищеварительной вакуоли</text>
<text x="165" y="396" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">внутри одной клетки</text>
<text x="480" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">2. Мешок с одним входом</text>
<path d="M435,120 L425,270 Q480,300 535,270 L525,120 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<path d="M455,125 L448,255 Q480,275 512,255 L505,125 Z" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
<path d="M470,95 L470,180" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/><path d="M492,180 L492,95" stroke="#dc2626" stroke-width="3" marker-end="url(#ar2)"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker><marker id="ar2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker></defs>
<text x="540" y="110" text-anchor="start" font-size="13" font-weight="normal" fill="#111827">рот</text><text x="480" y="230" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">кишечная</text><text x="480" y="244" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">полость</text>
<text x="480" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">гидра, медузы, планария</text>
<text x="480" y="352" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">пища входит через рот,</text>
<text x="480" y="374" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">переваривается в полости,</text>
<text x="480" y="396" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">остатки выходят через тот же рот</text>
<text x="795" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">3. Сквозная трубка</text>
<rect x="670" y="150" width="250" height="90" rx="45" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<path d="M670,195 L715,195 Q735,170 755,195 L920,195" stroke="#a16207" stroke-width="12" fill="none" stroke-linejoin="round"/>
<path d="M645,195 L667,195" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/><path d="M923,195 L945,195" stroke="#dc2626" stroke-width="3" marker-end="url(#ar2)"/>
<text x="675" y="135" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">рот</text><text x="900" y="121" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">анальное</text><text x="900" y="137" text-anchor="middle" font-size="13" font-weight="normal" fill="#111827">отверстие</text><text x="735" y="268" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">глотка, желудок</text><text x="845" y="268" text-anchor="middle" font-size="12" font-weight="normal" fill="#111827">кишечник</text>
<text x="795" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">круглые черви и все сложнее</text>
<text x="795" y="352" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">пища движется в одну сторону;</text>
<text x="795" y="374" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">появляются отделы и</text>
<text x="795" y="396" text-anchor="middle" font-size="14" font-weight="normal" fill="#111827">пищеварительные железы</text>
</svg>