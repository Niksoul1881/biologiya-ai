<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">SeqIO.read и SeqIO.parse: один формат, разные вопросы</text>

  <!-- left -->
  <rect x="20" y="60" width="460" height="330" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="20" y="60" width="460" height="36" rx="8" fill="#111827"/>
  <rect x="20" y="84" width="460" height="12" fill="#111827"/>
  <text x="250" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#e5e7eb">globin.fasta — одна запись</text>

  <rect x="40" y="116" width="420" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="54" y="140" font-family="Consolas, monospace" font-size="12" fill="#16A34A">&gt;hbb_human beta-globin fragment</text>
  <text x="54" y="160" font-family="Consolas, monospace" font-size="12" fill="#111827">ATGGTGCATCTGACTCCTGAGGAGAAGTCT</text>
  <text x="54" y="178" font-family="Consolas, monospace" font-size="12" fill="#111827">GCCGTTACTG</text>

  <rect x="40" y="224" width="420" height="62" rx="6" fill="#f0fdf4" stroke="#16A34A"/>
  <text x="54" y="248" font-family="Consolas, monospace" font-size="13" fill="#111827">SeqIO.read(f, "fasta")</text>
  <text x="54" y="270" font-size="13" fill="#16A34A">✓ один SeqRecord — то, что нужно</text>

  <rect x="40" y="302" width="420" height="62" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="54" y="326" font-family="Consolas, monospace" font-size="13" fill="#111827">SeqIO.parse(f, "fasta")</text>
  <text x="54" y="348" font-size="13" fill="#6b7280">тоже работает: в генераторе ровно 1 запись</text>

  <!-- right -->
  <rect x="520" y="60" width="460" height="330" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="520" y="60" width="460" height="36" rx="8" fill="#111827"/>
  <rect x="520" y="84" width="460" height="12" fill="#111827"/>
  <text x="750" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#e5e7eb">globin.fasta — три записи</text>

  <rect x="540" y="116" width="420" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="554" y="138" font-family="Consolas, monospace" font-size="12" fill="#16A34A">&gt;hbb_human beta-globin fragment</text>
  <text x="554" y="156" font-family="Consolas, monospace" font-size="12" fill="#111827">ATGGTGCATCTGACTCCTGAGGAGAAGTCT...</text>
  <text x="554" y="174" font-family="Consolas, monospace" font-size="12" fill="#16A34A">&gt;hbb_variant beta-globin variant</text>
  <text x="554" y="192" font-family="Consolas, monospace" font-size="12" fill="#16A34A">&gt;short lowercase fragment</text>

  <rect x="540" y="224" width="420" height="62" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="554" y="248" font-family="Consolas, monospace" font-size="13" fill="#111827">SeqIO.read(f, "fasta")</text>
  <text x="554" y="270" font-size="13" fill="#dc2626">✗ ValueError: More than one record found</text>

  <rect x="540" y="302" width="420" height="62" rx="6" fill="#f0fdf4" stroke="#16A34A"/>
  <text x="554" y="326" font-family="Consolas, monospace" font-size="13" fill="#111827">SeqIO.parse(f, "fasta")</text>
  <text x="554" y="348" font-size="13" fill="#16A34A">✓ генератор: 3 записи, по одной за шаг</text>

  <text x="500" y="420" text-anchor="middle" font-size="14" fill="#111827">read — «дай запись», parse — «дай все записи по одной»</text>
  <text x="500" y="442" text-anchor="middle" font-size="13" fill="#9ca3af">parse не падает даже на пустом файле: просто вернёт ноль записей</text>
</svg>
