<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Методы Seq: что вернёт каждый</text>

  <g font-size="14">
    <rect x="20" y="48" width="960" height="34" rx="6" fill="#111827"/>
    <text x="34" y="70" fill="#e5e7eb" font-weight="bold">Запись</text>
    <text x="330" y="70" fill="#e5e7eb" font-weight="bold">Что делает</text>
    <text x="640" y="70" fill="#e5e7eb" font-weight="bold">Результат для Seq("ATGCGCGT")</text>

    <g font-family="Consolas, monospace">
      <rect x="20" y="86" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="108" fill="#111827">seq</text>
      <text x="330" y="108" fill="#6b7280" font-family="Arial, sans-serif">объект-последовательность</text>
      <text x="640" y="108" fill="#16A34A">Seq('ATGCGCGT')</text>

      <rect x="20" y="124" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="146" fill="#111827">str(seq)</text>
      <text x="330" y="146" fill="#6b7280" font-family="Arial, sans-serif">приведение к обычной строке</text>
      <text x="640" y="146" fill="#16A34A">'ATGCGCGT'</text>

      <rect x="20" y="162" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="184" fill="#111827">len(seq)</text>
      <text x="330" y="184" fill="#6b7280" font-family="Arial, sans-serif">длина</text>
      <text x="640" y="184" fill="#16A34A">8</text>

      <rect x="20" y="200" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="222" fill="#111827">seq[2:5]</text>
      <text x="330" y="222" fill="#6b7280" font-family="Arial, sans-serif">срез, как у строки</text>
      <text x="640" y="222" fill="#16A34A">Seq('GCG')</text>

      <rect x="20" y="238" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="260" fill="#111827">seq.reverse_complement()</text>
      <text x="330" y="260" fill="#6b7280" font-family="Arial, sans-serif">вторая цепь, 5'→3'</text>
      <text x="640" y="260" fill="#16A34A">Seq('ACGCGCAT')</text>

      <rect x="20" y="276" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="298" fill="#111827">seq.transcribe()</text>
      <text x="330" y="298" fill="#6b7280" font-family="Arial, sans-serif">ДНК → РНК (T → U)</text>
      <text x="640" y="298" fill="#16A34A">Seq('AUGCGCGU')</text>

      <rect x="20" y="314" width="960" height="34" fill="#f9fafb"/>
      <text x="34" y="336" fill="#111827">seq.translate()</text>
      <text x="330" y="336" fill="#6b7280" font-family="Arial, sans-serif">белок с рамки 1</text>
      <text x="640" y="336" fill="#16A34A">Seq('MR')</text>

      <rect x="20" y="352" width="960" height="34" fill="#ffffff"/>
      <text x="34" y="374" fill="#111827">gc_fraction(seq)</text>
      <text x="330" y="374" fill="#6b7280" font-family="Arial, sans-serif">доля G + C</text>
      <text x="640" y="374" fill="#16A34A">0.625</text>
    </g>
  </g>

  <text x="500" y="408" text-anchor="middle" font-size="13" fill="#9ca3af">Все методы возвращают новое значение: сам Seq не меняется</text>
  <text x="500" y="428" text-anchor="middle" font-size="13" fill="#9ca3af">gc_fraction импортируют из Bio.SeqUtils — это не метод объекта Seq</text>
</svg>
