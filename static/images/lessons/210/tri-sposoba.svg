<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Три способа прочитать файл в Python</text>

  <rect x="30" y="52" width="940" height="46" rx="8" fill="#111827"/>
  <text x="46" y="81" font-family="Consolas, monospace" font-size="15" fill="#e5e7eb">from pathlib import Path      <tspan fill="#6b7280"># путь к файлу, который работает на любой системе</tspan></text>

  <g fill="none" stroke="#d1d5db" stroke-width="2">
    <rect x="30" y="118" width="300" height="286" rx="12"/>
    <rect x="350" y="118" width="300" height="286" rx="12"/>
    <rect x="670" y="118" width="300" height="286" rx="12"/>
  </g>

  <!-- 1 -->
  <text x="50" y="150" font-size="16" font-weight="bold" fill="#16A34A">open() + for</text>
  <rect x="46" y="164" width="268" height="78" rx="8" fill="#111827"/>
  <text x="58" y="190" font-family="Consolas, monospace" font-size="13" fill="#e5e7eb">with open(put) as f:</text>
  <text x="58" y="212" font-family="Consolas, monospace" font-size="13" fill="#86efac">    for line in f:</text>
  <text x="58" y="234" font-family="Consolas, monospace" font-size="13" fill="#9ca3af">        ...</text>
  <text x="50" y="272" font-size="13" fill="#111827"><tspan font-weight="bold">Память:</tspan> одна строка</text>
  <text x="50" y="298" font-size="13" fill="#111827"><tspan font-weight="bold">Когда:</tspan> большие файлы</text>
  <text x="50" y="324" font-size="12.5" fill="#6b7280">файл читается по кусочку,</text>
  <text x="50" y="342" font-size="12.5" fill="#6b7280">целиком в память не попадает</text>
  <text x="50" y="380" font-size="12" fill="#9ca3af">так читают большие геномы</text>

  <!-- 2 -->
  <text x="370" y="150" font-size="16" font-weight="bold" fill="#1d4ed8">readlines()</text>
  <rect x="366" y="164" width="268" height="78" rx="8" fill="#111827"/>
  <text x="378" y="190" font-family="Consolas, monospace" font-size="13" fill="#e5e7eb">with open(put) as f:</text>
  <text x="378" y="212" font-family="Consolas, monospace" font-size="13" fill="#86efac">    lines = f.readlines()</text>
  <text x="378" y="234" font-family="Consolas, monospace" font-size="13" fill="#9ca3af">        ...</text>
  <text x="370" y="272" font-size="13" fill="#111827"><tspan font-weight="bold">Память:</tspan> список строк</text>
  <text x="370" y="298" font-size="13" fill="#111827"><tspan font-weight="bold">Когда:</tspan> небольшие файлы</text>
  <text x="370" y="324" font-size="12.5" fill="#6b7280">удобно, если нужно вернуться</text>
  <text x="370" y="342" font-size="12.5" fill="#6b7280">к строке по номеру</text>
  <text x="370" y="380" font-size="12" fill="#9ca3af">каждая строка — с «\n»</text>

  <!-- 3 -->
  <text x="690" y="150" font-size="16" font-weight="bold" fill="#b45309">read()</text>
  <rect x="686" y="164" width="268" height="78" rx="8" fill="#111827"/>
  <text x="698" y="190" font-family="Consolas, monospace" font-size="13" fill="#e5e7eb">with open(put) as f:</text>
  <text x="698" y="212" font-family="Consolas, monospace" font-size="13" fill="#86efac">    text = f.read()</text>
  <text x="698" y="234" font-family="Consolas, monospace" font-size="13" fill="#9ca3af">        ...</text>
  <text x="690" y="272" font-size="13" fill="#111827"><tspan font-weight="bold">Память:</tspan> весь файл</text>
  <text x="690" y="298" font-size="13" fill="#111827"><tspan font-weight="bold">Когда:</tspan> маленькие файлы</text>
  <text x="690" y="324" font-size="12.5" fill="#6b7280">одна большая строка — удобно</text>
  <text x="690" y="342" font-size="12.5" fill="#6b7280">для split и count</text>
  <text x="690" y="380" font-size="12" fill="#9ca3af">риск: память кончится</text>

  <rect x="30" y="428" width="940" height="52" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="459" font-size="13.5" fill="#991b1b">Для генома человека (3,2 млрд символов) read() попросит больше 3 ГБ памяти. FASTA читают построчно, а не целиком.</text>
</svg>
