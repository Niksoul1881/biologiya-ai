<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f766e">Когда жили наши предки и родственники (приблизительно)</text>
  <!-- Шкала: x = 80 + (7 - t) * 120, t в млн лет назад -->
  <line x1="80" y1="450" x2="900" y2="450" stroke="#374151" stroke-width="2"/>
  <g font-size="14" fill="#374151" text-anchor="middle">
    <line x1="80" y1="445" x2="80" y2="455" stroke="#374151"/><text x="80" y="474">7</text>
    <line x1="200" y1="445" x2="200" y2="455" stroke="#374151"/><text x="200" y="474">6</text>
    <line x1="320" y1="445" x2="320" y2="455" stroke="#374151"/><text x="320" y="474">5</text>
    <line x1="440" y1="445" x2="440" y2="455" stroke="#374151"/><text x="440" y="474">4</text>
    <line x1="560" y1="445" x2="560" y2="455" stroke="#374151"/><text x="560" y="474">3</text>
    <line x1="680" y1="445" x2="680" y2="455" stroke="#374151"/><text x="680" y="474">2</text>
    <line x1="800" y1="445" x2="800" y2="455" stroke="#374151"/><text x="800" y="474">1</text>
    <line x1="920" y1="445" x2="920" y2="455" stroke="#374151"/><text x="920" y="474">0</text>
    <text x="500" y="500" font-size="15">миллионов лет назад</text>
  </g>
  <!-- Полосы -->
  <g font-size="15">
    <rect x="80" y="70" width="60" height="30" rx="6" fill="#d6d3d1"/>
    <text x="150" y="91" fill="#1f2937">ранние гоминины (сахелантроп и др.), ~7–6 млн</text>

    <rect x="416" y="118" width="264" height="30" rx="6" fill="#fcd34d"/>
    <text x="424" y="139" fill="#1f2937" font-weight="bold">Австралопитеки</text>
    <text x="690" y="139" fill="#1f2937">~4,2–2 млн; Люси — 3,2 млн</text>

    <rect x="632" y="166" width="108" height="30" rx="6" fill="#fdba74"/>
    <text x="624" y="187" fill="#1f2937" font-weight="bold" text-anchor="end">Человек умелый</text>
    <text x="750" y="187" fill="#1f2937">~2,4–1,5 млн, ранние</text>
    <text x="750" y="205" fill="#1f2937">каменные орудия*</text>

    <rect x="692" y="222" width="216" height="30" rx="6" fill="#f87171"/>
    <text x="700" y="243" fill="#ffffff" font-weight="bold">Человек прямоходящий</text>
    <text x="440" y="243" fill="#1f2937" text-anchor="start">~1,9 млн — ~100 тыс., огонь →</text>

    <rect x="872" y="270" width="43" height="30" rx="6" fill="#a78bfa"/>
    <text x="864" y="291" fill="#1f2937" text-anchor="end"><tspan font-weight="bold">Неандертальцы</tspan> ~400–40 тыс. лет назад</text>

    <rect x="884" y="318" width="31" height="30" rx="6" fill="#93c5fd"/>
    <text x="876" y="339" fill="#1f2937" text-anchor="end"><tspan font-weight="bold">Денисовцы</tspan> (Алтай, Азия) — до ~30–50 тыс. лет назад</text>

    <rect x="884" y="366" width="36" height="30" rx="6" fill="#16a34a"/>
    <text x="876" y="387" fill="#1f2937" text-anchor="end"><tspan font-weight="bold">Человек разумный</tspan> — около 300 тыс. лет назад, Африка</text>
  </g>
  <text x="80" y="414" font-size="13" fill="#6b7280">* самые древние известные каменные орудия — около 3,3 млн лет, их авторы точно не установлены.</text><text x="80" y="432" font-size="13" fill="#6b7280">Это не «лестница», а ветвистый куст: разные виды часто жили одновременно.</text>
</svg>
