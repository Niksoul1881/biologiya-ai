<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="780" height="460" fill="#ffffff"/>
  <text x="390" y="24" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Где и что переваривается</text>
  <g font-size="15">
    <rect x="20" y="56" width="180" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
    <text x="110" y="86" font-weight="bold" text-anchor="middle" fill="#78350f">Ротовая полость</text>
    <text x="110" y="108" text-anchor="middle" fill="#374151">слюна, pH ≈ 7</text>
    <rect x="20" y="146" width="180" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="110" y="176" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Желудок</text>
    <text x="110" y="198" text-anchor="middle" fill="#374151" font-size="13">желудочный сок, pH 1,5–2</text>
    <rect x="20" y="236" width="180" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/>
    <text x="110" y="264" font-weight="bold" text-anchor="middle" fill="#14532d">Тонкая кишка</text>
    <text x="110" y="286" text-anchor="middle" fill="#374151">сок поджелудочной,</text>
    <text x="110" y="304" text-anchor="middle" fill="#374151">желчь, кишечный сок</text>
    <rect x="20" y="346" width="180" height="70" rx="10" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="110" y="376" font-weight="bold" text-anchor="middle" fill="#312e81">Толстая кишка</text>
    <text x="110" y="398" text-anchor="middle" fill="#374151" font-size="13">бактерии, всасывание воды</text>
  </g>
  <!-- столбцы -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#111827">
    <text x="320" y="57">Углеводы</text><text x="510" y="57">Белки</text><text x="690" y="57">Жиры</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="230" y="64" width="180" height="56" rx="8" fill="#fde68a"/>
    <text x="320" y="86">крахмал → мальтоза</text><text x="320" y="106">(амилаза слюны)</text>
    <rect x="420" y="64" width="180" height="56" rx="8" fill="#f3f4f6"/><text x="510" y="96" fill="#6b7280">не перевариваются</text>
    <rect x="610" y="64" width="160" height="56" rx="8" fill="#f3f4f6"/><text x="690" y="96" fill="#6b7280">не перевариваются</text>
    <rect x="230" y="154" width="180" height="56" rx="8" fill="#f3f4f6"/><text x="320" y="176" fill="#6b7280">амилаза слюны</text><text x="320" y="196" fill="#6b7280">в кислоте прекращает работу</text>
    <rect x="420" y="154" width="180" height="56" rx="8" fill="#fca5a5"/><text x="510" y="176">белки → короткие</text><text x="510" y="196">цепочки (пепсин)</text>
    <rect x="610" y="154" width="160" height="56" rx="8" fill="#f3f4f6"/><text x="690" y="176" fill="#6b7280">почти не</text><text x="690" y="196" fill="#6b7280">перевариваются*</text>
    <rect x="230" y="244" width="180" height="74" rx="8" fill="#86efac"/><text x="320" y="270">крахмал, сахара</text><text x="320" y="290">→ глюкоза</text><text x="320" y="308">(амилаза и др.)</text>
    <rect x="420" y="244" width="180" height="74" rx="8" fill="#86efac"/><text x="510" y="270">белки и пептиды</text><text x="510" y="290">→ аминокислоты</text><text x="510" y="308">(трипсин и др.)</text>
    <rect x="610" y="244" width="160" height="74" rx="8" fill="#86efac"/><text x="690" y="264">жиры → глицерин</text><text x="690" y="282">и жирные кислоты</text><text x="690" y="300">(липаза;</text><text x="690" y="314">желчь эмульгирует)</text>
    <rect x="230" y="354" width="540" height="56" rx="8" fill="#c7d2fe"/>
    <text x="500" y="376">бактерии расщепляют клетчатку, синтезируют некоторые витамины (K, группы B);</text>
    <text x="500" y="396">всасывается вода, формируются каловые массы</text>
  </g>
  <text x="390" y="440" font-size="13" text-anchor="middle" fill="#6b7280">* у грудных детей в желудке частично расщепляются жиры молока; главное место переваривания всего — тонкая кишка</text>
</svg>
