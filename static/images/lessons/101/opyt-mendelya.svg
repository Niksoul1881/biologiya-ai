<text x="450" y="398" font-size="15" text-anchor="middle" fill="#1b4d1b" font-weight="bold">По каждому признаку отдельно — расщепление 3 : 1</text>
<text x="450" y="424" font-size="14" text-anchor="middle" fill="#333">жёлтые : зелёные = (315 + 101) : (108 + 32) = 416 : 140 ≈ 3 : 1</text>
<text x="450" y="448" font-size="14" text-anchor="middle" fill="#333">гладкие : морщинистые = (315 + 108) : (101 + 32) = 423 : 133 ≈ 3 : 1</text>
<text x="450" y="478" font-size="15" text-anchor="middle" fill="#c0392b" font-weight="bold">(3 : 1) × (3 : 1) = 9 : 3 : 3 : 1 — признаки наследуются независимо</text>
