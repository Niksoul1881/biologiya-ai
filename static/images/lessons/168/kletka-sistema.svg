<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="480" y="34" font-size="25" font-weight="bold" text-anchor="middle" fill="#1f2937">Клетка как система: входы → процессы → выходы</text>

  <!-- входы -->
  <text x="110" y="80" font-size="19" font-weight="bold" text-anchor="middle" fill="#15803d">ВХОДЫ</text>
  <text x="110" y="128" font-size="15" text-anchor="middle" fill="#1f2937">глюкоза, аминокислоты,</text>
  <text x="110" y="146" font-size="15" text-anchor="middle" fill="#1f2937">жирные кислоты</text>
  <text x="110" y="196" font-size="15" text-anchor="middle" fill="#1f2937">кислород</text>
  <text x="110" y="256" font-size="15" text-anchor="middle" fill="#1f2937">вода, ионы Na⁺, K⁺, Ca²⁺</text>
  <text x="110" y="316" font-size="15" text-anchor="middle" fill="#1f2937">сигналы: гормоны,</text>
  <text x="110" y="334" font-size="15" text-anchor="middle" fill="#1f2937">факторы роста, соседи</text>
  <text x="110" y="384" font-size="15" text-anchor="middle" fill="#1f2937">свет (у растений)</text>
  <line x1="205" y1="137" x2="262" y2="160" stroke="#15803d" stroke-width="3" marker-end="url(#ai)"/>
  <line x1="170" y1="192" x2="248" y2="205" stroke="#15803d" stroke-width="3" marker-end="url(#ai)"/>
  <line x1="205" y1="252" x2="242" y2="252" stroke="#15803d" stroke-width="3" marker-end="url(#ai)"/>
  <line x1="200" y1="325" x2="246" y2="315" stroke="#15803d" stroke-width="3" marker-end="url(#ai)"/>
  <line x1="180" y1="380" x2="262" y2="360" stroke="#15803d" stroke-width="3" marker-end="url(#ai)"/>

  <!-- клетка -->
  <ellipse cx="480" cy="270" rx="230" ry="175" fill="#ecfeff" stroke="#0891b2" stroke-width="7"/>
  <text x="480" y="84" font-size="14" text-anchor="middle" fill="#0e7490">мембрана — интерфейс: насосы, каналы, рецепторы</text>

  <rect x="320" y="140" width="320" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="163" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Метаболизм</text>
  <text x="480" y="184" font-size="14" text-anchor="middle" fill="#374151">энергия (АТФ) и строительные блоки</text>

  <rect x="320" y="206" width="320" height="56" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="229" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Обработка информации</text>
  <text x="480" y="250" font-size="14" text-anchor="middle" fill="#374151">сигнальные пути, включение генов</text>

  <rect x="320" y="272" width="320" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="295" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Синтез и транспорт</text>
  <text x="480" y="316" font-size="14" text-anchor="middle" fill="#374151">белки, мембраны, доставка по адресам</text>

  <rect x="320" y="338" width="320" height="56" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="480" y="361" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">Жизненный цикл</text>
  <text x="480" y="382" font-size="14" text-anchor="middle" fill="#374151">рост, деление, программируемая гибель</text>

  <!-- выходы -->
  <text x="850" y="80" font-size="19" font-weight="bold" text-anchor="middle" fill="#b45309">ВЫХОДЫ</text>
  <text x="850" y="137" font-size="15" text-anchor="middle" fill="#1f2937">CO₂ и вода</text>
  <text x="850" y="190" font-size="15" text-anchor="middle" fill="#1f2937">отходы: аммиак,</text>
  <text x="850" y="208" font-size="15" text-anchor="middle" fill="#1f2937">мочевина (печень)</text>
  <text x="850" y="256" font-size="15" text-anchor="middle" fill="#1f2937">продукты на экспорт:</text>
  <text x="850" y="274" font-size="15" text-anchor="middle" fill="#1f2937">гормоны, ферменты</text>
  <text x="850" y="322" font-size="15" text-anchor="middle" fill="#1f2937">сигналы соседям</text>
  <text x="850" y="372" font-size="15" text-anchor="middle" fill="#1f2937">тепло</text>
  <text x="850" y="414" font-size="15" text-anchor="middle" fill="#1f2937">дочерние клетки</text>
  <line x1="700" y1="168" x2="790" y2="140" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="712" y1="215" x2="782" y2="203" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="714" y1="262" x2="768" y2="262" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="712" y1="312" x2="782" y2="318" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="694" y1="352" x2="820" y2="368" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="660" y1="390" x2="790" y2="410" stroke="#b45309" stroke-width="3" marker-end="url(#ao)"/>

  <!-- состояние -->
  <rect x="190" y="475" width="580" height="100" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="480" y="503" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">Внутреннее состояние клетки</text>
  <text x="480" y="530" font-size="15" text-anchor="middle" fill="#374151">какие гены включены, концентрации тысяч молекул,</text>
  <text x="480" y="552" font-size="15" text-anchor="middle" fill="#374151">метки на ДНК и белках; выход зависит и от входа, и от состояния</text>
  <line x1="480" y1="470" x2="480" y2="450" stroke="#6b7280" stroke-width="3" marker-end="url(#ag)"/>
</svg>
