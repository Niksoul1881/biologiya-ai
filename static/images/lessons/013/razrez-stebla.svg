<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Поперечный разрез трёхлетней ветки</text>
  <!-- пробка -->
  <circle cx="270" cy="280" r="210" fill="#78350f"/>
  <!-- луб -->
  <circle cx="270" cy="280" r="190" fill="#d97706"/>
  <g stroke="#92400e" stroke-width="2"><line x1="270" y1="90" x2="270" y2="110"/><line x1="270" y1="450" x2="270" y2="470"/><line x1="80" y1="280" x2="100" y2="280"/><line x1="440" y1="280" x2="460" y2="280"/><line x1="136" y1="146" x2="150" y2="160"/><line x1="404" y1="414" x2="390" y2="400"/><line x1="404" y1="146" x2="390" y2="160"/><line x1="136" y1="414" x2="150" y2="400"/></g>
  <!-- камбий -->
  <circle cx="270" cy="280" r="170" fill="#22c55e"/>
  <!-- древесина: 3 кольца -->
  <circle cx="270" cy="280" r="164" fill="#fde68a"/>
  <circle cx="270" cy="280" r="164" fill="none" stroke="#b45309" stroke-width="4"/>
  <circle cx="270" cy="280" r="118" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <circle cx="270" cy="280" r="72" fill="#fde68a" stroke="#b45309" stroke-width="4"/>
  <!-- сердцевина -->
  <circle cx="270" cy="280" r="26" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"/>
  <!-- сердцевинные лучи -->
  <g stroke="#d6d3d1" stroke-width="2"><line x1="270" y1="254" x2="270" y2="116"/><line x1="296" y1="280" x2="434" y2="280"/><line x1="270" y1="306" x2="270" y2="444"/><line x1="244" y1="280" x2="106" y2="280"/><line x1="288" y1="262" x2="386" y2="164"/><line x1="252" y1="298" x2="154" y2="396"/></g>
  <!-- номера колец -->
  <g font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle"><text x="236" y="250">1</text><text x="204" y="218">2</text><text x="172" y="186">3</text></g>

  <!-- подписи -->
  <g font-size="18" fill="#1f2937">
    <line x1="470" y1="200" x2="560" y2="110" stroke="#374151" stroke-width="1.5"/>
    <text x="568" y="98" font-weight="bold" fill="#78350f">Пробка</text>
    <text x="568" y="117" font-size="14" fill="#4b5563">мёртвые клетки, защита</text>
    <line x1="452" y1="240" x2="560" y2="170" stroke="#374151" stroke-width="1.5"/>
    <text x="568" y="164" font-weight="bold" fill="#b45309">Луб</text>
    <text x="568" y="183" font-size="14" fill="#4b5563">ситовидные трубки — органические</text>
    <text x="568" y="200" font-size="14" fill="#4b5563">вещества; лубяные волокна</text>
    <text x="568" y="226" font-size="13" fill="#6b7280">пробка + луб = кора</text>
    <line x1="438" y1="290" x2="560" y2="265" stroke="#374151" stroke-width="1.5"/>
    <text x="568" y="266" font-weight="bold" fill="#15803d">Камбий</text>
    <text x="568" y="285" font-size="14" fill="#4b5563">делящиеся клетки — рост в толщину</text>
    <line x1="400" y1="340" x2="560" y2="335" stroke="#374151" stroke-width="1.5"/>
    <text x="568" y="334" font-weight="bold" fill="#a16207">Древесина</text>
    <text x="568" y="353" font-size="14" fill="#4b5563">сосуды — вода и минеральные вещества,</text>
    <text x="568" y="370" font-size="14" fill="#4b5563">волокна — прочность; 3 годичных кольца</text>
    <line x1="290" y1="290" x2="560" y2="420" stroke="#374151" stroke-width="1.5"/>
    <text x="568" y="420" font-weight="bold" fill="#57534e">Сердцевина</text>
    <text x="568" y="439" font-size="14" fill="#4b5563">рыхлые клетки, запас веществ</text>
  </g>
  <text x="270" y="510" font-size="14" text-anchor="middle" fill="#6b7280">кольца пронумерованы от центра: 1-й, 2-й, 3-й год</text>
</svg>
