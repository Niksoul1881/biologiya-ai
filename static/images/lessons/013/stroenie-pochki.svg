<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="34" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Почка в разрезе</text>
  <line x1="450" y1="55" x2="450" y2="480" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ВЕГЕТАТИВНАЯ -->
  <text x="225" y="72" font-size="20" font-weight="bold" text-anchor="middle" fill="#3f6212">Вегетативная</text>
  <rect x="200" y="400" width="50" height="70" fill="#a16207"/>
  <!-- чешуи -->
  <path d="M175,405 C160,330 180,200 225,110 C270,200 290,330 275,405 z" fill="#92400e" stroke="#713f12" stroke-width="3"/>
  <path d="M188,402 C178,330 195,215 225,140 C255,215 272,330 262,402 z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <!-- внутренность -->
  <path d="M200,400 C195,330 205,230 225,175 C245,230 255,330 250,400 z" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
  <!-- зачаточный стебель -->
  <path d="M225,400 L225,200" stroke="#65a30d" stroke-width="7"/>
  <!-- конус нарастания -->
  <path d="M217,205 C217,190 233,190 233,205 z" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <!-- зачаточные листья -->
  <g fill="#86efac" stroke="#15803d" stroke-width="2">
    <path d="M225,360 C205,340 200,300 207,265 C214,290 220,330 225,360 z"/>
    <path d="M225,360 C245,340 250,300 243,265 C236,290 230,330 225,360 z"/>
    <path d="M225,300 C210,285 207,255 212,232 C218,250 222,280 225,300 z"/>
    <path d="M225,300 C240,285 243,255 238,232 C232,250 228,280 225,300 z"/>
  </g>
  <!-- пазушные зачаточные почки -->
  <g fill="#fde047" stroke="#a16207"><circle cx="219" cy="350" r="3.5"/><circle cx="231" cy="292" r="3.5"/></g>
  <g font-size="16" fill="#1f2937">
    <line x1="230" y1="198" x2="330" y2="140" stroke="#374151" stroke-width="1.5"/>
    <text x="300" y="118" font-weight="bold" fill="#a16207">Конус нарастания</text>
    <text x="300" y="134" font-size="13" fill="#4b5563">образовательная ткань</text>
    <line x1="243" y1="280" x2="330" y2="230" stroke="#374151" stroke-width="1.5"/>
    <text x="332" y="225" font-weight="bold" fill="#15803d">Зачаточные</text>
    <text x="332" y="243" font-weight="bold" fill="#15803d">листья</text>
    <line x1="227" y1="380" x2="330" y2="320" stroke="#374151" stroke-width="1.5"/>
    <text x="332" y="315" font-weight="bold" fill="#65a30d">Зачаточный</text>
    <text x="332" y="333" font-weight="bold" fill="#65a30d">стебель</text>
    <line x1="182" y1="350" x2="80" y2="300" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="282" font-weight="bold" fill="#92400e">Почечные</text>
    <text x="20" y="300" font-weight="bold" fill="#92400e">чешуи</text>
    <text x="20" y="317" font-size="13" fill="#4b5563">защита</text>
  </g>
  <text x="225" y="490" font-size="14" text-anchor="middle" fill="#4b5563">из неё вырастет побег с листьями</text>

  <!-- ГЕНЕРАТИВНАЯ -->
  <text x="675" y="72" font-size="20" font-weight="bold" text-anchor="middle" fill="#be185d">Генеративная (цветочная)</text>
  <rect x="650" y="400" width="50" height="70" fill="#a16207"/>
  <path d="M600,405 C585,330 605,200 675,150 C745,200 765,330 750,405 z" fill="#92400e" stroke="#713f12" stroke-width="3"/>
  <path d="M614,402 C602,330 620,220 675,178 C730,220 748,330 736,402 z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <path d="M630,400 C622,330 640,240 675,205 C710,240 728,330 720,400 z" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <path d="M675,400 L675,300" stroke="#65a30d" stroke-width="6"/>
  <!-- зачаточный цветок -->
  <g fill="#f9a8d4" stroke="#be185d" stroke-width="2">
    <ellipse cx="652" cy="285" rx="16" ry="28" transform="rotate(-25 652 285)"/>
    <ellipse cx="698" cy="285" rx="16" ry="28" transform="rotate(25 698 285)"/>
    <ellipse cx="675" cy="265" rx="16" ry="30"/>
  </g>
  <g fill="#fde047" stroke="#a16207"><circle cx="668" cy="292" r="4"/><circle cx="682" cy="292" r="4"/><circle cx="675" cy="282" r="4"/></g>
  <g font-size="16" fill="#1f2937">
    <line x1="700" y1="265" x2="790" y2="230" stroke="#374151" stroke-width="1.5"/>
    <text x="772" y="205" font-weight="bold" fill="#be185d">Зачаточный</text>
    <text x="772" y="223" font-weight="bold" fill="#be185d">цветок</text>
    <text x="772" y="240" font-size="13" fill="#4b5563">(или соцветие)</text>
  </g>
  <text x="675" y="490" font-size="14" text-anchor="middle" fill="#4b5563">крупнее и круглее; из неё — цветок</text>
</svg>
