<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif"><rect width="900" height="640" fill="#FFFFFF"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#0F766E"/></marker></defs><text x="450.0" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Путь звука: от ушной раковины до коры</text><rect x="40" y="70" width="240" height="130" rx="14" fill="#FDE68A" stroke="#B45309" stroke-width="3"/><circle cx="64" cy="96" r="15" fill="#B45309"/><text x="64" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text><text x="165" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Ушная раковина</text><text x="160" y="148" text-anchor="middle" font-size="15" fill="#374151">улавливает звук</text><rect x="330" y="70" width="240" height="130" rx="14" fill="#FDE68A" stroke="#B45309" stroke-width="3"/><circle cx="354" cy="96" r="15" fill="#B45309"/><text x="354" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text><text x="455" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937"></text><text x="460" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Наружный слуховой</text><text x="460" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">проход</text><text x="450" y="148" text-anchor="middle" font-size="15" fill="#374151">проводит звук</text><rect x="620" y="70" width="240" height="130" rx="14" fill="#FECACA" stroke="#B91C1C" stroke-width="3"/><circle cx="644" cy="96" r="15" fill="#B91C1C"/><text x="644" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text><text x="745" y="102" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937"></text><text x="750" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Барабанная</text><text x="750" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">перепонка</text><text x="740" y="148" text-anchor="middle" font-size="15" fill="#374151">колеблется</text><rect x="620" y="260" width="240" height="130" rx="14" fill="#FECACA" stroke="#B91C1C" stroke-width="3"/><circle cx="644" cy="286" r="15" fill="#B91C1C"/><text x="644" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4</text><text x="745" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937"></text><text x="750" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Слуховые</text><text x="750" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">косточки</text><text x="740" y="338" text-anchor="middle" font-size="15" fill="#374151">молоточек → наковальня →</text><text x="740" y="358" text-anchor="middle" font-size="15" fill="#374151">стремечко: усиливают</text><text x="740" y="378" text-anchor="middle" font-size="15" fill="#374151">колебания</text><rect x="330" y="260" width="240" height="130" rx="14" fill="#DDD6FE" stroke="#6D28D9" stroke-width="3"/><circle cx="354" cy="286" r="15" fill="#6D28D9"/><text x="354" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">5</text><text x="455" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Овальное окно</text><text x="450" y="338" text-anchor="middle" font-size="15" fill="#374151">передаёт колебания в</text><text x="450" y="358" text-anchor="middle" font-size="15" fill="#374151">улитку</text><rect x="40" y="260" width="240" height="130" rx="14" fill="#DDD6FE" stroke="#6D28D9" stroke-width="3"/><circle cx="64" cy="286" r="15" fill="#6D28D9"/><text x="64" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">6</text><text x="165" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Жидкость улитки</text><text x="160" y="338" text-anchor="middle" font-size="15" fill="#374151">колебания жидкости и</text><text x="160" y="358" text-anchor="middle" font-size="15" fill="#374151">основной мембраны</text><rect x="40" y="450" width="240" height="130" rx="14" fill="#DDD6FE" stroke="#6D28D9" stroke-width="3"/><circle cx="64" cy="476" r="15" fill="#6D28D9"/><text x="64" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">7</text><text x="165" y="482" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937"></text><text x="170" y="480" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Волосковые</text><text x="170" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">клетки</text><text x="160" y="528" text-anchor="middle" font-size="15" fill="#374151">кортиев орган: звук →</text><text x="160" y="548" text-anchor="middle" font-size="15" fill="#374151">нервный импульс</text><rect x="330" y="450" width="240" height="130" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/><circle cx="354" cy="476" r="15" fill="#1D4ED8"/><text x="354" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">8</text><text x="455" y="482" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Слуховой нерв</text><text x="450" y="528" text-anchor="middle" font-size="15" fill="#374151">проводит импульсы в мозг</text><rect x="620" y="450" width="240" height="130" rx="14" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/><circle cx="644" cy="476" r="15" fill="#1D4ED8"/><text x="644" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">9</text><text x="745" y="482" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937"></text><text x="750" y="480" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">Височная доля</text><text x="750" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">коры</text><text x="740" y="528" text-anchor="middle" font-size="15" fill="#374151">слуховая зона: ощущение</text><text x="740" y="548" text-anchor="middle" font-size="15" fill="#374151">звука</text><line x1="284" y1="135" x2="324" y2="135" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="574" y1="135" x2="614" y2="135" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="740" y1="204" x2="740" y2="254" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="616" y1="325" x2="576" y2="325" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="326" y1="325" x2="286" y2="325" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="160" y1="394" x2="160" y2="444" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="284" y1="515" x2="324" y2="515" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><line x1="574" y1="515" x2="614" y2="515" stroke="#0F766E" stroke-width="4" marker-end="url(#a)"/><g font-size="14"><rect x="40" y="612" width="14" height="14" fill="#FDE68A" stroke="#B45309"/><text x="60" y="624" fill="#374151">наружное ухо</text><rect x="190" y="612" width="14" height="14" fill="#FECACA" stroke="#B91C1C"/><text x="210" y="624" fill="#374151">среднее ухо</text><rect x="330" y="612" width="14" height="14" fill="#DDD6FE" stroke="#6D28D9"/><text x="350" y="624" fill="#374151">внутреннее ухо</text><rect x="490" y="612" width="14" height="14" fill="#DBEAFE" stroke="#1D4ED8"/><text x="510" y="624" fill="#374151">нерв и мозг</text></g></svg>