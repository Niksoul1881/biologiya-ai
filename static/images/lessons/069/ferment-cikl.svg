<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#374151"/></marker></defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="400" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2937">Как работает фермент: «ключ и замок»</text>
  <!-- 1 -->
  <path d="M40 210 L40 150 L80 150 L80 175 L110 175 L110 150 L150 150 L150 210 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="82" y="110" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <rect x="108" y="110" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="95" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">1. Фермент</text>
  <text x="95" y="258" font-size="13" text-anchor="middle" fill="#374151">и субстрат</text>
  <text x="120" y="100" font-size="13" text-anchor="middle" fill="#92400e">субстрат</text>
  <text x="95" y="196" font-size="12" text-anchor="middle" fill="#1e3a8a">активный центр</text>
  <line x1="170" y1="170" x2="220" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <!-- 2 -->
  <path d="M240 210 L240 150 L280 150 L280 175 L310 175 L310 150 L350 150 L350 210 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="282" y="157" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <rect x="308" y="157" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="295" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">2. Фермент-</text>
  <text x="295" y="258" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">субстратный комплекс</text>
  <line x1="370" y1="170" x2="420" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <!-- 3 -->
  <path d="M440 210 L440 150 L480 150 L480 175 L510 175 L510 150 L550 150 L550 210 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="470" y="105" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <rect x="510" y="95" width="26" height="18" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="495" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">3. Продукты</text>
  <text x="495" y="258" font-size="13" text-anchor="middle" fill="#374151">связь разорвана</text>
  <line x1="570" y1="170" x2="620" y2="170" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <!-- 4 -->
  <path d="M640 210 L640 150 L680 150 L680 175 L710 175 L710 150 L750 150 L750 210 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <text x="695" y="240" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827">4. Фермент</text>
  <text x="695" y="258" font-size="13" text-anchor="middle" fill="#374151">свободен и готов</text>
  <text x="695" y="274" font-size="13" text-anchor="middle" fill="#374151">к новой работе</text>
  <text x="400" y="312" font-size="13" text-anchor="middle" fill="#6b7280">Форма активного центра подходит только к своему субстрату. Сам фермент в реакции не расходуется.</text>
</svg>
