<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" font-size="21" font-weight="bold" text-anchor="middle" fill="#1f2937">Как температура влияет на работу фермента</text>
  <!-- t 0..80 -> x 80..700 (7.75 px/°C) -->
  <line x1="80" y1="340" x2="710" y2="340" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="60" stroke="#374151" stroke-width="2"/>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="80" y="360">0</text><text x="157" y="360">10</text><text x="235" y="360">20</text><text x="312" y="360">30</text><text x="390" y="360">40</text><text x="467" y="360">50</text><text x="545" y="360">60</text><text x="622" y="360">70</text><text x="700" y="360">80 °C</text>
  </g>
  <text x="40" y="200" font-size="14" text-anchor="middle" fill="#374151" transform="rotate(-90 40 200)">активность фермента</text>
  <path d="M80 330 C200 300 300 160 367 95 C390 80 410 120 440 220 C460 290 480 330 520 338" fill="none" stroke="#dc2626" stroke-width="4"/>
  <line x1="367" y1="95" x2="367" y2="340" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="367" y="80" font-size="15" font-weight="bold" text-anchor="middle" fill="#b91c1c">оптимум ≈ 37 °C</text>
  <text x="200" y="140" font-size="14" text-anchor="middle" fill="#1d4ed8">холодно: молекулы</text>
  <text x="200" y="158" font-size="14" text-anchor="middle" fill="#1d4ed8">движутся медленно,</text>
  <text x="200" y="176" font-size="14" text-anchor="middle" fill="#1d4ed8">фермент «засыпает»</text>
  <text x="560" y="200" font-size="14" fill="#7f1d1d">выше 40–45 °C:</text>
  <text x="560" y="218" font-size="14" fill="#7f1d1d">белок-фермент</text>
  <text x="560" y="236" font-size="14" fill="#7f1d1d">разрушается</text>
  <text x="560" y="254" font-size="14" fill="#7f1d1d">(денатурация) —</text>
  <text x="560" y="272" font-size="14" fill="#7f1d1d">необратимо</text>
  <text x="380" y="388" font-size="13" text-anchor="middle" fill="#6b7280">Для ферментов человека; кривая условная</text>
</svg>
