<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="17">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f5d1e">Хламидомонада — одноклеточная зелёная водоросль</text>
  <g transform="translate(450,320)">
    <!-- жгутики -->
    <path d="M-8,-152 C-40,-200 -100,-205 -140,-240" stroke="#3b6b20" stroke-width="3" fill="none"/>
    <path d="M8,-152 C40,-200 100,-205 140,-240" stroke="#3b6b20" stroke-width="3" fill="none"/>
    <!-- оболочка -->
    <ellipse cx="0" cy="0" rx="120" ry="155" fill="#eef8e4" stroke="#3b6b20" stroke-width="4"/>
    <!-- цитоплазма -->
    <ellipse cx="0" cy="2" rx="110" ry="145" fill="#f6fbef" stroke="#a7c98a" stroke-width="1.5"/>
    <!-- хроматофор чашевидный -->
    <path d="M-100,-60 C-110,60 -70,135 0,138 C70,135 110,60 100,-60 C90,-30 70,-10 60,10 C50,60 30,85 0,88 C-30,85 -50,60 -60,10 C-70,-10 -90,-30 -100,-60 Z" fill="#5fb341" stroke="#2f7a1e" stroke-width="2.5"/>
    <!-- пиреноид -->
    <circle cx="0" cy="112" r="16" fill="#cfe8a8" stroke="#2f7a1e" stroke-width="2"/>
    <!-- ядро -->
    <circle cx="0" cy="10" r="34" fill="#c9d8f0" stroke="#3a5a9a" stroke-width="2.5"/>
    <circle cx="6" cy="6" r="11" fill="#7f9bd0"/>
    <!-- глазок -->
    <ellipse cx="-88" cy="-62" rx="11" ry="7" transform="rotate(-50 -88 -62)" fill="#e0312b" stroke="#8a1a16" stroke-width="1.5"/>
    <!-- сократительные вакуоли -->
    <circle cx="-22" cy="-118" r="9" fill="#ffffff" stroke="#6a8fa3" stroke-width="2"/>
    <circle cx="22" cy="-118" r="9" fill="#ffffff" stroke="#6a8fa3" stroke-width="2"/>
  </g>
  <g fill="#222">
    <text x="60" y="80">жгутики (2)</text>
    <text x="40" y="210">светочувствительный</text>
    <text x="40" y="230">глазок</text>
    <text x="640" y="160">сократительные</text>
    <text x="640" y="180">вакуоли</text>
    <text x="640" y="270">ядро</text>
    <text x="640" y="350">хроматофор</text>
    <text x="640" y="370" font-size="14" fill="#555">(с хлорофиллом, чашевидный)</text>
    <text x="640" y="460">пиреноид</text>
    <text x="640" y="480" font-size="14" fill="#555">(запасает крахмал)</text>
    <text x="40" y="340">клеточная оболочка</text>
    <text x="40" y="150">цитоплазма</text>
  </g>
  <g stroke="#444" stroke-width="1.3">
    <line x1="150" y1="86" x2="320" y2="90"/>
    <line x1="210" y1="216" x2="360" y2="258"/>
    <line x1="636" y1="166" x2="481" y2="202"/>
    <line x1="636" y1="266" x2="482" y2="326"/>
    <line x1="636" y1="346" x2="545" y2="370"/>
    <line x1="636" y1="456" x2="466" y2="432"/>
    <line x1="195" y1="336" x2="331" y2="320"/>
    <line x1="128" y1="146" x2="405" y2="225"/>
  </g>
</svg>
