<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif"><rect width="900" height="470" fill="#FFFFFF"/><text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Циклы сна за ночь (гипнограмма)</text><line x1="150" y1="90" x2="860" y2="90" stroke="#E5E7EB" stroke-width="1.5"/><text x="140" y="95" text-anchor="end" font-size="14" fill="#6B7280" font-weight="bold">Бодрствование</text><line x1="150" y1="150" x2="860" y2="150" stroke="#E5E7EB" stroke-width="1.5"/><text x="140" y="155" text-anchor="end" font-size="14" fill="#DC2626" font-weight="bold">Быстрый сон (БДГ)</text><line x1="150" y1="210" x2="860" y2="210" stroke="#E5E7EB" stroke-width="1.5"/><text x="140" y="215" text-anchor="end" font-size="14" fill="#2563EB" font-weight="bold">Медленный: дремота</text><line x1="150" y1="270" x2="860" y2="270" stroke="#E5E7EB" stroke-width="1.5"/><text x="140" y="275" text-anchor="end" font-size="14" fill="#2563EB" font-weight="bold">Медленный: поверхностный</text><line x1="150" y1="330" x2="860" y2="330" stroke="#E5E7EB" stroke-width="1.5"/><text x="140" y="335" text-anchor="end" font-size="14" fill="#1E3A8A" font-weight="bold">Медленный: глубокий</text><path d="M150.0,90 L166.7,90 L166.7,210 L175.1,210 L175.1,270 L200.1,270 L200.1,330 L258.6,330 L258.6,270 L283.6,270 L283.6,150 L300.4,150 L300.4,270 L325.4,270 L325.4,330 L375.5,330 L375.5,270 L408.9,270 L408.9,150 L442.4,150 L442.4,270 L484.1,270 L484.1,330 L509.2,330 L509.2,270 L550.9,270 L550.9,150 L592.7,150 L592.7,270 L651.2,270 L651.2,210 L659.5,210 L659.5,150 L709.6,150 L709.6,90 L714.7,90 L714.7,270 L764.8,270 L764.8,150 L823.2,150 L823.2,90 L860.0,90" fill="none" stroke="#1F2937" stroke-width="3"/><line x1="283.6" y1="150" x2="300.4" y2="150" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/><line x1="408.9" y1="150" x2="442.4" y2="150" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/><line x1="550.9" y1="150" x2="592.7" y2="150" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/><line x1="659.5" y1="150" x2="709.6" y2="150" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/><line x1="764.8" y1="150" x2="823.2" y2="150" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/><text x="150.0" y="365" text-anchor="middle" font-size="14" fill="#374151">0 ч</text><text x="250.2" y="365" text-anchor="middle" font-size="14" fill="#374151">1 ч</text><text x="350.5" y="365" text-anchor="middle" font-size="14" fill="#374151">2 ч</text><text x="450.7" y="365" text-anchor="middle" font-size="14" fill="#374151">3 ч</text><text x="550.9" y="365" text-anchor="middle" font-size="14" fill="#374151">4 ч</text><text x="651.2" y="365" text-anchor="middle" font-size="14" fill="#374151">5 ч</text><text x="751.4" y="365" text-anchor="middle" font-size="14" fill="#374151">6 ч</text><text x="851.6" y="365" text-anchor="middle" font-size="14" fill="#374151">7 ч</text><text x="505.0" y="390" text-anchor="middle" font-size="15" fill="#374151">время от засыпания</text><text x="450" y="420" text-anchor="middle" font-size="15" fill="#374151">Один цикл «медленный сон → быстрый сон» длится около 90 минут; за ночь их 4–6.</text><text x="450" y="442" text-anchor="middle" font-size="15" fill="#374151">Глубокого сна больше в начале ночи, быстрого (с яркими снами) — под утро.</text></svg>