<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="470" fill="#FFFFFF"/>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#0F766E"/></marker>
  <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#9CA3AF"/></marker></defs>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1F2937">Как информация попадает в долговременную память</text>
  <rect x="20" y="110" width="150" height="110" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="95" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Органы</text><text x="95" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">чувств</text>
  <text x="95" y="198" text-anchor="middle" font-size="13" fill="#374151">зрение, слух…</text>
  <rect x="215" y="100" width="190" height="130" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="310" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400E">Сенсорная</text><text x="310" y="154" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400E">(мгновенная)</text>
  <text x="310" y="182" text-anchor="middle" font-size="14" fill="#374151">доли секунды —</text><text x="310" y="200" text-anchor="middle" font-size="14" fill="#374151">несколько секунд</text>
  <rect x="455" y="100" width="190" height="130" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="550" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E3A8A">Кратковременная</text><text x="550" y="156" text-anchor="middle" font-size="14" fill="#374151">секунды — минуты</text>
  <text x="550" y="180" text-anchor="middle" font-size="14" fill="#374151">ёмкость мала:</text><text x="550" y="198" text-anchor="middle" font-size="14" fill="#374151">около 7 ± 2 элементов</text>
  <rect x="695" y="100" width="190" height="130" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <text x="790" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Долговременная</text><text x="790" y="156" text-anchor="middle" font-size="14" fill="#374151">дни — годы — вся жизнь</text>
  <text x="790" y="180" text-anchor="middle" font-size="14" fill="#374151">ёмкость огромна,</text><text x="790" y="198" text-anchor="middle" font-size="14" fill="#374151">нужно закрепление</text>
  <g stroke="#0F766E" stroke-width="4" fill="none">
    <line x1="172" y1="165" x2="209" y2="165" marker-end="url(#a)"/>
    <line x1="407" y1="165" x2="449" y2="165" marker-end="url(#a)"/>
    <line x1="647" y1="150" x2="689" y2="150" marker-end="url(#a)"/>
    <path d="M790,235 C790,300 550,300 550,240" marker-end="url(#a)"/>
  </g>
  <text x="428" y="92" text-anchor="middle" font-size="14" fill="#0F766E" font-weight="bold">внимание</text>
  <text x="668" y="62" text-anchor="middle" font-size="13" fill="#0F766E" font-weight="bold">повторение,</text>
  <text x="668" y="77" text-anchor="middle" font-size="13" fill="#0F766E" font-weight="bold">смысл, эмоции,</text>
  <text x="668" y="92" text-anchor="middle" font-size="13" fill="#0F766E" font-weight="bold">сон</text>
  <text x="670" y="315" text-anchor="middle" font-size="14" fill="#0F766E" font-weight="bold">извлечение — вспоминаем</text>
  <g stroke="#9CA3AF" stroke-width="3" fill="none" stroke-dasharray="6,5">
    <line x1="310" y1="232" x2="310" y2="290" marker-end="url(#g)"/>
    <line x1="550" y1="232" x2="500" y2="290" marker-end="url(#g)"/>
  </g>
  <text x="300" y="312" text-anchor="middle" font-size="14" fill="#6B7280">забывание</text>
  <text x="470" y="312" text-anchor="middle" font-size="14" fill="#6B7280">забывание</text>
  <rect x="20" y="350" width="865" height="100" rx="14" fill="#FAFAF8" stroke="#E5E7EB" stroke-width="2"/>
  <text x="40" y="380" font-size="16" font-weight="bold" fill="#1F2937">Пример.</text>
  <text x="115" y="380" font-size="15" fill="#374151">Ты увидел номер телефона — он мелькнул в сенсорной памяти. Сосредоточился и повторяешь</text>
  <text x="40" y="404" font-size="15" fill="#374151">его про себя — он в кратковременной памяти, пока набираешь. Если номер важный, ты часто им пользуешься</text>
  <text x="40" y="428" font-size="15" fill="#374151">и он связан с эмоциями (номер друга), — гиппокамп поможет перевести его в долговременную память.</text>
</svg>
