<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9333ea"/></marker>
<linearGradient id="v" x1="0" x2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
</defs>
<rect width="1000" height="680" fill="#ffffff"/>
<text x="500" y="34" font-size="24" font-weight="bold" fill="#1f2937" text-anchor="middle">Земноводные: трёхкамерное сердце и два круга кровообращения</text>
<!-- лёгкие -->
<rect x="380" y="60" width="240" height="80" rx="16" fill="url(#v)" stroke="#475569" stroke-width="3"/>
<text x="500" y="96" font-size="21" font-weight="bold" fill="#1f2937" text-anchor="middle">Лёгкие и кожа</text>
<text x="500" y="122" font-size="16" fill="#1f2937" text-anchor="middle">кровь получает O₂</text>
<!-- тело -->
<rect x="380" y="560" width="240" height="80" rx="16" fill="url(#v)" stroke="#475569" stroke-width="3" transform="rotate(180 500 600)"/>
<text x="500" y="596" font-size="21" font-weight="bold" fill="#1f2937" text-anchor="middle">Органы тела</text>
<text x="500" y="622" font-size="16" fill="#1f2937" text-anchor="middle">кровь отдаёт O₂</text>
<!-- сердце -->
<rect x="385" y="250" width="110" height="80" rx="16" fill="#93c5fd" stroke="#1e3a8a" stroke-width="3"/>
<text x="440" y="283" font-size="17" font-weight="bold" fill="#0b1f4d" text-anchor="middle">Правое</text>
<text x="440" y="305" font-size="17" font-weight="bold" fill="#0b1f4d" text-anchor="middle">предсердие</text>
<rect x="505" y="250" width="110" height="80" rx="16" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/>
<text x="560" y="283" font-size="17" font-weight="bold" fill="#5b0d0d" text-anchor="middle">Левое</text>
<text x="560" y="305" font-size="17" font-weight="bold" fill="#5b0d0d" text-anchor="middle">предсердие</text>
<rect x="400" y="340" width="200" height="90" rx="20" fill="#c4b5fd" stroke="#5b21b6" stroke-width="3"/>
<text x="500" y="380" font-size="19" font-weight="bold" fill="#2e1065" text-anchor="middle">Желудочек</text>
<text x="500" y="405" font-size="15" fill="#2e1065" text-anchor="middle">кровь частично смешивается</text>
<!-- малый круг -->
<path d="M400 370 C 300 370, 290 200, 300 160 C 305 120, 340 100, 375 100" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#mb)"/>
<path d="M620 100 C 700 100, 720 160, 700 230 C 690 270, 660 290, 622 290" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#mr)"/>
<text x="150" y="215" font-size="17" fill="#2563eb">венозная кровь —</text>
<text x="150" y="237" font-size="17" fill="#2563eb">к лёгким и коже</text>
<text x="730" y="185" font-size="17" fill="#dc2626">артериальная кровь —</text>
<text x="730" y="207" font-size="17" fill="#dc2626">в левое предсердие</text>
<text x="820" y="110" font-size="20" font-weight="bold" fill="#374151">Малый круг</text>
<!-- большой круг -->
<path d="M600 385 C 760 385, 790 470, 760 540 C 740 580, 680 600, 625 600" fill="none" stroke="#9333ea" stroke-width="7" marker-end="url(#mp)"/>
<path d="M380 600 C 250 600, 220 520, 225 420 C 230 330, 300 290, 380 290" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#mb)"/>
<text x="780" y="440" font-size="17" fill="#9333ea">смешанная кровь —</text>
<text x="780" y="462" font-size="17" fill="#9333ea">к органам тела</text>
<text x="780" y="490" font-size="15" fill="#4b5563">(к мозгу — почти</text>
<text x="780" y="510" font-size="15" fill="#4b5563">артериальная)</text>
<text x="40" y="470" font-size="17" fill="#2563eb">венозная кровь —</text>
<text x="40" y="492" font-size="17" fill="#2563eb">в правое предсердие</text>
<text x="820" y="640" font-size="20" font-weight="bold" fill="#374151">Большой круг</text>
</svg>
