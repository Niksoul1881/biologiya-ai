<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>
  <g fill="none" stroke="#d1d5db" stroke-width="2">
    <rect x="10" y="20" width="170" height="200" rx="14"/>
    <rect x="212" y="20" width="170" height="200" rx="14"/>
    <rect x="414" y="20" width="170" height="200" rx="14"/>
    <rect x="616" y="20" width="170" height="200" rx="14"/>
    <rect x="818" y="20" width="170" height="200" rx="14"/>
  </g>
  <g stroke="#16A34A" stroke-width="4" marker-end="url(#ar)">
    <line x1="183" y1="120" x2="208" y2="120"/>
    <line x1="385" y1="120" x2="410" y2="120"/>
    <line x1="587" y1="120" x2="612" y2="120"/>
    <line x1="789" y1="120" x2="814" y2="120"/>
  </g>
  <!-- 1. Клетка: веретеновидная гладкая мышечная клетка -->
  <path d="M30,120 Q95,75 160,120 Q95,165 30,120 z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="95" cy="120" rx="18" ry="8" fill="#7c3aed"/>
  <!-- 2. Ткань: несколько клеток -->
  <g fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5">
    <path d="M225,80 Q285,62 345,80 Q285,98 225,80 z"/>
    <path d="M250,100 Q310,82 370,100 Q310,118 250,100 z"/>
    <path d="M225,120 Q285,102 345,120 Q285,138 225,120 z"/>
    <path d="M250,140 Q310,122 370,140 Q310,158 250,140 z"/>
    <path d="M225,160 Q285,142 345,160 Q285,178 225,160 z"/>
  </g>
  <g fill="#7c3aed">
    <ellipse cx="285" cy="80" rx="8" ry="4"/><ellipse cx="310" cy="100" rx="8" ry="4"/>
    <ellipse cx="285" cy="120" rx="8" ry="4"/><ellipse cx="310" cy="140" rx="8" ry="4"/>
    <ellipse cx="285" cy="160" rx="8" ry="4"/>
  </g>
  <!-- 3. Орган: желудок -->
  <path d="M470,55 C470,90 440,100 445,140 C450,185 520,195 555,165 C575,148 570,120 545,118 C520,116 510,135 500,120 C490,105 505,80 500,55 z" fill="#fdba74" stroke="#c2410c" stroke-width="3"/>
  <!-- 4. Система органов: пищевод, желудок, кишечник -->
  <g stroke="#c2410c" stroke-width="3">
    <line x1="690" y1="35" x2="690" y2="70"/>
    <path d="M690,70 C690,90 670,95 675,115 C680,135 720,138 735,120 C745,108 735,95 720,98 C705,100 700,85 690,70 z" fill="#fdba74"/>
    <path d="M728,132 C750,140 765,145 760,150" fill="none" stroke="#ea580c" stroke-width="7"/>
    <path d="M660,150 h100 v18 h-100 v18 h100 v18 h-100" fill="none" stroke="#ea580c" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <!-- 5. Организм: силуэт ящерицы/животного -->
  <g fill="#86efac" stroke="#15803d" stroke-width="3">
    <ellipse cx="900" cy="125" rx="50" ry="26"/>
    <circle cx="955" cy="105" r="18"/>
    <path d="M852,125 Q825,150 835,185" fill="none" stroke-width="8" stroke-linecap="round"/>
    <line x1="875" y1="145" x2="868" y2="180" stroke-width="7" stroke-linecap="round"/>
    <line x1="925" y1="145" x2="932" y2="180" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="961" cy="100" r="3" fill="#14532d"/>
  <g font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="95" y="252">Клетка</text>
    <text x="297" y="252">Ткань</text>
    <text x="499" y="252">Орган</text>
    <text x="701" y="252">Система органов</text>
    <text x="903" y="252">Организм</text>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="95" y="276">мышечная клетка</text>
    <text x="297" y="276">гладкая мышечная</text>
    <text x="499" y="276">желудок</text>
    <text x="701" y="276">пищеварительная</text>
    <text x="903" y="276">животное целиком</text>
  </g>
</svg>
