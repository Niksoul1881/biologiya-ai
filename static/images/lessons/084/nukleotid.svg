<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="sans-serif">
<rect width="960" height="430" fill="#fff"/>
<text x="480" y="36" font-size="25" font-weight="bold" fill="#1f2937" text-anchor="middle">Строение нуклеотида</text>
<circle cx="140" cy="190" r="56" fill="#FEF08A" stroke="#CA8A04" stroke-width="3"/><text x="140" y="200" font-size="34" font-weight="bold" fill="#713F12" text-anchor="middle">P</text>
<text x="140" y="280" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">Остаток</text><text x="140" y="303" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">фосфорной кислоты</text>
<line x1="196" y1="190" x2="290" y2="190" stroke="#374151" stroke-width="4"/>
<polygon points="360.0,120.0 426.6,168.4 401.1,246.6 318.9,246.6 293.4,168.4" fill="#FED7AA" stroke="#EA580C" stroke-width="3"/>
<text x="360" y="198" font-size="22" font-weight="bold" fill="#7C2D12" text-anchor="middle">C₅</text>
<text x="360" y="300" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">Пентоза</text>
<text x="360" y="324" font-size="16" fill="#374151" text-anchor="middle">ДНК — дезоксирибоза</text><text x="360" y="346" font-size="16" fill="#374151" text-anchor="middle">РНК — рибоза</text>
<line x1="430" y1="190" x2="530" y2="190" stroke="#374151" stroke-width="4"/>
<polygon points="662.4,226.0 600.0,262.0 537.6,226.0 537.6,154.0 600.0,118.0 662.4,154.0" fill="#BFDBFE" stroke="#2563EB" stroke-width="3"/>
<text x="600" y="198" font-size="19" font-weight="bold" fill="#1E3A8A" text-anchor="middle">А, Г, Ц, Т/У</text>
<text x="595" y="300" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Азотистое основание</text>
<rect x="705" y="80" width="245" height="230" rx="12" fill="#f9fafb" stroke="#9ca3af"/>
<text x="719" y="110" font-size="16" font-weight="bold" fill="#1f2937">Пурины (два кольца):</text>
<text x="719" y="136" font-size="16" fill="#1f2937">аденин (А), гуанин (Г)</text>
<text x="719" y="174" font-size="16" font-weight="bold" fill="#1f2937">Пиримидины (одно кольцо):</text>
<text x="719" y="200" font-size="16" fill="#1f2937">цитозин (Ц),</text>
<text x="719" y="226" font-size="16" fill="#1f2937">тимин (Т) — только в ДНК,</text>
<text x="719" y="252" font-size="16" fill="#1f2937">урацил (У) — только в РНК</text>
<text x="480" y="385" font-size="16" fill="#6b7280" text-anchor="middle">Нуклеотиды соединяются в цепь: пентоза одного нуклеотида связывается</text>
<text x="480" y="408" font-size="16" fill="#6b7280" text-anchor="middle">с остатком фосфорной кислоты следующего (фосфодиэфирная связь)</text>
</svg>