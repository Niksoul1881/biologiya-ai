<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Arial, Helvetica, sans-serif">
<rect width="1000" height="580" fill="#fff"/>
<text x="500" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1b4d1b">20 аминокислот: группы по свойствам боковой цепи</text>
<text x="20" y="94" font-size="17" font-weight="bold" fill="#c0661a">Гидрофобные</text>
<text x="20" y="116" font-size="13" fill="#555">прячутся внутрь глобулы</text>
<rect x="196" y="60" width="106" height="76" rx="10" fill="#fdf0e0" stroke="#c0661a" stroke-width="2"/>
<text x="226" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#c0661a">A</text>
<text x="272" y="100" font-size="16" text-anchor="middle" fill="#333">Ala</text>
<text x="249.0" y="124" font-size="12" text-anchor="middle" fill="#333">аланин</text>
<rect x="310" y="60" width="106" height="76" rx="10" fill="#fdf0e0" stroke="#c0661a" stroke-width="2"/>
<text x="340" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#c0661a">V</text>
<text x="386" y="100" font-size="16" text-anchor="middle" fill="#333">Val</text>
<text x="363.0" y="124" font-size="12" text-anchor="middle" fill="#333">валин</text>
<rect x="424" y="60" width="106" height="76" rx="10" fill="#fdf0e0" stroke="#c0661a" stroke-width="2"/>
<text x="454" y="102" font-size="30" font-weight="bold" text-anchor="middle" fill="#c0661a">L</text>
