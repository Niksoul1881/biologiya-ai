<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f766e">Виды наружных кровотечений</text>
  <!-- Артериальное -->
  <rect x="20" y="60" width="275" height="340" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="157" y="94" text-anchor="middle" font-size="21" font-weight="bold" fill="#b91c1c">Артериальное</text>
  <rect x="60" y="150" width="190" height="24" rx="12" fill="#fecaca"/>
  <path d="M155 150 C 150 120, 140 110, 120 108 M155 150 C 160 118, 175 108, 190 104 M155 150 C 155 125, 155 115, 157 104" stroke="#ef4444" stroke-width="5" fill="none"/>
  <g font-size="15" fill="#1f2937">
    <text x="36" y="210">• кровь <tspan font-weight="bold" fill="#dc2626">ярко-алая</tspan></text>
    <text x="36" y="236">• бьёт <tspan font-weight="bold">пульсирующей</tspan> струёй</text>
    <text x="36" y="262">• самое опасное</text>
    <text x="36" y="296" font-weight="bold" fill="#991b1b">Помощь:</text>
    <text x="36" y="320">прямое давление на рану,</text>
    <text x="36" y="342">тугая давящая повязка; если</text>
    <text x="36" y="364">не помогает — жгут выше раны</text>
    <text x="36" y="386">+ записка со временем</text>
  </g>
  <!-- Венозное -->
  <rect x="312" y="60" width="275" height="340" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="450" y="94" text-anchor="middle" font-size="21" font-weight="bold" fill="#3730a3">Венозное</text>
  <rect x="355" y="150" width="190" height="24" rx="12" fill="#c7d2fe"/>
  <path d="M440 150 q-5 25 -2 45 M455 150 q4 20 0 40" stroke="#7f1d1d" stroke-width="6" fill="none"/>
  <g font-size="15" fill="#1f2937">
    <text x="328" y="210">• кровь <tspan font-weight="bold" fill="#7f1d1d">тёмно-вишнёвая</tspan></text>
    <text x="328" y="236">• вытекает <tspan font-weight="bold">ровной</tspan> струёй,</text>
    <text x="344" y="256">без толчков</text>
    <text x="328" y="296" font-weight="bold" fill="#3730a3">Помощь:</text>
    <text x="328" y="320">давящая повязка на рану,</text>
    <text x="328" y="342">конечность приподнять</text>
  </g>
  <!-- Капиллярное -->
  <rect x="604" y="60" width="275" height="340" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="741" y="94" text-anchor="middle" font-size="21" font-weight="bold" fill="#c2410c">Капиллярное</text>
  <rect x="646" y="150" width="190" height="24" rx="12" fill="#fed7aa"/>
  <g fill="#dc2626"><circle cx="680" cy="160" r="4"/><circle cx="700" cy="166" r="3"/><circle cx="725" cy="158" r="4"/><circle cx="750" cy="165" r="3"/><circle cx="775" cy="159" r="4"/><circle cx="800" cy="164" r="3"/></g>
  <g font-size="15" fill="#1f2937">
    <text x="620" y="210">• кровь сочится по всей</text>
    <text x="636" y="230">поверхности раны</text>
    <text x="620" y="256">• ссадины, царапины</text>
    <text x="620" y="296" font-weight="bold" fill="#c2410c">Помощь:</text>
    <text x="620" y="320">промыть чистой водой,</text>
    <text x="620" y="342">обработать края антисептиком,</text>
    <text x="620" y="364">наложить повязку</text>
  </g>
</svg>
