<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="sans-serif">
<rect width="1000" height="430" fill="#fff"/>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#374151"/></marker></defs>
<text x="500" y="36" font-size="25" font-weight="bold" fill="#1f2937" text-anchor="middle">Куда идёт ПВК: дыхание или брожение</text>
<rect x="370" y="60" width="260" height="60" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/><text x="500" y="88" font-size="19" font-weight="bold" fill="#78350F" text-anchor="middle">Глюкоза → 2 ПВК</text><text x="500" y="110" font-size="15" fill="#78350F" text-anchor="middle">гликолиз, + 2 АТФ</text>
<line x1="500" y1="120" x2="170" y2="178" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
<text x="323.0" y="155" font-size="14" fill="#6b7280" text-anchor="end">нет O₂</text>
<rect x="15" y="180" width="310" height="200" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2.5"/>
<text x="170" y="212" font-size="18" font-weight="bold" fill="#B91C1C" text-anchor="middle">Молочнокислое брожение</text>
<text x="170" y="240" font-size="14.5" fill="#374151" text-anchor="middle">мышцы при нехватке O₂,</text>
<text x="170" y="260" font-size="14.5" fill="#374151" text-anchor="middle">молочнокислые бактерии</text>
<text x="170" y="310" font-size="16" fill="#1f2937" text-anchor="middle">2 ПВК → 2 молочной кислоты</text>
<text x="170" y="350" font-size="17" font-weight="bold" fill="#B91C1C" text-anchor="middle">итого 2 АТФ на глюкозу</text>
<line x1="500" y1="120" x2="500" y2="178" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
<text x="512.0" y="155" font-size="14" fill="#6b7280" text-anchor="start">нет O₂</text>
<rect x="345" y="180" width="310" height="200" rx="14" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/>
<text x="500" y="212" font-size="18" font-weight="bold" fill="#6D28D9" text-anchor="middle">Спиртовое брожение</text>
<text x="500" y="240" font-size="14.5" fill="#374151" text-anchor="middle">дрожжи, клетки растений</text>
<text x="500" y="260" font-size="14.5" fill="#374151" text-anchor="middle">без кислорода</text>
<text x="500" y="310" font-size="16" fill="#1f2937" text-anchor="middle">2 ПВК → 2 C₂H₅OH + 2 CO₂</text>
<text x="500" y="350" font-size="17" font-weight="bold" fill="#6D28D9" text-anchor="middle">итого 2 АТФ на глюкозу</text>
<line x1="500" y1="120" x2="830" y2="178" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
<text x="677.0" y="155" font-size="14" fill="#6b7280" text-anchor="start">есть O₂</text>
<rect x="675" y="180" width="310" height="200" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
<text x="830" y="212" font-size="18" font-weight="bold" fill="#15803D" text-anchor="middle">Кислородное дыхание</text>
<text x="830" y="240" font-size="14.5" fill="#374151" text-anchor="middle">митохондрии, при наличии O₂</text>
<text x="830" y="260" font-size="14.5" fill="#374151" text-anchor="middle"> </text>
<text x="830" y="310" font-size="16" fill="#1f2937" text-anchor="middle">2 ПВК + 6 O₂ → 6 CO₂ + 6 H₂O</text>
<text x="830" y="350" font-size="17" font-weight="bold" fill="#15803D" text-anchor="middle">+ 36 АТФ → итого 38 АТФ</text>
<text x="500" y="415" font-size="15" fill="#6b7280" text-anchor="middle">Брожение даёт в 19 раз меньше АТФ, чем полное окисление глюкозы (2 против 38 по школьному курсу)</text>
</svg>