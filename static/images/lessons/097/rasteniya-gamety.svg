<circle cx="555" cy="412" r="10" fill="#a87020" opacity="0.7"/><circle cx="578" cy="428" r="10" fill="#a87020" opacity="0.7"/>
<text x="400" y="338" font-size="12" text-anchor="middle" fill="#a87020" font-weight="bold">3 антиподы · n</text>
<text x="566" y="375" font-size="12" text-anchor="middle" fill="#a87020">центральная клетка:</text>
<text x="566" y="390" font-size="12" text-anchor="middle" fill="#a87020" font-weight="bold">2 полярных ядра (n + n)</text>
<text x="760" y="385" font-size="12" text-anchor="start" fill="#a87020">синергиды · n</text>
<text x="760" y="425" font-size="13" text-anchor="start" fill="#b85c00" font-weight="bold">яйцеклетка · n</text>
<path d="M 755 421 L 710 421" stroke="#b85c00" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450" y="520" font-size="13" text-anchor="middle" fill="#333">Зародышевый мешок: 8 ядер, 7 клеток. Гаплоидные клетки гаметофита делятся митозом,</text>
<text x="450" y="538" font-size="13" text-anchor="middle" fill="#333">поэтому гаметы растений образуются митозом, а мейозом — споры.</text>
