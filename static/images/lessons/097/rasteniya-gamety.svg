<rect x="20" y="285" width="860" height="260" rx="0" fill="#fdf8ef" stroke="none"/>
<text x="30" y="80" font-size="16" text-anchor="start" fill="#1b7a3a" font-weight="bold">Пыльник → пыльцевое зерно (мужской гаметофит)</text>
<text x="30" y="310" font-size="16" text-anchor="start" fill="#a87020" font-weight="bold">Семязачаток → зародышевый мешок (женский гаметофит)</text>
