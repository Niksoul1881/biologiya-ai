<text x="450" y="634" font-size="13.5" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Из одного сперматоцита I порядка — 4 сперматозоида; из одного ооцита I порядка — 1 яйцеклетка и 2–3 полярных тельца.</text>
<text x="450" y="658" font-size="13" text-anchor="middle" fill="#333">n — число разных хромосом в наборе, c — число молекул ДНК (хроматид). У человека n = 23: 2n2c = 46 хромосом, 46 ДНК.</text>
<text x="450" y="678" font-size="13" text-anchor="middle" fill="#333">Мейоз II в ооците человека завершается только после проникновения сперматозоида.</text>
