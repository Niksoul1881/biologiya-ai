<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="470" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="450.0" y="32" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Гомологичные хромосомы, локусы и аллели</text>
<rect x="278" y="70" width="44" height="320" rx="22" fill="#f8dcea" stroke="#555" stroke-width="2"/>
<path d="M 278 170 Q 300 182 322 170 M 278 186 Q 300 174 322 186" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="300" y="415" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">от матери</text>
<rect x="278" y="106" width="44" height="18" fill="#1b7a3a" stroke="#333" stroke-width="1"/>
<text x="300" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
<rect x="278" y="241" width="44" height="18" fill="#1d4f86" stroke="#333" stroke-width="1"/>
<text x="300" y="256" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<rect x="278" y="321" width="44" height="18" fill="#b85c00" stroke="#333" stroke-width="1"/>
<text x="300" y="336" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">c</text>
<rect x="398" y="70" width="44" height="320" rx="22" fill="#dbe9f6" stroke="#555" stroke-width="2"/>
<path d="M 398 170 Q 420 182 442 170 M 398 186 Q 420 174 442 186" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="420" y="415" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">от отца</text>
<rect x="398" y="106" width="44" height="18" fill="#7cb342" stroke="#333" stroke-width="1"/>
<text x="420" y="121" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">a</text>
<rect x="398" y="241" width="44" height="18" fill="#1d4f86" stroke="#333" stroke-width="1"/>
<text x="420" y="256" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<rect x="398" y="321" width="44" height="18" fill="#b85c00" stroke="#333" stroke-width="1"/>
<text x="420" y="336" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">c</text>
<text x="360" y="450" font-size="14" text-anchor="middle" fill="#555">пара гомологичных хромосом</text>
<path d="M 445 115 L 520 115" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="528" y="120" font-size="14" text-anchor="start" fill="#333">локус гена A: аллели A и a → гетерозигота Aa</text>
<path d="M 445 250 L 520 250" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="528" y="255" font-size="14" text-anchor="start" fill="#333">локус гена B: аллели B и B → гомозигота BB</text>
<path d="M 445 330 L 520 330" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="528" y="335" font-size="14" text-anchor="start" fill="#333">локус гена C: аллели c и c → гомозигота cc</text>
<text x="40" y="120" font-size="13" text-anchor="start" fill="#555">центромера</text>
<path d="M 115 116 L 270 176" stroke="#888" stroke-width="1.2"/>
<text x="528" y="400" font-size="15" text-anchor="start" fill="#1b4d1b" font-weight="bold">Генотип по трём генам: AaBBcc.</text>
<text x="528" y="422" font-size="13" text-anchor="start" fill="#555">Аллели одного гена лежат в одинаковых</text>
<text x="528" y="440" font-size="13" text-anchor="start" fill="#555">местах (локусах) гомологичных хромосом.</text>
