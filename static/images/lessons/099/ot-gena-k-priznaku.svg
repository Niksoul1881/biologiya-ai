<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="330" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<text x="450.0" y="32" font-size="22" text-anchor="middle" fill="#1b4d1b" font-weight="bold">От гена к признаку: пример окраски шерсти</text>
<rect x="30" y="80" width="180" height="110" rx="12" fill="#dbe9f6" stroke="#1d4f86"/>
<text x="120" y="112" font-size="17" text-anchor="middle" fill="#1d4f86" font-weight="bold">Ген (ДНК)</text>
<text x="120" y="140" font-size="13" text-anchor="middle" fill="#333">участок ДНК с</text>
<text x="120" y="160" font-size="13" text-anchor="middle" fill="#333">инструкцией</text>
<rect x="250" y="80" width="180" height="110" rx="12" fill="#f6effa" stroke="#7a3fa0"/>
<text x="340" y="112" font-size="17" text-anchor="middle" fill="#7a3fa0" font-weight="bold">иРНК</text>
<text x="340" y="140" font-size="13" text-anchor="middle" fill="#333">копия гена</text>
<text x="340" y="160" font-size="13" text-anchor="middle" fill="#333">(транскрипция)</text>
<rect x="470" y="80" width="180" height="110" rx="12" fill="#e3f4e0" stroke="#1b7a3a"/>
<text x="560" y="112" font-size="17" text-anchor="middle" fill="#1b7a3a" font-weight="bold">Белок-фермент</text>
<text x="560" y="140" font-size="13" text-anchor="middle" fill="#333">тирозиназа</text>
<text x="560" y="160" font-size="13" text-anchor="middle" fill="#333">(трансляция)</text>
<rect x="690" y="80" width="180" height="110" rx="12" fill="#fbe7c6" stroke="#a87020"/>
<text x="780" y="112" font-size="17" text-anchor="middle" fill="#a87020" font-weight="bold">Признак</text>
<text x="780" y="140" font-size="13" text-anchor="middle" fill="#333">пигмент меланин →</text>
<text x="780" y="160" font-size="13" text-anchor="middle" fill="#333">тёмная шерсть</text>
<path d="M 212 135 L 246 135" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<path d="M 432 135 L 466 135" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<path d="M 652 135 L 686 135" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="215" width="840" height="95" rx="10" fill="#fff8e1" stroke="#e0a800"/>
<text x="450" y="242" font-size="13.5" text-anchor="middle" fill="#333" font-weight="bold">Аллель-«поломка» (мутация) → неактивный фермент → нет меланина → белая шерсть, красные глаза (альбинизм).</text>
<text x="450" y="266" font-size="13" text-anchor="middle" fill="#333">Одной рабочей копии гена обычно хватает: поэтому аллель нормальной окраски доминантный, а альбинизм — рецессивный.</text>
<text x="450" y="290" font-size="14" text-anchor="middle" fill="#1b4d1b" font-weight="bold">Фенотип = генотип + условия среды.</text>
</svg>